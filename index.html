<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">
<title>FlibidooSearch</title>

<link rel="icon"
      href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG">

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

a{color:inherit}

.hidden{
  display:none!important;
}

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px;
}

/* =========================================================
   HOME
   ========================================================= */

#home.home{
  width:100%;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.home-inner{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.hero-logo{
  width:min(260px,65vw);
  height:auto;
  display:block;
  margin:0 auto 18px;
  object-fit:contain;

  /* subtle edge fade */
  -webkit-mask-image:
    radial-gradient(
      ellipse 85% 85% at center,
      #000 70%,
      rgba(0,0,0,.85) 82%,
      transparent 100%
    );
  mask-image:
    radial-gradient(
      ellipse 85% 85% at center,
      #000 70%,
      rgba(0,0,0,.85) 82%,
      transparent 100%
    );
}

.home-title{
  text-align:center;
  font-size:clamp(38px,5vw,56px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500;
}

.home-title strong{
  font-weight:700;
}

.search-wrap{
  width:min(100%,680px);
  margin:0 auto;
}

form{
  display:flex;
  align-items:center;
  height:54px;
  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;
  transition:border-color .15s ease,box-shadow .15s ease;
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08);
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 18px;
}

input::placeholder{
  color:#9e8da1;
}

/* Search arrow */

.submit{
  height:38px;
  width:38px;
  margin-right:8px;
  border:1px solid var(--line);
  background:transparent;
  color:#766679;
  border-radius:50%;
  padding:0;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 auto;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
}

.submit-icon{
  width:18px;
  height:18px;
  display:block;
  fill:currentColor;
}

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

.confederacy-credit img{
  width:18px;
  height:18px;
  display:block;
  object-fit:contain;
  flex:0 0 18px;
  border-radius:4px;
}

/* =========================================================
   RESULTS
   ========================================================= */

main{
  flex:1;
}

.results{
  padding:30px 12px 70px;
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:44px;
  border-bottom:1px solid var(--line2);
  padding-bottom:14px;
  margin-bottom:14px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:inherit;
  white-space:nowrap;
}

.results-brand img{
  width:28px;
  height:28px;
  object-fit:contain;
  display:block;
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

.results-search{
  width:min(100%,680px);
  margin:0 0 28px;
}

.results-search form{
  height:48px;
}

.results-search .submit{
  width:34px;
  height:34px;
  margin-right:6px;
}

.search-types{
  display:flex;
  align-items:flex-end;
  gap:0;
  margin:8px 0 18px;
  border-bottom:1px solid rgba(255,255,255,.12);
  height:36px;
}

.search-type{
  position:relative;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font:inherit;
  font-size:13px;
  line-height:20px;
  padding:0 12px 10px;
  margin:0;
  border-radius:0;
  cursor:pointer;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:-1px;
  height:2px;
  border-radius:2px 2px 0 0;
  background:currentColor;
}

.results-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:42px;
  align-items:start;
}

/* =========================================================
   WEB RESULTS
   ========================================================= */

.result{
  padding:0 0 26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2);
}

.result-url-row{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  margin-bottom:6px;
}

.result-favicon{
  width:16px;
  height:16px;
  flex:0 0 16px;
  object-fit:contain;
  border-radius:3px;
  background:rgba(255,255,255,.04);
}

.result-url{
  font-size:13px;
  color:var(--url);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result h2{
  font-size:20px;
  line-height:1.25;
  margin:0 0 7px;
  font-weight:500;
  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.result-preview{
  width:100%;
  max-width:360px;
  max-height:210px;
  object-fit:cover;
  display:block;
  border:1px solid var(--line2);
  border-radius:7px;
  margin:0 0 10px;
  background:rgba(255,255,255,.025);
}

.snippet{
  font-size:14px;
  line-height:1.6;
  color:var(--result);
  margin:0;
  max-width:760px;
}

.snippet strong,
.snippet b{
  color:#fff;
  font-weight:700;
}

.snippet em,
.snippet i{
  font-style:italic;
}

.snippet mark{
  background:rgba(255,220,100,.22);
  color:inherit;
  border-radius:2px;
  padding:0 2px;
}

.result-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:7px;
}

/* =========================================================
   IMAGES
   ========================================================= */

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-result img{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.02);
  border-radius:6px;
}

.image-result-title{
  font-size:14px;
  line-height:1.4;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   NEWS
   ========================================================= */

.news-image{
  width:150px;
  height:95px;
  object-fit:cover;
  border:1px solid var(--line2);
  border-radius:6px;
  float:right;
  margin:0 0 8px 18px;
}

/* =========================================================
   DICTIONARY
   ========================================================= */

.dictionary{
  border-left:1px solid var(--line2);
  padding-left:28px;
  max-height:70vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;
  font-weight:500;
  letter-spacing:-.02em;
  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line2);
}

.dictionary-language,
.dictionary-label{
  font-size:12px;
  color:var(--muted);
}

.dictionary-language{
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);
  margin-left:5px;
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;
  color:var(--result);
  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
}

/* =========================================================
   EMPTY / ERROR / PAGER
   ========================================================= */

.empty{
  padding:70px 0;
  color:var(--muted);
  text-align:center;
}

.error{
  min-height:120px;
  max-width:680px;
  margin:0;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line2);
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.pager{
  display:flex;
  gap:8px;
  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:4px;
  padding:8px 12px;
  cursor:pointer;
}

/* =========================================================
   ABOUT
   ========================================================= */

.about-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:24px;
  z-index:10000;
}

.about-overlay.hidden{
  display:none;
}

.about-card{
  position:relative;
  width:min(100%,560px);
  max-height:min(80vh,700px);
  overflow:auto;
  background:#24132a;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  padding:30px;
}

.about-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;
  font-size:25px;
  font-weight:500;
}

.about-card p{
  color:var(--result);
  line-height:1.7;
  font-size:14px;
}

.about-card a{
  color:var(--text);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr;
  }

  .dictionary{
    order:-1;
    border-left:0;
    border-bottom:1px solid var(--line2);
    border-top:0;
    padding:0 0 26px;
    margin-bottom:26px;
    max-height:none;
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 14px;
  }

  .news-image{
    width:120px;
    height:80px;
  }
}

@media(max-width:640px){

  .shell{
    width:100%;
    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:20px 16px;
  }

  .hero-logo{
    width:190px;
    margin-bottom:16px;
  }

  .home-title{
    font-size:38px;
    margin-bottom:24px;
  }

  form{
    height:50px;
  }

  .results{
    padding:22px 16px 60px;
  }

  .results-head{
    gap:12px;
  }

  .results-brand img{
    width:24px;
    height:24px;
  }

  .results-brand span{
    font-size:14px;
  }

  .results-query{
    font-size:13px;
  }

  .search-types{
    overflow-x:auto;
    scrollbar-width:none;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;
    font-size:12px;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr;
  }

  .hero-logo{
    width:170px;
  }

  .home-title{
    font-size:35px;
  }

  .news-image{
    width:100px;
    height:70px;
  }
}
</style>
</head>

<body>

<main>

<!-- =======================================================
     HOME
======================================================= -->

<section id="home" class="home shell">

  <div class="home-inner">

    <div class="search-wrap">

      <img
        class="hero-logo"
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt="Flibidoo"
      >

      <h1 class="home-title">
        <em><strong>Flibidoo</strong></em>Search
      </h1>

      <form id="searchForm" role="search">

        <input
          id="q"
          name="q"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web"
          aria-label="Search the web"
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="Search"
        >
          <svg
            class="submit-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
            aria-hidden="true"
          >
            <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
          </svg>
        </button>

      </form>

      <div class="links">

        <button type="button" id="aboutButton">
          About
        </button>

        <span class="confederacy-credit">
          <span>with love from The Great Confederacy of E</span>

          <img
            src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
            alt=""
          >
        </span>

      </div>

    </div>

  </div>

</section>


<!-- =======================================================
     RESULTS
======================================================= -->

<section id="results" class="results shell hidden">

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >
      <img
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt=""
      >

      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>
    </a>

    <div id="queryLabel" class="results-query"></div>

    <div id="count" class="count"></div>

  </div>


  <div class="results-search">

    <form id="resultsSearchForm" role="search">

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >
        <svg
          class="submit-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>
      </button>

    </form>

  </div>


  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >
      Web
    </button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >
      Images
    </button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >
      News
    </button>

  </nav>


  <div class="results-layout">

    <div>
      <div id="resultList"></div>
      <div id="pager" class="pager"></div>
    </div>

    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results"
    ></aside>

  </div>

</section>

</main>


<!-- =======================================================
     ABOUT
======================================================= -->

<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle"
>

  <div class="about-card">

    <button
      id="aboutClose"
      class="about-close"
      type="button"
      aria-label="Close About"
    >
      ×
    </button>

    <h2 id="aboutTitle">About</h2>

    <p>
      Welcome to FlibidooSearch.
    </p>

    <p>
      You can edit this text directly in the HTML inside the
      <strong>about-card</strong>.
    </p>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WORKER_BASE =
  'https://working-filibidooo.daniel-torres-a95.workers.dev';


/* =========================================================
   DOM
========================================================= */

const form =
  document.querySelector('#searchForm');

const input =
  document.querySelector('#q');

const home =
  document.querySelector('#home');

const results =
  document.querySelector('#results');

const list =
  document.querySelector('#resultList');

const label =
  document.querySelector('#queryLabel');

const count =
  document.querySelector('#count');

const pager =
  document.querySelector('#pager');

const resultsForm =
  document.querySelector('#resultsSearchForm');

const resultsInput =
  document.querySelector('#resultsQ');

const dictionary =
  document.querySelector('#dictionary');

const submitButton =
  document.querySelector('#submitButton');

const resultsSubmitButton =
  document.querySelector('#resultsSubmitButton');


let currentQ = '';
let currentPage = 0;
let currentType = 'web';


/* =========================================================
   HELPERS
========================================================= */

function esc(value = '') {

  return String(value).replace(
    /[&<>'"]/g,
    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[char])
  );

}


/*
  Decode percent-encoded URLs for display.

  If decoding fails, return the original string.
*/

function decodeUrl(value = '') {

  let output = String(value);

  try {

    for(let i = 0; i < 3; i++) {

      const decoded = decodeURIComponent(output);

      if(decoded === output) break;

      output = decoded;

    }

  } catch (_) {}

  return output;

}


/*
  Convert Markdown-ish text into safe HTML.

  We deliberately do NOT allow arbitrary HTML.
  This prevents search-provider descriptions from injecting
  scripts into FlibidooSearch.

  Supported:
    **bold**
    __bold__
    *italic*
    _italic_
    `code`
    [text](https://example.com)

  Also supports basic HTML tags:
    <strong>
    <b>
    <em>
    <i>
    <mark>
    <small>
    <br>
*/

function richText(value = '') {

  let text = String(value);

  /*
    First escape everything.
  */

  text = esc(text);

  /*
    Restore a controlled set of HTML tags.
  */

  text = text.replace(
    /&lt;(strong|b|em|i|mark|small|br)\s*&gt;/gi,
    '<$1>'
  );

  text = text.replace(
    /&lt;\/(strong|b|em|i|mark|small)\s*&gt;/gi,
    '</$1>'
  );

  /*
    Markdown links.

    Only HTTP/HTTPS URLs are accepted.
  */

  text = text.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi,
    (_, title, url) =>
      `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${title}</a>`
  );

  /*
    Bold.
  */

  text = text.replace(
    /\*\*(.+?)\*\*/gs,
    '<strong>$1</strong>'
  );

  text = text.replace(
    /__(.+?)__/gs,
    '<strong>$1</strong>'
  );

  /*
    Italic.
  */

  text = text.replace(
    /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
    '<em>$1</em>'
  );

  text = text.replace(
    /(?<!_)_([^_\n]+)_(?!_)/g,
    '<em>$1</em>'
  );

  /*
    Inline code.
  */

  text = text.replace(
    /`([^`]+)`/g,
    '<code>$1</code>'
  );

  /*
    Newlines.
  */

  text = text.replace(/\r?\n/g,'<br>');

  return text;

}


/*
  Find the hostname of a URL.
*/

function hostname(url = '') {

  try {

    return new URL(url).hostname;

  } catch (_) {

    return '';

  }

}


/*
  Favicon fallback.

  Google's favicon service is used as a fallback because
  many result objects don't provide an explicit favicon.
*/

function faviconFor(url, explicit = '') {

  if(explicit) return explicit;

  const host = hostname(url);

  if(!host) return '';

  return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=32`;

}


/*
  Get an image/OG thumbnail from the various shapes that
  search providers commonly return.
*/

function thumbnailFor(result) {

  return (
    result.thumbnail ||
    result.thumbnail_url ||
    result.image ||
    result.image_url ||
    result.properties?.thumbnail ||
    result.properties?.image ||
    result.meta_url?.image ||
    ''
  );

}


/*
  Safely create an external URL.
*/

function safeHref(value = '') {

  try {

    const url = new URL(value);

    if(
      url.protocol === 'http:' ||
      url.protocol === 'https:'
    ){

      return url.href;

    }

  } catch (_) {}

  return '';

}


/*
  Search button visual state.
*/

function updateButtonState(button, value) {

  button.classList.toggle(
    'has-input',
    String(value || '').trim().length > 0
  );

}


/* =========================================================
   DICTIONARY
========================================================= */

async function loadDictionary(word) {

  dictionary.classList.remove('hidden');

  dictionary.innerHTML = `
    <h2 class="dictionary-title">Dictionary</h2>
    <div class="dictionary-word">${esc(word)}</div>
    <div class="dictionary-loading">
      Loading definition…
    </div>
  `;

  try {

    const response = await fetch(
      `${WORKER_BASE}/api/dictionary?word=${encodeURIComponent(word)}`,
      {
        headers:{
          'Accept':'application/json'
        }
      }
    );

    const text = await response.text();

    let data = null;

    try {

      data = text ? JSON.parse(text) : null;

    } catch (_) {

      throw new Error(
        'Dictionary returned invalid JSON.'
      );

    }

    if(!response.ok){

      throw new Error(
        data?.error ||
        'Dictionary unavailable.'
      );

    }

    renderDictionary(data,word);

  } catch(error) {

    dictionary.innerHTML = `
      <h2 class="dictionary-title">Dictionary</h2>
      <div class="dictionary-word">${esc(word)}</div>
      <div class="dictionary-empty">
        ${esc(error.message || 'Definition unavailable.')}
      </div>
    `;

  }

}


/*
  FreeDictionaryAPI can return different entry shapes,
  so this renderer is intentionally defensive.
*/

function renderDictionary(data,word) {

  const entries =
    Array.isArray(data?.entries)
      ? data.entries
      : Array.isArray(data)
        ? data
        : [];

  dictionary.innerHTML = '';

  const title =
    document.createElement('h2');

  title.className =
    'dictionary-title';

  title.textContent =
    'Dictionary';

  dictionary.appendChild(title);

  const wordEl =
    document.createElement('div');

  wordEl.className =
    'dictionary-word';

  wordEl.textContent =
    data?.word || word;

  dictionary.appendChild(wordEl);


  if(!entries.length){

    const empty =
      document.createElement('div');

    empty.className =
      'dictionary-empty';

    empty.textContent =
      'No dictionary entry found.';

    dictionary.appendChild(empty);

    return;

  }


  entries.forEach(entry => {

    const article =
      document.createElement('article');

    article.className =
      'dictionary-entry';


    if(entry.language){

      const language =
        document.createElement('div');

      language.className =
        'dictionary-language';

      language.textContent =
        typeof entry.language === 'string'
          ? entry.language
          : entry.language.name || '';

      article.appendChild(language);

    }


    const pos =
      entry.partOfSpeech ||
      entry.part_of_speech ||
      entry.pos ||
      '';

    if(pos){

      const posEl =
        document.createElement('div');

      posEl.className =
        'dictionary-pos';

      posEl.textContent =
        pos;

      article.appendChild(posEl);

    }


    const senses =
      Array.isArray(entry.senses)
        ? entry.senses
        : Array.isArray(entry.meanings)
          ? entry.meanings
          : [];


    senses.forEach(sense => {

      const block =
        document.createElement('div');

      block.className =
        'dictionary-sense';


      const definition =
        sense.definition ||
        sense.def ||
        sense.meaning ||
        '';


      if(definition){

        const definitionEl =
          document.createElement('div');

        definitionEl.className =
          'dictionary-definition';

        definitionEl.textContent =
          definition;

        block.appendChild(definitionEl);

      }


      const example =
        sense.example ||
        sense.examples?.[0] ||
        '';

      if(example){

        const exampleEl =
          document.createElement('div');

        exampleEl.className =
          'dictionary-example';

        exampleEl.textContent =
          `“${example}”`;

        block.appendChild(exampleEl);

      }


      article.appendChild(block);

    });


    const translations =
      entry.translations ||
      entry.translation ||
      null;


    if(translations){

      const section =
        document.createElement('div');

      section.className =
        'dictionary-translations';


      const heading =
        document.createElement('div');

      heading.className =
        'dictionary-label';

      heading.textContent =
        'Translations';

      section.appendChild(heading);


      const ul =
        document.createElement('ul');

      ul.className =
        'dictionary-list';


      if(Array.isArray(translations)){

        translations.forEach(item => {

          const li =
            document.createElement('li');

          li.textContent =
            typeof item === 'string'
              ? item
              : item.translation ||
                item.text ||
                JSON.stringify(item);

          ul.appendChild(li);

        });

      }else if(typeof translations === 'object'){

        Object.entries(translations)
          .slice(0,20)
          .forEach(([language,value]) => {

            const li =
              document.createElement('li');

            li.textContent =
              `${language}: ${
                Array.isArray(value)
                  ? value.join(', ')
                  : value
              }`;

            ul.appendChild(li);

          });

      }


      if(ul.children.length)
        section.appendChild(ul);

      article.appendChild(section);

    }


    dictionary.appendChild(article);

  });

}


/*
  The dictionary is shown for normal web searches.
  It is hidden for Images/News.
*/

function dictionaryWordForQuery(q){

  /*
    Keep dictionary lookup conservative.

    A phrase like "best restaurants in Manila" should not
    create a dictionary lookup for the whole phrase.
  */

  const words =
    q.trim().split(/\s+/);

  if(words.length !== 1)
    return '';

  const word =
    words[0]
      .replace(/^[^a-zA-Z'-]+|[^a-zA-Z'-]+$/g,'');

  if(
    !word ||
    word.length < 2 ||
    word.length > 50
  )
    return '';

  return word;

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function render(data){

  home.classList.add('hidden');
  results.classList.remove('hidden');

  currentType =
    data.type || currentType;

  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';

  let a = [];


  if(currentType === 'web'){

    a =
      Array.isArray(data.results)
        ? data.results
        : Array.isArray(data.results?.web?.results)
          ? data.results.web.results
          : [];

  }

  else if(currentType === 'images'){

    a =
      Array.isArray(data.results)
        ? data.results
        : [];

  }

  else if(currentType === 'news'){

    a =
      Array.isArray(data.results)
        ? data.results
        : [];

  }


  count.textContent =
    a.length
      ? `${a.length} results`
      : '';


  resultsInput.value =
    data.query || '';

  list.innerHTML =
    '';

  pager.innerHTML =
    '';


  document
    .querySelectorAll('.search-type')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.type === currentType
      );

    });


  /*
    Dictionary.
  */

  const dictionaryWord =
    currentType === 'web'
      ? dictionaryWordForQuery(data.query || currentQ)
      : '';

  if(dictionaryWord){

    loadDictionary(dictionaryWord);

  }else{

    dictionary.classList.add('hidden');
    dictionary.innerHTML = '';

  }


  if(!a.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    return;

  }


  /* =======================================================
     IMAGES
  ======================================================= */

  if(currentType === 'images'){

    const grid =
      document.createElement('div');

    grid.className =
      'image-grid';


    a.forEach(r => {

      const u =
        safeHref(
          r.url ||
          r.properties?.url ||
          ''
        );

      const img =
        safeHref(
          r.thumbnail ||
          r.thumbnail_url ||
          r.properties?.url ||
          r.image ||
          ''
        );

      if(!img)
        return;


      const el =
        document.createElement('article');

      el.className =
        'image-result';


      el.innerHTML = `
        <a
          href="${esc(u || img)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="${esc(img)}"
            alt="${esc(r.title || '')}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >
        </a>

        <div class="image-result-title">
          ${esc(r.title || u || 'Image')}
        </div>

        <div class="image-result-source">
          ${esc(
            r.source ||
            r.meta_url?.hostname ||
            hostname(u)
          )}
        </div>
      `;

      grid.appendChild(el);

    });


    if(grid.children.length){

      list.appendChild(grid);

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';

    }

  }


  /* =======================================================
     NEWS
  ======================================================= */

  else if(currentType === 'news'){

    a.forEach(r => {

      const el =
        document.createElement('article');

      el.className =
        'result';


      const u =
        safeHref(r.url || '');

      const title =
        r.title ||
        u ||
        'News result';

      const desc =
        r.description ||
        r.content ||
        '';

      const age =
        r.age ||
        r.publishedDate ||
        r.published_date ||
        '';


      const image =
        safeHref(
          thumbnailFor(r)
        );


      el.innerHTML = `

        ${
          image
            ? `<img
                class="news-image"
                src="${esc(image)}"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
              >`
            : ''
        }

        <div class="result-url-row">

          <img
            class="result-favicon"
            src="${esc(
              faviconFor(
                u,
                r.favicon ||
                r.meta_url?.favicon ||
                ''
              )
            )}"
            alt=""
            loading="lazy"
          >

          <div class="result-url">
            ${esc(
              decodeUrl(
                r.meta_url?.hostname ||
                hostname(u) ||
                u
              )
            )}
          </div>

        </div>

        <h2>
          <a
            href="${esc(u)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>
        </h2>

        ${
          desc
            ? `<p class="snippet">${richText(desc)}</p>`
            : ''
        }

        ${
          age
            ? `<div class="result-meta">${esc(age)}</div>`
            : ''
        }

      `;

      list.appendChild(el);

    });

  }


  /* =======================================================
     WEB
  ======================================================= */

  else{

    a.forEach(r => {

      const el =
        document.createElement('article');

      el.className =
        'result';


      const u =
        safeHref(r.url || '');

      const host =
        r.meta_url?.hostname ||
        hostname(u);


      const title =
        r.title ||
        u ||
        'Search result';


      const desc =
        r.description ||
        r.content ||
        '';


      const age =
        r.age ||
        r.publishedDate ||
        r.published_date ||
        '';


      /*
        Explicit thumbnail / OG image first.
      */

      const thumbnail =
        safeHref(
          thumbnailFor(r)
        );


      /*
        Explicit favicon first,
        then hostname favicon fallback.
      */

      const favicon =
        faviconFor(
          u,
          r.favicon ||
          r.meta_url?.favicon ||
          r.properties?.favicon ||
          ''
        );


      /*
        Only show the preview image when the provider
        actually supplied one.

        We don't use favicon as the large preview image.
      */

      el.innerHTML = `

        <div class="result-url-row">

          <img
            class="result-favicon"
            src="${esc(favicon)}"
            alt=""
            loading="lazy"
            referrerpolicy="no-referrer"
          >

          <div class="result-url">
            ${esc(
              decodeUrl(host || u)
            )}
          </div>

        </div>


        <h2>

          <a
            href="${esc(u)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>

        </h2>


        ${
          thumbnail
            ? `
              <img
                class="result-preview"
                src="${esc(thumbnail)}"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
              >
            `
            : ''
        }


        ${
          desc
            ? `<p class="snippet">${richText(desc)}</p>`
            : ''
        }


        ${
          age
            ? `<div class="result-meta">${esc(age)}</div>`
            : ''
        }

      `;


      list.appendChild(el);

    });

  }


  /* =======================================================
     PAGINATION
  ======================================================= */

  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const button =
      document.createElement('button');

    button.textContent =
      'Previous';

    button.onclick =
      () =>
        search(
          currentQ,
          currentPage - 1,
          currentType
        );

    pager.appendChild(button);

  }


  if(more){

    const button =
      document.createElement('button');

    button.textContent =
      'Next';

    button.onclick =
      () =>
        search(
          currentQ,
          currentPage + 1,
          currentType
        );

    pager.appendChild(button);

  }


  /*
    Update browser URL.

    Maps intentionally removed.
  */

  const params =
    new URLSearchParams();

  params.set(
    'q',
    data.query || currentQ
  );

  params.set(
    'type',
    currentType
  );

  if(currentPage)
    params.set(
      'page',
      String(currentPage)
    );

  history.replaceState(
    {},
    '',
    `/?${params.toString()}`
  );

}


/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page = 0,
  type = currentType
){

  q =
    String(q || '').trim();

  if(!q)
    return;


  if(!['web','images','news'].includes(type))
    type = 'web';


  currentQ =
    q;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    type;


  document.title =
    `${q} - FlibidooSearch`;


  input.value =
    q;

  resultsInput.value =
    q;


  home.classList.add('hidden');

  results.classList.remove('hidden');


  list.innerHTML =
    '<div class="empty">Searching…</div>';

  count.textContent =
    '';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML =
    '';


  /*
    Hide dictionary while changing categories.
  */

  if(type !== 'web'){

    dictionary.classList.add('hidden');
    dictionary.innerHTML = '';

  }


  try{

    /*
      IMPORTANT:

      The browser talks to YOUR WORKER.

      The worker talks to Tiago.

      We do NOT call search.tiago.zip directly here.
    */

    const params =
      new URLSearchParams({
        q,
        type,
        page:String(currentPage)
      });


    const response =
      await fetch(
        `${WORKER_BASE}/api/search?${params.toString()}`,
        {
          method:'GET',
          headers:{
            'Accept':'application/json'
          }
        }
      );


    const text =
      await response.text();


    let data;


    /*
      Prevent:

        Unexpected token 'N',
        "Not Found " is not valid JSON

      from turning into a mysterious error.
    */

    try{

      data =
        text
          ? JSON.parse(text)
          : {};

    }catch(_){

      if(
        response.status === 404 &&
        text.trim() === 'Not Found'
      ){

        throw new Error(
          'Search endpoint returned 404. Check that the Worker is deployed with /api/search.'
        );

      }

      throw new Error(
        `Search server returned invalid JSON (HTTP ${response.status}).`
      );

    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        `Search failed (HTTP ${response.status}).`
      );

    }


    data.type =
      type;


    render(data);


  }catch(error){

    list.innerHTML =
      `
        <div class="error">
          ${esc(
            error?.message ||
            'Search failed. Please try again.'
          )}
        </div>
      `;

  }

}

form.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const q =
      input.value.trim();

    if(!q)
      return;

    location.href =
      `/?q=${encodeURIComponent(q)}&type=web&page=0`;

  }
);


resultsForm.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const q =
      resultsInput.value.trim();

    if(q)
      search(
        q,
        0,
        currentType
      );

  }
);


input.addEventListener(
  'input',
  () =>
    updateButtonState(
      submitButton,
      input.value
    )
);


resultsInput.addEventListener(
  'input',
  () =>
    updateButtonState(
      resultsSubmitButton,
      resultsInput.value
    )
);


/*
  Category switching.

  There is NO Maps button anymore.
*/

document
  .querySelectorAll('.search-type')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        const q =
          resultsInput.value.trim() ||
          currentQ;

        if(!q)
          return;

        search(
          q,
          0,
          button.dataset.type
        );

      }
    );

  });

const aboutOverlay =
  document.querySelector('#aboutOverlay');


document
  .querySelector('#aboutButton')
  .onclick =
    () =>
      aboutOverlay.classList.remove('hidden');


document
  .querySelector('#aboutClose')
  .onclick =
    () =>
      aboutOverlay.classList.add('hidden');

      aboutOverlay.classList.add(
        'hidden'
      );

  }
);

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


/* =========================================================
   INITIAL URL
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );

const initialQuery =
  params.get('q');

const initialType =
  params.get('type');


if(initialQuery){

  search(
    initialQuery,
    Number(
      params.get('page') || 0
    ),
    ['web','images','news'].includes(initialType)
      ? initialType
      : 'web'
  );

}
