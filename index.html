<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">

<link rel="icon"
      href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG">

<title>FlibidooSearch</title>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden
}

a{
  color:inherit
}

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px
}

/* HOME */

#home.home{
  width:100%;
  height:100vh;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.home-inner{
  width:min(100%,760px);
  display:flex;
  flex-direction:column;
  align-items:center
}

.hero-logo{
  width:min(260px,65vw);
  max-height:180px;
  height:auto;
  display:block;
  margin:0 auto 18px;
  object-fit:contain
}

h1{
  font-size:clamp(38px,5vw,58px);
  line-height:1;
  margin:0 0 32px;
  letter-spacing:-.055em;
  font-weight:500;
  text-align:center
}

.search-wrap{
  width:min(100%,760px)
}

form{
  display:flex;
  align-items:center;
  height:56px;
  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;
  transition:border-color .15s ease,box-shadow .15s ease;
  width:100%
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08)
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 16px
}

input::placeholder{
  color:#9e8da1
}

.submit{
  height:40px;
  width:40px;
  margin-right:7px;
  border:1px solid var(--line);
  background:transparent;
  color:#766679;
  border-radius:50%;
  padding:9px;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 40px
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus)
}

.submit:hover{
  border-color:var(--focus)
}

.submit-icon{
  width:20px;
  height:20px;
  display:block;
  fill:currentColor
}

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
  font-size:13px
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0
}

.links button:hover{
  color:var(--text)
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center
}

.confederacy-credit img{
  width:18px;
  height:18px;
  display:block;
  object-fit:contain;
  flex:0 0 18px;
  border-radius:4px
}

/* RESULTS */

main{
  flex:1
}

.results{
  padding:30px 12px 70px
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:44px;
  border-bottom:1px solid var(--line2);
  padding-bottom:14px;
  margin-bottom:14px
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:inherit;
  white-space:nowrap
}

.results-brand img{
  width:28px;
  height:28px;
  object-fit:contain;
  display:block
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em
}

.results-query{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap
}

.results-search{
  width:min(100%,760px);
  margin:0 0 28px
}

.results-search form{
  height:52px
}

.search-types{
  display:flex;
  align-items:flex-end;
  gap:0;
  margin:8px 0 18px;
  border-bottom:1px solid rgba(255,255,255,.12);
  height:36px
}

.search-type{
  position:relative;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font:inherit;
  font-size:13px;
  line-height:20px;
  padding:0 12px 10px;
  margin:0;
  border-radius:0;
  cursor:pointer
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent
}

.search-type.active::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:-1px;
  height:2px;
  border-radius:2px 2px 0 0;
  background:currentColor
}

.results-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:42px;
  align-items:start
}

/* WEB RESULTS */

.result{
  padding:0 0 26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2)
}

.result-url-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  margin-bottom:7px
}

.result-favicon{
  width:18px;
  height:18px;
  object-fit:contain;
  border-radius:3px;
  flex:0 0 18px;
  background:rgba(255,255,255,.04)
}

.result-url{
  font-size:13px;
  color:var(--url);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.result h2{
  font-size:20px;
  line-height:1.3;
  margin:0 0 7px;
  font-weight:500;
  letter-spacing:-.02em
}

.result h2 a{
  text-decoration:none
}

.result h2 a:hover{
  text-decoration:underline
}

.snippet{
  font-size:14px;
  line-height:1.6;
  color:var(--result);
  margin:0;
  max-width:760px
}

.snippet strong,
.snippet b{
  font-weight:700
}

.snippet em,
.snippet i{
  font-style:italic
}

.snippet a{
  text-decoration:underline
}

.result-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:7px
}

/* IMAGES */

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 22px
}

.image-result{
  min-width:0;
  position:relative
}

.image-result a{
  display:block;
  text-decoration:none
}

.image-thumb-wrap{
  position:relative;
  overflow:hidden
}

.image-result img{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.02);
  user-select:none;
  -webkit-user-drag:none
}

/* Long press progress */

.image-progress{
  position:absolute;
  left:0;
  bottom:0;
  height:4px;
  width:0;
  background:#fff;
  opacity:.9;
  pointer-events:none;
  transition:none
}

.image-result-title{
  font-size:14px;
  line-height:1.4;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.image-result-source{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

/* DICTIONARY */

.dictionary{
  border-left:1px solid var(--line2);
  padding-left:28px;
  max-height:70vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin
}

.dictionary.hidden{
  display:none
}

.dictionary-title{
  font-size:22px;
  font-weight:500;
  letter-spacing:-.02em;
  margin:0 0 5px
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line2)
}

.dictionary-language,
.dictionary-label{
  font-size:12px;
  color:var(--muted)
}

.dictionary-language{
  margin-bottom:8px
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px
}

.dictionary-label{
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:7px
}

.dictionary-list{
  margin:0;
  padding-left:18px
}

.dictionary-list li{
  margin:0 0 7px
}

.dictionary-sense{
  margin:0 0 15px
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);
  margin-left:5px
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;
  color:var(--result);
  margin:7px 0 0 14px
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;
  color:var(--muted)
}

/* WORD OF THE DAY */

.wotd-panel{
  padding:0 0 22px;
  margin:0 0 22px;
  border-bottom:1px solid var(--line2)
}

.wotd-heading{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 8px;
  color:#ffb52e;
  font-size:13px;
  font-weight:600
}

.wotd-word{
  color:#fff;
  font-size:20px;
  font-weight:600;
  line-height:1.25;
  margin:0 0 7px
}

.wotd-definition{
  color:#ffe9a8;
  font-size:13px;
  line-height:1.55;
  margin:0
}

.wotd-example{
  color:#c9b88a;
  font-size:12px;
  line-height:1.5;
  margin:7px 0 0
}

.wotd-status{
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

/* MAP */

.map-result{
  padding:0 0 22px;
  margin-bottom:22px;
  border-bottom:1px solid var(--line2)
}

.map-result-title{
  font-size:18px;
  line-height:1.35;
  margin:0 0 6px;
  font-weight:500
}

.map-result-title a{
  text-decoration:none
}

.map-result-title a:hover{
  text-decoration:underline
}

.map-result-address{
  font-size:14px;
  line-height:1.55;
  color:var(--result)
}

.map-result-coords{
  font-size:12px;
  color:var(--muted);
  margin-top:6px
}

/* MISC */

.empty{
  padding:70px 0;
  color:var(--muted);
  text-align:center
}

.error{
  min-height:120px;
  max-width:680px;
  margin:0;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line2);
  color:var(--muted);
  font-size:14px;
  line-height:1.5
}

.pager{
  display:flex;
  gap:8px;
  padding-top:10px
}

.pager button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:4px;
  padding:8px 12px;
  cursor:pointer
}

.hidden{
  display:none!important
}

/* ABOUT */

.about-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:24px;
  z-index:10000
}

.about-overlay.hidden{
  display:none
}

.about-card{
  position:relative;
  width:min(100%,560px);
  max-height:min(80vh,700px);
  overflow:auto;
  background:#24132a;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  padding:30px
}

.about-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text)
}

.about-card h2{
  margin:0 38px 16px 0;
  font-size:25px;
  font-weight:500
}

.about-card p{
  color:var(--result);
  line-height:1.7;
  font-size:14px
}

.about-card a{
  color:var(--text)
}

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr
  }

  .dictionary{
    order:-1;
    border-left:0;
    border-bottom:1px solid var(--line2);
    border-top:0;
    padding:0 0 26px;
    margin-bottom:26px;
    max-height:none
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 14px
  }
}

@media(max-width:640px){

  .shell{
    width:100%;
    padding-left:16px;
    padding-right:16px
  }

  #home.home{
    padding:20px 16px
  }

  .hero-logo{
    width:190px
  }

  h1{
    font-size:38px;
    margin-bottom:24px
  }

  form{
    height:52px
  }

  .results{
    padding:22px 16px 60px
  }

  .results-head{
    gap:12px
  }

  .results-brand img{
    width:24px;
    height:24px
  }

  .results-brand span{
    font-size:14px
  }

  .results-query{
    font-size:13px
  }

  .search-types{
    overflow-x:auto;
    scrollbar-width:none
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;
    font-size:12px
  }

  .about-overlay{
    padding:16px
  }

  .about-card{
    padding:26px 22px
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<main>

<section id="home" class="home shell">

  <div class="home-inner">

    <img
      class="hero-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="Flibidoo">

    <h1><em><strong>Flibidoo</strong></em>Search</h1>

    <div class="search-wrap">

      <form id="searchForm" role="search">

        <input
          id="q"
          name="q"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web"
          aria-label="Search the web">

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="Search">

          <svg
            class="submit-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
            aria-hidden="true">

            <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>

          </svg>

        </button>

      </form>

    </div>

    <div class="links">

      <button type="button" id="aboutButton">
        About
      </button>

      <span class="confederacy-credit">
        with love from The Great Confederacy of E

        <img
          src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
          alt=""
          aria-hidden="true">

      </span>

    </div>

  </div>

</section>


<section id="results" class="results shell hidden">

  <div class="results-head">

    <a class="results-brand" href="/" aria-label="FlibidooSearch home">

      <img
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt="">

      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>

    </a>

    <div id="queryLabel" class="results-query"></div>

    <div id="count" class="count"></div>

  </div>


  <div class="results-search">

    <form id="resultsSearchForm" role="search">

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web">

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search">

        <svg
          class="submit-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true">

          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>

        </svg>

      </button>

    </form>

  </div>


  <nav class="search-types" aria-label="Search type">

    <button class="search-type active" data-type="web" type="button">
      Web
    </button>

    <button class="search-type" data-type="images" type="button">
      Images
    </button>

    <button class="search-type" data-type="news" type="button">
      News
    </button>

  </nav>


  <div class="results-layout">

    <div>

      <div id="resultList"></div>

      <div id="pager" class="pager"></div>

    </div>

    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results">
    </aside>

  </div>

</section>

</main>


<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle">

  <div class="about-card">

    <button
      id="aboutClose"
      class="about-close"
      type="button"
      aria-label="Close About">
      ×
    </button>

    <h2 id="aboutTitle">About</h2>

    <p>Welcome to FlibidooSearch.</p>

    <p>
      You can edit this text directly in the HTML inside the
      <strong>about-card</strong>.
    </p>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_BASE =
  'https://ancient-unit-5007.daniel-torres-a95.workers.dev';

const WOTD_BASE =
  'https://ancient-unit-5007.daniel-torres-a95.workers.dev';


/* =========================================================
   ELEMENTS
========================================================= */

const form =
  document.querySelector('#searchForm');

const input =
  document.querySelector('#q');

const home =
  document.querySelector('#home');

const results =
  document.querySelector('#results');

const list =
  document.querySelector('#resultList');

const label =
  document.querySelector('#queryLabel');

const count =
  document.querySelector('#count');

const pager =
  document.querySelector('#pager');

const resultsForm =
  document.querySelector('#resultsSearchForm');

const resultsInput =
  document.querySelector('#resultsQ');

const dictionary =
  document.querySelector('#dictionary');

const submitButton =
  document.querySelector('#submitButton');

const resultsSubmitButton =
  document.querySelector('#resultsSubmitButton');


/* =========================================================
   STATE
========================================================= */

let currentQ = '';
let currentPage = 0;
let currentType = 'web';


/* =========================================================
   BASIC HELPERS
========================================================= */

function updateButtonState(button,value){

  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );

}


/*
 * Decode entities such as:
 *
 * let&#x27;s
 *
 * into:
 *
 * let's
 */
function decodeEntities(value=''){

  const textarea =
    document.createElement('textarea');

  textarea.innerHTML = String(value);

  return textarea.value;

}


/*
 * Convert basic Markdown into HTML.
 */
function markdownToHtml(value=''){

  let text =
    decodeEntities(value);

  /*
   * Escape HTML first so arbitrary HTML cannot execute.
   */
  text = text
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');

  /*
   * Markdown links.
   */
  text = text.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2">$1</a>'
  );

  /*
   * Bold.
   */
  text = text.replace(
    /\*\*([\s\S]*?)\*\*/g,
    '<strong>$1</strong>'
  );

  /*
   * Italic.
   */
  text = text.replace(
    /(^|[^\*])\*([^*]+)\*/g,
    '$1<em>$2</em>'
  );

  /*
   * Underscore italic.
   */
  text = text.replace(
    /(^|[^_])_([^_]+)_/g,
    '$1<em>$2</em>'
  );

  /*
   * New lines.
   */
  text = text.replace(
    /\r?\n/g,
    '<br>'
  );

  return text;
}


/*
 * Safely allow useful HTML formatting from search descriptions.
 *
 * Allowed:
 *
 * strong
 * b
 * em
 * i
 * u
 * br
 * a
 *
 * Everything else becomes plain text.
 */
function richText(value=''){

  const source =
    decodeEntities(value);

  const html =
    markdownToHtml(source);

  const doc =
    new DOMParser().parseFromString(
      `<div>${html}</div>`,
      'text/html'
    );

  const root =
    doc.body.firstElementChild;

  const allowed =
    new Set([
      'STRONG',
      'B',
      'EM',
      'I',
      'U',
      'BR',
      'A'
    ]);

  root
    .querySelectorAll('*')
    .forEach(node=>{

      if(!allowed.has(node.tagName)){

        node.replaceWith(
          document.createTextNode(
            node.textContent
          )
        );

        return;
      }

      if(node.tagName === 'A'){

        const href =
          node.getAttribute('href') || '';

        if(!/^https?:\/\//i.test(href)){

          node.replaceWith(
            document.createTextNode(
              node.textContent
            )
          );

          return;
        }

        node.setAttribute(
          'href',
          href
        );

        node.setAttribute(
          'rel',
          'noopener noreferrer'
        );

        /*
         * Same-tab navigation.
         */
        node.removeAttribute('target');
      }

      [...node.attributes]
        .forEach(attr=>{

          if(
            node.tagName !== 'A' ||
            attr.name !== 'href' ||
            attr.name === 'target'
          ){

            if(
              node.tagName !== 'A' ||
              attr.name !== 'href'
            ){
              node.removeAttribute(
                attr.name
              );
            }

          }

        });

    });

  return root.innerHTML;
}


/* =========================================================
   URL / FAVICON
========================================================= */

function getHostname(url){

  try{

    return new URL(url).hostname;

  }catch{

    return '';

  }

}


function faviconFor(url){

  const host =
    getHostname(url);

  if(!host)
    return '';

  /*
   * Google's favicon endpoint is used as the
   * reliable fallback.
   */
  return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;
}


/* =========================================================
   OG THUMBNAIL
========================================================= */

function getThumbnail(result){

  return (
    result.thumbnail ||
    result.image ||
    result.image_url ||
    result.properties?.thumbnail ||
    result.properties?.image ||
    ''
  );

}


/* =========================================================
   DICTIONARY
========================================================= */

async function loadDictionary(word){

  word =
    word.trim();

  if(!word){
    dictionary.classList.add('hidden');
    return;
  }

  dictionary.classList.remove('hidden');

  dictionary.innerHTML =
    '<div class="dictionary-loading">Looking up definition…</div>';

  try{

    const response =
      await fetch(
        `${API_BASE}/api/dictionary?word=${encodeURIComponent(word)}`
      );

    const text =
      await response.text();

    let data = {};

    try{
      data =
        text ? JSON.parse(text) : {};
    }catch{

      dictionary.classList.add('hidden');
      return;

    }

    if(!response.ok){

      dictionary.classList.add('hidden');
      return;

    }

    const entries =
      Array.isArray(data.entries)
        ? data.entries
        : [];

    if(!entries.length){

      dictionary.classList.add('hidden');
      return;

    }

    renderDictionary(
      word,
      entries
    );

  }catch{

    dictionary.classList.add('hidden');

  }

}


function renderDictionary(word,entries){

  /*
   * English first.
   */
  const sorted =
    [...entries].sort((a,b)=>{

      const al =
        String(
          a.language ||
          a.lang ||
          a.language_code ||
          ''
        ).toLowerCase();

      const bl =
        String(
          b.language ||
          b.lang ||
          b.language_code ||
          ''
        ).toLowerCase();

      const ae =
        al.includes('english') ||
        al === 'en' ||
        al.startsWith('en-');

      const be =
        bl.includes('english') ||
        bl === 'en' ||
        bl.startsWith('en-');

      if(ae && !be) return -1;
      if(!ae && be) return 1;

      return 0;

    });

  let html = `
    <h2 class="dictionary-title">
      Dictionary
    </h2>

    <div class="dictionary-word">
      ${escapeHtml(word)}
    </div>
  `;

  sorted.forEach(entry=>{

    const language =
      entry.language ||
      entry.lang ||
      entry.language_code ||
      '';

    const pos =
      entry.partOfSpeech ||
      entry.part_of_speech ||
      entry.pos ||
      '';

    const senses =
      entry.senses ||
      entry.meanings ||
      [];

    html += `
      <section class="dictionary-entry">

        ${
          language
            ? `<div class="dictionary-language">
                 ${escapeHtml(language)}
               </div>`
            : ''
        }

        ${
          pos
            ? `<div class="dictionary-pos">
                 ${escapeHtml(pos)}
               </div>`
            : ''
        }
    `;

    if(Array.isArray(senses)){

      senses
        .slice(0,8)
        .forEach(sense=>{

          const definition =
            sense.definition ||
            sense.def ||
            sense.meaning ||
            '';

          const example =
            sense.example ||
            sense.examples?.[0] ||
            '';

          if(!definition)
            return;

          html += `
            <div class="dictionary-sense">

              <div class="dictionary-definition">
                ${richText(definition)}
              </div>

              ${
                example
                  ? `<div class="dictionary-example">
                       ${richText(example)}
                     </div>`
                  : ''
              }

            </div>
          `;

        });

    }

    html += `
      </section>
    `;

  });

  dictionary.innerHTML =
    html;

}


function escapeHtml(value=''){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');

}


/* =========================================================
   WORD OF THE DAY
========================================================= */

async function getWotd(){

  try{

    const response =
      await fetch(
        `${WOTD_BASE}/`
      );

    if(!response.ok)
      return null;

    const word =
      (await response.text()).trim();

    if(!word ||
       word.toLowerCase().includes('failed'))
      return null;

    return word;

  }catch{

    return null;

  }

}


function isWotdQuery(query){

  const q =
    query.toLowerCase().trim();

  return (
    q === 'wotd' ||
    q === 'word of the day' ||
    q.includes('word of the day') ||
    /\bwotd\b/.test(q)
  );

}


async function renderWotdPanel(){

  const word =
    await getWotd();

  if(!word)
    return;

  let definition = '';
  let example = '';

  try{

    const response =
      await fetch(
        `${API_BASE}/api/dictionary?word=${encodeURIComponent(word)}`
      );

    if(response.ok){

      const data =
        await response.json();

      const entries =
        Array.isArray(data.entries)
          ? data.entries
          : [];

      /*
       * Prefer English.
       */
      const entry =
        entries.find(e=>{

          const lang =
            String(
              e.language ||
              e.lang ||
              ''
            ).toLowerCase();

          return (
            lang.includes('english') ||
            lang === 'en'
          );

        }) || entries[0];

      const senses =
        entry?.senses ||
        entry?.meanings ||
        [];

      const first =
        Array.isArray(senses)
          ? senses.find(
              s=>s.definition ||
                  s.def ||
                  s.meaning
            )
          : null;

      if(first){

        definition =
          first.definition ||
          first.def ||
          first.meaning ||
          '';

        example =
          first.example ||
          first.examples?.[0] ||
          '';

      }

    }

  }catch{}

  const panel =
    document.createElement('section');

  panel.className =
    'wotd-panel';

  panel.innerHTML = `

    <div class="wotd-heading">
      Word of the Day!
    </div>

    <div class="wotd-word">
      ${escapeHtml(word)}
    </div>

    ${
      definition
        ? `<div class="wotd-definition">
             ${richText(definition)}
           </div>`
        : ''
    }

    ${
      example
        ? `<div class="wotd-example">
             ${richText(example)}
           </div>`
        : ''
    }

  `;

  dictionary.classList.remove(
    'hidden'
  );

  dictionary.prepend(panel);

}


async function checkIfCurrentWordIsWotd(query){

  const wotd =
    await getWotd();

  if(!wotd)
    return false;

  return (
    query.trim().toLowerCase() ===
    wotd.trim().toLowerCase()
  );

}


/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page=0,
  type=currentType
){

  q =
    q.trim();

  if(!q)
    return;

  currentQ =
    q;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    type;

  document.title =
    `${q} - FlibidooSearch`;

  input.value =
    q;

  resultsInput.value =
    q;

  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );

  list.innerHTML =
    '<div class="empty">Searching…</div>';

  count.textContent =
    '';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML =
    '';

  dictionary.classList.add(
    'hidden'
  );

  /*
   * Load dictionary independently.
   * This means dictionary still appears even
   * when the search itself has zero results.
   */
  const dictionaryPromise =
    isWotdQuery(q)
      ? renderWotdPanel()
      : loadDictionary(q);

  /*
   * If the query itself is the current WOTD,
   * put the WOTD panel above its dictionary.
   */
  if(!isWotdQuery(q)){

    checkIfCurrentWordIsWotd(q)
      .then(isWotd=>{

        if(isWotd){

          dictionary.innerHTML = '';

          renderWotdPanel()
            .then(()=>loadDictionary(q));

        }

      });

  }

  try{

    const url =
      `${API_BASE}/api/search` +
      `?q=${encodeURIComponent(q)}` +
      `&type=${encodeURIComponent(type)}` +
      `&page=${currentPage}`;

    const response =
      await fetch(url);

    const text =
      await response.text();

    let data = {};

    try{

      data =
        text ? JSON.parse(text) : {};

    }catch{

      throw new Error(
        `Search endpoint returned invalid JSON (${response.status}).`
      );

    }

    if(!response.ok){

      throw new Error(
        data.error ||
        `Search endpoint returned ${response.status}.`
      );

    }

    data.type =
      type;

    render(data);

    await dictionaryPromise;

    history.replaceState(
      {},
      '',
      `/?q=${encodeURIComponent(q)}` +
      `&type=${encodeURIComponent(type)}` +
      (
        currentPage
          ? `&page=${currentPage}`
          : ''
      )
    );

  }catch(error){

    list.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message ||
          'Search failed. Please try again.'
        )}
      </div>
    `;

    /*
     * Do NOT remove the dictionary if search fails.
     */
    try{
      await dictionaryPromise;
    }catch{}

  }

}


/* =========================================================
   RENDER SEARCH RESULTS
========================================================= */

function render(data){

  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );

  currentType =
    data.type ||
    currentType;

  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';

  let a = [];

  if(currentType === 'web'){

    a =
      Array.isArray(
        data.results
      )
        ? data.results
        : (
            Array.isArray(
              data.results?.web?.results
            )
              ? data.results.web.results
              : []
          );

  }else if(
    currentType === 'images' ||
    currentType === 'news'
  ){

    a =
      Array.isArray(
        data.results
      )
        ? data.results
        : [];

  }

  count.textContent =
    a.length
      ? `${a.length} results`
      : '';

  resultsInput.value =
    data.query || '';

  list.innerHTML =
    '';

  pager.innerHTML =
    '';

  document
    .querySelectorAll('.search-type')
    .forEach(button=>{

      button.classList.toggle(
        'active',
        button.dataset.type ===
        currentType
      );

    });


  if(!a.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

  }else if(currentType === 'images'){

    renderImages(a);

  }else{

    renderWebOrNews(a);

  }


  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );

  if(currentPage > 0){

    const button =
      document.createElement('button');

    button.textContent =
      'Previous';

    button.onclick =
      ()=>search(
        currentQ,
        currentPage - 1,
        currentType
      );

    pager.appendChild(
      button
    );

  }

  if(more){

    const button =
      document.createElement('button');

    button.textContent =
      'Next';

    button.onclick =
      ()=>search(
        currentQ,
        currentPage + 1,
        currentType
      );

    pager.appendChild(
      button
    );

  }

}


/* =========================================================
   WEB / NEWS
========================================================= */

function renderWebOrNews(a){

  a.forEach(r=>{

    const el =
      document.createElement('article');

    el.className =
      'result';

    const url =
      r.url ||
      r.link ||
      '';

    const host =
      r.meta_url?.hostname ||
      getHostname(url);

    const title =
      r.title ||
      url;

    const desc =
      r.description ||
      r.content ||
      '';

    const age =
      r.age ||
      r.publishedDate ||
      r.published ||
      '';

    const favicon =
      r.favicon ||
      faviconFor(url);

    el.innerHTML = `

      <div class="result-url-row">

        ${
          favicon
            ? `<img
                 class="result-favicon"
                 src="${escapeHtml(favicon)}"
                 alt=""
                 loading="lazy"
                 referrerpolicy="no-referrer">`
            : ''
        }

        <div class="result-url">
          ${escapeHtml(host || url)}
        </div>

      </div>

      <h2>
        <a href="${escapeHtml(url)}">
          ${escapeHtml(title)}
        </a>
      </h2>

      ${
        desc
          ? `<p class="snippet">
               ${richText(desc)}
             </p>`
          : ''
      }

      ${
        age
          ? `<div class="result-meta">
               ${escapeHtml(age)}
             </div>`
          : ''
      }

    `;

    /*
     * Explicitly force same-tab navigation.
     */
    const link =
      el.querySelector('h2 a');

    if(link){

      link.removeAttribute(
        'target'
      );

      link.addEventListener(
        'click',
        ()=>{
          window.location.href =
            link.href;
        }
      );

    }

    list.appendChild(
      el
    );

  });

}


/* =========================================================
   IMAGE RESULTS
========================================================= */

function renderImages(a){

  const grid =
    document.createElement('div');

  grid.className =
    'image-grid';

  a.forEach(r=>{

    const url =
      r.url ||
      r.properties?.url ||
      '';

    const img =
      getThumbnail(r);

    if(!img)
      return;

    const title =
      r.title ||
      url;

    const source =
      r.source ||
      r.meta_url?.hostname ||
      getHostname(url);

    const el =
      document.createElement('article');

    el.className =
      'image-result';

    el.innerHTML = `

      <a href="${escapeHtml(img)}">

        <div class="image-thumb-wrap">

          <img
            src="${escapeHtml(img)}"
            alt="${escapeHtml(title)}"
            loading="lazy"
            referrerpolicy="no-referrer"
            draggable="false">

          <div class="image-progress"></div>

        </div>

      </a>

      <div class="image-result-title">
        ${escapeHtml(title)}
      </div>

      <div class="image-result-source">
        ${escapeHtml(source)}
      </div>

    `;

    const anchor =
      el.querySelector('a');

    const image =
      el.querySelector('img');

    const progress =
      el.querySelector(
        '.image-progress'
      );

    let timer = null;
    let startedAt = 0;
    let longPressTriggered = false;

    function cancelLongPress(){

      if(timer){

        clearInterval(timer);
        timer = null;

      }

      progress.style.width =
        '0';

    }

    function startLongPress(){

      longPressTriggered =
        false;

      startedAt =
        Date.now();

      timer =
        setInterval(()=>{

          const elapsed =
            Date.now() -
            startedAt;

          const percent =
            Math.min(
              100,
              (elapsed / 2000) * 100
            );

          progress.style.width =
            `${percent}%`;

          if(percent >= 100){

            clearInterval(timer);
            timer = null;

            longPressTriggered =
              true;

            downloadImage(
              img,
              title
            );

            setTimeout(
              ()=>{
                progress.style.width =
                  '0';
              },
              250
            );

          }

        },20);

    }

    image.addEventListener(
      'pointerdown',
      startLongPress
    );

    image.addEventListener(
      'pointerup',
      ()=>{
        if(!longPressTriggered)
          cancelLongPress();
      }
    );

    image.addEventListener(
      'pointerleave',
      cancelLongPress
    );

    image.addEventListener(
      'pointercancel',
      cancelLongPress
    );

    /*
     * Prevent normal click from being swallowed.
     * Clicking goes to the image URL in the same tab.
     */
    anchor.addEventListener(
      'click',
      e=>{

        if(longPressTriggered){

          e.preventDefault();
          longPressTriggered =
            false;

        }

      }
    );

    grid.appendChild(
      el
    );

  });

  if(grid.children.length){

    list.appendChild(
      grid
    );

  }else{

    list.innerHTML =
      '<div class="empty">No images found.</div>';

  }

}


/* =========================================================
   IMAGE DOWNLOAD
========================================================= */

async function downloadImage(
  url,
  title
){

  try{

    const response =
      await fetch(url);

    if(!response.ok)
      throw new Error();

    const blob =
      await response.blob();

    const objectUrl =
      URL.createObjectURL(blob);

    const a =
      document.createElement('a');

    a.href =
      objectUrl;

    a.download =
      sanitizeFilename(
        title || 'flibidoo-image'
      );

    document.body.appendChild(
      a
    );

    a.click();

    a.remove();

    URL.revokeObjectURL(
      objectUrl
    );

  }catch{

    /*
     * If CORS prevents direct download,
     * navigate to the image instead.
     */
    window.location.href =
      url;

  }

}


function sanitizeFilename(value){

  return String(value)
    .replace(/[\\/:*?"<>|]+/g,' ')
    .trim()
    .slice(0,120) ||
    'flibidoo-image';

}
