<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">
<title>FlibidooSearch</title>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden
}

a{color:inherit}

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px
}

/* =========================
   HOME
========================= */

#home.home{
  width:100%;
  height:100vh;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

/* Small hero logo */

.hero-logo{
  width:115px;
  height:115px;
  display:block;
  margin:0 0 12px;
  object-fit:contain;

  /* subtle transparent/faded edges */
  -webkit-mask-image:
    radial-gradient(
      ellipse at center,
      #000 55%,
      rgba(0,0,0,.92) 70%,
      rgba(0,0,0,.45) 88%,
      transparent 100%
    );
  mask-image:
    radial-gradient(
      ellipse at center,
      #000 55%,
      rgba(0,0,0,.92) 70%,
      rgba(0,0,0,.45) 88%,
      transparent 100%
    );
}

h1{
  font-size:clamp(34px,5vw,54px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500
}

.search-wrap{
  width:min(100%,680px)
}

form{
  display:flex;
  align-items:center;
  height:54px;
  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;
  transition:border-color .15s ease,box-shadow .15s ease
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08)
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 14px
}

input::placeholder{
  color:#9e8da1
}

.submit{
  height:38px;
  width:38px;
  margin-right:8px;
  border:1px solid var(--line);
  background:transparent;
  color:#766679;
  border-radius:50%;
  padding:0;
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:18px
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus)
}

.submit:hover{
  border-color:var(--focus)
}

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
  font-size:13px
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0
}

.links button:hover{
  color:var(--text)
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center
}

.confederacy-credit img{
  width:20px;
  height:20px;
  display:block;
  object-fit:contain;
  flex:0 0 20px;
  border-radius:5px
}

main{
  flex:1
}

/* =========================
   RESULTS PAGE
========================= */

.results{
  padding:22px 12px 70px
}

/*
  TOP RESULTS BAR
  Logo is intentionally small here.
*/

.results-head{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:52px;
  border-bottom:1px solid var(--line2);
  padding-bottom:14px;
  margin-bottom:18px
}

.results-brand{
  display:flex;
  align-items:center;
  gap:9px;
  text-decoration:none;
  color:inherit;
  white-space:nowrap
}

/* THIS is the top-bar logo size */

.results-brand img{
  width:34px;
  height:34px;
  object-fit:contain;
  display:block;
  flex:0 0 34px;

  -webkit-mask-image:
    radial-gradient(
      circle,
      #000 58%,
      rgba(0,0,0,.75) 80%,
      transparent 100%
    );
  mask-image:
    radial-gradient(
      circle,
      #000 58%,
      rgba(0,0,0,.75) 80%,
      transparent 100%
    );
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em
}

.results-query{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap
}

.results-search{
  width:min(100%,680px);
  margin:0 0 22px
}

.results-search form{
  height:48px
}

.results-search .submit{
  width:34px;
  height:34px;
  margin-right:6px
}

/* =========================
   SEARCH TYPES
========================= */

.search-types{
  display:flex;
  align-items:flex-end;
  gap:0;
  margin:8px 0 22px;
  border-bottom:1px solid rgba(255,255,255,.12);
  height:36px
}

.search-type{
  position:relative;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font:inherit;
  font-size:13px;
  line-height:20px;
  padding:0 12px 10px;
  margin:0;
  cursor:pointer
}

.search-type:hover,
.search-type.active{
  color:#fff
}

.search-type.active::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:-1px;
  height:2px;
  border-radius:2px 2px 0 0;
  background:currentColor
}

/* =========================
   MAIN RESULTS + SIDEBAR
========================= */

.results-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:42px;
  align-items:start
}

/* =========================
   WEB RESULT
========================= */

.result{
  position:relative;
  padding:0 0 26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2)
}

.result-main{
  min-width:0;
  padding-right:150px
}

.result-url{
  font-size:13px;
  color:var(--url);
  margin-bottom:6px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.result-title-row{
  display:flex;
  align-items:flex-start;
  gap:9px;
  min-width:0
}

.result-favicon{
  width:18px;
  height:18px;
  flex:0 0 18px;
  margin-top:3px;
  object-fit:contain;
  border-radius:3px
}

.result h2{
  min-width:0;
  font-size:20px;
  line-height:1.25;
  margin:0 0 7px;
  font-weight:500;
  letter-spacing:-.02em
}

.result h2 a{
  text-decoration:none
}

.result h2 a:hover{
  text-decoration:underline
}

.snippet{
  font-size:14px;
  line-height:1.6;
  color:var(--result);
  margin:0;
  max-width:760px
}

.result-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:7px
}

/* OG / thumbnail */

.result-thumbnail{
  position:absolute;
  right:0;
  top:0;
  width:128px;
  height:82px;
  object-fit:cover;
  border:1px solid var(--line2);
  border-radius:8px;
  background:rgba(255,255,255,.025)
}

.result-thumbnail.favicon-fallback{
  object-fit:contain;
  padding:27px;
  background:rgba(255,255,255,.025)
}

/* =========================
   DICTIONARY SIDEBAR
========================= */

.dictionary{
  border-left:1px solid var(--line2);
  padding-left:28px;
  max-height:72vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin
}

.dictionary.hidden{
  display:none!important
}

.dictionary-title{
  font-size:25px;
  font-weight:500;
  letter-spacing:-.025em;
  margin:0 0 4px
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px
}

.dictionary-entry{
  padding:0 0 22px;
  margin-bottom:22px;
  border-bottom:1px solid var(--line2)
}

.dictionary-language{
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px
}

.dictionary-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.07em;
  margin-bottom:7px
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px
}

.dictionary-sense{
  margin:0 0 15px
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55
}

.dictionary-tags{
  font-size:11px;
  color:var(--muted);
  margin-left:5px
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;
  color:var(--result);
  margin:7px 0 0 14px
}

.dictionary-list{
  margin:0;
  padding-left:18px
}

.dictionary-list li{
  margin:0 0 7px;
  font-size:13px;
  line-height:1.45
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;
  color:var(--muted)
}

/* =========================
   IMAGES
========================= */

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 22px
}

.image-result{
  min-width:0
}

.image-result a{
  display:block;
  text-decoration:none
}

.image-result img{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.02)
}

.image-result-title{
  font-size:14px;
  line-height:1.4;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.image-result-source{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

/* =========================
   MAP
========================= */

.map-result{
  padding:0 0 22px;
  margin-bottom:22px;
  border-bottom:1px solid var(--line2)
}

.map-result-title{
  font-size:18px;
  line-height:1.35;
  margin:0 0 6px;
  font-weight:500
}

.map-result-title a{
  text-decoration:none
}

.map-result-title a:hover{
  text-decoration:underline
}

.map-result-address{
  font-size:14px;
  line-height:1.55;
  color:var(--result)
}

.map-result-coords{
  font-size:12px;
  color:var(--muted);
  margin-top:6px
}

/* =========================
   EMPTY / ERROR / PAGER
========================= */

.empty{
  padding:70px 0;
  color:var(--muted);
  text-align:center
}

.error{
  min-height:120px;
  max-width:680px;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line2);
  color:var(--muted);
  font-size:14px;
  line-height:1.5
}

.pager{
  display:flex;
  gap:8px;
  padding-top:10px
}

.pager button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:4px;
  padding:8px 12px;
  cursor:pointer
}

.hidden{
  display:none!important
}

/* =========================
   ABOUT
========================= */

.about-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:24px;
  z-index:10000
}

.about-card{
  position:relative;
  width:min(100%,560px);
  max-height:min(80vh,700px);
  overflow:auto;
  background:#24132a;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  padding:30px
}

.about-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text)
}

.about-card h2{
  margin:0 38px 16px 0;
  font-size:25px;
  font-weight:500
}

.about-card p{
  color:var(--result);
  line-height:1.7;
  font-size:14px
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr
  }

  .dictionary{
    order:-1;
    border-left:0;
    border-bottom:1px solid var(--line2);
    padding:0 0 26px;
    margin-bottom:26px;
    max-height:none
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 14px
  }

  .result-main{
    padding-right:115px
  }

  .result-thumbnail{
    width:100px;
    height:70px
  }
}

@media(max-width:640px){

  .shell{
    width:100%;
    padding-left:16px;
    padding-right:16px
  }

  #home.home{
    padding:20px 16px
  }

  .hero-logo{
    width:95px;
    height:95px
  }

  h1{
    font-size:36px;
    margin-bottom:24px
  }

  .results{
    padding:18px 16px 60px
  }

  .results-head{
    gap:10px
  }

  .results-brand img{
    width:30px;
    height:30px;
    flex-basis:30px
  }

  .results-brand span{
    font-size:14px
  }

  .results-query{
    font-size:13px
  }

  .search-types{
    overflow-x:auto;
    scrollbar-width:none
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;
    font-size:12px
  }

  .about-overlay{
    padding:16px
  }

  .about-card{
    padding:26px 22px
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr
  }

  .result-main{
    padding-right:0
  }

  .result-thumbnail{
    position:relative;
    top:auto;
    right:auto;
    width:100%;
    height:150px;
    margin-top:12px
  }

}
</style>
</head>

<body>

<main>

<!-- =========================
     HOME
========================= -->

<section id="home" class="home shell">

  <div class="search-wrap">

    <img
      class="hero-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="Flibidoo"
    >

    <h1>
      <em><strong>Flibidoo</strong></em>Search
    </h1>

    <form id="searchForm" role="search">

      <input
        id="q"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="submitButton"
        type="submit"
        aria-label="Search"
      >→</button>

    </form>

    <div class="links">

      <button
        type="button"
        id="aboutButton"
      >
        About
      </button>

      <span class="confederacy-credit">

        <span>
          with love from The Great Confederacy of E
        </span>

        <img
          src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
          alt=""
          aria-hidden="true"
        >

      </span>

    </div>

  </div>

</section>


<!-- =========================
     RESULTS
========================= -->

<section
  id="results"
  class="results shell hidden"
>

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >

      <img
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt="Flibidoo"
      >

      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>

    </a>

    <div
      id="queryLabel"
      class="results-query"
    ></div>

    <div
      id="count"
      class="count"
    ></div>

  </div>


  <div class="results-search">

    <form
      id="resultsSearchForm"
      role="search"
    >

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >→</button>

    </form>

  </div>


  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >Web</button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >Images</button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >News</button>

    <button
      class="search-type"
      data-type="map"
      type="button"
    >Maps</button>

  </nav>


  <div class="results-layout">

    <div>

      <div id="resultList"></div>

      <div
        id="pager"
        class="pager"
      ></div>

    </div>


    <!-- DICTIONARY SIDEBAR -->

    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results"
    ></aside>

  </div>

</section>

</main>


<!-- =========================
     ABOUT
========================= -->

<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle"
>

  <div class="about-card">

    <button
      id="aboutClose"
      class="about-close"
      type="button"
      aria-label="Close About"
    >×</button>

    <h2 id="aboutTitle">About</h2>

    <p>
      Welcome to FlibidooSearch.
    </p>

    <p>
      You can edit this text directly in the HTML
      inside the <strong>about-card</strong>.
    </p>

  </div>

</div>


<script>

const form=document.querySelector('#searchForm');
const input=document.querySelector('#q');

const home=document.querySelector('#home');
const results=document.querySelector('#results');

const list=document.querySelector('#resultList');
const label=document.querySelector('#queryLabel');
const count=document.querySelector('#count');
const pager=document.querySelector('#pager');

const resultsForm=document.querySelector('#resultsSearchForm');
const resultsInput=document.querySelector('#resultsQ');

const dictionary=document.querySelector('#dictionary');

let currentQ='';
let currentPage=0;
let currentType='web';


/* =========================
   UTILITIES
========================= */

function esc(s=''){

  return String(s).replace(
    /[&<>'"]/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );

}


function getHostname(url=''){

  try{
    return new URL(url).hostname;
  }catch{
    return '';
  }

}


function faviconFor(url=''){

  const host=getHostname(url);

  if(!host)return '';

  return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;

}


/*
  Look for as many common image fields as possible.
*/

function getResultThumbnail(r,url){

  return (
    r.thumbnail ||
    r.thumbnail_url ||
    r.image ||
    r.image_url ||
    r.og_image ||
    r.ogImage ||
    r.meta?.image ||
    r.meta?.og_image ||
    r.properties?.thumbnail ||
    r.properties?.image ||
    faviconFor(url)
  );

}


function isFaviconFallback(src,url){

  return src===faviconFor(url);

}


/* =========================
   DICTIONARY
========================= */

/*
  Your Worker exposes:

    GET /api/dictionary?word=...

  This function calls that endpoint.
*/

async function loadDictionary(word){

  word=(word||'').trim();

  dictionary.classList.remove('hidden');

  if(!word){

    dictionary.innerHTML='';

    dictionary.classList.add('hidden');

    return;

  }


  dictionary.innerHTML=`

    <div class="dictionary-title">
      Dictionary
    </div>

    <div class="dictionary-word">
      Looking up “${esc(word)}”…
    </div>

    <div class="dictionary-loading">
      Loading definition…
    </div>

  `;


  try{

    const response=
      await fetch(
        `/api/dictionary?word=${encodeURIComponent(word)}`
      );


    const data=
      await response.json();


    if(
      !response.ok ||
      !Array.isArray(data.entries) ||
      !data.entries.length
    ){

      dictionary.innerHTML=`

        <div class="dictionary-title">
          Dictionary
        </div>

        <div class="dictionary-word">
          ${esc(word)}
        </div>

        <div class="dictionary-empty">
          No dictionary entry found.
        </div>

      `;

      return;

    }


    renderDictionary(word,data);

  }catch(error){

    dictionary.innerHTML=`

      <div class="dictionary-title">
        Dictionary
      </div>

      <div class="dictionary-word">
        ${esc(word)}
      </div>

      <div class="dictionary-empty">
        Dictionary temporarily unavailable.
      </div>

    `;

  }

}


/*
  The Free Dictionary API can return several
  slightly different shapes.

  This renderer deliberately checks multiple
  possible property names so the sidebar is
  resilient to the response format.
*/

function renderDictionary(word,data){

  let html=`

    <div class="dictionary-title">
      Dictionary
    </div>

    <div class="dictionary-word">
      ${esc(word)}
    </div>

  `;


  data.entries.forEach(entry=>{

    const language=
      entry.language?.name ||
      entry.language ||
      entry.lang ||
      '';

    const partOfSpeech=
      entry.partOfSpeech ||
      entry.part_of_speech ||
      entry.pos ||
      '';


    html+=`

      <article class="dictionary-entry">

        ${
          language
            ? `<div class="dictionary-language">
                ${esc(language)}
              </div>`
            : ''
        }

        ${
          partOfSpeech
            ? `<div class="dictionary-pos">
                ${esc(partOfSpeech)}
              </div>`
            : ''
        }

    `;


    /*
      Definitions can be directly on the entry
      or nested inside senses.
    */

    let definitions=
      entry.definitions ||
      entry.senses ||
      [];


    if(!Array.isArray(definitions)){
      definitions=[];
    }


    if(definitions.length){

      html+=`

        <div class="dictionary-senses">

          <div class="dictionary-label">
            Definitions
          </div>

      `;


      definitions.forEach((sense,index)=>{

        const definition=
          typeof sense==='string'
            ? sense
            : (
                sense.definition ||
                sense.meaning ||
                sense.text ||
                ''
              );

        if(!definition)return;


        const example=
          typeof sense==='object'
            ? (
                sense.example ||
                sense.examples?.[0] ||
                ''
              )
            : '';


        const tags=
          typeof sense==='object'
            ? (
                sense.tags ||
                sense.labels ||
                ''
              )
            : '';


        html+=`

          <div class="dictionary-sense">

            <div class="dictionary-definition">

              ${index+1}.
              ${esc(definition)}

              ${
                tags
                  ? `<span class="dictionary-tags">
                      ${esc(
                        Array.isArray(tags)
                          ? tags.join(', ')
                          : tags
                      )}
                    </span>`
                  : ''
              }

            </div>

            ${
              example
                ? `<div class="dictionary-example">
                    “${esc(example)}”
                  </div>`
                : ''
            }

          </div>

        `;

      });


      html+=`</div>`;

    }


    /*
      Synonyms.
    */

    const synonyms=
      entry.synonyms ||
      entry.relations?.synonyms ||
      [];


    if(
      Array.isArray(synonyms) &&
      synonyms.length
    ){

      html+=`

        <div class="dictionary-relations">

          <div class="dictionary-label">
            Synonyms
          </div>

          <div class="dictionary-list">

            ${synonyms
              .slice(0,12)
              .map(
                x=>`<span>${esc(
                  typeof x==='string'
                    ? x
                    : x.word||x.text||''
                )}</span>`
              )
              .join(', ')}

          </div>

        </div>

      `;

    }


    /*
      Antonyms.
    */

    const antonyms=
      entry.antonyms ||
      entry.relations?.antonyms ||
      [];


    if(
      Array.isArray(antonyms) &&
      antonyms.length
    ){

      html+=`

        <div class="dictionary-relations">

          <div class="dictionary-label">
            Antonyms
          </div>

          <div class="dictionary-list">

            ${antonyms
              .slice(0,12)
              .map(
                x=>`<span>${esc(
                  typeof x==='string'
                    ? x
                    : x.word||x.text||''
                )}</span>`
              )
              .join(', ')}

          </div>

        </div>

      `;

    }


    html+=`

      </article>

    `;

  });


  html+=`

    <div class="dictionary-source">
      Source: Free Dictionary API
    </div>

  `;


  dictionary.innerHTML=html;

}


/* =========================
   SEARCH
========================= */

async function search(
  q,
  page=0,
  type=currentType
){

  q=q.trim();

  if(!q)return;


  currentQ=q;

  currentPage=
    Math.max(
      0,
      Number(page)||0
    );

  currentType=type;


  document.title=
    `${q} - FlibidooSearch`;


  input.value=q;
  resultsInput.value=q;


  home.classList.add('hidden');
  results.classList.remove('hidden');


  list.innerHTML=
    '<div class="empty">Searching…</div>';

  count.textContent='';

  label.textContent=
    `Results for “${q}”`;

  pager.innerHTML='';


  /*
    Dictionary loads alongside the search.

    We only show it on Web searches.
  */

  if(type==='web'){

    loadDictionary(q);

  }else{

    dictionary.innerHTML='';
    dictionary.classList.add('hidden');

  }


  /*
    IMPORTANT:

    Call YOUR CLOUDFLARE WORKER:

      /api/search?q=...&type=...&page=...

    NOT Tiago directly.
  */

  try{

    const response=
      await fetch(
        `/api/search?q=${encodeURIComponent(q)}&type=${encodeURIComponent(type)}&page=${currentPage}`,
        {
          method:'GET',
          headers:{
            'Accept':'application/json'
          }
        }
      );


    const data=
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        'Search failed.'
      );

    }


    render(data);


  }catch(error){

    list.innerHTML=`

      <div class="error">
        ${esc(
          error.message ||
          'Search failed. Please try again.'
        )}
      </div>

    `;

  }

}


/* =========================
   RENDER SEARCH RESULTS
========================= */

function render(data){

  home.classList.add('hidden');
  results.classList.remove('hidden');


  currentType=
    data.type ||
    currentType;


  label.textContent=
    data.query
      ? `Results for “${data.query}”`
      : '';


  let a=[];


  if(currentType==='web'){

    a=
      Array.isArray(data.results)
        ? data.results
        : (
            Array.isArray(
              data.results?.web?.results
            )
              ? data.results.web.results
              : []
          );

  }

  else if(
    currentType==='images' ||
    currentType==='news'
  ){

    a=
      Array.isArray(data.results)
        ? data.results
        : [];

  }

  else if(currentType==='map'){

    a=
      Array.isArray(data.results)
        ? data.results
        : [];

  }


  count.textContent=
    a.length
      ? `${a.length} results`
      : '';


  resultsInput.value=
    data.query||'';

  list.innerHTML='';
  pager.innerHTML='';


  document
    .querySelectorAll('.search-type')
    .forEach(button=>{

      button.classList.toggle(
        'active',
        button.dataset.type===currentType
      );

    });


  if(!a.length){

    list.innerHTML=
      '<div class="empty">No results found.</div>';

    return;

  }


  /* =========================
     IMAGES
  ========================= */

  if(currentType==='images'){

    const grid=
      document.createElement('div');

    grid.className='image-grid';


    a.forEach(r=>{

      const url=
        r.url ||
        r.properties?.url ||
        '';

      const image=
        r.thumbnail ||
        r.image ||
        r.properties?.url ||
        '';


      if(!image)return;


      const el=
        document.createElement('article');

      el.className='image-result';


      el.innerHTML=`

        <a
          href="${esc(url)}"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            src="${esc(image)}"
            alt="${esc(r.title||'')}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >

        </a>

        <div class="image-result-title">
          ${esc(r.title||url)}
        </div>

        <div class="image-result-source">
          ${esc(
            r.source ||
            r.meta_url?.hostname ||
            getHostname(url)
          )}
        </div>

      `;


      grid.appendChild(el);

    });


    if(grid.children.length){

      list.appendChild(grid);

    }else{

      list.innerHTML=
        '<div class="empty">No images found.</div>';

    }

  }


  /* =========================
     MAPS
  ========================= */

  else if(currentType==='map'){

    a.forEach(r=>{

      const el=
        document.createElement('article');

      el.className='map-result';


      const title=
        r.title ||
        r.name ||
        'Map result';


      const url=
        r.url ||
        '';


      const addr=
        typeof r.address==='string'
          ? r.address
          : (
              r.address
                ? Object.values(r.address)
                    .filter(
                      v=>typeof v==='string'&&v
                    )
                    .join(', ')
                : r.description ||
                  ''
            );


      const lat=
        r.lat ??
        r.latitude;


      const lon=
        r.lon ??
        r.lng ??
        r.longitude;


      const href=
        lat!=null &&
        lon!=null
          ? `https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lon)}`
          : url;


      el.innerHTML=`

        <h2 class="map-result-title">

          <a
            href="${esc(href)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>

        </h2>

        ${
          addr
            ? `<div class="map-result-address">
                ${esc(addr)}
              </div>`
            : ''
        }

        ${
          lat!=null&&lon!=null
            ? `<div class="map-result-coords">
                ${esc(lat)}, ${esc(lon)}
              </div>`
            : ''
        }

      `;


      list.appendChild(el);

    });

  }


  /* =========================
     WEB / NEWS
  ========================= */

  else{

    a.forEach(r=>{

      const el=
        document.createElement('article');

      el.className='result';


      const url=
        r.url ||
        r.link ||
        '';


      const host=
        r.meta_url?.hostname ||
        getHostname(url);


      const title=
        r.title ||
        url ||
        'Untitled result';


      const description=
        r.description ||
        r.content ||
        '';


      const age=
        r.age ||
        r.publishedDate ||
        r.published_date ||
        '';


      /*
        Favicon.
      */

      const favicon=
        r.favicon ||
        r.favicon_url ||
        r.meta?.favicon ||
        faviconFor(url);


      /*
        Thumbnail / OG image.
      */

      const thumbnail=
        getResultThumbnail(r,url);


      const fallback=
        isFaviconFallback(
          thumbnail,
          url
        );


      el.innerHTML=`

        <div class="result-main">

          <div class="result-url">
            ${esc(host||url)}
          </div>

          <div class="result-title-row">

            <img
              class="result-favicon"
              src="${esc(favicon)}"
              alt=""
              loading="lazy"
              referrerpolicy="no-referrer"
              onerror="this.style.visibility='hidden'"
            >

            <h2>

              <a
                href="${esc(url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${esc(title)}
              </a>

            </h2>

          </div>


          ${
            description
              ? `<p class="snippet">
                  ${esc(description)}
                </p>`
              : ''
          }


          ${
            age
              ? `<div class="result-meta">
                  ${esc(age)}
                </div>`
              : ''
          }

        </div>


        ${
          thumbnail
            ? `<img
                class="result-thumbnail ${
                  fallback
                    ? 'favicon-fallback'
                    : ''
                }"
                src="${esc(thumbnail)}"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="
                  this.onerror=null;
                  this.src='${esc(faviconFor(url))}';
                  this.classList.add('favicon-fallback')
                "
              >`
            : ''
        }

      `;


      list.appendChild(el);

    });

  }


  /* =========================
     PAGINATION
  ========================= */

  const more=
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage>0){

    const button=
      document.createElement('button');

    button.textContent='Previous';

    button.onclick=()=>
      search(
        currentQ,
        currentPage-1,
        currentType
      );

    pager.appendChild(button);

  }


  if(more){

    const button=
      document.createElement('button');

    button.textContent='Next';

    button.onclick=()=>
      search(
        currentQ,
        currentPage+1,
        currentType
      );

    pager.appendChild(button);

  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(
      data.query||currentQ
    )}&type=${encodeURIComponent(
      currentType
    )}${
      currentPage
        ? `&page=${currentPage}`
        : ''
    }`
  );

}


/* =========================
   HOME FORM
========================= */

form.addEventListener(
  'submit',
  e=>{

    e.preventDefault();

    const q=
      input.value.trim();

    if(q){

      location.href=
        `/?q=${encodeURIComponent(q)}&type=web&page=0`;

    }

  }
);


/* =========================
   RESULTS FORM
========================= */

resultsForm.addEventListener(
  'submit',
  e=>{

    e.preventDefault();

    const q=
      resultsInput.value.trim();

    if(q){

      search(
        q,
        0,
        currentType
      );

    }

  }
);


/* =========================
   TABS
========================= */

document
  .querySelectorAll('.search-type')
  .forEach(button=>{

    button.addEventListener(
      'click',
      ()=>{

        search(
          resultsInput.value ||
          currentQ,
          0,
          button.dataset.type
        );

      }
    );

  });


/* =========================
   ABOUT
========================= */

const aboutOverlay=
  document.querySelector(
    '#aboutOverlay'
  );


document
  .querySelector('#aboutButton')
  .onclick=()=>
    aboutOverlay.classList.remove(
      'hidden'
    );


document
  .querySelector('#aboutClose')
  .onclick=()=>
    aboutOverlay.classList.add(
      'hidden'
    );


aboutOverlay.addEventListener(
  'click',
  e=>{

    if(e.target===aboutOverlay){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


document.addEventListener(
  'keydown',
  e=>{

    if(e.key==='Escape'){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


/* =========================
   INITIAL URL
========================= */

const params=
  new URLSearchParams(
    location.search
  );

const initialQuery=
  params.get('q');


if(initialQuery){

  search(
    initialQuery,
    Number(params.get('page')||0),
    [
      'web',
      'images',
      'news',
      'map'
    ].includes(params.get('type'))
      ? params.get('type')
      : 'web'
  );

}

</script>
