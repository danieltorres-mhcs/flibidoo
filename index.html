<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1d0c22" />

  <title>FlibidooSearch</title>

  <link
    rel="icon"
    type="image/png"
    href="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
  />

  <style>
    :root{
      --bg:#1d0c22;
      --text:#f5eef7;
      --muted:#b9aabb;
      --line:#5a4560;
      --line2:#39283d;
      --accent:#f5eef7;
      --result:#e7dce9;
      --url:#b8a2bc;
      --focus:#cdb8d1;
      --translate:#aebedc;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    a{
      color:inherit;
    }

    .shell{
      width:min(100% - 40px,1120px);
      margin:0 auto;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header{
      height:64px;
      border-bottom:1px solid var(--line2);
      display:flex;
      align-items:center;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      font-weight:600;
      letter-spacing:-.01em;
    }

    .brand img{
      width:34px;
      height:34px;
      object-fit:contain;
      display:block;
      mask-image:linear-gradient(
        to bottom,
        #000 0%,
        #000 74%,
        transparent 100%
      );
      -webkit-mask-image:linear-gradient(
        to bottom,
        #000 0%,
        #000 74%,
        transparent 100%
      );
      border-radius:0 0 11px 11px;
    }

    /* =========================================================
       MAIN
       ========================================================= */

    main{
      flex:1;
    }

    .home{
      min-height:calc(100vh - 120px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:54px 0 100px;
    }

    .hero-logo{
      width:min(210px,55vw);
      height:auto;
      display:block;
      margin-bottom:12px;

      mask-image:
        linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        ),
        linear-gradient(
          to bottom,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

      -webkit-mask-image:
        linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        ),
        linear-gradient(
          to bottom,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

      -webkit-mask-composite:source-in;
      mask-composite:intersect;

      border-radius:0;
    }

    h1{
      font-size:clamp(34px,5vw,54px);
      line-height:1;
      margin:0 0 30px;
      letter-spacing:-.055em;
      font-weight:500;
    }

    .search-wrap{
      width:min(100%,680px);
    }

    form{
      display:flex;
      align-items:center;
      height:54px;
      border:1px solid var(--line);
      border-radius:28px;
      background:transparent;
      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    form:focus-within{
      border-color:var(--focus);
      box-shadow:0 0 0 2px rgba(205,184,209,.08);
    }

    .search-icon{
      width:20px;
      height:20px;
      margin-left:18px;
      flex:0 0 auto;
      opacity:.75;
    }

    .search-icon circle,
    .search-icon path{
      stroke:currentColor;
    }

    input{
      min-width:0;
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:16px;
      padding:0 14px;
    }

    input::placeholder{
      color:#9e8da1;
    }

    .submit{
      height:38px;
      width:38px;
      margin-right:8px;
      border:1px solid var(--line);
      background:transparent;
      color:#766679;
      border-radius:50%;
      padding:0;
      display:grid;
      place-items:center;
      font-size:20px;
      line-height:1;
      cursor:pointer;
      transition:
        color .15s ease,
        border-color .15s ease;
    }

    .submit.has-input{
      color:var(--text);
      border-color:var(--focus);
    }

    .submit:hover{
      border-color:var(--focus);
    }

    .submit:focus-visible{
      outline:2px solid var(--focus);
      outline-offset:2px;
    }

    .submit-icon{
      width:18px;
      height:18px;
      display:block;
      transition:
        color .15s ease,
        opacity .15s ease;
    }

    .links{
      display:flex;
      align-items:center;
      gap:18px;
      margin-top:20px;
      color:var(--muted);
      font-size:13px;
      flex-wrap:wrap;
    }

    .links button,
    .links a{
      border:0;
      background:none;
      color:inherit;
      cursor:pointer;
      padding:0;
      text-decoration:none;
    }

    .links button:hover,
    .links a:hover{
      color:var(--text);
    }

    .love-credit{
      display:inline-flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      white-space:nowrap;
    }

    .love-credit img{
      width:22px;
      height:22px;
      object-fit:contain;
      display:block;
    }

    /* =========================================================
       RESULTS
       ========================================================= */

    .results{
      padding:30px 0 70px;
    }

    .results-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line2);
      padding-bottom:14px;
      margin-bottom:14px;
      gap:15px;
    }

    .count{
      font-size:13px;
      color:var(--muted);
    }

    .results-search{
      width:min(100%,680px);
      margin:0 0 28px;
    }

    .results-search form{
      height:48px;
    }

    .results-search .search-icon{
      margin-left:16px;
    }

    .results-search .submit{
      width:34px;
      height:34px;
      margin-right:6px;
    }

    /* =========================================================
       RESULTS BRAND
       ========================================================= */

    .results-header{
      display:flex;
      align-items:center;
      gap:18px;
      min-height:44px;
    }

    .results-brand{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:inherit;
      white-space:nowrap;
    }

    .results-brand img{
      width:28px;
      height:28px;
      object-fit:contain;
      display:block;
    }

    .results-brand span{
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
    }

    .results-query-label{
      font-size:14px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* =========================================================
       SEARCH TYPES
       ========================================================= */

    .search-types{
      display:flex;
      align-items:flex-end;
      gap:0;
      margin:8px 0 18px;
      border-bottom:1px solid rgba(255,255,255,.12);
      height:36px;
    }

    .search-type{
      position:relative;
      appearance:none;
      border:0;
      background:transparent;
      color:rgba(255,255,255,.62);
      font:inherit;
      font-size:13px;
      line-height:20px;
      padding:0 12px 10px;
      margin:0;
      border-radius:0;
      cursor:pointer;
      transition:color .12s ease;
    }

    .search-type:hover{
      color:rgba(255,255,255,.9);
      background:transparent;
    }

    .search-type.active{
      color:#fff;
      background:transparent;
    }

    .search-type.active::after{
      content:"";
      position:absolute;
      left:10px;
      right:10px;
      bottom:-1px;
      height:2px;
      border-radius:2px 2px 0 0;
      background:currentColor;
    }

    .search-type:focus-visible{
      outline:1px solid rgba(255,255,255,.55);
      outline-offset:-2px;
    }

    /* =========================================================
       TRANSLATE MESSAGE
       ========================================================= */

    .translate-message{
      display:none;
      margin:0 0 20px;
      padding:0;
      font-size:14px;
      line-height:1.5;
      color:var(--muted);
    }

    .translate-message.show{
      display:block;
    }

    .translate-message a{
      color:var(--translate);
      text-decoration:underline;
      text-decoration-thickness:1px;
      text-underline-offset:2px;
    }

    .translate-message a:hover{
      color:#c4d2e8;
    }

    /* =========================================================
       RESULTS LAYOUT
       ========================================================= */

    .results-layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 330px;
      gap:42px;
      align-items:start;
    }

    /* =========================================================
       DICTIONARY
       ========================================================= */

    .dictionary{
      border-left:1px solid var(--line2);
      padding-left:28px;

      /*
        Sticky on desktop and landscape tablets.
        Portrait devices override this below.
      */
      position:sticky;
      top:20px;

      max-height:calc(100vh - 40px);
      overflow-y:auto;
      overscroll-behavior:contain;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,.2) transparent;
    }

    .dictionary::-webkit-scrollbar{
      width:6px;
    }

    .dictionary::-webkit-scrollbar-track{
      background:transparent;
    }

    .dictionary::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.2);
      border-radius:6px;
    }

    .dictionary.hidden{
      display:none;
    }

    .dictionary-title{
      font-size:22px;
      font-weight:500;
      letter-spacing:-.02em;
      margin:0 0 5px;
    }

    .dictionary-word{
      font-size:13px;
      color:var(--muted);
      margin-bottom:22px;
    }

    .dictionary-entry{
      padding:0 0 24px;
      margin-bottom:24px;
      border-bottom:1px solid var(--line2);
    }

    .dictionary-entry:last-child{
      border-bottom:0;
    }

    .dictionary-language{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .dictionary-pos{
      font-size:15px;
      margin-bottom:12px;
    }

    .dictionary-pronunciations,
    .dictionary-forms,
    .dictionary-senses,
    .dictionary-relations,
    .dictionary-translations{
      margin-top:14px;
    }

    .dictionary-label{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:7px;
    }

    .dictionary-list{
      margin:0;
      padding-left:18px;
    }

    .dictionary-list li{
      margin:0 0 7px;
    }

    .dictionary-sense{
      margin:0 0 15px;
    }

    .dictionary-definition{
      font-size:14px;
      line-height:1.55;
    }

    .dictionary-tags{
      font-size:12px;
      color:var(--muted);
      margin-left:5px;
    }

    .dictionary-example{
      font-size:13px;
      line-height:1.5;
      color:var(--result);
      margin:7px 0 0 14px;
    }

    .dictionary-quote{
      font-size:13px;
      line-height:1.5;
      color:var(--muted);
      margin:7px 0 0 14px;
    }

    .dictionary-source{
      font-size:12px;
      line-height:1.5;
      color:var(--muted);
      padding-top:4px;
    }

    .dictionary-source a{
      color:inherit;
    }

    .dictionary-loading,
    .dictionary-empty{
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    /* =========================================================
       MOBILE DICTIONARY SCROLL CONTROLS
       ========================================================= */

    .dictionary-scroll-controls{
      display:none;
    }

    .dictionary-scroll-button{
      width:25px;
      height:25px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(29,12,34,.88);
      color:rgba(255,255,255,.72);
      border-radius:5px;
      display:grid;
      place-items:center;
      padding:0;
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
      backdrop-filter:blur(5px);
      -webkit-backdrop-filter:blur(5px);
      transition:
        color .12s ease,
        border-color .12s ease,
        background .12s ease;
    }

    .dictionary-scroll-button:hover{
      color:#fff;
      border-color:rgba(255,255,255,.35);
      background:rgba(45,23,51,.94);
    }

    .dictionary-scroll-button:active{
      color:#fff;
      border-color:rgba(255,255,255,.5);
    }

    .dictionary-scroll-button svg{
      width:13px;
      height:13px;
      display:block;
    }

    /* =========================================================
       RESULTS
       ========================================================= */

    .result{
      padding:0 0 26px;
      margin-bottom:26px;
      border-bottom:1px solid var(--line2);
    }

    .result-url{
      font-size:13px;
      color:var(--url);
      margin-bottom:6px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .result h2{
      font-size:20px;
      line-height:1.25;
      margin:0 0 7px;
      font-weight:500;
      letter-spacing:-.02em;
    }

    .result h2 a{
      text-decoration:none;
    }

    .result h2 a:hover{
      text-decoration:underline;
    }

    .snippet{
      font-size:14px;
      line-height:1.6;
      color:var(--result);
      margin:0;
      max-width:760px;
    }

    .result-favicon{
      width:18px;
      height:18px;
      object-fit:contain;
      vertical-align:-4px;
      margin-right:7px;
    }

    .result-meta{
      font-size:12px;
      color:var(--muted);
      margin-top:7px;
    }

    .result-inline-thumb{
      margin-top:10px;
      max-width:260px;
    }

    .result-inline-thumb img{
      display:block;
      width:100%;
      max-height:150px;
      object-fit:cover;
    }

    /* =========================================================
       IMAGE RESULTS
       ========================================================= */

    .image-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:28px 22px;
    }

    .image-result{
      min-width:0;
    }

    .image-result a{
      display:block;
      text-decoration:none;
    }

    .image-result img{
      display:block;
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      border:1px solid var(--line2);
      background:rgba(255,255,255,.02);
    }

    .image-result-title{
      font-size:14px;
      line-height:1.4;
      margin-top:9px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .image-result-source{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* =========================================================
       MAP RESULTS
       ========================================================= */

    .map-result{
      padding:0 0 22px;
      margin-bottom:22px;
      border-bottom:1px solid var(--line2);
    }

    .map-result-title{
      font-size:18px;
      line-height:1.35;
      margin:0 0 6px;
      font-weight:500;
    }

    .map-result-title a{
      text-decoration:none;
    }

    .map-result-title a:hover{
      text-decoration:underline;
    }

    .map-result-address{
      font-size:14px;
      line-height:1.55;
      color:var(--result);
    }

    .map-result-coords{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    /* =========================================================
       ERROR / EMPTY / PAGER
       ========================================================= */

    .empty{
      padding:70px 0;
      color:var(--muted);
      text-align:center;
    }

    .error{
      min-height:120px;
      max-width:680px;
      margin:0;
      padding:28px 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      border:1px solid var(--line2);
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .pager{
      display:flex;
      gap:8px;
      padding-top:10px;
    }

    .pager button{
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      border-radius:4px;
      padding:8px 12px;
      cursor:pointer;
    }

    .pager button:hover{
      border-color:var(--focus);
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer{
      height:56px;
      border-top:1px solid var(--line2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:var(--muted);
      font-size:12px;
    }

    .footer-links{
      display:flex;
      gap:16px;
    }

    .footer-links a{
      text-decoration:none;
    }

    .footer-links a:hover{
      text-decoration:underline;
      color:var(--text);
    }

    /* =========================================================
       AUTOCOMPLETE
       ========================================================= */

    .flibidoo-suggest-wrap{
      position:relative;
    }

    .flibidoo-suggestions{
      position:absolute;
      left:0;
      right:0;
      top:calc(100% + 4px);
      z-index:100;
      background:#1d0c22;
      border:1px solid rgba(255,255,255,.14);
      border-radius:8px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
    }

    .flibidoo-suggestion{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      border:0;
      background:transparent;
      color:#fff;
      text-align:left;
      padding:10px 13px;
      font:inherit;
      font-size:13px;
      cursor:pointer;
    }

    .flibidoo-suggestion:hover,
    .flibidoo-suggestion.active{
      background:rgba(255,255,255,.07);
    }

    .flibidoo-suggestion img{
      width:24px;
      height:24px;
      object-fit:cover;
      border-radius:50%;
    }

    .flibidoo-suggestion small{
      display:block;
      color:rgba(255,255,255,.55);
      margin-top:2px;
    }

    /* =========================================================
       GENERAL
       ========================================================= */

    .hidden{
      display:none!important;
    }

    .logo,
    .brand-logo,
    img[alt*="Flibidoo" i],
    img[src*="flibidoo" i]{
      border-radius:0 !important;
    }

    /* =========================================================
       LANDSCAPE TABLET / DESKTOP
       Dictionary stays sticky.
       ========================================================= */

    @media (min-width:641px){
      .dictionary{
        position:sticky;
        top:20px;
      }
    }

    /* =========================================================
       PORTRAIT / VERTICAL DEVICES
       
       Dictionary moves above results and becomes a scroll frame.
       It is NOT sticky.
       ========================================================= */

    @media (orientation:portrait) and (max-width:860px){

      .results-layout{
        display:flex;
        flex-direction:column;
        gap:28px;
      }

      /*
        Dictionary first on portrait devices.
      */
      .dictionary{
        order:-1;
        width:100%;
        position:relative;
        top:auto;
        left:auto;
        right:auto;

        border-left:0;
        border-top:1px solid var(--line2);
        border-bottom:1px solid var(--line2);

        padding:18px 38px 18px 0;

        /*
          This is the mobile dictionary frame.
        */
        max-height:45vh;
        min-height:130px;

        overflow-y:auto;
        overflow-x:hidden;

        overscroll-behavior:contain;
        -webkit-overflow-scrolling:touch;

        scrollbar-width:none;
      }

      .dictionary::-webkit-scrollbar{
        display:none;
      }

      /*
        Custom scroll controls appear only on portrait devices.
      */
      .dictionary-scroll-controls{
        display:flex;
        position:absolute;
        top:0;
        left:0;
        right:0;
        bottom:0;
        pointer-events:none;
        z-index:20;
      }

      .dictionary-scroll-button{
        position:absolute;
        right:6px;
        pointer-events:auto;
      }

      .dictionary-scroll-up{
        top:6px;
      }

      .dictionary-scroll-down{
        bottom:6px;
      }

      .dictionary-title{
        padding-right:5px;
      }

      .dictionary-entry{
        padding-right:2px;
      }

      .translate-message{
        margin-bottom:18px;
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media(max-width:640px){

      .shell{
        width:min(100% - 24px,1120px);
      }

      .home{
        padding-top:25px;
        padding-left:6px;
        padding-right:6px;
      }

      .hero-logo{
        width:150px;
      }

      h1{
        font-size:36px;
        margin-bottom:24px;
      }

      form{
        height:50px;
      }

      .submit{
        width:38px;
        padding:0;
      }

      .results{
        padding-top:22px;
      }

      .results-search{
        margin-bottom:22px;
      }

      .results-head{
        align-items:flex-start;
      }

      .results-brand img{
        width:24px;
        height:24px;
      }

      .results-brand span{
        font-size:14px;
      }

      .results-query-label{
        font-size:13px;
      }

      .search-types{
        overflow-x:auto;
        scrollbar-width:none;
      }

      .search-types::-webkit-scrollbar{
        display:none;
      }

      .search-type{
        padding-left:10px;
        padding-right:10px;
        font-size:12px;
      }

      .image-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:22px 14px;
      }

      .links{
        justify-content:center;
        gap:14px;
      }

      .love-credit{
        width:100%;
        justify-content:center;
      }

      .translate-message{
        font-size:13px;
      }

      footer{
        padding:0 6px;
      }
    }

    @media(max-width:460px){

      .image-grid{
        grid-template-columns:1fr;
      }

<script>
/* ============================================================
   FLIBIDOO WORKER
   ============================================================ */

const FLIBIDOO_WORKER =
  'https://ancient-unit-5007.daniel-torres-a95.workers.dev';


/* ============================================================
   DOM
   ============================================================ */

const form =
  document.querySelector('#searchForm');

const input =
  document.querySelector('#q');

const submitButton =
  document.querySelector('#submitButton');

const home =
  document.querySelector('#home');

const results =
  document.querySelector('#results');

const list =
  document.querySelector('#resultList');

const label =
  document.querySelector('#queryLabel');

const count =
  document.querySelector('#count');

const pager =
  document.querySelector('#pager');

const resultsForm =
  document.querySelector('#resultsSearchForm');

const resultsInput =
  document.querySelector('#resultsQ');

const resultsSubmitButton =
  document.querySelector('#resultsSubmitButton');

const dictionary =
  document.querySelector('#dictionary');

const translateMessage =
  document.querySelector('#translateMessage');


let currentQ = '';
let currentPage = 1;
let currentType = 'web';


/* ============================================================
   HELPERS
   ============================================================ */

function esc(s=''){
  return String(s).replace(
    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );
}


function updateButtonState(button,value){
  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );
}


function normalize(s=''){
  return s
    .toLowerCase()
    .trim()
    .replace(/[“”"'.,!?;:()[\]{}]/g,'')
    .replace(/\s+/g,' ');
}


/* ============================================================
   LEVENSHTEIN
   ============================================================ */

function levenshtein(a,b){

  const prev =
    Array.from(
      {length:b.length+1},
      (_,i)=>i
    );

  for(let i=1;i<=a.length;i++){

    let cur=[i];

    for(let j=1;j<=b.length;j++){

      cur[j]=Math.min(
        cur[j-1]+1,
        prev[j]+1,
        prev[j-1]+(
          a[i-1]===b[j-1] ? 0 : 1
        )
      );
    }

    for(
      let j=0;
      j<=b.length;
      j++
    ){
      prev[j]=cur[j];
    }
  }

  return prev[b.length];
}


/* ============================================================
   DICTIONARY DETECTION
   ============================================================ */

function dictionaryWord(query){

  const q=normalize(query);

  if(!q)return null;

  if(q.split(' ').length===1){
    return q;
  }

  const tokens =
    q.split(' ').filter(Boolean);

  const candidates=new Set();

  for(const t of tokens){

    if(/^[a-z][a-z'-]*$/i.test(t)){

      candidates.add(
        t.replace(
          /^['-]+|['-]+$/g,
          ''
        )
      );
    }
  }

  for(const word of candidates){

    const templates=[
      `meaning of ${word}`,
      `${word} meaning`,
      `${word} means`,
      `${word} definition`,
      `definition of ${word}`
    ];

    for(const template of templates){

      if(
        levenshtein(q,template)<=3
      ){
        return word;
      }
    }
  }

  return null;
}


/* ============================================================
   TRANSLATION QUERY DETECTION
   ============================================================ */

function isTranslationQuery(query){

  const q=normalize(query);

  if(!q)return false;

  /*
    Examples:

    hello to english
    english to spanish
    translate hello
    translator
    translated hello
    say hello in spanish
  */

  if(/\bto english\b/.test(q)){
    return true;
  }

  if(/\benglish to\b/.test(q)){
    return true;
  }

  if(/\btranslate\b/.test(q)){
    return true;
  }

  if(/\btranslator\b/.test(q)){
    return true;
  }

  if(/\btranslated\b/.test(q)){
    return true;
  }

  /*
    "say ____ in ____"
  */
  if(
    /^say\s+.+\s+in\s+.+$/i.test(q)
  ){
    return true;
  }

  return false;
}


function updateTranslationMessage(query){

  translateMessage.classList.toggle(
    'show',
    isTranslationQuery(query)
  );
}


/* ============================================================
   RENDER SEARCH RESULTS
   ============================================================ */

function render(data){

  home.classList.add('hidden');

  results.classList.remove('hidden');

  currentType =
    data.type || currentType;

  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';

  const resultsArray =
    Array.isArray(data.results)
      ? data.results
      : [];

  count.textContent =
    resultsArray.length
      ? `${resultsArray.length} results`
      : '';

  resultsInput.value =
    data.query || '';

  updateButtonState(
    resultsSubmitButton,
    resultsInput.value
  );

  updateTranslationMessage(
    data.query || currentQ
  );

  document
    .querySelectorAll('.search-type')
    .forEach(b =>
      b.classList.toggle(
        'active',
        b.dataset.type===currentType
      )
    );

  list.innerHTML='';
  pager.innerHTML='';


  if(!resultsArray.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    return;
  }


  /* ========================================================
     IMAGES
     ======================================================== */

  if(currentType==='images'){

    const grid =
      document.createElement('div');

    grid.className='image-grid';

    resultsArray.forEach(r=>{

      const u =
        r.url ||
        r.properties?.url ||
        '';

      const img =
        r.thumbnail ||
        r.properties?.url ||
        '';

      if(!img)return;

      const el =
        document.createElement('article');

      el.className='image-result';

      el.innerHTML=`
        <a
          href="${esc(u)}"
          rel="noopener noreferrer"
        >
          <img
            src="${esc(img)}"
            alt="${esc(r.title||'')}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >
        </a>

        <div class="image-result-title">
          ${esc(r.title||u)}
        </div>

        <div class="image-result-source">
          ${esc(
            r.source ||
            r.meta_url?.hostname ||
            ''
          )}
        </div>
      `;

      grid.appendChild(el);
    });

    if(grid.children.length){

      list.appendChild(grid);

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';
    }

  }


  /* ========================================================
     MAPS
     ======================================================== */

  else if(currentType==='map'){

    resultsArray.forEach(r=>{

      const el =
        document.createElement('article');

      el.className='map-result';

      const u =
        r.url || '';

      const title =
        r.title ||
        'Map result';

      const address =
        r.address
          ? Object.values(r.address)
              .filter(Boolean)
              .join(', ')
          : (
              r.description || ''
            );

      el.innerHTML=`
        <h2 class="map-result-title">
          <a
            href="${esc(u)}"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>
        </h2>

        <div class="map-result-address">
          ${esc(address)}
        </div>

        ${
          r.lat && r.lon
            ? `
              <div class="map-result-coords">
                ${esc(r.lat)}, ${esc(r.lon)}
              </div>
            `
            : ''
        }
      `;

      list.appendChild(el);
    });

  }


  /* ========================================================
     WEB / NEWS
     ======================================================== */

  else{

    resultsArray.forEach(r=>{

      const el =
        document.createElement('article');

      el.className='result';

      const u =
        r.url || '';

      const favicon =
        r.meta_url?.favicon || '';

      const host =
        r.meta_url?.hostname || '';

      const title =
        r.title || u;

      const description =
        r.description ||
        r.content ||
        '';

      const age =
        r.age ||
        r.publishedDate ||
        '';

      const thumb =
        r.thumbnail?.src ||
        r.thumbnail ||
        '';

      el.innerHTML=`
        <div class="result-url">

          ${
            favicon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(favicon)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

          <span>
            ${esc(host||u)}
          </span>

        </div>

        <h2>
          <a
            href="${esc(u)}"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>
        </h2>

        ${
          description
            ? `
              <p class="snippet">
                ${window.flibidooRichText(description)}
              </p>
            `
            : ''
        }

        ${
          age
            ? `
              <div class="result-meta">
                ${esc(age)}
              </div>
            `
            : ''
        }

        ${
          thumb
            ? `
              <div class="result-inline-thumb">
                <img
                  src="${esc(thumb)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              </div>
            `
            : ''
        }
      `;

      list.appendChild(el);
    });
  }


  /* ========================================================
     PAGINATION
     ======================================================== */

  const hasMore =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );

  if(currentPage>0){

    const b =
      document.createElement('button');

    b.textContent='Previous';

    b.onclick=() =>
      search(
        currentQ,
        currentPage-1,
        currentType
      );

    pager.appendChild(b);
  }

  if(hasMore){

    const b =
      document.createElement('button');

    b.textContent='Next';

    b.onclick=() =>
      search(
        currentQ,
        currentPage+1,
        currentType
      );

    pager.appendChild(b);
  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(
      data.query||currentQ
    )}&type=${encodeURIComponent(
      currentType
    )}${
      currentPage
        ? `&page=${currentPage}`
        : ''
    }`
  );
}


/* ============================================================
   DICTIONARY
   ============================================================ */

function dictionaryTags(tags){

  return Array.isArray(tags) &&
    tags.length
      ? `
        <span class="dictionary-tags">
          (${tags.map(esc).join(', ')})
        </span>
      `
      : '';
}


function renderSense(sense,depth=0){

  if(!sense)return '';

  let html=`
    <div
      class="dictionary-sense"
      style="
        margin-left:${Math.min(depth,3)*12}px
      "
    >
  `;


  if(sense.definition){

    html += `
      <div class="dictionary-definition">
        ${esc(sense.definition)}
        ${dictionaryTags(sense.tags)}
      </div>
    `;
  }


  if(Array.isArray(sense.examples)){

    sense.examples.forEach(x=>{

      if(x){

        html += `
          <div class="dictionary-example">
            “${esc(x)}”
          </div>
        `;
      }
    });
  }


  if(Array.isArray(sense.quotes)){

    sense.quotes.forEach(q=>{

      if(q?.text){

        html += `
          <div class="dictionary-quote">
            “${esc(q.text)}”
            ${
              q.reference
                ? ` — ${esc(q.reference)}`
                : ''
            }
          </div>
        `;
      }
    });
  }


  if(
    Array.isArray(sense.synonyms) &&
    sense.synonyms.length
  ){

    html += `
      <div class="dictionary-relations">

        <div class="dictionary-label">
          Synonyms
        </div>

        <div>
          ${sense.synonyms.map(esc).join(', ')}
        </div>

      </div>
    `;
  }


  if(
    Array.isArray(sense.antonyms) &&
    sense.antonyms.length
  ){

    html += `
      <div class="dictionary-relations">

        <div class="dictionary-label">
          Antonyms
        </div>

        <div>
          ${sense.antonyms.map(esc).join(', ')}
        </div>

      </div>
    `;
  }


  if(
    Array.isArray(sense.translations) &&
    sense.translations.length
  ){

    html += `
      <div class="dictionary-translations">

        <div class="dictionary-label">
          Translations
        </div>

        <ul class="dictionary-list">
    `;

    sense.translations.forEach(t=>{

      if(t?.word){

        html += `
          <li>
            ${esc(
              t.language?.name ||
              t.language?.code ||
              ''
            )}
            —
            ${esc(t.word)}
          </li>
        `;
      }
    });

    html += `
        </ul>
      </div>
    `;
  }


  if(Array.isArray(sense.subsenses)){

    sense.subsenses.forEach(sub=>{

      html +=
        renderSense(
          sub,
          depth+1
        );
    });
  }


  return html+'</div>';
}


/* ============================================================
   PRIORITIZE ENGLISH DICTIONARY ENTRIES
   ============================================================ */

function sortDictionaryEntries(entries){

  if(!Array.isArray(entries)){
    return [];
  }

  return [...entries].sort((a,b)=>{

    const aCode =
      String(
        a?.language?.code || ''
      ).toLowerCase();

    const aName =
      String(
        a?.language?.name || ''
      ).toLowerCase();

    const bCode =
      String(
        b?.language?.code || ''
      ).toLowerCase();

    const bName =
      String(
        b?.language?.name || ''
      ).toLowerCase();


    const aEnglish =
      aCode === 'en' ||
      aCode.startsWith('en-') ||
      aName === 'english';

    const bEnglish =
      bCode === 'en' ||
      bCode.startsWith('en-') ||
      bName === 'english';


    if(aEnglish && !bEnglish)return -1;
    if(!aEnglish && bEnglish)return 1;

    return 0;
  });
}


/* ============================================================
   RENDER DICTIONARY
   ============================================================ */

function renderDictionary(data){

  if(
    !data ||
    !Array.isArray(data.entries) ||
    !data.entries.length
  ){

    dictionary.classList.add('hidden');

    return;
  }


  const entries =
    sortDictionaryEntries(
      data.entries
    );


  let html=`
    <h2 class="dictionary-title">
      ${esc(data.word||'')}
    </h2>

    <div class="dictionary-word">
      Dictionary
    </div>
  `;


  entries.forEach(entry=>{

    html += `
      <section class="dictionary-entry">
    `;


    const language =
      entry.language?.name ||
      entry.language?.code;


    if(language){

      html += `
        <div class="dictionary-language">
          ${esc(language)}
          ${
            entry.language?.code
              ? ` (${esc(entry.language.code)})`
              : ''
          }
        </div>
      `;
    }


    if(entry.partOfSpeech){

      html += `
        <div class="dictionary-pos">
          ${esc(entry.partOfSpeech)}
        </div>
      `;
    }


    if(
      Array.isArray(entry.pronunciations) &&
      entry.pronunciations.length
    ){

      html += `
        <div class="dictionary-pronunciations">

          <div class="dictionary-label">
            Pronunciations
          </div>

          <ul class="dictionary-list">
      `;

      entry.pronunciations.forEach(p=>{

        if(p?.text){

          html += `
            <li>
              ${esc(p.text)}
              ${
                p.type
                  ? ` — ${esc(p.type)}`
                  : ''
              }
              ${dictionaryTags(p.tags)}
            </li>
          `;
        }
      });

      html += `
          </ul>
        </div>
      `;
    }


    if(
      Array.isArray(entry.forms) &&
      entry.forms.length
    ){

      html += `
        <div class="dictionary-forms">

          <div class="dictionary-label">
            Forms
          </div>

          <ul class="dictionary-list">
      `;

      entry.forms.forEach(f=>{

        if(f?.word){

          html += `
            <li>
              ${esc(f.word)}
              ${dictionaryTags(f.tags)}
            </li>
          `;
        }
      });

      html += `
          </ul>
        </div>
      `;
    }


    if(
      Array.isArray(entry.senses) &&
      entry.senses.length
    ){

      html += `
        <div class="dictionary-senses">

          <div class="dictionary-label">
            Definitions
          </div>
      `;

      entry.senses.forEach(s=>{

        html += renderSense(s);
      });

      html += `
        </div>
      `;
    }


    if(
      Array.isArray(entry.synonyms) &&
      entry.synonyms.length
    ){

      html += `
        <div class="dictionary-relations">

          <div class="dictionary-label">
            Synonyms
          </div>

          <div>
            ${entry.synonyms.map(esc).join(', ')}
          </div>

        </div>
      `;
    }


    if(
      Array.isArray(entry.antonyms) &&
      entry.antonyms.length
    ){

      html += `
        <div class="dictionary-relations">

          <div class="dictionary-label">
            Antonyms
          </div>

          <div>
            ${entry.antonyms.map(esc).join(', ')}
          </div>

        </div>
      `;
    }


    html += `
      </section>
    `;
  });


  if(data.source){

    html += `
      <div class="dictionary-source">

        Source:
        ${
          data.source.url
            ? `
              <a
                href="${esc(data.source.url)}"
                rel="noopener noreferrer"
              >
                ${esc(data.source.url)}
              </a>
            `
            : ''
        }

        ${
          data.source.license
            ? `
              <br>
              License:
              ${
                data.source.license.url
                  ? `
                    <a
                      href="${esc(
                        data.source.license.url
                      )}"
                      rel="noopener noreferrer"
                    >
                      ${esc(
                        data.source.license.name ||
                        'License'
                      )}
                    </a>
                  `
                  : esc(
                      data.source.license.name ||
                      ''
                    )
              }
            `
            : ''
        }

      </div>
    `;
  }


  /*
    Important:
    Preserve the custom scroll controls after
    inserting dictionary content.
  */

  dictionary.innerHTML =
    html +
    `
      <div
        class="dictionary-scroll-controls"
        aria-hidden="true"
      >

        <button
          type="button"
          class="dictionary-scroll-button dictionary-scroll-up"
          id="dictionaryScrollUp"
          aria-label="Scroll dictionary up"
        >
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M6 14l6-6 6 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <button
          type="button"
          class="dictionary-scroll-button dictionary-scroll-down"
          id="dictionaryScrollDown"
          aria-label="Scroll dictionary down"
        >
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M6 10l6 6 6-6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

      </div>
    `;


  dictionary.classList.remove('hidden');


  setupDictionaryScrollButtons();
}


/* ============================================================
   DICTIONARY FETCH
   ============================================================ */

async function loadDictionary(q){

  const word =
    dictionaryWord(q);

  if(!word){

    dictionary.classList.add('hidden');
    dictionary.innerHTML='';

    return;
  }


  dictionary.classList.remove('hidden');

  dictionary.innerHTML =
    '<div class="dictionary-loading">Looking up the definition…</div>';


  try{

    const r =
      await fetch(
        `${FLIBIDOO_WORKER}/api/dictionary?word=${encodeURIComponent(word)}`
      );


    if(!r.ok){

      dictionary.classList.add('hidden');

      return;
    }


    const data =
      await r.json();


    if(
      data?.entries?.length
    ){

      renderDictionary(data);

    }else{

      dictionary.classList.add('hidden');
      dictionary.innerHTML='';
    }

  }catch{

    dictionary.classList.add('hidden');
    dictionary.innerHTML='';
  }
}


/* ============================================================
   DICTIONARY CUSTOM SCROLL BUTTONS
   ============================================================ */

let dictionaryScrollTimer = null;


function dictionaryScrollAmount(){

  /*
    A comfortable amount for both phones and tablets.
  */
  return Math.max(
    100,
    Math.floor(
      dictionary.clientHeight * .65
    )
  );
}


function dictionaryScrollBy(amount){

  dictionary.scrollBy({
    top:amount,
    left:0,
    behavior:'smooth'
  });
}


function stopDictionaryScrolling(){

  if(dictionaryScrollTimer){

    clearInterval(
      dictionaryScrollTimer
    );

    dictionaryScrollTimer=null;
  }
}


function startDictionaryScrolling(amount){

  stopDictionaryScrolling();

  /*
    Immediate movement.
  */
  dictionaryScrollBy(amount);

  /*
    Then continuously scroll while held.
  */
  dictionaryScrollTimer =
    setInterval(
      () => dictionaryScrollBy(amount),
      110
    );
}


function setupDictionaryScrollButtons(){

  const up =
    document.querySelector(
      '#dictionaryScrollUp'
    );

  const down =
    document.querySelector(
      '#dictionaryScrollDown'
    );


  if(!up || !down)return;


  /*
    Remove duplicate listeners by replacing
    the buttons with clones.
  */

  const newUp =
    up.cloneNode(true);

  const newDown =
    down.cloneNode(true);


  up.replaceWith(newUp);
  down.replaceWith(newDown);


  const bind =
    (button,amount) => {

      const start = e => {

        e.preventDefault();

        startDictionaryScrolling(
          amount
        );
      };


      const stop = e => {

        e.preventDefault();

        stopDictionaryScrolling();
      };


      button.addEventListener(
        'pointerdown',
        start
      );

      button.addEventListener(
        'pointerup',
        stop
      );

      button.addEventListener(
        'pointercancel',
        stop
      );

      button.addEventListener(
        'pointerleave',
        stop
      );

      button.addEventListener(
        'pointerout',
        stop
      );


      /*
        Also support keyboard activation.
      */

      button.addEventListener(
        'keydown',
        e => {

          if(
            e.key === 'Enter' ||
            e.key === ' '
          ){

            e.preventDefault();

            startDictionaryScrolling(
              amount
            );
          }
        }
      );

      button.addEventListener(
        'keyup',
        e => {

          if(
            e.key === 'Enter' ||
            e.key === ' '
          ){

            e.preventDefault();

            stopDictionaryScrolling();
          }
        }
      );
    };


  bind(
    newUp,
    -dictionaryScrollAmount()
  );

  bind(
    newDown,
    dictionaryScrollAmount()
  );
}


window.addEventListener(
  'pointerup',
  stopDictionaryScrolling
);

window.addEventListener(
  'blur',
  stopDictionaryScrolling
);


/* ============================================================
   SEARCH
   ============================================================ */

async function search(
  q,
  page=0,
  type=currentType
){

  q=q.trim();

  if(!q)return;


  currentQ=q;
  currentPage=page;
  currentType=type;


  input.value=q;
  resultsInput.value=q;


  updateButtonState(
    submitButton,
    q
  );

  updateButtonState(
    resultsSubmitButton,
    q
  );


  home.classList.add('hidden');
  results.classList.remove('hidden');


  list.innerHTML =
    '<div class="empty">Searching…</div>';


  count.textContent='';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML='';


  updateTranslationMessage(q);


  document
    .querySelectorAll('.search-type')
    .forEach(b =>
      b.classList.toggle(
        'active',
        b.dataset.type===currentType
      )
    );


  /*
    Dictionary only for web searches.
    It runs independently.
  */

  const dictionaryPromise =
    currentType === 'web'
      ? loadDictionary(q)
      : Promise.resolve();


  try{

    const r =
      await fetch(
        `${FLIBIDOO_WORKER}/api/search?q=${encodeURIComponent(q)}&page=${page}&type=${encodeURIComponent(currentType)}`
      );


    const d =
      await r.json();


    if(!r.ok){

      throw new Error(
        d.error ||
        'Search failed'
      );
    }


    render(d);

  }catch(e){

    list.innerHTML =
      `
        <div class="error">
          ${esc(
            e.message ||
            'Search failed. Please try again.'
          )}
        </div>
      `;
  }


  await dictionaryPromise;
}


/* ============================================================
   INPUT STATE
   ============================================================ */

input.addEventListener(
  'input',
  () =>
    updateButtonState(
      submitButton,
      input.value
    )
);

updateButtonState(
  submitButton,
  input.value
);


resultsInput.addEventListener(

    updateButtonState(

      resultsInput.value
    )

updateButtonState(

  resultsInput.value

/* ============================================================
   FORMS
   ============================================================ */

form.addEventListener(
  'submit',

    e.preventDefault();

    search(
      input.value,
      1,
      currentType
    );
  }
);


resultsForm.addEventListener(
  'submit',
  e => {

    e.preventDefault();

    search(
      resultsInput.value,
      0,
      currentType
    );
  }
);


/* ============================================================
   SEARCH CATEGORY BUTTONS
   ============================================================ */

document
  .querySelectorAll('.search-type')
  .forEach(btn => {

    btn.addEventListener(
      'click',
      () => {

        search(
          resultsInput.value ||
          currentQ,
          0,
          btn.dataset.type
        );
      }
    );
  });


/* ============================================================
   FLIBIDOO TRANSLATE LINK
   ============================================================ */

document
  .querySelector('#translateLink')
  .addEventListener(
    'click',
    () => {

      /*
        Normal anchor navigation handles this.
      */
    }
  );


/* ============================================================
   INITIAL URL
   ============================================================ */

const params =
  new URLSearchParams(
    location.search
  );

const initialQuery =
  params.get('q');

const initialPage =
  Math.max(
    0,
    Number(
      params.get('page') || 0
    )
  );

const initialType =
  [
    'web',
    'images',
    'news',
    'map'
  ].includes(
    params.get('type')
  )
    ? params.get('type')
    : 'web';


if(initialQuery){

  search(
    initialQuery,
    initialPage,
    initialType
  );
}
</script>


<script id="flibidoo-favicon-links">

    return `
      https://www.google.com/s2/favicons
      ?domain=${encodeURIComponent(u.hostname)}
      &sz=64
    `.replace(/\s+/g,'');

  }catch(_){

    return '';
  }

function flibidooResultIcon(url){

  return src
    ? `
      <img

<script id="flibidoo-rich-description">
(() => {

  window.flibidooRichText =
    function(value){

      let src =
        String(value ?? '');

      if(!src)return '';


      /*
        Decode common HTML entities.
      */

      const ta =
        document.createElement(
          'textarea'
        );

      ta.innerHTML=src;

      src=ta.value;


      /*
        Remove dangerous HTML.
      */

      src=src
        .replace(
          /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi,
          ''
        )
        .replace(
          /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*\/?>/gi,
          ''
        )
        .replace(
          /\s+on[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi,
          ''
        )
        .replace(
          /\s+(href|src)\s*=\s*(['"])\s*javascript:[\s\S]*?\2/gi,
          ''
        );


      /*
        Preserve only basic safe tags.
      */

      const allowed=[];

      src =
        src.replace(
          /<\/?(strong|b|em|i|u|s|del|mark|small|br|code|kbd|sub|sup|a)(?:\s+[^>]*)?>/gi,
          m => {

            const idx =
              allowed.push(m)-1;

            return `@@FLIBIDOO_TAG_${idx}@@`;
          }
        );


      src =
        src
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;');


      /*
        Markdown links.
      */

      src =
        src.replace(
          /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          '<a href="$2" rel="noopener noreferrer">$1</a>'
        );


      src =
        src.replace(
          /`([^`]+)`/g,
          '<code>$1</code>'
        );


      src =
        src.replace(
          /\*\*([^*]+)\*\*/g,
          '<strong>$1</strong>'
        );


      src =
        src.replace(
          /__([^_]+)__/g,
          '<strong>$1</strong>'
        );


      src =
        src.replace(
          /~~([^~]+)~~/g,
          '<del>$1</del>'
        );


      src =
        src.replace(
          /(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;])/g,
          '$1<em>$2</em>'
        );


      src =
        src.replace(
          /(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?:;])/g,
          '$1<em>$2</em>'
        );


      src =
        src.replace(
          /^#{1,6}\s+(.+)$/gm,
          '<strong>$1</strong>'
        );


      src =
        src.replace(
          /^\s*[-*]\s+(.+)$/gm,
          '• $1'
        );


      src =
        src.replace(
          /^\s*\d+\.\s+(.+)$/gm,
          '$1'
        );


      /*
        Restore safe HTML.
      */

      src =
        src.replace(
          /@@FLIBIDOO_TAG_(\d+)@@/g,
          (_,i) =>
            allowed[Number(i)] || ''
        );


      /*
        Preserve line breaks.
      */

      return src.replace(
        /\r?\n/g,
        '<br>'
      );
    };

})();
</script>


<script id="flibidoo-autocomplete">
(() => {

  const inputs =
    [
      ...document.querySelectorAll(
        '#q, #resultsQ'
      )
    ];

  if(!inputs.length)return;


  let timer=null;
  let controller=null;
  let selected=-1;
  let items=[];


  const esc =
    v =>
      String(v??'')
        .replace(
          /[&<>"']/g,
          c => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'
          }[c])
        );


  function setup(input){

    const wrap =
      input.closest('form') ||
      input.parentElement;

    wrap.classList.add(
      'flibidoo-suggest-wrap'
    );


    const box =
      document.createElement('div');

    box.className =
      'flibidoo-suggestions';

    box.hidden=true;

    wrap.appendChild(box);


    function close(){

      box.hidden=true;
      box.innerHTML='';
      selected=-1;
    }


    function choose(q){

      input.value=q;

      close();

      const f =
        input.closest('form');

      if(f){
        f.requestSubmit();
      }
    }


    async function load(){

      const q =
        input.value.trim();

      if(q.length<2){

        close();

        return;
      }


      if(controller){

        controller.abort();
      }


      controller =
        new AbortController();


      try{

        const r =
          await fetch(
            `${FLIBIDOO_WORKER}/api/suggest?q=${encodeURIComponent(q)}`,
            {
              signal:
                controller.signal
            }
          );


        if(!r.ok){

          throw new Error();
        }


        const d =
          await r.json();


        items =
          Array.isArray(
            d.suggestions
          )
            ? d.suggestions.slice(
                0,
                8
              )
            : [];


        if(!items.length){

          close();

          return;
        }


        box.innerHTML =
          items.map(
            (x,i) => `
              <button
                class="flibidoo-suggestion"
                type="button"
                data-i="${i}"
              >

                ${
                  x.img
                    ? `
                      <img
                        src="${esc(x.img)}"
                        alt=""
                        loading="lazy"
                        referrerpolicy="no-referrer"
                      >
                    `
                    : ''
                }

                <span>
                  ${esc(x.query)}

                  ${
                    x.entity &&
                    x.desc
                      ? `
                        <small>
                          ${esc(x.desc)}
                        </small>
                      `
                      : ''
                  }
                </span>

              </button>
            `
          ).join('');


        box.hidden=false;


        box
          .querySelectorAll('button')
          .forEach(btn => {

            btn.addEventListener(
              'mousedown',
              e => {

                e.preventDefault();

                choose(
                  items[
                    Number(
                      btn.dataset.i
                    )
                  ].query
                );
              }
            );
          });


      }catch(_){

        close();
      }
    }


    input.addEventListener(
      'input',
      () => {

        clearTimeout(timer);

        timer =
          setTimeout(
            load,
            180
          );
      }
    );


    input.addEventListener(
      'keydown',
      e => {

        if(box.hidden)return;


        if(e.key==='ArrowDown'){

          e.preventDefault();

          selected =
            Math.min(
              selected+1,
              items.length-1
            );

        }else if(e.key==='ArrowUp'){

          e.preventDefault();

          selected =
            Math.max(
              selected-1,
              -1
            );

        }else if(
          e.key==='Enter' &&
          selected>=0
        ){

          e.preventDefault();

          choose(
            items[selected].query
          );

        }else if(
          e.key==='Escape'
        ){

          close();

          return;
        }


        box
          .querySelectorAll('button')
          .forEach(
            (btn,i) =>
              btn.classList.toggle(
                'active',
                i===selected
              )
          );
      }
    );


    document.addEventListener(
      'click',
      e => {

        if(!wrap.contains(e.target)){

          close();
        }
      }
    );
  }


  inputs.forEach(setup);

})();
</script>
