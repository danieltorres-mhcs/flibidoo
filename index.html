<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d0c22">
<meta name="color-scheme" content="dark">
<title>FlibidooSearch</title>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
  --panel:#24132a;
  --error:#ffb5b5;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button,
select{
  -webkit-tap-highlight-color:transparent;
}

a{
  color:inherit;
}

.hidden{
  display:none!important;
}

/* =========================================================
   GLOBAL LAYOUT
   ========================================================= */

.shell{
  width:min(100% - 32px,1120px);
  margin:0 auto;
}

main{
  flex:1;
}

/* =========================================================
   HOME
   ========================================================= */

#home.home{
  width:100%;
  min-height:100vh;
  margin:0;
  padding:
    max(24px,env(safe-area-inset-top))
    max(20px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(20px,env(safe-area-inset-left));

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.search-wrap{
  width:min(100%,680px);
}

h1{
  font-size:clamp(34px,5vw,54px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500;
  text-align:center;
}

/* =========================================================
   SEARCH BAR
   ========================================================= */

form{
  display:flex;
  align-items:center;
  width:100%;
  min-width:0;
  height:54px;

  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;

  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08);
}

input{
  min-width:0;
  flex:1;

  border:0;
  outline:0;

  background:transparent;
  color:var(--text);

  font-size:16px;
  padding:0 14px;
}

input::placeholder{
  color:#9e8da1;
}

.submit{
  height:38px;
  width:38px;

  margin-right:8px;

  border:1px solid var(--line);
  background:transparent;
  color:#766679;

  border-radius:50%;
  padding:0;

  display:grid;
  place-items:center;

  cursor:pointer;
  flex:0 0 auto;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
}

/* =========================================================
   HOME LINKS
   ========================================================= */

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;

  gap:18px;

  margin-top:20px;

  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  color:var(--muted);

  font-size:12px;
  line-height:1.4;

  text-align:center;
}

/* =========================================================
   RESULTS
   ========================================================= */

.results{
  padding:
    30px
    0
    max(70px,env(safe-area-inset-bottom));
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;

  min-height:44px;

  border-bottom:1px solid var(--line2);

  padding-bottom:14px;
  margin-bottom:14px;
}

.results-brand{
  display:inline-flex;
  align-items:center;

  gap:8px;

  text-decoration:none;
  color:inherit;

  white-space:nowrap;
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  min-width:0;
  flex:1;

  font-size:14px;
  color:var(--muted);

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

.results-search{
  width:min(100%,680px);
  margin:0 0 18px;
}

.results-search form{
  height:48px;
}

.results-search .submit{
  width:34px;
  height:34px;
  margin-right:6px;
}

/* =========================================================
   SEARCH TYPES
   ========================================================= */

.search-types{
  display:flex;
  align-items:flex-end;

  gap:0;

  margin:8px 0 18px;

  border-bottom:1px solid rgba(255,255,255,.12);

  height:36px;

  overflow-x:auto;
  overflow-y:hidden;

  scrollbar-width:none;
}

.search-types::-webkit-scrollbar{
  display:none;
}

.search-type{
  position:relative;

  appearance:none;

  border:0;
  background:transparent;

  color:rgba(255,255,255,.62);

  font:inherit;
  font-size:13px;
  line-height:20px;

  padding:0 12px 10px;
  margin:0;

  border-radius:0;

  cursor:pointer;

  flex:0 0 auto;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";

  position:absolute;

  left:10px;
  right:10px;
  bottom:-1px;

  height:2px;

  border-radius:2px 2px 0 0;

  background:currentColor;
}

/* =========================================================
   RESULTS LAYOUT
   ========================================================= */

.results-layout{
  display:grid;

  grid-template-columns:minmax(0,1fr) 330px;

  gap:42px;

  align-items:start;
}

/* =========================================================
   WEB RESULTS
   ========================================================= */

.result{
  padding:0 0 26px;
  margin-bottom:26px;

  border-bottom:1px solid var(--line2);
}

.result-url{
  font-size:13px;
  color:var(--url);

  margin-bottom:6px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result h2{
  font-size:20px;
  line-height:1.25;

  margin:0 0 7px;

  font-weight:500;
  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.snippet{
  font-size:14px;
  line-height:1.6;

  color:var(--result);

  margin:0;

  max-width:760px;
}

.result-meta{
  font-size:12px;
  color:var(--muted);

  margin-top:7px;
}

/* =========================================================
   IMAGE RESULTS
   ========================================================= */

.image-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-result img{
  display:block;

  width:100%;
  aspect-ratio:4/3;

  object-fit:cover;

  border:1px solid var(--line2);

  background:rgba(255,255,255,.02);
}

.image-result-title{
  font-size:14px;
  line-height:1.4;

  margin-top:9px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);

  margin-top:4px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   MAP RESULTS
   ========================================================= */

.map-result{
  padding:0 0 22px;
  margin-bottom:22px;

  border-bottom:1px solid var(--line2);
}

.map-result-title{
  font-size:18px;
  line-height:1.35;

  margin:0 0 6px;

  font-weight:500;
}

.map-result-title a{
  text-decoration:none;
}

.map-result-title a:hover{
  text-decoration:underline;
}

.map-result-address{
  font-size:14px;
  line-height:1.55;

  color:var(--result);
}

.map-result-coords{
  font-size:12px;
  color:var(--muted);

  margin-top:6px;
}

.map-result-link{
  display:inline-block;

  margin-top:10px;

  font-size:12px;

  color:var(--muted);

  text-decoration:none;
}

.map-result-link:hover{
  color:var(--text);
  text-decoration:underline;
}

/* =========================================================
   DICTIONARY
   ========================================================= */

.dictionary{
  border-left:1px solid var(--line2);

  padding-left:28px;

  max-height:70vh;

  overflow-y:auto;

  overscroll-behavior:contain;

  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;
  font-weight:500;

  letter-spacing:-.02em;

  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);

  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;

  border-bottom:1px solid var(--line2);
}

.dictionary-language,
.dictionary-label{
  font-size:12px;
  color:var(--muted);
}

.dictionary-language{
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  text-transform:uppercase;
  letter-spacing:.05em;

  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);

  margin-left:5px;
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;

  color:var(--result);

  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;

  color:var(--muted);
}

/* =========================================================
   WORD OF THE DAY
   ========================================================= */

.wotd-panel{
  padding:0 0 22px;
  margin:0 0 22px;

  border-bottom:1px solid var(--line2);
}

.wotd-heading{
  display:flex;
  align-items:center;
  gap:8px;

  margin:0 0 8px;

  color:#ffb52e;

  font-size:13px;
  font-weight:600;
}

.wotd-word{
  color:#ffe18a;

  font-size:20px;
  font-weight:600;
  line-height:1.25;

  margin:0 0 5px;
}

.wotd-definition{
  color:#ffe9a8;

  font-size:13px;
  line-height:1.55;

  margin:0;
}

.wotd-status{
  color:var(--muted);

  font-size:13px;
  line-height:1.5;
}

/* =========================================================
   TRANSLATOR
   ========================================================= */

.translation-panel{
  width:min(100%,760px);

  margin:0 0 22px;

  padding:18px;

  border:1px solid var(--line2);

  background:rgba(255,255,255,.015);

  border-radius:14px;
}

.translation-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:14px;
}

.translation-title{
  font-size:14px;
  font-weight:600;
}

.translation-close{
  width:32px;
  height:32px;

  border:0;
  border-radius:50%;

  background:transparent;

  color:var(--muted);

  cursor:pointer;

  font-size:20px;

  display:grid;
  place-items:center;
}

.translation-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.translation-languages{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    40px
    minmax(0,1fr);

  align-items:center;

  gap:10px;

  margin-bottom:12px;
}

.translation-language{
  width:100%;
  height:38px;

  border:1px solid var(--line);
  border-radius:8px;

  background:#201025;
  color:var(--text);

  padding:0 10px;

  outline:none;
}

.translation-language:focus{
  border-color:var(--focus);
}

.translation-language option{
  background:#24132a;
  color:var(--text);
}

.translation-swap{
  width:38px;
  height:38px;

  border:1px solid var(--line);
  border-radius:50%;

  background:transparent;

  color:var(--muted);

  cursor:pointer;

  display:grid;
  place-items:center;

  font-size:17px;
}

.translation-swap:hover{
  color:var(--text);
  border-color:var(--focus);
}

.translation-editors{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  gap:12px;
}

.translation-box{
  position:relative;
}

.translation-textarea{
  width:100%;

  min-height:150px;

  resize:vertical;

  border:1px solid var(--line);
  border-radius:10px;

  background:transparent;
  color:var(--text);

  padding:13px 13px 34px;

  outline:none;

  font:inherit;
  font-size:14px;
  line-height:1.55;
}

.translation-textarea:focus{
  border-color:var(--focus);
}

.translation-textarea::placeholder{
  color:#9e8da1;
}

.translation-output{
  min-height:150px;

  border:1px solid var(--line);
  border-radius:10px;

  padding:13px;

  color:var(--result);

  font-size:14px;
  line-height:1.55;

  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.translation-counter{
  position:absolute;

  bottom:9px;
  right:11px;

  font-size:11px;

  color:var(--muted);

  pointer-events:none;
}

.translation-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-top:12px;
}

.translation-status{
  min-width:0;

  font-size:12px;

  color:var(--muted);

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.translation-button{
  flex:0 0 auto;

  height:38px;

  padding:0 15px;

  border:1px solid var(--line);
  border-radius:19px;

  background:transparent;

  color:var(--text);

  cursor:pointer;
}

.translation-button:hover{
  border-color:var(--focus);
}

.translation-button:disabled{
  opacity:.45;
  cursor:default;
}

/* =========================================================
   BANG NOTICE
   ========================================================= */

.bang-notice{
  display:inline-flex;
  align-items:center;

  max-width:100%;

  margin:0 0 16px;

  padding:7px 10px;

  border:1px solid var(--line2);
  border-radius:8px;

  color:var(--muted);

  font-size:12px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.bang-notice strong{
  color:var(--text);
  font-weight:500;

  margin-right:5px;
}

/* =========================================================
   EMPTY / ERROR / PAGER
   ========================================================= */

.empty{
  padding:70px 0;

  color:var(--muted);

  text-align:center;
}

.error{
  min-height:120px;

  max-width:680px;

  margin:0;

  padding:28px 18px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  border:1px solid var(--line2);

  color:var(--muted);

  font-size:14px;
  line-height:1.5;
}

.pager{
  display:flex;

  gap:8px;

  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);

  background:transparent;

  color:var(--text);

  border-radius:4px;

  padding:8px 12px;

  cursor:pointer;
}

.pager button:hover{
  border-color:var(--focus);
}

/* =========================================================
   ABOUT
   ========================================================= */

.about-overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.62);

  display:grid;
  place-items:center;

  padding:24px;

  z-index:10000;
}

.about-card{
  position:relative;

  width:min(100%,560px);

  max-height:min(80vh,700px);

  overflow:auto;

  background:#24132a;

  border:1px solid var(--line);

  border-radius:14px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.45);

  padding:30px;
}

.about-close{
  position:absolute;

  top:10px;
  right:10px;

  width:34px;
  height:34px;

  border:0;
  border-radius:50%;

  background:transparent;

  color:var(--muted);

  font-size:24px;
  line-height:1;

  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;

  font-size:25px;

  font-weight:500;
}

.about-card p{
  color:var(--result);

  line-height:1.7;

  font-size:14px;
}

.about-card a{
  color:var(--text);
}

/* =========================================================
   TABLET
   ========================================================= */

@media(max-width:900px){

  .shell{
    width:min(100% - 28px,1120px);
  }

  .results-layout{
    grid-template-columns:1fr;

    gap:0;
  }

  /*
   * Dictionary first on tablet/mobile.
   */
  .dictionary{
    order:-1;

    border-left:0;

    border-bottom:1px solid var(--line2);

    padding:0 0 26px;

    margin-bottom:26px;

    max-height:none;
  }

  .translation-panel{
    width:100%;
  }
}

/* =========================================================
   SMALL TABLET / LARGE PHONE
   ========================================================= */

@media(max-width:760px){

  .image-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:22px 14px;
  }

  .results{
    padding-top:22px;
  }

  .results-head{
    gap:12px;
  }

  .results-query{
    font-size:13px;
  }

  .count{
    font-size:12px;
  }

  .translation-editors{
    grid-template-columns:1fr;
  }

  .translation-output{
    min-height:120px;
  }
}

/* =========================================================
   PHONE
   ========================================================= */

@media(max-width:640px){

  .shell{
    width:100%;

    padding-left:
      max(16px,env(safe-area-inset-left));

    padding-right:
      max(16px,env(safe-area-inset-right));
  }

  #home.home{
    padding-top:
      max(20px,env(safe-area-inset-top));

    padding-bottom:
      max(20px,env(safe-area-inset-bottom));
  }

  .search-wrap{
    width:100%;
  }

  h1{
    font-size:36px;

    margin-bottom:24px;
  }

  form{
    height:50px;
  }

  input{
    font-size:16px;
  }

  .results{
    padding-top:18px;
  }

  .results-head{
    min-width:0;
  }

  .results-brand{
    flex:0 0 auto;
  }

  .results-query{
    min-width:0;
  }

  .results-search{
    width:100%;
  }

  .search-types{
    margin-bottom:16px;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;

    font-size:12px;
  }

  .result h2{
    font-size:19px;
  }

  .snippet{
    font-size:14px;
  }

  .translation-panel{
    padding:15px;

    border-radius:12px;
  }

  .translation-languages{
    grid-template-columns:
      minmax(0,1fr)
      36px
      minmax(0,1fr);

    gap:7px;
  }

  .translation-language{
    font-size:12px;
  }

  .translation-swap{
    width:34px;
    height:34px;
  }

  .translation-footer{
    align-items:flex-start;
  }

  .translation-status{
    white-space:normal;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}

/* =========================================================
   VERY SMALL PHONE
   ========================================================= */

@media(max-width:460px){

  .shell{
    padding-left:
      max(13px,env(safe-area-inset-left));

    padding-right:
      max(13px,env(safe-area-inset-right));
  }

  #home.home{
    padding-left:
      max(13px,env(safe-area-inset-left));

    padding-right:
      max(13px,env(safe-area-inset-right));
  }

  h1{
    font-size:32px;

    letter-spacing:-.045em;
  }

  .image-grid{
    grid-template-columns:1fr;
  }

  .links{
    gap:12px;
  }

  .results-head{
    gap:8px;
  }

  .results-brand span{
    font-size:13px;
  }

  .count{
    display:none;
  }

  .translation-panel{
    padding:13px;
  }

  .translation-textarea,
  .translation-output{
    font-size:13px;
  }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<main>

<!-- =======================================================
     HOME
======================================================= -->

<section id="home" class="home shell">

/* =========================================================

function esc(s=''){
  return String(s).replace(
    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',

  );
}

function safeURL(value){

/* =========================================================
   HELIUM BANGS
========================================================= */

/*
 * Helium's manifest uses:
 *
 * s  = site name
 * t  = single trigger
 * ts = multiple triggers
 * u  = URL template
 *
 * Example:
 *
 * {
 *   "s":"Wikipedia",
 *   "ts":["w","wiki"],
 *   "u":"https://en.wikipedia.org/wiki/Special:Search?search={searchTerms}"
 * }
 */

function normalizeBangRecord(record){

  if(!record || typeof record !== 'object'){
    return null;
  }

  const name =
    String(
      record.s ||
      record.name ||
      ''
    ).trim();

  const template =
    String(
      record.u ||
      record.url ||
      ''
    ).trim();

  if(!name || !template){
    return null;
  }

  let triggers = [];

  if(
    Array.isArray(record.ts)
  ){
    triggers.push(
      ...record.ts
    );
  }

  if(record.t){
    triggers.push(
      record.t
    );
  }

  if(
    Array.isArray(record.triggers)
  ){
    triggers.push(
      ...record.triggers
    );
  }

  triggers =
    triggers
      .map(
        x => String(x)
          .trim()
          .toLowerCase()
          .replace(/^!/,'')
      )
      .filter(Boolean);

  triggers =
    [...new Set(triggers)];

  if(!triggers.length){
    return null;
  }

  return {
    name,
    template,
    triggers,
    category:
      record.sc ||
      record.category ||
      ''
  };
}


function buildBangMap(data){

  bangMap =
    new Map();

  bangs =
    Array.isArray(data)
      ? data
      : Array.isArray(data?.bang)
        ? data.bang
        : Array.isArray(data?.bangs)
          ? data.bangs
          : [];

  for(const raw of bangs){

    const bang =
      normalizeBangRecord(raw);

    if(!bang){
      continue;
    }

    for(
      const trigger of bang.triggers
    ){

      if(!bangMap.has(trigger)){

        bangMap.set(
          trigger,
          bang
        );

      }

    }

  }

  bangsLoaded = true;
}


async function loadBangs(){

  if(bangsLoaded){
    return;
  }

  /*
   * Try cached data first.
   */
  try{

    const cached =
      localStorage.getItem(
        'flibidoo-helium-bangs'
      );

    if(cached){

      const parsed =
        JSON.parse(cached);

      if(Array.isArray(parsed)){

        buildBangMap(parsed);

      }

    }

  }catch{}


  /*
   * Fetch fresh Helium data.
   */
  try{

    const response =
      await fetch(
        BANGS_URL,
        {
          method:'GET',
          credentials:'omit',
          headers:{
            'Accept':
              'application/json'
          },
          cache:'no-store'
        }
      );

    if(!response.ok){
      throw new Error(
        `Bang request failed: ${response.status}`
      );
    }

    const data =
      await response.json();

    const raw =
      Array.isArray(data)
        ? data
        : Array.isArray(data?.bang)
          ? data.bang
          : Array.isArray(data?.bangs)
            ? data.bangs
            : [];

    buildBangMap(raw);

    try{

      localStorage.setItem(
        'flibidoo-helium-bangs',
        JSON.stringify(raw)
      );

    }catch{}

  }catch(error){

    /*
     * If cached data exists, continue using it.
     */
    if(!bangsLoaded){

      buildBangMap([]);

    }

    console.warn(
      'FlibidooSearch: unable to load Helium bangs.',
      error
    );

  }
}


/*
 * Detect:
 *
 * !w cats
 * cats !w
 * cats !w more
 *
 * The bang can appear at the beginning or end.
 */

function parseBang(query){

  const text =
    query.trim();

  if(!text){
    return null;
  }

  const tokens =
    text.split(/\s+/);

  let bangTokenIndex = -1;
  let trigger = '';

  /*
   * First check beginning.
   */
  if(tokens.length){

    const first =
      tokens[0].match(
        /^!([^\s!]+)$/
      );

    if(first){

      const candidate =
        first[1].toLowerCase();

      if(bangMap.has(candidate)){

        bangTokenIndex = 0;
        trigger = candidate;

      }

    }

  }

  /*
   * If not found, search the query for a
   * standalone bang anywhere.
   */
  if(bangTokenIndex === -1){

    for(
      let i=1;
      i<tokens.length;
      i++
    ){

      const match =
        tokens[i].match(
          /^!([^\s!]+)$/
        );

      if(!match){
        continue;
      }

      const candidate =
        match[1].toLowerCase();

      if(
        bangMap.has(candidate)
      ){

        bangTokenIndex = i;
        trigger = candidate;

        break;
      }

    }

  }

  if(
    bangTokenIndex === -1 ||
    !trigger
  ){
    return null;
  }

  const bang =
    bangMap.get(trigger);

  const queryParts =
    tokens.filter(
      (_,i) =>
        i !== bangTokenIndex
    );

  const cleanQuery =
    queryParts.join(' ').trim();

  return {
    trigger,
    bang,
    cleanQuery
  };
}


/*
 * Replace both common placeholder formats:
 *
 * {searchTerms}
 * %s
 */

function buildBangURL(
  bang,
  query
){

  if(!bang){
    return '';
  }

  const encoded =
    encodeURIComponent(
      query || ''
    );

  let template =
    bang.template;

  /*
   * Helium uses {searchTerms}.
   */
  if(
    template.includes(
      '{searchTerms}'
    )
  ){

    return template.replace(
      /\{searchTerms\}/g,
      encoded
    );

  }

  /*
   * Support %s as a compatibility fallback.
   */
  if(
    template.includes('%s')
  ){

    return template.replace(
      /%s/g,
      encoded
    );

  }

  /*
   * If no placeholder exists,
   * open the URL as-is.
   */
  return template;
}


function tryBangSearch(query){

  const parsed =
    parseBang(query);

  if(!parsed){
    return false;
  }

  const url =
    buildBangURL(
      parsed.bang,
      parsed.cleanQuery
    );

  if(!url){
    return false;
  }

  bangNotice.classList.remove(
    'hidden'
  );

  bangNotice.innerHTML =
    `<strong>!${esc(parsed.trigger)}</strong> ` +
    `${esc(parsed.bang.name)}`;

  window.location.href =
    url;

  return true;
}

function languageCodeFromName(
  value
){

  const normalized =
    value
      .trim()
      .toLowerCase();

  const aliases = {

    english:'en',

    spanish:'es',
    español:'es',

    french:'fr',
    français:'fr',

    german:'de',
    deutsch:'de',

    italian:'it',

    portuguese:'pt',

    dutch:'nl',

    russian:'ru',

    ukrainian:'uk',

    polish:'pl',

    czech:'cs',

    slovak:'sk',

    romanian:'ro',

    hungarian:'hu',

    greek:'el',

    turkish:'tr',

    arabic:'ar',

    hebrew:'he',

    persian:'fa',

    hindi:'hi',

    bengali:'bn',

    urdu:'ur',

    tamil:'ta',

    telugu:'te',

    malayalam:'ml',

    indonesian:'id',

    malay:'ms',

    vietnamese:'vi',

    thai:'th',

    japanese:'ja',

    korean:'ko',

    chinese:'zh-CN',

    'chinese simplified':'zh-CN',

    'simplified chinese':'zh-CN',

    'chinese traditional':'zh-TW',

    'traditional chinese':'zh-TW',

    swedish:'sv',

    norwegian:'no',

    danish:'da',

    finnish:'fi',

    swahili:'sw',

    afrikaans:'af',

    catalan:'ca',

    basque:'eu',

    galician:'gl'

  };

  return (
    aliases[normalized] ||
    null
  );
}


function detectTranslationIntent(
  query
){

  const q =
    query
      .trim()
      .toLowerCase();

  /*
   * translate
   * translator
   *
   * Auto-detect -> English
   */
  if(
    q === 'translate' ||
    q === 'translator'
  ){

    return {
      source:'auto',
      target:'en'
    };

  }


  /*
   * "spanish to english"
   * "japanese to english"
   */
  const toEnglish =
    q.match(
      /^(.+?)\s+to\s+english$/
    );

  if(toEnglish){

    const source =
      languageCodeFromName(
        toEnglish[1]
      );

    if(source){

      return {
        source,
        target:'en'
      };

    }

  }


  /*
   * "english to spanish"
   */
  const englishTo =
    q.match(
      /^english\s+to\s+(.+?)$/
    );

  if(englishTo){

    const target =
      languageCodeFromName(
        englishTo[1]
      );

    if(target){

      return {
        source:'en',
        target
      };

    }

  }


  /*
   * Also support:
   *
   * "translate spanish"
   * "translate to spanish"
   */
  const translateTo =
    q.match(
      /^translate\s+(?:to\s+)?(.+?)$/
    );

  if(translateTo){

    const target =
      languageCodeFromName(
        translateTo[1]
      );

    if(target){

      return {
        source:'auto',
        target
      };

    }

  }

  return null;
}


function openTranslation(
  query
){

  const intent =
    detectTranslationIntent(
      query
    );

  if(!intent){

    translationPanel.classList.add(
      'hidden'
    );

    return false;
  }

  translationPanel.classList.remove(
    'hidden'
  );

  const source =
    intent.source ||
    'auto';

  const target =
    intent.target ||
    'en';

  const sourceExists =
    [...translationSource.options]
      .some(
        option =>
          option.value === source
      );

  const targetExists =
    [...translationTarget.options]
      .some(
        option =>
          option.value === target
      );

  translationSource.value =
    sourceExists
      ? source
      : 'auto';

  translationTarget.value =
    targetExists
      ? target
      : 'en';

  translationStatus.textContent =
    '';

  return true;
}


/* =========================================================
   TRANSLATOR
========================================================= */

function updateTranslationCounter(){

  const length =
    unicodeLength(
      translationInput.value
    );

  translationCounter.textContent =
    `${length} / ${TRANSLATE_MAX}`;

  translationCounter.style.color =
    length >= TRANSLATE_MAX
      ? 'var(--error)'
      : '';

  translationButton.disabled =
    length === 0;
}


/*
 * Hard client-side limit.
 *
 * maxlength alone can behave differently with
 * Unicode because JavaScript's string length uses
 * UTF-16 units. We explicitly trim to 2,000
 * Unicode code points.
 */
translationInput.addEventListener(
  'input',
  () => {

    let value =
      translationInput.value;

    if(
      unicodeLength(value) >
      TRANSLATE_MAX
    ){

      value =
        Array.from(value)
          .slice(0,TRANSLATE_MAX)
          .join('');

      translationInput.value =
        value;
    }

    updateTranslationCounter();

  }
);


translationClose.addEventListener(
  'click',
  () => {

    translationPanel.classList.add(
      'hidden'
    );

  }
);


translationSwap.addEventListener(
  'click',
  () => {

    const oldSource =
      translationSource.value;

    const oldTarget =
      translationTarget.value;

    /*
     * Auto-detect can't be an output language.
     */
    if(oldSource === 'auto'){

      translationSource.value =
        oldTarget;

      translationTarget.value =
        'en';

    }else{

      translationSource.value =
        oldTarget;

      translationTarget.value =
        oldSource;

    }

    const oldInput =
      translationInput.value;

    const oldOutput =
      translationOutput.textContent;

    if(oldOutput){

      translationInput.value =
        oldOutput;

      translationOutput.textContent =
        oldInput;

    }

    updateTranslationCounter();

  }
);


async function translateText(){

  let text =
    translationInput.value;

  /*
   * Enforce the limit one more time before
   * the network request.
   */
  if(
    unicodeLength(text) >
    TRANSLATE_MAX
  ){

    text =
      Array.from(text)
        .slice(0,TRANSLATE_MAX)
        .join('');

    translationInput.value =
      text;
  }

  text =
    text.trim();

  if(!text){

    translationStatus.textContent =
      'Enter something to translate.';

    return;
  }

  const length =
    unicodeLength(text);

  if(length > TRANSLATE_MAX){

    translationStatus.textContent =
      `Maximum ${TRANSLATE_MAX} characters.`;

    return;
  }

  const source =
    translationSource.value ||
    'auto';

  const target =
    translationTarget.value ||
    'en';

  translationButton.disabled =
    true;

  translationStatus.textContent =
    'Translating…';

  translationOutput.textContent =
    '';

  try{

    const response =
      await fetch(
        `${TRANSLATE_WORKER}/api/translate`,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            text,
            source,
            target
          })
        }
      );

    let data;

    try{

      data =
        await response.json();

    }catch{

      throw new Error(
        'The translation server returned an invalid response.'
      );

    }

    if(!response.ok){

      throw new Error(
        data?.error ||
        `Translation failed (${response.status}).`
      );

    }

    translationOutput.textContent =
      data.translatedText ||
      '';

    /*
     * If the Worker reports a detected source
     * language, reflect it in the selector.
     */
    if(
      data.source &&
      data.source !== 'auto'
    ){

      const exists =
        [...translationSource.options]
          .some(
            option =>
              option.value === data.source
          );

      if(exists){

        translationSource.value =
          data.source;

      }

    }

    translationStatus.textContent =
      'Translation complete.';

  }catch(error){

    translationOutput.textContent =
      '';

    translationStatus.textContent =
      error?.message ||
      'Translation failed. Please try again.';

  }finally{

    translationButton.disabled =
      unicodeLength(
        translationInput.value
      ) === 0;

  }

}


translationButton.addEventListener(
  'click',
  translateText
);


translationInput.addEventListener(
  'keydown',
  event => {

    /*
     * Ctrl/Cmd + Enter translates.
     */
    if(
      event.key === 'Enter' &&
      (event.ctrlKey || event.metaKey)
    ){

      event.preventDefault();

      translateText();

    }

  }
);


updateTranslationCounter();


/* =========================================================
   RENDER RESULTS
========================================================= */

function render(data){

  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );

  currentType =
    data.type ||
    currentType;

  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';

  let a = [];


  /*
   * Web
   */
  if(
    currentType === 'web'
  ){

    a =
      Array.isArray(
        data.results?.web?.results
      )
        ? data.results.web.results
        : Array.isArray(data.results)
          ? data.results
          : [];

  }


  /*
   * Images / News
   */
  else if(
    currentType === 'images' ||
    currentType === 'news'
  ){

    a =
      Array.isArray(data.results)
        ? data.results
        : Array.isArray(
            data.results?.results
          )
          ? data.results.results
          : [];

  }


  /*
   * Maps
   */
  else if(
    currentType === 'map'
  ){

    const loc =
      data.results?.locations ??
      data.results?.map ??
      data.results?.places ??
      data.locations ??
      data.map ??
      data.places ??
      data.results;

    a =
      Array.isArray(loc)
        ? loc
        : Array.isArray(loc?.results)
          ? loc.results
          : [];

  }


  count.textContent =
    a.length
      ? `${a.length} results`
      : '';

  resultsInput.value =
    data.query ||
    '';

  list.innerHTML =
    '';

  pager.innerHTML =
    '';


  document
    .querySelectorAll(
      '.search-type'
    )
    .forEach(
      button => {

        button.classList.toggle(
          'active',
          button.dataset.type ===
            currentType
        );

      }
    );


  if(!a.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    history.replaceState(
      {},
      '',
      `/?q=${encodeURIComponent(
        data.query ||
        currentQ
      )}&type=${encodeURIComponent(
        currentType
      )}${
        currentPage
          ? `&page=${currentPage}`
          : ''
      }`
    );

    return;
  }


  /* =======================================================
     IMAGES
  ======================================================= */

  if(
    currentType === 'images'
  ){

    const grid =
      document.createElement(
        'div'
      );

    grid.className =
      'image-grid';


    a.forEach(
      r => {

        const u =
          safeURL(
            r.url ||
            r.properties?.url ||
            ''
          );

        const img =
          safeURL(
            r.thumbnail ||
            r.image ||
            r.properties?.url ||
            ''
          );

        if(!img){
          return;
        }

        const el =
          document.createElement(
            'article'
          );

        el.className =
          'image-result';

        el.innerHTML = `
          <a
            href="${esc(u || img)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="${esc(img)}"
              alt="${esc(
                r.title || ''
              )}"
              loading="lazy"
              referrerpolicy="no-referrer"
            >
          </a>

          <div class="image-result-title">
            ${esc(
              r.title ||
              u ||
              'Image'
            )}
          </div>

          <div class="image-result-source">
            ${esc(
              r.source ||
              r.meta_url?.hostname ||
              ''
            )}
          </div>
        `;

        grid.appendChild(
          el
        );

      }
    );


    if(grid.children.length){

      list.appendChild(
        grid
      );

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';

    }

  }


  /* =======================================================
     MAPS
  ======================================================= */

  else if(
    currentType === 'map'
  ){

    a.forEach(
      r => {

        const el =
          document.createElement(
            'article'
          );

        el.className =
          'map-result';


        const properties =
          r.properties ||
          {};


        const title =
          r.title ||
          r.name ||
          r.address?.name ||
          properties.name ||
          properties.title ||
          'Map result';


        const website =
          safeURL(
            r.url ||
            r.website ||
            properties.url ||
            properties.website ||
            ''
          );


        let address = '';


        if(
          typeof r.address ===
          'string'
        ){

          address =
            r.address;

        }else if(
          r.address &&
          typeof r.address ===
          'object'
        ){

          const parts = [
            r.address.house_number,
            r.address.road,
            r.address.neighbourhood,
            r.address.suburb,
            r.address.city,
            r.address.town,
            r.address.village,
            r.address.state,
            r.address.postcode,
            r.address.country
          ]
          .filter(
            value =>
              typeof value ===
              'string' &&
              value.trim()
          );

          address =
            [...new Set(parts)]
              .join(', ');

          /*
           * Fallback for unknown object formats.
           */
          if(!address){

            address =
              Object.values(
                r.address
              )
              .filter(
                value =>
                  typeof value ===
                  'string' &&
                  value.trim()
              )
              .join(', ');

          }

        }


        if(!address){

          address =
            r.description ||
            properties.address ||
            '';

        }


        const lat =
          r.lat ??
          r.latitude ??
          r.coordinates?.lat ??
          r.geometry?.coordinates?.[1] ??
          properties.lat ??
          properties.latitude;


        const lon =
          r.lon ??
          r.lng ??
          r.longitude ??
          r.coordinates?.lon ??
          r.geometry?.coordinates?.[0] ??
          properties.lon ??
          properties.lng ??
          properties.longitude;


        let mapHref =
          '';


        if(
          lat !== undefined &&
          lat !== null &&
          lon !== undefined &&
          lon !== null
        ){

          mapHref =
            `https://www.google.com/maps?q=${
              encodeURIComponent(lat)
            },${
              encodeURIComponent(lon)
            }`;

        }else if(website){

          mapHref =
            website;

        }


        el.innerHTML = `

          <h2 class="map-result-title">

            ${
              mapHref

                ? `
                  <a
                    href="${esc(mapHref)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${esc(title)}
                  </a>
                `

                : esc(title)
            }

          </h2>


          ${
            address
              ? `
                <div class="map-result-address">
                  ${esc(address)}
                </div>
              `
              : ''
          }


          ${
            lat !== undefined &&
            lat !== null &&
            lon !== undefined &&
            lon !== null

              ? `
                <div class="map-result-coords">
                  ${esc(lat)}, ${esc(lon)}
                </div>
              `

              : ''
          }


          ${
            website

              ? `
                <a
                  class="map-result-link"
                  href="${esc(website)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Website
                </a>
              `

              : ''
          }

        `;

        list.appendChild(
          el
        );

      }
    );

  }


  /* =======================================================
     WEB / NEWS
  ======================================================= */

  else{

    a.forEach(
      r => {

        const el =
          document.createElement(
            'article'
          );

        el.className =
          'result';


        const u =
          safeURL(
            r.url ||
            ''
          );


        const host =
          r.meta_url?.hostname ||
          '';


        const title =
          r.title ||
          u ||
          '';


        const desc =
          r.description ||
          r.content ||
          '';


        const age =
          r.age ||
          r.publishedDate ||
          '';


        el.innerHTML = `

          <div class="result-url">
            ${esc(host || u)}
          </div>

          <h2>

            ${
              u

                ? `
                  <a
                    href="${esc(u)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${esc(title)}
                  </a>
                `

                : esc(title)
            }

          </h2>


          ${
            desc

              ? `
                <p class="snippet">
                  ${esc(desc)}
                </p>
              `

              : ''
          }


          ${
            age

              ? `
                <div class="result-meta">
                  ${esc(age)}
                </div>
              `

              : ''
          }

        `;

        list.appendChild(
          el
        );

      }
    );

  }


  /* =======================================================
     PAGER
  ======================================================= */

  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(
    currentPage > 0
  ){

    const button =
      document.createElement(
        'button'
      );

    button.textContent =
      'Previous';

    button.onclick =
      () =>
        search(
          currentQ,
          currentPage - 1,
          currentType
        );

    pager.appendChild(
      button
    );

  }


  if(more){

    const button =
      document.createElement(
        'button'
      );

    button.textContent =
      'Next';

    button.onclick =
      () =>
        search(
          currentQ,
          currentPage + 1,
          currentType
        );

    pager.appendChild(
      button
    );

  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(
      data.query ||
      currentQ
    )}&type=${encodeURIComponent(
      currentType
    )}${
      currentPage
        ? `&page=${currentPage}`
        : ''
    }`
  );

}


/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page=0,
  type=currentType
){

  q =
    q.trim();

  if(!q){
    return;
  }


  /*
   * Make sure the latest bang list is available.
   */
  await loadBangs();


  /*
   * A bang takes priority over normal search.
   */
  if(
    tryBangSearch(q)
  ){

    return;
  }


  currentQ =
    q;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    type;


  /*
   * Open translator when the query is
   * a translation command.
   */
  openTranslation(
    q
  );


  document.title =
    `${q} - FlibidooSearch`;


  input.value =
    q;

  resultsInput.value =
    q;


  updateButtonState(
    submitButton,
    q
  );

  updateButtonState(
    resultsSubmitButton,
    q
  );


  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );


  list.innerHTML =
    '<div class="empty">Searching…</div>';

  count.textContent =
    '';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML =
    '';


  /*
   * MAP FIX:
   *
   * Previously the code converted map searches
   * into "web".
   *
   * We now send the actual selected type.
   */
  const requestType =
    type;


  try{

    const response =
      await fetch(
        `${API_BASE}/api`,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            query:q,

            type:requestType,

            page:currentPage

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        'Search failed'
      );

    }


    data.type =
      type;


    render(
      data
    );


  }catch(error){

    list.innerHTML =
      `
        <div class="error">
          ${esc(
            error.message ||
            'Search failed. Please try again.'
          )}
        </div>
      `;

  }

}


/* =========================================================
   HOME SEARCH
========================================================= */

form.addEventListener(
  'submit',
  async event => {

    event.preventDefault();

    const q =
      input.value.trim();

    if(!q){
      return;
    }


    /*
     * Check bangs before changing URL.
     */
    await loadBangs();

    if(
      tryBangSearch(q)
    ){

      return;
    }


    location.href =
      `/?q=${
        encodeURIComponent(q)
      }&type=web&page=0`;

  }
);


/* =========================================================
   RESULTS SEARCH
========================================================= */

resultsForm.addEventListener(
  'submit',
  async event => {

    event.preventDefault();

    const q =
      resultsInput.value.trim();

    if(!q){
      return;
    }


    await search(
      q,
      0,
      currentType
    );

  }
);


/* =========================================================
   SEARCH TYPE BUTTONS
========================================================= */

document
  .querySelectorAll(
    '.search-type'
  )
  .forEach(
    button => {

      button.addEventListener(
        'click',
        () => {

          const q =
            resultsInput.value ||
            currentQ;

          search(
            q,
            0,
            button.dataset.type
          );

        }
      );

    }
  );


/* =========================================================
   ABOUT
========================================================= */

const aboutOverlay =
  document.querySelector(
    '#aboutOverlay'
  );


document
  .querySelector(
    '#aboutButton'
  )
  .onclick =
    () =>
      aboutOverlay.classList.remove(
        'hidden'
      );


document
  .querySelector(
    '#aboutClose'
  )
  .onclick =
    () =>
      aboutOverlay.classList.add(
        'hidden'
      );


aboutOverlay.addEventListener(
  'click',
  event => {

    if(
      event.target ===
      aboutOverlay
    ){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


document.addEventListener(
  'keydown',
  event => {

    if(
      event.key === 'Escape'
    ){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


/* =========================================================
   URL INITIALIZATION
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );

const initialQuery =
  params.get('q');

const initialType =
  [
    'web',
    'images',
    'news',
    'map'
  ].includes(
    params.get('type')
  )
    ? params.get('type')
    : 'web';


/*
 * Start loading bangs immediately,
 * without blocking the initial page.
 */
loadBangs();


if(initialQuery){

  search(
    initialQuery,
    Number(
      params.get('page') || 0
    ),
    initialType
  );

}
</script>
