<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">
<title>FlibidooSearch</title>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

a{
  color:inherit;
}

button,
input{
  font-family:inherit;
}

.shell{
  width:min(100% - 40px,1180px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px;
}

/* =========================================================
   HOME
========================================================= */

#home.home{
  width:100%;
  height:100vh;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#home .search-wrap{
  width:min(100%,760px);
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* BIG HOME LOGO */

.hero-logo{
  width:min(260px,65vw);
  height:auto;
  display:block;
  margin:0 auto 18px;
  object-fit:contain;

  /* soft fade around edges */
  -webkit-mask-image:
    radial-gradient(
      ellipse at center,
      #000 58%,
      rgba(0,0,0,.9) 72%,
      rgba(0,0,0,.45) 88%,
      transparent 100%
    );

  mask-image:
    radial-gradient(
      ellipse at center,
      #000 58%,
      rgba(0,0,0,.9) 72%,
      rgba(0,0,0,.45) 88%,
      transparent 100%
    );
}

#home h1{
  text-align:center;
}

h1{
  font-size:clamp(36px,5vw,54px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500;
}

h1 em{
  font-style:normal;
}

h1 strong{
  font-weight:700;
}

.search-wrap{
  width:min(100%,760px);
}

/* =========================================================
   SEARCH BOX
========================================================= */

form{
  display:flex;
  align-items:center;
  height:56px;
  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;
  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:
    0 0 0 2px rgba(205,184,209,.08);
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 18px;
}

input::placeholder{
  color:#9e8da1;
}

/* Arrow button */

.submit{
  height:40px;
  width:40px;
  margin-right:7px;
  border:1px solid var(--line);
  background:transparent;
  color:#766679;
  border-radius:50%;
  padding:9px;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 40px;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
}

.submit svg{
  width:100%;
  height:100%;
  display:block;
  fill:currentColor;
}

/* =========================================================
   HOME LINKS
========================================================= */

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

.confederacy-credit img{
  width:20px;
  height:20px;
  display:block;
  object-fit:contain;
  flex:0 0 20px;
  border-radius:5px;
}

/* =========================================================
   MAIN
========================================================= */

main{
  flex:1;
}

/* =========================================================
   RESULTS
========================================================= */

.results{
  padding:30px 12px 70px;
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:44px;
  border-bottom:1px solid var(--line2);
  padding-bottom:14px;
  margin-bottom:20px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:inherit;
  white-space:nowrap;
}

.results-brand span{
  font-size:17px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

/* WIDE RESULT SEARCH */

.results-search{
  width:100%;
  max-width:920px;
  margin:0 0 28px;
}

.results-search form{
  width:100%;
  height:54px;
}

.results-search input{
  font-size:16px;
}

.results-search .submit{
  width:38px;
  height:38px;
  flex-basis:38px;
  padding:8px;
}

/* =========================================================
   CATEGORIES
========================================================= */

.search-types{
  display:flex;
  align-items:flex-end;
  gap:0;
  margin:8px 0 22px;
  border-bottom:1px solid rgba(255,255,255,.12);
  height:38px;
}

.search-type{
  position:relative;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font:inherit;
  font-size:13px;
  line-height:20px;
  padding:0 14px 11px;
  margin:0;
  border-radius:0;
  cursor:pointer;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  bottom:-1px;
  height:2px;
  border-radius:2px 2px 0 0;
  background:currentColor;
}

/* =========================================================
   RESULTS LAYOUT
========================================================= */

.results-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:42px;
  align-items:start;
}

/* =========================================================
   WEB RESULTS
========================================================= */

.result{
  padding:0 0 26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2);
}

.result-site{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  margin-bottom:7px;
}

.result-favicon{
  width:18px;
  height:18px;
  border-radius:4px;
  object-fit:contain;
  flex:0 0 18px;
  background:rgba(255,255,255,.04);
}

.result-url{
  font-size:13px;
  color:var(--url);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result h2{
  font-size:21px;
  line-height:1.25;
  margin:0 0 8px;
  font-weight:500;
  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.result-body{
  display:flex;
  gap:16px;
  align-items:flex-start;
}

.result-text{
  min-width:0;
  flex:1;
}

.snippet{
  font-size:14px;
  line-height:1.6;
  color:var(--result);
  margin:0;
  max-width:760px;
}

.snippet strong{
  font-weight:700;
  color:#fff;
}

.snippet em{
  font-style:italic;
}

.result-thumb{
  width:120px;
  height:80px;
  flex:0 0 120px;
  object-fit:cover;
  border-radius:7px;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.02);
}

.result-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}

/* =========================================================
   IMAGES
========================================================= */

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-result img{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border:1px solid var(--line2);
  border-radius:6px;
  background:rgba(255,255,255,.02);
}

.image-result-title{
  font-size:14px;
  line-height:1.4;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   NEWS
========================================================= */

.news-thumb{
  width:150px;
  height:95px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid var(--line2);
  flex:0 0 150px;
}

.news-result{
  padding-bottom:26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2);
}

.news-title{
  font-size:20px;
  line-height:1.3;
  margin:0 0 7px;
  font-weight:500;
}

.news-title a{
  text-decoration:none;
}

.news-title a:hover{
  text-decoration:underline;
}

/* =========================================================
   DICTIONARY
========================================================= */

.dictionary{
  border-left:1px solid var(--line2);
  padding-left:28px;
  max-height:75vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;
  font-weight:500;
  letter-spacing:-.02em;
  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line2);
}

.dictionary-language,
.dictionary-label{
  font-size:12px;
  color:var(--muted);
}

.dictionary-language{
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 8px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-example{
  font-size:13px;
  line-height:1.5;
  color:var(--result);
  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
}

/* =========================================================
   WORD OF THE DAY
========================================================= */

.wotd-panel{
  padding:0 0 22px;
  margin:0 0 22px;
  border-bottom:1px solid var(--line2);
}

.wotd-heading{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 9px;
  color:#ffb52e;
  font-size:13px;
  font-weight:600;
}

.wotd-word{
  color:#fff;
  font-size:21px;
  font-weight:600;
  line-height:1.25;
  margin:0 0 7px;
}

.wotd-definition{
  color:#ffe9a8;
  font-size:13px;
  line-height:1.55;
  margin:0;
}

.wotd-example{
  color:#cdbd8c;
  font-size:12px;
  line-height:1.5;
  margin:8px 0 0;
}

/* =========================================================
   MISC
========================================================= */

.empty{
  padding:70px 0;
  color:var(--muted);
  text-align:center;
}

.error{
  min-height:120px;
  max-width:760px;
  margin:0;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line2);
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.pager{
  display:flex;
  gap:8px;
  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:4px;
  padding:8px 12px;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   ABOUT
========================================================= */

.about-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:24px;
  z-index:10000;
}

.about-overlay.hidden{
  display:none;
}

.about-card{
  position:relative;
  width:min(100%,560px);
  max-height:min(80vh,700px);
  overflow:auto;
  background:#24132a;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  padding:30px;
}

.about-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;
  font-size:25px;
  font-weight:500;
}

.about-card p{
  color:var(--result);
  line-height:1.7;
  font-size:14px;
}

.about-card a{
  color:var(--text);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

  .results-layout{
    grid-template-columns:1fr;
  }

  .dictionary{
    order:-1;
    border-left:0;
    border-bottom:1px solid var(--line2);
    padding:0 0 26px;
    margin-bottom:26px;
    max-height:none;
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 14px;
  }

  .result-body{
    gap:12px;
  }

  .result-thumb{
    width:100px;
    height:70px;
    flex-basis:100px;
  }
}

@media(max-width:640px){

  .shell{
    width:100%;
    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:20px 16px;
  }

  .hero-logo{
    width:190px;
  }

  h1{
    font-size:36px;
    margin-bottom:24px;
  }

  form{
    height:52px;
  }

  .results{
    padding:22px 16px 60px;
  }

  .results-head{
    gap:12px;
  }

  .results-query{
    font-size:13px;
  }

  .search-types{
    overflow-x:auto;
    scrollbar-width:none;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;
    font-size:12px;
  }

  .results-search{
    max-width:none;
  }

  .result-body{
    display:block;
  }

  .result-thumb{
    width:120px;
    height:80px;
    margin-top:12px;
  }

  .news-thumb{
    width:120px;
    height:80px;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr;
  }

  .hero-logo{
    width:170px;
  }
}
</style>
</head>

<body>

<main>

<!-- =======================================================
     HOME
======================================================== -->

<section id="home" class="home shell">

  <div class="search-wrap">

    <img
      class="hero-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="Flibidoo"
    >

    <h1>
      <em><strong>Flibidoo</strong></em>Search
    </h1>

    <form id="searchForm" role="search">

      <input
        id="q"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="submitButton"
        type="submit"
        aria-label="Search"
      >
        <!-- Font Awesome arrow supplied by you -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>
      </button>

    </form>

    <div class="links">

      <button
        type="button"
        id="aboutButton"
      >
        About
      </button>

      <span class="confederacy-credit">

        with love from The Great Confederacy of E

        <img
          src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
          alt=""
          aria-hidden="true"
        >

      </span>

    </div>

  </div>

</section>


<!-- =======================================================
     RESULTS
======================================================== -->

<section
  id="results"
  class="results shell hidden"
>

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >
      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>
    </a>

    <div
      id="queryLabel"
      class="results-query"
    ></div>

    <div
      id="count"
      class="count"
    ></div>

  </div>


  <div class="results-search">

    <form
      id="resultsSearchForm"
      role="search"
    >

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>

      </button>

    </form>

  </div>


  <!-- NO MAPS -->

  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >
      Web
    </button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >
      Images
    </button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >
      News
    </button>

  </nav>


  <div class="results-layout">

    <div>

      <div id="resultList"></div>

      <div
        id="pager"
        class="pager"
      ></div>

    </div>


    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results"
    ></aside>

  </div>

</section>

</main>


<!-- =======================================================
     ABOUT
======================================================== -->

<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle"
>

  <div class="about-card">

    <button
      id="aboutClose"
      class="about-close"
      type="button"
      aria-label="Close About"
    >
      ×
    </button>

    <h2 id="aboutTitle">
      About
    </h2>

    <p>
      Welcome to FlibidooSearch.
    </p>

    <p>
      You can edit this text directly in the HTML
      inside the <strong>about-card</strong>.
    </p>

  </div>

</div>


<script>
/* =========================================================
   CONFIG
========================================================= */

/*
 * IMPORTANT:
 * The browser talks to YOUR Worker.
 *
 * The Worker talks to:
 * https://search.tiago.zip/api
 */

const API_BASE =
  'https://working-filibidooo.daniel-torres-a95.workers.dev';


/* =========================================================
   DOM
========================================================= */

const form =
  document.querySelector('#searchForm');

const input =
  document.querySelector('#q');

const home =
  document.querySelector('#home');

const results =
  document.querySelector('#results');

const list =
  document.querySelector('#resultList');

const label =
  document.querySelector('#queryLabel');

const count =
  document.querySelector('#count');

const pager =
  document.querySelector('#pager');

const resultsForm =
  document.querySelector('#resultsSearchForm');

const resultsInput =
  document.querySelector('#resultsQ');

const dictionary =
  document.querySelector('#dictionary');

const submitButton =
  document.querySelector('#submitButton');

const resultsSubmitButton =
  document.querySelector('#resultsSubmitButton');


let currentQ = '';
let currentPage = 0;
let currentType = 'web';


/* =========================================================
   HELPERS
========================================================= */

function esc(value = ''){
  return String(value)
    .replace(/[&<>'"]/g, char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[char]));
}


/*
 * Safe rich text formatter.
 *
 * Supports:
 * **bold**
 * __bold__
 * *italic*
 * _italic_
 *
 * Also allows a very small whitelist of HTML tags:
 * <strong>
 * <b>
 * <em>
 * <i>
 * <u>
 *
 * Everything else gets escaped.
 */

function richText(value = ''){

  let text = String(value);

  /*
   * Protect the allowed HTML tags.
   */
  const tokens = [];

  text = text.replace(
    /<\/?(strong|b|em|i|u)\b[^>]*>/gi,
    tag => {
      const token = `___FLIBIDOO_TAG_${tokens.length}___`;
      tokens.push(tag);
      return token;
    }
  );

  text = esc(text);

  /*
   * Markdown bold.
   */
  text = text.replace(
    /\*\*(.+?)\*\*/gs,
    '<strong>$1</strong>'
  );

  text = text.replace(
    /__(.+?)__/gs,
    '<strong>$1</strong>'
  );

  /*
   * Markdown italic.
   */
  text = text.replace(
    /(?<!\*)\*([^*]+?)\*(?!\*)/g,
    '<em>$1</em>'
  );

  text = text.replace(
    /(?<!_)_([^_]+?)_(?!_)/g,
    '<em>$1</em>'
  );

  /*
   * Restore allowed HTML.
   */
  tokens.forEach((tag, index) => {
    text = text.replaceAll(
      `___FLIBIDOO_TAG_${index}___`,
      tag
    );
  });

  /*
   * Basic line breaks.
   */
  text = text.replace(/\r?\n/g, '<br>');

  return text;
}


function updateButtonState(button, value){
  button.classList.toggle(
    'has-input',
    String(value || '').trim().length > 0
  );
}


function safeUrl(value){
  try{
    const url = new URL(value);

    if(
      url.protocol === 'http:' ||
      url.protocol === 'https:'
    ){
      return url.href;
    }
  }catch{}

  return '';
}


function faviconFor(url){
  try{
    return new URL(
      '/favicon.ico',
      url
    ).href;
  }catch{
    return '';
  }
}


function getFavicon(result){

  /*
   * Tiago already supplies:
   * meta_url.favicon
   */
  const favicon =
    result?.meta_url?.favicon ||
    result?.favicon ||
    '';

  if(favicon){
    return safeUrl(favicon);
  }

  return faviconFor(
    result?.url || ''
  );
}


function getThumbnail(result){

  /*
   * Tiago web results use:
   * thumbnail.src
   */

  if(
    result?.thumbnail &&
    typeof result.thumbnail === 'object'
  ){
    return safeUrl(
      result.thumbnail.src ||
      result.thumbnail.url ||
      ''
    );
  }

  if(
    typeof result?.thumbnail === 'string'
  ){
    return safeUrl(result.thumbnail);
  }

  if(result?.ogImage){
    return safeUrl(result.ogImage);
  }

  return '';
}


/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page = 0,
  type = currentType
){

  q = String(q || '').trim();

  if(!q) return;

  currentQ = q;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    ['web','images','news'].includes(type)
      ? type
      : 'web';

  document.title =
    `${q} - FlibidooSearch`;

  input.value = q;
  resultsInput.value = q;

  home.classList.add('hidden');
  results.classList.remove('hidden');

  list.innerHTML =
    '<div class="empty">Searching…</div>';

  count.textContent = '';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML = '';

  /*
   * Sidebar is independent.
   */
  dictionary.innerHTML = '';
  dictionary.classList.add('hidden');


  /*
   * IMPORTANT:
   *
   * We call OUR Worker:
   *
   * /api/search
   *
   * NOT:
   *
   * /api
   */

  const endpoint =
    `${API_BASE}/api/search` +
    `?q=${encodeURIComponent(q)}` +
    `&type=${encodeURIComponent(currentType)}` +
    `&page=${currentPage}`;


  try{

    const response =
      await fetch(endpoint, {
        method:'GET',
        headers:{
          'Accept':'application/json'
        }
      });


    const text =
      await response.text();


    let data;

    try{

      data = JSON.parse(text);

    }catch{

      throw new Error(
        `Search endpoint returned invalid JSON (${response.status}).`
      );

    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        `Search endpoint returned ${response.status}.`
      );

    }


    data.type =
      currentType;


    render(data);


  }catch(error){

    list.innerHTML = `
      <div class="error">
        ${esc(
          error?.message ||
          'Search failed. Please try again.'
        )}
      </div>
    `;

  }


  /*
   * ALWAYS load dictionary/WOTD independently.
   */
  await loadSidebar(q);


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(q)}` +
    `&type=${encodeURIComponent(currentType)}` +
    `&page=${currentPage}`
  );
}


/* =========================================================
   RENDER SEARCH RESULTS
========================================================= */

function render(data){

  home.classList.add('hidden');
  results.classList.remove('hidden');

  currentType =
    data.type || currentType;

  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';


  let a = [];


  if(currentType === 'web'){

    a =
      Array.isArray(
        data?.results?.web?.results
      )
        ? data.results.web.results
        : [];

    /*
     * Fallback to mixed if needed.
     */
    if(
      !a.length &&
      Array.isArray(
        data?.results?.mixed
      )
    ){
      a =
        data.results.mixed;
    }

  }else if(
    currentType === 'images' ||
    currentType === 'news'
  ){

    a =
      Array.isArray(data.results)
        ? data.results
        : [];

  }


  count.textContent =
    a.length
      ? `${a.length} results`
      : '';


  resultsInput.value =
    data.query || '';


  list.innerHTML = '';
  pager.innerHTML = '';


  document
    .querySelectorAll('.search-type')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.type === currentType
      );

    });


  /*
   * No search results.
   *
   * Dictionary is still allowed to appear
   * because it loads separately.
   */
  if(!a.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    return;
  }


  /* =======================================================
     IMAGES
  ======================================================= */

  if(currentType === 'images'){

    const grid =
      document.createElement('div');

    grid.className =
      'image-grid';


    a.forEach(result => {

      const url =
        safeUrl(
          result.url ||
          result.properties?.url ||
          ''
        );

      const image =
        safeUrl(
          result.thumbnail ||
          result.properties?.url ||
          ''
        );


      if(!image) return;


      const element =
        document.createElement('article');

      element.className =
        'image-result';


      element.innerHTML = `

        <a
          href="${esc(url)}"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            src="${esc(image)}"
            alt="${esc(result.title || '')}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >

        </a>

        <div class="image-result-title">
          ${esc(result.title || url)}
        </div>

        <div class="image-result-source">
          ${esc(
            result.source ||
            result.meta_url?.hostname ||
            ''
          )}
        </div>

      `;


      grid.appendChild(element);

    });


    if(grid.children.length){

      list.appendChild(grid);

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';

    }


  /* =======================================================
     NEWS
  ======================================================= */

  }else if(currentType === 'news'){

    a.forEach(result => {

      const element =
        document.createElement('article');

      element.className =
        'news-result';


      const url =
        safeUrl(result.url || '');

      const image =
        getThumbnail(result);

      const favicon =
        getFavicon(result);


      const title =
        result.title ||
        url ||
        'News result';

      const description =
        result.description ||
        result.content ||
        '';

      const age =
        result.age ||
        result.publishedDate ||
        '';


      element.innerHTML = `

        <div class="result-site">

          ${
            favicon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(favicon)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

          <div class="result-url">
            ${esc(
              result.meta_url?.hostname ||
              url
            )}
          </div>

        </div>


        <div class="result-body">

          <div class="result-text">

            <h2 class="news-title">
              <a
                href="${esc(url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${esc(title)}
              </a>
            </h2>

            ${
              description
                ? `
                  <p class="snippet">
                    ${richText(description)}
                  </p>
                `
                : ''
            }

            ${
              age
                ? `
                  <div class="result-meta">
                    ${esc(age)}
                  </div>
                `
                : ''
            }

          </div>


          ${
            image
              ? `
                <img
                  class="news-thumb"
                  src="${esc(image)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

        </div>

      `;


      list.appendChild(element);

    });


  /* =======================================================
     WEB
  ======================================================= */

  }else{

    a.forEach(result => {

      const element =
        document.createElement('article');

      element.className =
        'result';


      const url =
        safeUrl(result.url || '');

      const host =
        result.meta_url?.hostname ||
        '';

      const title =
        result.title ||
        url ||
        'Search result';

      const description =
        result.description ||
        result.content ||
        '';

      const age =
        result.age ||
        result.publishedDate ||
        '';

      const favicon =
        getFavicon(result);

      const thumbnail =
        getThumbnail(result);


      element.innerHTML = `

        <div class="result-site">

          ${
            favicon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(favicon)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

          <div class="result-url">
            ${esc(host || url)}
          </div>

        </div>


        <h2>

          <a
            href="${esc(url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>

        </h2>


        <div class="result-body">

          <div class="result-text">

            ${
              description
                ? `
                  <p class="snippet">
                    ${richText(description)}
                  </p>
                `
                : ''
            }

            ${
              age
                ? `
                  <div class="result-meta">
                    ${esc(age)}
                  </div>
                `
                : ''
            }

          </div>


          ${
            thumbnail
              ? `
                <img
                  class="result-thumb"
                  src="${esc(thumbnail)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

        </div>

      `;


      list.appendChild(element);

    });

  }


  /* =======================================================
     PAGINATION
  ======================================================= */

  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const previous =
      document.createElement('button');

    previous.textContent =
      'Previous';

    previous.onclick =
      () => search(
        currentQ,
        currentPage - 1,
        currentType
      );

    pager.appendChild(previous);

  }


  if(more){

    const next =
      document.createElement('button');

    next.textContent =
      'Next';

    next.onclick =
      () => search(
        currentQ,
        currentPage + 1,
        currentType
      );

    pager.appendChild(next);

  }
}


/* =========================================================
   SIDEBAR
========================================================= */

async function loadSidebar(q){

  dictionary.innerHTML = '';
  dictionary.classList.add('hidden');


  const normalized =
    q.trim().toLowerCase();


  const wantsWotd =
    normalized === 'wotd' ||
    normalized === 'word of the day' ||
    normalized.includes('word of the day') ||
    normalized.includes('wotd');


  let wotdData = null;


  /*
   * Get WOTD independently.
   */

  try{

    const response =
      await fetch(
        `${API_BASE}/api/wotd`,
        {
          headers:{
            'Accept':'application/json'
          }
        }
      );


    const text =
      await response.text();


    try{

      wotdData =
        JSON.parse(text);

    }catch{

      wotdData = null;

    }

  }catch{

    wotdData = null;

  }


  const wotdWord =
    String(
      wotdData?.word || ''
    ).trim();


  /*
   * Explicit WOTD request.
   */

  if(
    wantsWotd &&
    wotdWord
  ){

    renderWotd(wotdData);

    return;
  }


  /*
   * If they searched the WOTD itself,
   * show WOTD panel and ALSO dictionary.
   */

  if(
    wotdWord &&
    normalized ===
      wotdWord.toLowerCase()
  ){

    renderWotd(wotdData);

    /*
     * Continue into dictionary.
     */
  }


  /*
   * Don't dictionary-search phrases like
   * "word of the day".
   */

  if(!wantsWotd){

    await loadDictionary(q);

  }
}


/* =========================================================
   DICTIONARY REQUEST
========================================================= */

async function loadDictionary(word){

  try{

    const response =
      await fetch(
        `${API_BASE}/api/dictionary?word=${encodeURIComponent(word)}`,
        {
          headers:{
            'Accept':'application/json'
          }
        }
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch{

      return;

    }


    if(
      !Array.isArray(data?.entries) ||
      !data.entries.length
    ){

      /*
       * If WOTD panel exists, don't erase it.
       */
      if(
        !dictionary.querySelector('.wotd-panel')
      ){

        dictionary.innerHTML = '';
        dictionary.classList.add('hidden');

      }

      return;
    }


    renderDictionary(data);

  }catch{

    /*
     * Dictionary is optional.
     * Search must continue working if it fails.
     */

    if(
      !dictionary.querySelector('.wotd-panel')
    ){

      dictionary.innerHTML = '';
      dictionary.classList.add('hidden');

    }

  }
}


/* =========================================================
   WOTD
========================================================= */

function renderWotd(data){

  const word =
    String(data?.word || '').trim();

  if(!word) return;


  dictionary.classList.remove('hidden');


  dictionary.innerHTML = `

    <section class="wotd-panel">

      <div class="wotd-heading">
        Word of the Day!
      </div>

      <div class="wotd-word">
        ${esc(word)}
      </div>

      ${
        data.definition
          ? `
            <p class="wotd-definition">
              ${esc(data.definition)}
            </p>
          `
          : ''
      }

      ${
        data.example
          ? `
            <p class="wotd-example">
              “${esc(data.example)}”
            </p>
          `
          : ''
      }

    </section>

  `;
}


/* =========================================================
   DICTIONARY RENDER
========================================================= */

function renderDictionary(data){

  const entries =
    Array.isArray(data?.entries)
      ? data.entries
      : [];


  if(!entries.length){

    if(
      !dictionary.querySelector('.wotd-panel')
    ){

      dictionary.innerHTML = '';
      dictionary.classList.add('hidden');

    }

    return;
  }


  /*
   * English first.
   */

  const english =
    entries.filter(entry =>
      String(
        entry?.language?.code || ''
      ).toLowerCase() === 'en'
    );


  const other =
    entries.filter(entry =>
      String(
        entry?.language?.code || ''
      ).toLowerCase() !== 'en'
    );


  const ordered = [
    ...english,
    ...other
  ];


  /*
   * Preserve WOTD panel if one already exists.
   */

  let html =
    dictionary.querySelector(
      '.wotd-panel'
    )?.outerHTML || '';


  html += `

    <h2 class="dictionary-title">
      ${esc(data.word || '')}
    </h2>

  `;


  if(english.length){

    html += `
      <div class="dictionary-word">
        English
      </div>
    `;

  }


  ordered.forEach(entry => {

    const language =
      entry?.language?.name ||
      entry?.language?.code ||
      'Unknown';


    const pos =
      entry?.partOfSpeech ||
      '';


    /*
     * The API may call these "senses".
     * Some dictionary implementations use
     * "meanings", so support both.
     */

    const senses =
      Array.isArray(entry?.senses)
        ? entry.senses
        : Array.isArray(entry?.meanings)
          ? entry.meanings.flatMap(
              meaning =>
                Array.isArray(
                  meaning?.definitions
                )
                  ? meaning.definitions
                  : []
            )
          : [];


    html += `

      <article class="dictionary-entry">

        <div class="dictionary-language">
          ${esc(language)}
        </div>

        ${
          pos
            ? `
              <div class="dictionary-pos">
                ${esc(pos)}
              </div>
            `
            : ''
        }

        ${
          senses.length
            ? `

              <div class="dictionary-senses">

                <div class="dictionary-label">
                  Definitions
                </div>

                <ol class="dictionary-list">

                  ${
                    senses
                      .slice(0,8)
                      .map(sense => {

                        const definition =
                          sense?.definition ||
                          '';

                        const examples =
                          Array.isArray(
                            sense?.examples
                          )
                            ? sense.examples
                            : sense?.example
                              ? [sense.example]
                              : [];


                        return `

                          <li class="dictionary-sense">

                            <div class="dictionary-definition">
                              ${esc(definition)}
                            </div>

                            ${
                              examples.length
                                ? `
                                  <div class="dictionary-example">
                                    “${esc(
                                      examples[0]
                                    )}”
                                  </div>
                                `
                                : ''
                            }

                          </li>

                        `;

                      })
                      .join('')
                  }

                </ol>

              </div>

            `
            : ''
        }

        ${
          Array.isArray(entry?.synonyms) &&
          entry.synonyms.length
            ? `

              <div class="dictionary-relations">

                <div class="dictionary-label">
                  Synonyms
                </div>

                <div>
                  ${
                    entry.synonyms
                      .slice(0,12)
                      .map(item =>
                        esc(
                          typeof item === 'string'
                            ? item
                            : item?.text || ''
                        )
                      )
                      .join(', ')
                  }
                </div>

              </div>

            `
            : ''
        }

      </article>

    `;

  });


  html += `

    <div class="dictionary-source">
      Powered by FreeDictionaryAPI
    </div>

  `;


  dictionary.innerHTML =
    html;

  dictionary.classList.remove(
    'hidden'
  );
}


/* =========================================================
   INPUT STATE
========================================================= */

input.addEventListener(
  'input',
  () => updateButtonState(
    submitButton,
    input.value
  )
);

resultsInput.addEventListener(
  'input',
  () => updateButtonState(
    resultsSubmitButton,
    resultsInput.value
  )
);


/* =========================================================
   HOME SUBMIT
========================================================= */

form.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const q =
      input.value.trim();

    if(!q) return;


    location.href =
      `/?q=${encodeURIComponent(q)}` +
      `&type=web&page=0`;

  }
);


/* =========================================================
   RESULT SEARCH SUBMIT
========================================================= */

resultsForm.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const q =
      resultsInput.value.trim();

    if(!q) return;

    search(
      q,
      0,
      currentType
    );

  }
);


/* =========================================================
   CATEGORY SWITCHING
========================================================= */

document
  .querySelectorAll('.search-type')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        const type =
          button.dataset.type;


        if(
          !['web','images','news']
            .includes(type)
        ){
          return;
        }


        search(
          resultsInput.value ||
          currentQ,
          0,
          type
        );

      }
    );

  });


/* =========================================================
   ABOUT
========================================================= */

const aboutOverlay =
  document.querySelector(
    '#aboutOverlay'
  );


document
  .querySelector('#aboutButton')
  .addEventListener(
    'click',
    () => {
      aboutOverlay.classList.remove(
        'hidden'
      );
    }
  );


document
  .querySelector('#aboutClose')
  .addEventListener(
    'click',
    () => {
      aboutOverlay.classList.add(
        'hidden'
      );
    }
  );


aboutOverlay.addEventListener(
  'click',
  event => {

    if(
      event.target === aboutOverlay
    ){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


document.addEventListener(
  'keydown',
  event => {

    if(event.key === 'Escape'){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


/* =========================================================
   INITIAL URL
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );


const initialQuery =
  params.get('q');


const initialType =
  [
    'web',
    'images',
    'news'
  ].includes(
    params.get('type')
  )
    ? params.get('type')
    : 'web';


if(initialQuery){

  search(
    initialQuery,
    Number(
      params.get('page') || 0
    ),
    initialType
  );

}
</script>
