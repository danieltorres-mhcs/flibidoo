<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">
<title>FlibidooSearch</title>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

a{color:inherit}

.hidden{
  display:none!important;
}

/* =========================================================
   HOME
========================================================= */

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px;
}

#home.home{
  width:100%;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* Large centered logo */

.home-logo{
  width:min(330px,72vw);
  height:auto;
  display:block;
  margin:0 auto 18px;
  object-fit:contain;

  /* subtle edge fade */
  -webkit-mask-image:
    radial-gradient(
      ellipse at center,
      #000 55%,
      rgba(0,0,0,.94) 72%,
      transparent 100%
    );
  mask-image:
    radial-gradient(
      ellipse at center,
      #000 55%,
      rgba(0,0,0,.94) 72%,
      transparent 100%
    );
}

.home-title{
  text-align:center;
  font-size:clamp(38px,5vw,56px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500;
}

.search-wrap{
  width:min(100%,680px);
  margin:0 auto;
}

/* =========================================================
   SEARCH BAR
========================================================= */

form{
  display:flex;
  align-items:center;
  height:54px;
  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;
  transition:border-color .15s ease,box-shadow .15s ease;
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08);
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 14px;
}

input::placeholder{
  color:#9e8da1;
}

/* SVG arrow button */

.submit{
  height:38px;
  width:38px;
  margin-right:8px;
  border:1px solid var(--line);
  background:transparent;
  color:#766679;
  border-radius:50%;
  padding:0;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 auto;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
}

.submit svg{
  width:20px;
  height:20px;
  display:block;
  fill:currentColor;
}

/* =========================================================
   HOME LINKS / CONFEDERACY
========================================================= */

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

.confederacy-credit img{
  width:18px;
  height:18px;
  display:block;
  object-fit:cover;
  flex:0 0 18px;
  border-radius:4px;
}

/* =========================================================
   RESULTS
========================================================= */

main{
  flex:1;
}

.results{
  padding:30px 12px 70px;
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:44px;
  border-bottom:1px solid var(--line2);
  padding-bottom:14px;
  margin-bottom:14px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:inherit;
  white-space:nowrap;
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

.results-search{
  width:min(100%,680px);
  margin:0 0 28px;
}

.results-search form{
  height:48px;
}

.results-search .submit{
  width:34px;
  height:34px;
  margin-right:6px;
}

.results-search .submit svg{
  width:18px;
  height:18px;
}

/* =========================================================
   SEARCH TYPES
========================================================= */

.search-types{
  display:flex;
  align-items:flex-end;
  gap:0;
  margin:8px 0 18px;
  border-bottom:1px solid rgba(255,255,255,.12);
  height:36px;
}

.search-type{
  position:relative;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font:inherit;
  font-size:13px;
  line-height:20px;
  padding:0 12px 10px;
  margin:0;
  border-radius:0;
  cursor:pointer;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:-1px;
  height:2px;
  border-radius:2px 2px 0 0;
  background:currentColor;
}

/* =========================================================
   LAYOUT
========================================================= */

.results-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:42px;
  align-items:start;
}

/* =========================================================
   WEB RESULTS
========================================================= */

.result{
  padding:0 0 26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2);
}

.result-main{
  min-width:0;
}

.result-top{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  margin-bottom:7px;
}

.result-favicon{
  width:18px;
  height:18px;
  object-fit:contain;
  flex:0 0 18px;
  border-radius:3px;
  background:rgba(255,255,255,.04);
}

.result-url{
  font-size:13px;
  color:var(--url);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}

.result h2{
  font-size:20px;
  line-height:1.25;
  margin:0 0 7px;
  font-weight:500;
  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.snippet{
  font-size:14px;
  line-height:1.6;
  color:var(--result);
  margin:0;
  max-width:760px;
}

.snippet strong,
.snippet b{
  font-weight:700;
}

.snippet em,
.snippet i{
  font-style:italic;
}

.snippet u{
  text-decoration:underline;
}

.snippet mark{
  background:rgba(255,220,80,.22);
  color:inherit;
  padding:0 2px;
  border-radius:2px;
}

.snippet code{
  font-family:monospace;
  font-size:.92em;
  background:rgba(255,255,255,.08);
  padding:2px 4px;
  border-radius:3px;
}

.result-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:7px;
}

/* thumbnail */

.result-thumb{
  width:150px;
  height:94px;
  flex:0 0 150px;
  object-fit:cover;
  border-radius:7px;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.03);
}

.result-row{
  display:flex;
  align-items:flex-start;
  gap:18px;
}

.result-row .result-main{
  flex:1;
  min-width:0;
}

/* =========================================================
   IMAGES
========================================================= */

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-result img{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.02);
  border-radius:6px;
}

.image-result-title{
  font-size:14px;
  line-height:1.4;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source img{
  width:14px;
  height:14px;
  flex:0 0 14px;
  border:0;
  border-radius:2px;
}

/* =========================================================
   DICTIONARY
========================================================= */

.dictionary{
  border-left:1px solid var(--line2);
  padding-left:28px;
  max-height:75vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;
  font-weight:500;
  letter-spacing:-.02em;
  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line2);
}

.dictionary-language,
.dictionary-label{
  font-size:12px;
  color:var(--muted);
}

.dictionary-language{
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);
  margin-left:5px;
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;
  color:var(--result);
  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
}

/* =========================================================
   WORD OF THE DAY
========================================================= */

.wotd-panel{
  padding:0 0 22px;
  margin:0 0 22px;
  border-bottom:1px solid var(--line2);
}

.wotd-heading{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 8px;
  color:#ffb52e;
  font-size:13px;
  font-weight:600;
}

.wotd-word{
  color:#fff;
  font-size:20px;
  font-weight:600;
  line-height:1.25;
  margin:0 0 6px;
}

.wotd-definition{
  color:#ffe9a8;
  font-size:13px;
  line-height:1.55;
  margin:0;
}

.wotd-example{
  color:#c9ad7d;
  font-size:12px;
  line-height:1.5;
  margin:7px 0 0;
  font-style:italic;
}

/* =========================================================
   EMPTY / ERROR / PAGER
========================================================= */

.empty{
  padding:70px 0;
  color:var(--muted);
  text-align:center;
}

.error{
  min-height:120px;
  max-width:680px;
  margin:0;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line2);
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.pager{
  display:flex;
  gap:8px;
  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:4px;
  padding:8px 12px;
  cursor:pointer;
}

/* =========================================================
   ABOUT
========================================================= */

.about-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:24px;
  z-index:10000;
}

.about-overlay.hidden{
  display:none;
}

.about-card{
  position:relative;
  width:min(100%,560px);
  max-height:min(80vh,700px);
  overflow:auto;
  background:#24132a;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  padding:30px;
}

.about-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;
  font-size:25px;
  font-weight:500;
}

.about-card p{
  color:var(--result);
  line-height:1.7;
  font-size:14px;
}

.about-card a{
  color:var(--text);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr;
  }

  .dictionary{
    order:-1;
    border-left:0;
    border-bottom:1px solid var(--line2);
    border-top:0;
    padding:0 0 26px;
    margin-bottom:26px;
    max-height:none;
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 14px;
  }

  .result-thumb{
    width:120px;
    height:80px;
    flex-basis:120px;
  }
}

@media(max-width:640px){

  .shell{
    width:100%;
    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:20px 16px;
  }

  .home-logo{
    width:210px;
    margin-bottom:15px;
  }

  .home-title{
    font-size:36px;
    margin-bottom:24px;
  }

  form{
    height:50px;
  }

  .results{
    padding:22px 16px 60px;
  }

  .results-head{
    gap:12px;
  }

  .results-query{
    font-size:13px;
  }

  .search-types{
    overflow-x:auto;
    scrollbar-width:none;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;
    font-size:12px;
  }

  .result-row{
    display:block;
  }

  .result-thumb{
    width:100%;
    height:auto;
    aspect-ratio:16/9;
    margin-top:12px;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<main>

<!-- ======================================================
     HOME
====================================================== -->

<section id="home" class="home shell">

  <div class="search-wrap">

    <img
      class="home-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="Flibidoo"
    >

    <h1 class="home-title">
      <em><strong>Flibidoo</strong></em>Search
    </h1>

    <form id="searchForm" role="search">

      <input
        id="q"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="submitButton"
        type="submit"
        aria-label="Search"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>
      </button>

    </form>

    <div class="links">

      <button type="button" id="aboutButton">
        About
      </button>

      <span class="confederacy-credit">
        with love from The Great Confederacy of E
        <img
          src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
          alt=""
        >
      </span>

    </div>

  </div>

</section>


<!-- ======================================================
     RESULTS
====================================================== -->

<section id="results" class="results shell hidden">

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >
      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>
    </a>

    <div id="queryLabel" class="results-query"></div>
    <div id="count" class="count"></div>

  </div>


  <div class="results-search">

    <form id="resultsSearchForm" role="search">

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>
      </button>

    </form>

  </div>


  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >
      Web
    </button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >
      Images
    </button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >
      News
    </button>

  </nav>


  <div class="results-layout">

    <div>
      <div id="resultList"></div>
      <div id="pager" class="pager"></div>
    </div>

    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results"
    ></aside>

  </div>

</section>

</main>


<!-- ======================================================
     ABOUT
====================================================== -->

<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle"
>

  <div class="about-card">

    <button
      id="aboutClose"
      class="about-close"
      type="button"
      aria-label="Close About"
    >
      ×
    </button>

    <h2 id="aboutTitle">About</h2>

    <p>Welcome to FlibidooSearch.</p>

    <p>
      You can edit this text directly in the HTML inside the
      <strong>about-card</strong>.
    </p>

  </div>

</div>


<script>
/* =========================================================
   CONFIG
========================================================= */

/*
 * This is YOUR Cloudflare Worker.
 *
 * It proxies:
 *   /api/search
 *   /api/dictionary
 *   /api/suggest
 */
const WORKER_BASE =
  'https://working-filibidooo.daniel-torres-a95.workers.dev';


/*
 * Separate Word-of-the-Day worker.
 */
const WOTD_WORKER =
  'https://ancient-unit-5007.daniel-torres-a95.workers.dev';


/* =========================================================
   ELEMENTS
========================================================= */

const form =
  document.querySelector('#searchForm');

const input =
  document.querySelector('#q');

const home =
  document.querySelector('#home');

const results =
  document.querySelector('#results');

const list =
  document.querySelector('#resultList');

const label =
  document.querySelector('#queryLabel');

const count =
  document.querySelector('#count');

const pager =
  document.querySelector('#pager');

const resultsForm =
  document.querySelector('#resultsSearchForm');

const resultsInput =
  document.querySelector('#resultsQ');

const dictionary =
  document.querySelector('#dictionary');

const submitButton =
  document.querySelector('#submitButton');

const resultsSubmitButton =
  document.querySelector('#resultsSubmitButton');


let currentQ = '';
let currentPage = 0;
let currentType = 'web';


/* =========================================================
   BASIC HELPERS
========================================================= */

function esc(value = ''){

  return String(value)
    .replace(/[&<>'"]/g, char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[char]));

}


function updateButtonState(button,value){

  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );

}


/*
 * Make sure external URLs are valid.
 *
 * This also handles percent-encoded URLs correctly.
 */
function safeUrl(value){

  if(!value) return '';

  try{

    const url = new URL(value);

    if(
      url.protocol !== 'http:' &&
      url.protocol !== 'https:'
    ){
      return '';
    }

    return url.href;

  }catch{

    return '';

  }

}


/*
 * Favicon fallback.
 */
function faviconFor(url,fallback=''){

  const direct =
    safeUrl(fallback);

  if(direct) return direct;

  try{

    const parsed =
      new URL(url);

    return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(parsed.hostname)}&sz=64`;

  }catch{

    return '';

  }

}


/* =========================================================
   MARKDOWN + SAFE HTML DESCRIPTION RENDERER
========================================================= */

/*
 * Supports:
 *
 * **bold**
 * *italic*
 * _italic_
 * [links](https://...)
 * `code`
 *
 * And safe HTML:
 *
 * <strong>
 * <b>
 * <em>
 * <i>
 * <u>
 * <mark>
 * <code>
 * <br>
 *
 * Dangerous tags and attributes are removed.
 */

function renderRichText(value=''){

  let text =
    String(value)
      .replace(/\r\n/g,'\n')
      .replace(/\r/g,'\n');


  /*
   * Protect existing HTML temporarily.
   */
  const placeholders = [];

  text = text.replace(
    /<(\/?)(strong|b|em|i|u|mark|code|br)\b[^>]*>/gi,
    (match,slash,tag) => {

      const token =
        `___FLIBIDOO_HTML_${placeholders.length}___`;

      placeholders.push(
        `<${slash}${tag.toLowerCase()}>`
      );

      return token;

    }
  );


  /*
   * Escape everything else.
   */
  text = esc(text);


  /*
   * Markdown links.
   */
  text = text.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (_,label,url) => {

      const href =
        safeUrl(url);

      if(!href){
        return esc(label);
      }

      return `<a href="${esc(href)}"
        target="_blank"
        rel="noopener noreferrer">${label}</a>`;

    }
  );


  /*
   * Bold.
   */
  text = text.replace(
    /\*\*(.+?)\*\*/gs,
    '<strong>$1</strong>'
  );


  /*
   * Italic.
   */
  text = text.replace(
    /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
    '<em>$1</em>'
  );


  text = text.replace(
    /(?<!_)_([^_\n]+)_(?!_)/g,
    '<em>$1</em>'
  );


  /*
   * Inline code.
   */
  text = text.replace(
    /`([^`\n]+)`/g,
    '<code>$1</code>'
  );


  /*
   * Newlines.
   */
  text = text.replace(
    /\n/g,
    '<br>'
  );


  /*
   * Restore explicitly allowed HTML.
   */
  placeholders.forEach(
    (html,index) => {

      text =
        text.replace(
          `___FLIBIDOO_HTML_${index}___`,
          html
        );

    }
  );


  return text;

}


/* =========================================================
   DICTIONARY
========================================================= */

function normalizeLanguage(entry){

  const code =
    String(
      entry?.language?.code ||
      ''
    ).toLowerCase();

  const name =
    String(
      entry?.language?.name ||
      ''
    ).toLowerCase();

  /*
   * English gets highest priority.
   */
  if(
    code === 'en' ||
    code.startsWith('en-') ||
    name === 'english' ||
    name.startsWith('english ')
  ){
    return 0;
  }

  return 1;

}


function sortDictionaryEntries(entries){

  return [...entries].sort(
    (a,b) =>
      normalizeLanguage(a) -
      normalizeLanguage(b)
  );

}


function renderDictionary(data,word){

  /*
   * Completely hide the sidebar if there
   * aren't any actual entries.
   */
  const entries =
    Array.isArray(data?.entries)
      ? data.entries
      : [];

  if(!entries.length){

    dictionary.innerHTML = '';
    dictionary.classList.add('hidden');

    return false;

  }


  const sorted =
    sortDictionaryEntries(entries);


  let html = '';

  html += `
    <h2 class="dictionary-title">
      Dictionary
    </h2>

    <div class="dictionary-word">
      ${esc(data?.word || word)}
    </div>
  `;


  sorted.forEach(entry => {

    const language =
      entry?.language?.name ||
      entry?.language?.code ||
      'Unknown language';

    const pos =
      entry?.partOfSpeech ||
      '';


    html += `
      <section class="dictionary-entry">

        <div class="dictionary-language">
          ${esc(language)}
        </div>

        ${
          pos
            ? `<div class="dictionary-pos">
                ${esc(pos)}
              </div>`
            : ''
        }
    `;


    const senses =
      Array.isArray(entry?.senses)
        ? entry.senses
        : [];


    if(senses.length){

      html += `
        <div class="dictionary-senses">
          <div class="dictionary-label">
            Definitions
          </div>
      `;


      senses.slice(0,8).forEach(
        (sense,index) => {

          const definition =
            sense?.definition ||
            '';

          if(!definition) return;


          const tags =
            Array.isArray(sense?.tags)
              ? sense.tags.join(', ')
              : '';


          html += `
            <div class="dictionary-sense">

              <div class="dictionary-definition">

                ${index + 1}.
                ${renderRichText(definition)}

                ${
                  tags
                    ? `<span class="dictionary-tags">
                        (${esc(tags)})
                      </span>`
                    : ''
                }

              </div>
          `;


          const examples =
            Array.isArray(sense?.examples)
              ? sense.examples
              : [];


          examples
            .slice(0,2)
            .forEach(example => {

              if(!example) return;

              html += `
                <div class="dictionary-example">
                  “${renderRichText(example)}”
                </div>
              `;

            });


          html += `
            </div>
          `;

        }
      );


      html += `
        </div>
      `;

    }


    /*
     * Synonyms / antonyms.
     */

    const synonyms =
      Array.isArray(entry?.synonyms)
        ? entry.synonyms
        : [];

    const antonyms =
      Array.isArray(entry?.antonyms)
        ? entry.antonyms
        : [];


    if(synonyms.length){

      html += `
        <div class="dictionary-relations">

          <div class="dictionary-label">
            Synonyms
          </div>

          <div class="dictionary-definition">
            ${esc(
              synonyms.slice(0,20).join(', ')
            )}
          </div>

        </div>
      `;

    }


    if(antonyms.length){

      html += `
        <div class="dictionary-relations">

          <div class="dictionary-label">
            Antonyms
          </div>

          <div class="dictionary-definition">
            ${esc(
              antonyms.slice(0,20).join(', ')
            )}
          </div>

        </div>
      `;

    }


    html += `
      </section>
    `;

  });


  if(data?.source?.url){

    const sourceUrl =
      safeUrl(data.source.url);

    if(sourceUrl){

      html += `
        <div class="dictionary-source">

          Source:
          <a
            href="${esc(sourceUrl)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Wiktionary
          </a>

          ·
          <a
            href="https://freedictionaryapi.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            FreeDictionaryAPI
          </a>

        </div>
      `;

    }

  }else{

    html += `
      <div class="dictionary-source">
        Powered by FreeDictionaryAPI
      </div>
    `;

  }


  dictionary.innerHTML = html;
  dictionary.classList.remove('hidden');

  return true;

}


async function loadDictionary(word){

  if(!word) return false;

  try{

    const endpoint =
      `${WORKER_BASE}/api/dictionary?word=${encodeURIComponent(word)}`;


    const response =
      await fetch(endpoint,{
        headers:{
          'Accept':'application/json'
        }
      });


    const text =
      await response.text();


    let data;

    try{

      data =
        text
          ? JSON.parse(text)
          : {};

    }catch{

      return false;

    }


    if(!response.ok){

      dictionary.innerHTML = '';
      dictionary.classList.add('hidden');

      return false;

    }


    return renderDictionary(
      data,
      word
    );

  }catch{

    dictionary.innerHTML = '';
    dictionary.classList.add('hidden');

    return false;

  }

}


/* =========================================================
   WORD OF THE DAY
========================================================= */

function isWotdQuery(query){

  const normalized =
    String(query)
      .toLowerCase()
      .replace(/[^\p{L}\p{N}\s]/gu,' ')
      .replace(/\s+/g,' ')
      .trim();


  return (
    normalized === 'wotd' ||
    normalized === 'word of the day' ||
    normalized.includes('word of the day') ||
    /\bwotd\b/.test(normalized)
  );

}


async function getWotd(){

  try{

    const response =
      await fetch(
        WOTD_WORKER,
        {
          cache:'no-store'
        }
      );


    if(!response.ok){
      return '';
    }


    const word =
      (await response.text()).trim();


    if(
      !word ||
      word.length > 100
    ){
      return '';
    }


    return word;

  }catch{

    return '';

  }

}


async function getDictionaryForWotd(query){

  const explicit =
    isWotdQuery(query);


  let wotdWord =
    explicit
      ? await getWotd()
      : '';


  /*
   * If this isn't an explicit WOTD search,
   * check whether the searched word itself
   * is today's WOTD.
   */
  if(!explicit){

    const today =
      await getWotd();


    if(
      today &&
      today.trim().toLowerCase() ===
      query.trim().toLowerCase()
    ){

      wotdWord = today;

    }

  }


  return {
    explicit,
    word:wotdWord
  };

}


async function renderWotdPanel(word){

  if(!word) return false;


  try{

    /*
     * Get the normal dictionary data for the
     * WOTD so we can display its definition/example.
     */
    const endpoint =
      `${WORKER_BASE}/api/dictionary?word=${encodeURIComponent(word)}`;


    const response =
      await fetch(endpoint,{
        headers:{
          'Accept':'application/json'
        }
      });


    if(!response.ok){
      return false;
    }


    const text =
      await response.text();


    let data;

    try{
      data =
        text
          ? JSON.parse(text)
          : {};
    }catch{
      return false;
    }


    const entries =
      Array.isArray(data?.entries)
        ? sortDictionaryEntries(data.entries)
        : [];


    if(!entries.length){
      return false;
    }


    /*
     * Prefer English entry.
     */
    const english =
      entries.find(
        entry => normalizeLanguage(entry) === 0
      ) || entries[0];


    const senses =
      Array.isArray(english?.senses)
        ? english.senses
        : [];


    const firstSense =
      senses.find(
        sense => sense?.definition
      );


    if(!firstSense){
      return false;
    }


    const definition =
      firstSense.definition;


    const examples =
      Array.isArray(firstSense.examples)
        ? firstSense.examples
        : [];


    const example =
      examples.find(Boolean) || '';


    const panel =
      document.createElement('section');

    panel.className =
      'wotd-panel';


    panel.innerHTML = `

      <div class="wotd-heading">
        <span>●</span>
        <span>Word of the Day!</span>
      </div>

      <div class="wotd-word">
        ${esc(word)}
      </div>

      <p class="wotd-definition">
        ${renderRichText(definition)}
      </p>

      ${
        example
          ? `
            <p class="wotd-example">
              “${renderRichText(example)}”
            </p>
          `
          : ''
      }

    `;


    /*
     * WOTD goes before the normal dictionary.
     */
    dictionary.prepend(panel);


    return true;

  }catch{

    return false;

  }

}


/* =========================================================
   SEARCH RESULT NORMALIZATION
========================================================= */

function getWebResults(data){

  const nested =
    data?.results?.web?.results;


  if(Array.isArray(nested)){
    return nested;
  }


  /*
   * Tiago also exposes mixed results.
   */
  if(Array.isArray(data?.results?.mixed)){
    return data.results.mixed;
  }


  return [];

}


function getImageResults(data){

  if(Array.isArray(data?.results)){
    return data.results;
  }


  return [];

}


function getNewsResults(data){

  if(Array.isArray(data?.results)){
    return data.results;
  }


  return [];

}


/* =========================================================
   RENDER
========================================================= */

async function render(data){

  home.classList.add('hidden');
  results.classList.remove('hidden');


  currentType =
    data.type || currentType;


  const query =
    data.query || currentQ;


  label.textContent =
    query
      ? `Results for “${query}”`
      : '';


  let array = [];


  if(currentType === 'web'){

    array =
      getWebResults(data);

  }else if(currentType === 'images'){

    array =
      getImageResults(data);

  }else if(currentType === 'news'){

    array =
      getNewsResults(data);

  }


  /*
   * Important:
   *
   * Dictionary is independent of search results.
   * Therefore we do NOT return early if `array`
   * is empty.
   */
  count.textContent =
    array.length
      ? `${array.length} results`
      : '';


  resultsInput.value =
    query || '';


  list.innerHTML = '';
  pager.innerHTML = '';


  document
    .querySelectorAll('.search-type')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.type === currentType
      );

    });


  if(currentType === 'images'){

    renderImages(array);

  }else if(currentType === 'news'){

    renderNews(array);

  }else{

    renderWeb(array);

  }


  /*
   * Dictionary always gets its own attempt.
   */
  dictionary.innerHTML = '';
  dictionary.classList.add('hidden');


  const wotdInfo =
    await getDictionaryForWotd(query);


  if(wotdInfo.word){

    await renderWotdPanel(
      wotdInfo.word
    );

  }


  /*
   * If this was an explicit WOTD query,
   * the sidebar should focus on the WOTD and
   * not display a second normal dictionary for
   * the literal phrase "wotd".
   */
  if(!wotdInfo.explicit){

    await loadDictionary(query);

  }else{

    /*
     * Keep the WOTD panel visible if it exists.
     */
    if(!dictionary.querySelector('.wotd-panel')){

      dictionary.classList.add('hidden');

    }

  }


  /*
   * Pagination.
   */
  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const previous =
      document.createElement('button');

    previous.textContent =
      'Previous';

    previous.onclick =
      () =>
        search(
          currentQ,
          currentPage - 1,
          currentType
        );

    pager.appendChild(previous);

  }


  if(more){

    const next =
      document.createElement('button');

    next.textContent =
      'Next';

    next.onclick =
      () =>
        search(
          currentQ,
          currentPage + 1,
          currentType
        );

    pager.appendChild(next);

  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(query)}&type=${encodeURIComponent(currentType)}${currentPage ? `&page=${currentPage}` : ''}`
  );

}


/* =========================================================
   WEB RENDERER
========================================================= */

function renderWeb(array){

  if(!array.length){

    list.innerHTML =
      '<div class="empty">No web results found.</div>';

    return;

  }


  array.forEach(result => {

    const article =
      document.createElement('article');

    article.className =
      'result';


    const url =
      safeUrl(result?.url || '');


    const hostname =
      result?.meta_url?.hostname ||
      (() => {

        try{
          return new URL(url).hostname;
        }catch{
          return '';
        }

      })();


    const favicon =
      faviconFor(
        url,
        result?.meta_url?.favicon
      );


    /*
     * Tiago gives thumbnail as:
     *
     * thumbnail: { src: "..." }
     */
    const thumbnail =
      safeUrl(
        result?.thumbnail?.src ||
        result?.thumbnail ||
        ''
      );


    const title =
      result?.title ||
      url ||
      'Untitled result';


    const description =
      result?.description ||
      result?.content ||
      '';


    const age =
      result?.age ||
      result?.publishedDate ||
      '';


    const image =
      thumbnail ||
      favicon;


    article.innerHTML = `

      <div class="result-row">

        <div class="result-main">

          <div class="result-top">

            ${
              favicon
                ? `
                  <img
                    class="result-favicon"
                    src="${esc(favicon)}"
                    alt=""
                    loading="lazy"
                    referrerpolicy="no-referrer"
                  >
                `
                : ''
            }

            <div class="result-url">
              ${esc(hostname || url)}
            </div>

          </div>


          <h2>

            ${
              url
                ? `
                  <a
                    href="${esc(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${esc(title)}
                  </a>
                `
                : esc(title)
            }

          </h2>


          ${
            description
              ? `
                <p class="snippet">
                  ${renderRichText(description)}
                </p>
              `
              : ''
          }


          ${
            age
              ? `
                <div class="result-meta">
                  ${esc(age)}
                </div>
              `
              : ''
          }

        </div>


        ${
          image
            ? `
              <a
                href="${esc(url || image)}"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="${esc(title)}"
              >
                <img
                  class="result-thumb"
                  src="${esc(image)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                  onerror="this.onerror=null;this.src='${esc(favicon)}';"
                >
              </a>
            `
            : ''
        }

      </div>

    `;


    list.appendChild(article);

  });

}


/* =========================================================
   IMAGE RENDERER
========================================================= */

function renderImages(array){

  if(!array.length){

    list.innerHTML =
      '<div class="empty">No images found.</div>';

    return;

  }


  const grid =
    document.createElement('div');

  grid.className =
    'image-grid';


  array.forEach(result => {

    const url =
      safeUrl(
        result?.url ||
        result?.properties?.url ||
        ''
      );


    const image =
      safeUrl(
        result?.thumbnail ||
        result?.properties?.url ||
        ''
      );


    if(!image) return;


    const title =
      result?.title ||
      url ||
      'Image';


    const source =
      result?.source ||
      result?.meta_url?.hostname ||
      '';


    const favicon =
      faviconFor(
        url,
        result?.meta_url?.favicon
      );


    const article =
      document.createElement('article');

    article.className =
      'image-result';


    article.innerHTML = `

      <a
        href="${esc(url || image)}"
        target="_blank"
        rel="noopener noreferrer"
      >

        <img
          src="${esc(image)}"
          alt="${esc(title)}"
          loading="lazy"
          referrerpolicy="no-referrer"
        >

      </a>


      <div class="image-result-title">
        ${esc(title)}
      </div>


      <div class="image-result-source">

        ${
          favicon
            ? `
              <img
                src="${esc(favicon)}"
                alt=""
                loading="lazy"
              >
            `
            : ''
        }

        ${esc(source)}

      </div>

    `;


    grid.appendChild(article);

  });


  if(grid.children.length){

    list.appendChild(grid);

  }else{

    list.innerHTML =
      '<div class="empty">No images found.</div>';

  }

}

/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page=0,
  type=currentType
){

  q =
    String(q || '').trim();


  if(!q) return;


  currentQ =
    q;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    type;


  document.title =
    `${q} - FlibidooSearch`;


  input.value =
    q;

  resultsInput.value =
    q;


  home.classList.add('hidden');
  results.classList.remove('hidden');


  list.innerHTML =
    '<div class="empty">Searching…</div>';


  count.textContent =
    '';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML =
    '';


  /*
   * Clear dictionary while loading,
   * but it will be independently restored.
   */
  dictionary.innerHTML =
    '';

  dictionary.classList.add(
    'hidden'
  );


  try{

    /*
     * IMPORTANT:
     *
     * Your Worker exposes /api/search,
     * not /api.
     *
     * The Worker then calls Tiago's POST /api.
     */
    const endpoint =
      `${WORKER_BASE}/api/search?q=${encodeURIComponent(q)}&type=${encodeURIComponent(type)}&page=${currentPage}`;


    const response =
      await fetch(
        endpoint,
        {
          headers:{
            'Accept':'application/json'
          }
        }
      );


    const body =
      await response.text();


    let data;

    try{

      data =
        body
          ? JSON.parse(body)
          : {};

    }catch{

      throw new Error(
        `Search endpoint returned invalid JSON (${response.status}).`
      );

    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        `Search endpoint returned ${response.status}.`
      );

    }


    /*
     * Make sure the requested frontend type
     * survives the Worker response.
     */
    data.type =
      type;


    await render(data);


  }catch(error){

    /*
     * Dictionary should STILL be attempted even
     * when Tiago/search itself fails.
     */
    dictionary.innerHTML =
      '';

    dictionary.classList.add(
      'hidden'
    );


    const wotdInfo =
      await getDictionaryForWotd(q);


    if(wotdInfo.word){

      await renderWotdPanel(
        wotdInfo.word
      );

    }


    if(!wotdInfo.explicit){

      await loadDictionary(q);

    }


    list.innerHTML = `

      <div class="error">

        ${esc(
          error?.message ||
          'Search failed. Please try again.'
        )}

      </div>

    `;

  }

}


/* =========================================================
   EVENTS
========================================================= */

function updateHomeButton(){

  updateButtonState(
    submitButton,
    input.value
  );

}


function updateResultsButton(){

  updateButtonState(
    resultsSubmitButton,
    resultsInput.value
  );

}


input.addEventListener(
  'input',
  updateHomeButton
);


resultsInput.addEventListener(
  'input',
  updateResultsButton
);


form.addEventListener(
  'submit',
  event => {

    event.preventDefault();


    const q =
      input.value.trim();


    if(!q) return;


    /*
     * URL is percent encoded.
     */
    location.href =
      `/?q=${encodeURIComponent(q)}&type=web&page=0`;

  }
);


resultsForm.addEventListener(
  'submit',
  event => {

    event.preventDefault();


    const q =
      resultsInput.value.trim();


    if(!q) return;


    search(
      q,
      0,
      currentType
    );

  }
);


/*
 * Category switching.
 *
 * No Maps button exists anymore.
 */
document
  .querySelectorAll('.search-type')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        const q =
          resultsInput.value.trim() ||
          currentQ;


        if(!q) return;


        search(
          q,
          0,
          button.dataset.type
        );

      }
    );

  });


/* =========================================================
   ABOUT
========================================================= */

const aboutOverlay =
  document.querySelector('#aboutOverlay');


document
  .querySelector('#aboutButton')
  .onclick =
    () =>
      aboutOverlay.classList.remove(
        'hidden'
      );


document
  .querySelector('#aboutClose')
  .onclick =
    () =>
      aboutOverlay.classList.add(
        'hidden'
      );


aboutOverlay.addEventListener(
  'click',
  event => {

    if(
      event.target ===
      aboutOverlay
    ){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


document.addEventListener(
  'keydown',
  event => {

    if(event.key === 'Escape'){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


/* =========================================================
   INITIAL PAGE LOAD
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );


const initialQuery =
  params.get('q');


const allowedTypes =
  ['web','images','news'];


const initialType =
  allowedTypes.includes(
    params.get('type')
  )
    ? params.get('type')
    : 'web';


if(initialQuery){

  search(
    initialQuery,
    Number(
      params.get('page') || 0
    ),
    initialType
  );

}


/* Initial button states */

updateHomeButton();
updateResultsButton();

</script>
