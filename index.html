<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#1d0c22">

<title>FlibidooSearch</title>

<link
  rel="icon"
  href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
>

<style>

:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
}

*{
  box-sizing:border-box
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden
}

a{
  color:inherit
}

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px
}


/* =========================================================
   HOME
========================================================= */

#home.home{
  width:100%;
  height:100vh;
  min-height:100vh;
  margin:0;
  padding:24px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  overflow:hidden
}

.home-inner{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center
}

.hero-logo{
  width:min(310px,72vw);
  height:auto;
  display:block;
  margin:0 auto 18px;
  object-fit:contain;

  /*
    Soft fade around the logo edges.
  */
  -webkit-mask-image:
    radial-gradient(
      ellipse at center,
      #000 67%,
      rgba(0,0,0,.92) 77%,
      transparent 100%
    );

  mask-image:
    radial-gradient(
      ellipse at center,
      #000 67%,
      rgba(0,0,0,.92) 77%,
      transparent 100%
    )
}

h1{
  font-size:clamp(38px,5vw,58px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500;
  text-align:center
}

.search-wrap{
  width:min(100%,680px);
  display:flex;
  flex-direction:column;
  align-items:center
}


/* =========================================================
   SEARCH BOX
========================================================= */

form{
  display:flex;
  align-items:center;

  height:54px;

  border:1px solid var(--line);
  border-radius:28px;

  background:transparent;

  transition:
    border-color .15s ease,
    box-shadow .15s ease
}

form:focus-within{
  border-color:var(--focus);

  box-shadow:
    0 0 0 2px rgba(205,184,209,.08)
}

input{
  min-width:0;
  flex:1;

  border:0;
  outline:0;

  background:transparent;
  color:var(--text);

  font-size:16px;

  padding:0 14px
}

input::placeholder{
  color:#9e8da1
}


/* =========================================================
   ARROW BUTTON
========================================================= */

.submit{
  height:38px;
  width:38px;

  margin-right:8px;

  border:1px solid var(--line);

  background:transparent;
  color:#766679;

  border-radius:50%;

  padding:8px;

  display:grid;
  place-items:center;

  cursor:pointer
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus)
}

.submit:hover{
  border-color:var(--focus)
}

.submit-icon{
  width:100%;
  height:100%;
  display:block;

  fill:currentColor
}


/* =========================================================
   HOME LINKS
========================================================= */

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;

  gap:18px;

  margin-top:20px;

  color:var(--muted);
  font-size:13px
}

.links button{
  border:0;
  background:none;

  color:inherit;

  cursor:pointer;
  padding:0
}

.links button:hover{
  color:var(--text)
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  color:var(--muted);

  font-size:12px;
  line-height:1.4;

  text-align:center
}

.confederacy-credit img{
  width:20px;
  height:20px;

  display:block;

  object-fit:contain;

  flex:0 0 20px;

  border-radius:5px
}


/* =========================================================
   RESULTS
========================================================= */

main{
  flex:1
}

.results{
  padding:30px 12px 70px
}

.results-head{
  display:flex;
  align-items:center;

  gap:18px;

  min-height:44px;

  border-bottom:1px solid var(--line2);

  padding-bottom:14px;
  margin-bottom:14px
}

.results-brand{
  display:inline-flex;
  align-items:center;

  gap:8px;

  text-decoration:none;

  color:inherit;

  white-space:nowrap
}

.results-brand img{
  width:30px;
  height:30px;

  object-fit:contain;

  display:block
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em
}

.results-query{
  font-size:14px;
  color:var(--muted);

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  flex:1
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap
}


/* =========================================================
   RESULTS SEARCH
========================================================= */

.results-search{
  width:min(100%,680px);
  margin:0 0 28px
}

.results-search form{
  height:48px
}

.results-search .submit{
  width:34px;
  height:34px;

  margin-right:6px
}


/* =========================================================
   SEARCH TYPES
========================================================= */

.search-types{
  display:flex;
  align-items:flex-end;

  gap:0;

  margin:8px 0 18px;

  border-bottom:
    1px solid rgba(255,255,255,.12);

  height:36px
}

.search-type{
  position:relative;

  appearance:none;

  border:0;

  background:transparent;

  color:rgba(255,255,255,.62);

  font:inherit;

  font-size:13px;
  line-height:20px;

  padding:0 12px 10px;

  margin:0;

  border-radius:0;

  cursor:pointer
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent
}

.search-type.active::after{
  content:"";

  position:absolute;

  left:10px;
  right:10px;

  bottom:-1px;

  height:2px;

  border-radius:
    2px 2px 0 0;

  background:currentColor
}


/* =========================================================
   LAYOUT
========================================================= */

.results-layout{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    330px;

  gap:42px;

  align-items:start
}


/* =========================================================
   WEB RESULT
========================================================= */

.result{
  position:relative;

  padding:0 0 26px;

  margin-bottom:26px;

  border-bottom:
    1px solid var(--line2)
}

.result-url{
  display:flex;
  align-items:center;

  gap:7px;

  min-width:0;

  font-size:13px;

  color:var(--url);

  margin-bottom:6px
}

.result-favicon{
  width:16px;
  height:16px;

  flex:0 0 16px;

  object-fit:contain;

  border-radius:3px
}

.result-url-text{
  overflow:hidden;

  text-overflow:ellipsis;
  white-space:nowrap
}

.result h2{
  font-size:20px;

  line-height:1.25;

  margin:0 0 7px;

  font-weight:500;

  letter-spacing:-.02em
}

.result h2 a{
  text-decoration:none
}

.result h2 a:hover{
  text-decoration:underline
}

.snippet{
  font-size:14px;

  line-height:1.6;

  color:var(--result);

  margin:0;

  max-width:760px
}

.snippet strong,
.snippet b{
  font-weight:700
}

.snippet em,
.snippet i{
  font-style:italic
}

.snippet mark{
  background:rgba(255,255,255,.12);
  color:inherit;
  padding:0 2px;
  border-radius:2px
}

.result-meta{
  font-size:12px;

  color:var(--muted);

  margin-top:7px
}


/* =========================================================
   THUMBNAIL
========================================================= */

.result-thumb{
  display:block;

  width:120px;
  height:80px;

  object-fit:cover;

  border:1px solid var(--line2);

  border-radius:6px;

  margin-top:12px;

  background:
    rgba(255,255,255,.03)
}


/* =========================================================
   IMAGES
========================================================= */

.image-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:28px 22px
}

.image-result{
  min-width:0;
  position:relative
}

.image-result a{
  display:block;
  text-decoration:none
}

.image-result img{
  display:block;

  width:100%;

  aspect-ratio:4/3;

  object-fit:cover;

  border:1px solid var(--line2);

  background:
    rgba(255,255,255,.02)
}

.image-result-title{
  font-size:14px;

  line-height:1.4;

  margin-top:9px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis
}

.image-result-source{
  font-size:12px;

  color:var(--muted);

  margin-top:4px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis
}


/* =========================================================
   DICTIONARY
========================================================= */

.dictionary{
  border-left:
    1px solid var(--line2);

  padding-left:28px;

  max-height:70vh;

  overflow-y:auto;

  overscroll-behavior:contain;

  scrollbar-width:thin
}

.dictionary-title{
  font-size:22px;

  font-weight:500;

  letter-spacing:-.02em;

  margin:0 0 5px
}

.dictionary-word{
  font-size:13px;

  color:var(--muted);

  margin-bottom:22px
}

.dictionary-entry{
  padding:0 0 24px;

  margin-bottom:24px;

  border-bottom:
    1px solid var(--line2)
}

.dictionary-language,
.dictionary-label{
  font-size:12px;

  color:var(--muted)
}

.dictionary-language{
  margin-bottom:8px
}

.dictionary-pos{
  font-size:15px;

  margin-bottom:12px
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px
}

.dictionary-label{
  text-transform:uppercase;

  letter-spacing:.05em;

  margin-bottom:7px
}

.dictionary-list{
  margin:0;

  padding-left:18px
}

.dictionary-list li{
  margin:0 0 7px
}

.dictionary-sense{
  margin:0 0 15px
}

.dictionary-definition{
  font-size:14px;

  line-height:1.55
}

.dictionary-tags{
  font-size:12px;

  color:var(--muted);

  margin-left:5px
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;

  line-height:1.5;

  color:var(--result);

  margin:7px 0 0 14px
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;

  line-height:1.5;

  color:var(--muted)
}


/* =========================================================
   WORD OF THE DAY
========================================================= */

.wotd-panel{
  padding:0 0 22px;

  margin:0 0 22px;

  border-bottom:
    1px solid var(--line2)
}

.wotd-heading{
  display:flex;
  align-items:center;

  gap:8px;

  margin:0 0 8px;

  color:#ffb52e;

  font-size:13px;

  font-weight:600
}

.wotd-word{
  color:#fff;

  font-size:21px;

  font-weight:600;

  line-height:1.25;

  margin:0 0 6px
}

.wotd-definition{
  color:#ffe9a8;

  font-size:13px;

  line-height:1.55;

  margin:0
}

.wotd-example{
  color:#cdbb8a;

  font-size:12px;

  line-height:1.5;

  margin:7px 0 0
}

.wotd-status{
  color:var(--muted);

  font-size:13px;

  line-height:1.5
}


/* =========================================================
   EMPTY / ERROR
========================================================= */

.empty{
  padding:70px 0;

  color:var(--muted);

  text-align:center
}

.error{
  min-height:120px;

  max-width:680px;

  margin:0;

  padding:28px 18px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  border:1px solid var(--line2);

  color:var(--muted);

  font-size:14px;

  line-height:1.5
}

.pager{
  display:flex;

  gap:8px;

  padding-top:10px
}

.pager button{
  border:1px solid var(--line);

  background:transparent;

  color:var(--text);

  border-radius:4px;

  padding:8px 12px;

  cursor:pointer
}

.hidden{
  display:none!important
}


/* =========================================================
   ABOUT
========================================================= */

.about-overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.62);

  display:grid;

  place-items:center;

  padding:24px;

  z-index:10000
}

.about-overlay.hidden{
  display:none
}

.about-card{
  position:relative;

  width:min(100%,560px);

  max-height:min(80vh,700px);

  overflow:auto;

  background:#24132a;

  border:1px solid var(--line);

  border-radius:14px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.45);

  padding:30px
}

.about-close{
  position:absolute;

  top:10px;
  right:10px;

  width:34px;
  height:34px;

  border:0;

  border-radius:50%;

  background:transparent;

  color:var(--muted);

  font-size:24px;

  line-height:1;

  cursor:pointer
}

.about-close:hover{
  background:
    rgba(255,255,255,.08);

  color:var(--text)
}

.about-card h2{
  margin:0 38px 16px 0;

  font-size:25px;

  font-weight:500
}

.about-card p{
  color:var(--result);

  line-height:1.7;

  font-size:14px
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr
  }

  .dictionary{
    order:-1;

    border-left:0;

    border-bottom:
      1px solid var(--line2);

    border-top:0;

    padding:0 0 26px;

    margin-bottom:26px;

    max-height:none
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:22px 14px
  }
}

@media(max-width:640px){

  .shell{
    width:100%;

    padding-left:16px;
    padding-right:16px
  }

  #home.home{
    padding:20px 16px
  }

  .hero-logo{
    width:220px
  }

  h1{
    font-size:38px;

    margin-bottom:24px
  }

  form{
    height:50px
  }

  .results{
    padding:22px 16px 60px
  }

  .results-head{
    gap:12px
  }

  .results-brand img{
    width:24px;
    height:24px
  }

  .results-brand span{
    font-size:14px
  }

  .results-query{
    font-size:13px
  }

  .search-types{
    overflow-x:auto;

    scrollbar-width:none
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;

    font-size:12px
  }

  .about-overlay{
    padding:16px
  }

  .about-card{
    padding:26px 22px
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr
  }

  .result-thumb{
    width:100px;
    height:70px
  }
}

</style>
</head>

<body>

<main>

<!-- ======================================================
     HOME
====================================================== -->

<section id="home" class="home shell">

  <div class="search-wrap">

    <div class="home-inner">

      <img
        class="hero-logo"
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt="Flibidoo"
      >

      <h1>
        <em><strong>Flibidoo</strong></em>Search
      </h1>

    </div>


    <form
      id="searchForm"
      role="search"
    >

      <input
        id="q"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="submitButton"
        type="submit"
        aria-label="Search"
      >

        <svg
          class="submit-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>

      </button>

    </form>


    <div class="links">

      <button
        type="button"
        id="aboutButton"
      >
        About
      </button>

      <span class="confederacy-credit">

        with love from The Great Confederacy of E

        <img
          src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
          alt=""
          aria-hidden="true"
        >

      </span>

    </div>

  </div>

</section>


<!-- ======================================================
     RESULTS
====================================================== -->

<section
  id="results"
  class="results shell hidden"
>

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >

      <img
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt=""
      >

      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>

    </a>

    <div
      id="queryLabel"
      class="results-query"
    ></div>

    <div
      id="count"
      class="count"
    ></div>

  </div>


  <div class="results-search">

    <form
      id="resultsSearchForm"
      role="search"
    >

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >

        <svg
          class="submit-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>

      </button>

    </form>

  </div>


  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >
      Web
    </button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >
      Images
    </button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >
      News
    </button>

  </nav>


  <div class="results-layout">

    <div>

      <div id="resultList"></div>

      <div
        id="pager"
        class="pager"
      ></div>

    </div>


    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results"
    ></aside>

  </div>

</section>

</main>


<!-- ======================================================
     ABOUT
====================================================== -->

<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle"
>

  <div class="about-card">

    <button
      id="aboutClose"
      class="about-close"
      type="button"
      aria-label="Close About"
    >
      ×
    </button>

    <h2 id="aboutTitle">
      About
    </h2>

    <p>
      Welcome to FlibidooSearch.
    </p>

    <p>
      You can edit this text directly in the HTML
      inside the <strong>about-card</strong>.
    </p>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WORKER =
  'https://working-filibidooo.daniel-torres-a95.workers.dev';


/* =========================================================
   ELEMENTS
========================================================= */

const form =
  document.querySelector('#searchForm');

const input =
  document.querySelector('#q');

const home =
  document.querySelector('#home');

const results =
  document.querySelector('#results');

const list =
  document.querySelector('#resultList');

const label =
  document.querySelector('#queryLabel');

const count =
  document.querySelector('#count');

const pager =
  document.querySelector('#pager');

const resultsForm =
  document.querySelector('#resultsSearchForm');

const resultsInput =
  document.querySelector('#resultsQ');

const dictionary =
  document.querySelector('#dictionary');

let currentQ = '';
let currentPage = 0;
let currentType = 'web';

let currentWotd = null;


/* =========================================================
   HTML ESCAPE
========================================================= */

function esc(value = ''){

  return String(value).replace(
    /[&<>'"]/g,

    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[char])
  );

}


/* =========================================================
   URL SAFETY
========================================================= */

function safeUrl(value){

  if(!value) return '';

  try{

    const url =
      new URL(String(value));

    if(
      url.protocol === 'http:' ||
      url.protocol === 'https:'
    ){
      return url.href;
    }

  }catch{}

  return '';

}


/* =========================================================
   MARKDOWN + SAFE HTML
=========================================================

   Tiago descriptions are converted into a small,
   deliberately restricted formatting subset.

========================================================= */

function formatDescription(value = ''){

  let text = String(value);

  /*
    Escape everything first.
  */
  text = esc(text);

  /*
    Markdown links:
    [text](https://example.com)
  */

  text = text.replace(
    /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,

    (_, label, url) => {

      const safe =
        safeUrl(url);

      if(!safe) {
        return label;
      }

      return `<a
        href="${esc(safe)}"
        target="_blank"
        rel="noopener noreferrer"
      >${label}</a>`;
    }
  );


  /*
    Basic Markdown emphasis.
  */

  text = text.replace(
    /\*\*([^*]+)\*\*/g,
    '<strong>$1</strong>'
  );

  text = text.replace(
    /__([^_]+)__/g,
    '<strong>$1</strong>'
  );

  text = text.replace(
    /(^|[^\*])\*([^*\n]+)\*(?!\*)/g,
    '$1<em>$2</em>'
  );

  text = text.replace(
    /(^|[^_])_([^_\n]+)_(?!_)/g,
    '$1<em>$2</em>'
  );


  /*
    The search provider can contain actual HTML-ish
    formatting. Convert only the harmless text tags
    we explicitly support.
  */

  text = text.replace(
    /&lt;(strong|b)&gt;([\s\S]*?)&lt;\/\1&gt;/gi,
    '<strong>$2</strong>'
  );

  text = text.replace(
    /&lt;(em|i)&gt;([\s\S]*?)&lt;\/\1&gt;/gi,
    '<em>$2</em>'
  );

  text = text.replace(
    /&lt;mark&gt;([\s\S]*?)&lt;\/mark&gt;/gi,
    '<mark>$1</mark>'
  );


  /*
    Newlines.
  */

  text = text.replace(
    /\n/g,
    '<br>'
  );

  return text;
}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtonState(
  button,
  value
){

  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );

}


/* =========================================================
   FETCH JSON
========================================================= */

async function getJSON(url){

  const response =
    await fetch(url, {
      headers:{
        Accept:'application/json'
      }
    });

  const text =
    await response.text();

  let data;

  try{

    data =
      text ? JSON.parse(text) : {};

  }catch{

    throw new Error(
      `Server returned invalid JSON (${response.status}).`
    );

  }

  if(!response.ok){

    throw new Error(
      data?.error ||
      `Request failed (${response.status}).`
    );

  }

  return data;
}


/* =========================================================
   WOTD
========================================================= */

async function getWotd(){

  try{

    const data =
      await getJSON(
        `${WORKER}/api/wotd`
      );

    const word =
      String(data?.word || '').trim();

    return word || null;

  }catch{

    return null;

  }
}


/* =========================================================
   WOTD QUERY DETECTION
========================================================= */

function isWotdQuery(query){

  const normalized =
    query
      .toLowerCase()
      .replace(/[^\w\s]/g,' ')
      .replace(/\s+/g,' ')
      .trim();

  return (
    normalized === 'wotd' ||
    normalized === 'word of the day' ||
    normalized.includes('word of the day') ||
    normalized.includes('wotd')
  );
}


/* =========================================================
   DICTIONARY
========================================================= */

async function loadDictionary(query){

  dictionary.classList.add('hidden');
  dictionary.innerHTML = '';

  /*
    WOTD special query:
    don't try to look up "word of the day".
    First obtain the actual word.
  */

  let lookupWord =
    query.trim();

  const specialWotd =
    isWotdQuery(query);

  let wotdWord = null;

  if(specialWotd){

    wotdWord =
      await getWotd();

    if(!wotdWord){
      return;
    }

    lookupWord =
      wotdWord;
  }


  /*
    If this is an ordinary query, check whether
    the query itself is today's WOTD.
  */

  if(!specialWotd){

    /*
      Only try WOTD matching for something that
      looks like a single word.
    */

    if(
      /^[A-Za-zÀ-ÿ'-]+$/.test(query.trim())
    ){

      const todaysWord =
        await getWotd();

      if(
        todaysWord &&
        todaysWord.toLowerCase() ===
        query.trim().toLowerCase()
      ){

        wotdWord =
          todaysWord;

      }

    }

  }


  try{

    const data =
      await getJSON(
        `${WORKER}/api/dictionary?word=${encodeURIComponent(lookupWord)}`
      );

    let entries =
      Array.isArray(data?.entries)
        ? data.entries
        : [];


    /*
      No entries = completely hide sidebar.
    */

    if(!entries.length){

      dictionary.innerHTML = '';

      dictionary.classList.add(
        'hidden'
      );

      return;

    }


    /*
      Explicitly prioritize English.

      Worker already does this, but doing it here too
      keeps the UI correct if the response changes.
    */

    entries =
      [...entries].sort(
        (a,b) =>
          languageRank(a) -
          languageRank(b)
      );


    let html = '';


    /*
      WOTD panel.
    */

    if(wotdWord){

      const englishEntry =
        entries.find(
          e => isEnglishEntry(e)
        );

      const firstSense =
        englishEntry?.senses?.find(
          s => s?.definition
        );

      const definition =
        firstSense?.definition ||
        '';

      const example =
        firstSense?.examples?.find(Boolean) ||
        '';

      html += `
        <section class="wotd-panel">

          <div class="wotd-heading">
            Word of the Day!
          </div>

          <div class="wotd-word">
            ${esc(wotdWord)}
          </div>

          ${
            definition
              ? `
                <p class="wotd-definition">
                  ${formatDescription(definition)}
                </p>
              `
              : ''
          }

          ${
            example
              ? `
                <p class="wotd-example">
                  “${esc(example)}”
                </p>
              `
              : ''
          }

        </section>
      `;

    }


    /*
      Normal dictionary heading.
    */

    html += `
      <h2 class="dictionary-title">
        Dictionary
      </h2>

      <div class="dictionary-word">
        ${esc(data?.word || lookupWord)}
      </div>
    `;


    /*
      Entries.
    */

    for(const entry of entries){

      const language =
        getLanguageName(entry);

      const pos =
        entry?.partOfSpeech ||
        '';

      html += `
        <article class="dictionary-entry">

          ${
            language
              ? `
                <div class="dictionary-language">
                  ${esc(language)}
                </div>
              `
              : ''
          }

          ${
            pos
              ? `
                <div class="dictionary-pos">
                  ${esc(pos)}
                </div>
              `
              : ''
          }
      `;


      /*
        Senses.
      */

      const senses =
        Array.isArray(entry?.senses)
          ? entry.senses
          : [];


      if(senses.length){

        html += `
          <div class="dictionary-senses">

            <div class="dictionary-label">
              Definitions
            </div>
        `;


        senses
          .filter(
            sense => sense?.definition
          )
          .slice(0,8)
          .forEach(
            (sense,index) => {

              const tags =
                Array.isArray(sense.tags)
                  ? sense.tags
                  : [];

              html += `
                <div class="dictionary-sense">

                  <div class="dictionary-definition">

                    <strong>
                      ${index + 1}.
                    </strong>

                    ${formatDescription(
                      sense.definition
                    )}

                    ${
                      tags.length
                        ? `
                          <span class="dictionary-tags">
                            (${esc(tags.join(', '))})
                          </span>
                        `
                        : ''
                    }

                  </div>
              `;


              const examples =
                Array.isArray(sense.examples)
                  ? sense.examples
                  : [];


              if(examples.length){

                html += `
                  <div class="dictionary-example">
                    “${esc(examples[0])}”
                  </div>
                `;

              }


              html += `</div>`;

            }
          );


        html += `
          </div>
        `;

      }


      /*
        Synonyms / antonyms.
      */

      if(
        Array.isArray(entry.synonyms) &&
        entry.synonyms.length
      ){

        html += `
          <div class="dictionary-relations">

            <div class="dictionary-label">
              Synonyms
            </div>

            <div class="dictionary-definition">
              ${esc(
                entry.synonyms
                  .slice(0,12)
                  .join(', ')
              )}
            </div>

          </div>
        `;

      }


      if(
        Array.isArray(entry.antonyms) &&
        entry.antonyms.length
      ){

        html += `
          <div class="dictionary-relations">

            <div class="dictionary-label">
              Antonyms
            </div>

            <div class="dictionary-definition">
              ${esc(
                entry.antonyms
                  .slice(0,12)
                  .join(', ')
              )}
            </div>

          </div>
        `;

      }


      /*
        Translations.
      */

      const translations =
        [];

      for(
        const sense of senses
      ){

        if(
          Array.isArray(
            sense?.translations
          )
        ){

          translations.push(
            ...sense.translations
          );

        }

      }


      if(translations.length){

        html += `
          <div class="dictionary-translations">

            <div class="dictionary-label">
              Translations
            </div>

            <ul class="dictionary-list">
        `;

        translations
          .slice(0,15)
          .forEach(
            translation => {

              const lang =
                typeof translation.language === 'object'
                  ? translation.language?.name ||
                    translation.language?.code ||
                    ''
                  : translation.language || '';

              html += `
                <li>
                  ${esc(
                    `${lang}: ${translation.word || ''}`
                  )}
                </li>
              `;

            }
          );

        html += `
            </ul>

          </div>
        `;

      }


      html += `
        </article>
      `;

    }


    /*
      Attribution required by FreeDictionaryAPI.
      Their site says applications should visibly
      attribute the API and link back to Wiktionary
      when available. 
    */

    if(data?.source?.url){

      html += `
        <div class="dictionary-source">
          Source:
          <a
            href="${esc(
              safeUrl(data.source.url)
            )}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Wiktionary
          </a>
          · FreeDictionaryAPI
        </div>
      `;

    }else{

      html += `
        <div class="dictionary-source">
          FreeDictionaryAPI · Wiktionary data
        </div>
      `;

    }


    dictionary.innerHTML =
      html;

    dictionary.classList.remove(
      'hidden'
    );

  }catch{

    /*
      Dictionary failure should NEVER break
      the web search results.
    */

    dictionary.innerHTML = '';

    dictionary.classList.add(
      'hidden'
    );

  }

}


/* =========================================================
   DICTIONARY HELPERS
========================================================= */

function getLanguageCode(entry){

  if(
    typeof entry?.language === 'object'
  ){

    return String(
      entry.language?.code || ''
    ).toLowerCase();

  }

  return String(
    entry?.language || ''
  ).toLowerCase();
}


function getLanguageName(entry){

  if(
    typeof entry?.language === 'object'
  ){

    return (
      entry.language?.name ||
      entry.language?.code ||
      ''
    );

  }

  return entry?.language || '';
}


function isEnglishEntry(entry){

  const code =
    getLanguageCode(entry);

  const name =
    getLanguageName(entry)
      .toLowerCase();

  return (
    code === 'en' ||
    name === 'english'
  );

}


function languageRank(entry){

  return isEnglishEntry(entry)
    ? 0
    : 1;
}


/* =========================================================
   WEB RESULT RENDERING
========================================================= */

function renderWebResult(r){

  const url =
    safeUrl(r?.url || '');

  const host =
    r?.meta_url?.hostname ||
    (
      url
        ? new URL(url).hostname
        : ''
    );

  const favicon =
    safeUrl(
      r?.meta_url?.favicon ||
      ''
    );

  const title =
    r?.title ||
    url ||
    'Untitled result';

  const description =
    r?.description ||
    r?.content ||
    '';

  const age =
    r?.age ||
    r?.publishedDate ||
    '';

  /*
    Tiago documents thumbnail.src for web results.
  */

  const thumbnail =
    safeUrl(
      r?.thumbnail?.src ||
      r?.thumbnail ||
      ''
    );


  /*
    Fallback to favicon if no thumbnail exists.
  */

  const visual =
    thumbnail ||
    favicon;


  return `
    <article class="result">

      <div class="result-url">

        ${
          favicon
            ? `
              <img
                class="result-favicon"
                src="${esc(favicon)}"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
              >
            `
            : ''
        }

        <span class="result-url-text">
          ${esc(host || url)}
        </span>

      </div>


      <h2>

        <a
          href="${esc(url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${esc(title)}
        </a>

      </h2>


      ${
        description
          ? `
            <p class="snippet">
              ${formatDescription(description)}
            </p>
          `
          : ''
      }


      ${
        visual
          ? `
            <a
              href="${esc(url)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                class="result-thumb"
                src="${esc(visual)}"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
              >
            </a>
          `
          : ''
      }


      ${
        age
          ? `
            <div class="result-meta">
              ${esc(age)}
            </div>
          `
          : ''
      }

    </article>
  `;
}


/* =========================================================
   RENDER SEARCH
========================================================= */

function render(data){

  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );


  currentType =
    data.type ||
    currentType;


  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';


  let a = [];


  if(currentType === 'web'){

    a =
      Array.isArray(data.results)
        ? data.results
        : [];

  }


  if(
    currentType === 'images' ||
    currentType === 'news'
  ){

    a =
      Array.isArray(data.results)
        ? data.results
        : [];

  }


  count.textContent =
    a.length
      ? `${a.length} results`
      : '';


  resultsInput.value =
    data.query || '';


  list.innerHTML = '';

  pager.innerHTML = '';


  document
    .querySelectorAll('.search-type')
    .forEach(
      button =>
        button.classList.toggle(
          'active',
          button.dataset.type ===
          currentType
        )
    );


  /*
    IMPORTANT:

    Do NOT return early here.

    Dictionary is loaded independently,
    so it remains visible even when there
    are zero search results.
  */

  if(!a.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

  }else{


    if(currentType === 'web'){

      a.forEach(
        result => {

          list.insertAdjacentHTML(
            'beforeend',
            renderWebResult(result)
          );

        }
      );

    }


    if(currentType === 'images'){

      const grid =
        document.createElement('div');

      grid.className =
        'image-grid';


      a.forEach(r => {

        const url =
          safeUrl(
            r?.url ||
            r?.properties?.url ||
            ''
          );

        const img =
          safeUrl(
            r?.thumbnail ||
            r?.properties?.url ||
            ''
          );

        if(!img) return;


        const el =
          document.createElement('article');

        el.className =
          'image-result';


        el.innerHTML = `
          <a
            href="${esc(url)}"
            target="_blank"
            rel="noopener noreferrer"
          >

            <img
              src="${esc(img)}"
              alt="${esc(r?.title || '')}"
              loading="lazy"
              referrerpolicy="no-referrer"
            >

          </a>

          <div class="image-result-title">
            ${esc(r?.title || url)}
          </div>

          <div class="image-result-source">
            ${esc(
              r?.source ||
              r?.meta_url?.hostname ||
              ''
            )}
          </div>
        `;


        grid.appendChild(el);

      });


      if(grid.children.length){

        list.appendChild(grid);

      }else{

        list.innerHTML =
          '<div class="empty">No images found.</div>';

      }

    }


    if(currentType === 'news'){

      a.forEach(r => {

        list.insertAdjacentHTML(
          'beforeend',

          renderWebResult(r)
        );

      });

    }

  }


  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const button =
      document.createElement('button');

    button.textContent =
      'Previous';

    button.onclick =
      () =>
        search(
          currentQ,
          currentPage - 1,
          currentType
        );

    pager.appendChild(button);

  }


  if(more){

    const button =
      document.createElement('button');

    button.textContent =
      'Next';

    button.onclick =
      () =>
        search(
          currentQ,
          currentPage + 1,
          currentType
        );

    pager.appendChild(button);

  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(
      data.query || currentQ
    )}&type=${encodeURIComponent(
      currentType
    )}${
      currentPage
        ? `&page=${currentPage}`
        : ''
    }`
  );

}


/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page = 0,
  type = currentType
){

  q =
    q.trim();

  if(!q) return;


  currentQ =
    q;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    ['web','images','news'].includes(type)
      ? type
      : 'web';


  document.title =
    `${q} - FlibidooSearch`;

  input.value =
    q;

  resultsInput.value =
    q;


  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );


  list.innerHTML =
    '<div class="empty">Searching…</div>';

  count.textContent =
    '';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML =
    '';


  /*
    Dictionary is intentionally started separately.

    This means a dictionary lookup can succeed
    even if Tiago returns zero results or fails.
  */

  const dictionaryPromise =
    loadDictionary(q);


  try{

    const endpoint =
      `${WORKER}/api/search` +
      `?q=${encodeURIComponent(q)}` +
      `&type=${encodeURIComponent(currentType)}` +
      `&page=${currentPage}`;


    const data =
      await getJSON(endpoint);


    data.type =
      currentType;


    render(data);

  }catch(error){

    list.innerHTML =
      `<div class="error">
        ${esc(
          error?.message ||
          'Search failed. Please try again.'
        )}
      </div>`;

  }


  /*
    Keep dictionary promise from producing
    an unhandled rejection.
  */

  await dictionaryPromise
    .catch(() => {});

}


/* =========================================================
   HOME FORM
========================================================= */

form.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const q =
      input.value.trim();

    if(!q) return;

    location.href =
      `/?q=${encodeURIComponent(q)}` +
      `&type=web&page=0`;

  }
);


/* =========================================================
   RESULTS FORM
========================================================= */

resultsForm.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const q =
      resultsInput.value.trim();

    if(q){

      search(
        q,
        0,
        currentType
      );

    }

  }
);


/* =========================================================
   CATEGORY BUTTONS
========================================================= */

document
  .querySelectorAll('.search-type')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        const q =
          resultsInput.value.trim() ||
          currentQ;

        if(!q) return;

        search(
          q,
          0,
          button.dataset.type
        );

      }
    );

  });


/* =========================================================
   INPUT BUTTON STATE
========================================================= */

input.addEventListener(
  'input',
  () =>
    updateButtonState(
      document.querySelector('#submitButton'),
      input.value
    )
);

resultsInput.addEventListener(
  'input',
  () =>
    updateButtonState(
      document.querySelector(
        '#resultsSubmitButton'
      ),
      resultsInput.value
    )
);


/* =========================================================
   ABOUT
========================================================= */

const aboutOverlay =
  document.querySelector(
    '#aboutOverlay'
  );

document
  .querySelector('#aboutButton')
  .onclick =
    () =>
      aboutOverlay.classList.remove(
        'hidden'
      );

document
  .querySelector('#aboutClose')
  .onclick =
    () =>
      aboutOverlay.classList.add(
        'hidden'
      );

aboutOverlay.addEventListener(
  'click',
  event => {

    if(
      event.target ===
      aboutOverlay
    ){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);

document.addEventListener(
  'keydown',
  event => {

    if(event.key === 'Escape'){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


/* =========================================================
   INITIAL URL
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );

const initialQuery =
  params.get('q');


if(initialQuery){

  const initialType =
    ['web','images','news'].includes(
      params.get('type')
    )
      ? params.get('type')
      : 'web';


  search(
    initialQuery,
    Number(
      params.get('page') || 0
    ),
    initialType
  );

}
