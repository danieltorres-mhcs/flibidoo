<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">
<meta name="description" content="FlibidooSearch">

<title>FlibidooSearch</title>

<link rel="icon"
      href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG">

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;

  --wotd:#ffb52e;
  --wotd-light:#ffe18a;
  --wotd-text:#ffe9a8;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

a{
  color:inherit;
}

button,
input{
  font:inherit;
}

.hidden{
  display:none!important;
}

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px;
}

/* =========================================================
   HOME
   ========================================================= */

#home.home{
  width:100%;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.home-content{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
/* Long-press image download */
.image-result {
  position: relative;
  min-width: 0;
}

.image-result-image-wrap {
  position: relative;
  overflow: hidden;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: rgba(255,255,255,.02);
  border: 1px solid var(--line2);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.image-result-image-wrap img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: 0;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

.longpress-progress {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s ease;
  background: rgba(0,0,0,.18);
}

.longpress-progress.active {
  opacity: 1;
}

.longpress-ring {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background:
    conic-gradient(
      rgba(255,255,255,.95) var(--progress, 0%),
      rgba(255,255,255,.18) var(--progress, 0%)
    );
  padding: 4px;
  transform: scale(.9);
}

.longpress-ring::after {
  content: "↓";
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(29,12,34,.94);
  color: white;
  font-size: 25px;
  line-height: 1;
}

.image-result-image-wrap.downloading .longpress-ring {
  animation: downloadPulse .35s ease;
}

@keyframes downloadPulse {
  0% { transform: scale(.9); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
/*
  Large logo.

  The mask gives the image soft transparent edges so it
  blends into the dark purple background.
*/
.hero-logo{
  width:min(310px,72vw);
  height:auto;
  display:block;
  margin:0 auto 18px;
  object-fit:contain;

  -webkit-mask-image:
    radial-gradient(
      ellipse at center,
      #000 58%,
      rgba(0,0,0,.95) 70%,
      rgba(0,0,0,.55) 84%,
      transparent 100%
    );

  mask-image:
    radial-gradient(
      ellipse at center,
      #000 58%,
      rgba(0,0,0,.95) 70%,
      rgba(0,0,0,.55) 84%,
      transparent 100%
    );
}

.home-title{
  text-align:center;
  font-size:clamp(38px,5vw,58px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500;
}

.home-title em{
  font-style:italic;
}

.home-title strong{
  font-weight:700;
}

.search-wrap{
  width:min(100%,760px);
  margin:0 auto;
}

/* =========================================================
   SEARCH BAR
   ========================================================= */

.search-form{
  display:flex;
  align-items:center;
  width:100%;
  height:58px;

  border:1px solid var(--line);
  border-radius:30px;
  background:transparent;

  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

.search-form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08);
}

.search-form input{
  min-width:0;
  flex:1;

  border:0;
  outline:0;

  background:transparent;
  color:var(--text);

  font-size:16px;

  padding:0 16px;
}

.search-form input::placeholder{
  color:#9e8da1;
}

/* Arrow button */

.submit{
  height:42px;
  width:42px;

  margin-right:7px;

  border:1px solid var(--line);
  background:transparent;
  color:#766679;

  border-radius:50%;
  padding:0;

  display:grid;
  place-items:center;

  cursor:pointer;

  flex:0 0 42px;

  transition:
    color .15s ease,
    border-color .15s ease,
    background .15s ease;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
  color:var(--text);
  background:rgba(255,255,255,.035);
}

.submit-icon{
  width:20px;
  height:20px;
  display:block;
  fill:currentColor;
}

/* =========================================================
   HOME LINKS
   ========================================================= */

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;

  gap:18px;

  margin-top:20px;

  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

.confederacy-credit img{
  width:19px;
  height:19px;

  display:block;
  object-fit:contain;

  flex:0 0 19px;

  border-radius:5px;
}

/* =========================================================
   MAIN
   ========================================================= */

main{
  flex:1;
}

/* =========================================================
   RESULTS PAGE
   ========================================================= */

.results{
  padding:30px 12px 70px;
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;

  min-height:44px;

  border-bottom:1px solid var(--line2);

  padding-bottom:14px;
  margin-bottom:18px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;

  text-decoration:none;
  color:inherit;

  white-space:nowrap;
}

.results-brand img{
  width:30px;
  height:30px;

  object-fit:contain;
  display:block;
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

/* =========================================================
   RESULTS SEARCH BAR
   ========================================================= */

.results-search{
  width:min(100%,760px);
  margin:0 0 20px;
}

.results-search .search-form{
  height:54px;
}

.results-search .submit{
  width:38px;
  height:38px;
  flex-basis:38px;
  margin-right:7px;
}

.results-search .submit-icon{
  width:18px;
  height:18px;
}

/* =========================================================
   SEARCH TYPES
   ========================================================= */

.search-types{
  display:flex;
  align-items:flex-end;

  gap:0;

  margin:8px 0 22px;

  border-bottom:1px solid rgba(255,255,255,.12);

  height:38px;
}

.search-type{
  position:relative;

  appearance:none;

  border:0;
  background:transparent;

  color:rgba(255,255,255,.62);

  font-size:13px;
  line-height:20px;

  padding:0 13px 10px;

  margin:0;

  border-radius:0;

  cursor:pointer;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";

  position:absolute;

  left:10px;
  right:10px;
  bottom:-1px;

  height:2px;

  border-radius:2px 2px 0 0;

  background:currentColor;
}

/* =========================================================
   RESULT LAYOUT
   ========================================================= */

.results-layout{
  display:grid;

  grid-template-columns:minmax(0,1fr) 330px;

  gap:42px;

  align-items:start;
}

/* =========================================================
   WEB RESULTS
   ========================================================= */

.result{
  padding:0 0 26px;
  margin-bottom:26px;

  border-bottom:1px solid var(--line2);
}

.result-top{
  display:flex;
  align-items:center;
  gap:9px;

  min-width:0;

  margin-bottom:7px;
}

.result-favicon{
  width:18px;
  height:18px;

  flex:0 0 18px;

  border-radius:4px;

  object-fit:contain;

  background:rgba(255,255,255,.05);
}

.result-url{
  font-size:13px;
  color:var(--url);

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  min-width:0;
}

.result h2{
  font-size:20px;
  line-height:1.25;

  margin:0 0 7px;

  font-weight:500;

  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.snippet{
  font-size:14px;
  line-height:1.6;

  color:var(--result);

  margin:0;

  max-width:760px;

  overflow-wrap:anywhere;
}

.snippet strong,
.snippet b{
  color:#fff;
  font-weight:700;
}

.snippet em,
.snippet i{
  color:#f4e9f6;
}

.result-meta{
  font-size:12px;
  color:var(--muted);

  margin-top:7px;
}

/* Optional OG/result thumbnail */

.result-media{
  margin-top:12px;

  width:min(100%,420px);

  border:1px solid var(--line2);

  background:rgba(255,255,255,.02);
}

.result-media img{
  display:block;

  width:100%;
  max-height:230px;

  object-fit:cover;
}

/* =========================================================
   IMAGES
   ========================================================= */

.image-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-result img{
  display:block;

  width:100%;

  aspect-ratio:4/3;

  object-fit:cover;

  border:1px solid var(--line2);

  background:rgba(255,255,255,.02);
}

.image-result-title{
  font-size:14px;
  line-height:1.4;

  margin-top:9px;

  white-space:nowrap;

  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);

  margin-top:4px;

  white-space:nowrap;

  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   DICTIONARY
   ========================================================= */

.dictionary{
  border-left:1px solid var(--line2);

  padding-left:28px;

  max-height:75vh;

  overflow-y:auto;

  overscroll-behavior:contain;

  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;

  font-weight:500;

  letter-spacing:-.02em;

  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;

  color:var(--muted);

  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;

  margin-bottom:24px;

  border-bottom:1px solid var(--line2);
}

.dictionary-language,
.dictionary-label{
  font-size:12px;
  color:var(--muted);
}

.dictionary-language{
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  text-transform:uppercase;

  letter-spacing:.05em;

  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);
  margin-left:5px;
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;

  color:var(--result);

  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;

  color:var(--muted);
}

/* =========================================================
   WORD OF THE DAY
   ========================================================= */

.wotd-panel{
  padding:0 0 22px;

  margin:0 0 22px;

  border-bottom:1px solid var(--line2);
}

.wotd-heading{
  display:flex;
  align-items:center;
  gap:8px;

  margin:0 0 8px;

  color:var(--wotd);

  font-size:13px;
  font-weight:600;
}

.wotd-heading::before{
  content:"";
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--wotd);

  box-shadow:0 0 10px rgba(255,181,46,.45);
}

.wotd-word{
  color:#fff;

  font-size:20px;

  font-weight:600;

  line-height:1.25;

  margin:0 0 6px;
}

.wotd-definition{
  color:var(--wotd-text);

  font-size:13px;

  line-height:1.55;

  margin:0;
}

.wotd-example{
  color:rgba(255,233,168,.72);

  font-size:12px;

  line-height:1.5;

  margin:7px 0 0;
}

/* =========================================================
   EMPTY / ERROR / PAGER
   ========================================================= */

.empty{
  padding:70px 0;

  color:var(--muted);

  text-align:center;
}

.error{
  min-height:120px;

  max-width:680px;

  margin:0;

  padding:28px 18px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  border:1px solid var(--line2);

  color:var(--muted);

  font-size:14px;

  line-height:1.5;
}

.pager{
  display:flex;

  gap:8px;

  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);

  background:transparent;

  color:var(--text);

  border-radius:4px;

  padding:8px 12px;

  cursor:pointer;
}

/* =========================================================
   ABOUT
   ========================================================= */

.about-overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.62);

  display:grid;
  place-items:center;

  padding:24px;

  z-index:10000;
}

.about-overlay.hidden{
  display:none;
}

.about-card{
  position:relative;

  width:min(100%,560px);

  max-height:min(80vh,700px);

  overflow:auto;

  background:#24132a;

  border:1px solid var(--line);

  border-radius:14px;

  box-shadow:0 20px 60px rgba(0,0,0,.45);

  padding:30px;
}

.about-close{
  position:absolute;

  top:10px;
  right:10px;

  width:34px;
  height:34px;

  border:0;

  border-radius:50%;

  background:transparent;

  color:var(--muted);

  font-size:24px;

  line-height:1;

  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);

  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;

  font-size:25px;

  font-weight:500;
}

.about-card p{
  color:var(--result);

  line-height:1.7;

  font-size:14px;
}

.about-card a{
  color:var(--text);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr;
  }

  .dictionary{
    order:-1;

    border-left:0;

    border-bottom:1px solid var(--line2);

    padding:0 0 26px;

    margin-bottom:26px;

    max-height:none;
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:22px 14px;
  }

  .results-layout{
    gap:20px;
  }
}

@media(max-width:640px){

  .shell{
    width:100%;

    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:20px 16px;
  }

  .hero-logo{
    width:min(260px,72vw);
  }

  .home-title{
    font-size:38px;
    margin-bottom:24px;
  }

  .search-form{
    height:54px;
  }

  .results{
    padding:22px 16px 60px;
  }

  .results-head{
    gap:12px;
  }

  .results-brand span{
    font-size:14px;
  }

  .results-query{
    font-size:13px;
  }

  .search-types{
    overflow-x:auto;
    scrollbar-width:none;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;

    font-size:12px;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr;
  }

  .hero-logo{
    width:min(240px,75vw);
  }
}
</style>
</head>

<body>

<main>

<!-- ======================================================
     HOME
======================================================= -->

<section id="home" class="home shell">

  <div class="home-content">

    <img
      class="hero-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="Flibidoo"
    >

    <h1 class="home-title">
      <em><strong>Flibidoo</strong></em>Search
    </h1>

    <div class="search-wrap">

      <form id="searchForm" class="search-form" role="search">

        <input
          id="q"
          name="q"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web"
          aria-label="Search the web"
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="Search"
        >

          <svg
            class="submit-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
            aria-hidden="true"
          >
            <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
          </svg>

        </button>

      </form>

      <div class="links">

        <button
          type="button"
          id="aboutButton"
        >
          About
        </button>

        <span class="confederacy-credit">

          with love from The Great Confederacy of E

          <img
            src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
            alt=""
          >

        </span>

      </div>

    </div>

  </div>

</section>


<!-- ======================================================
     RESULTS
======================================================= -->

<section id="results" class="results shell hidden">

  <div class="results-head">

    <a
      class="results-brand"<a href="${esc(u)}">
      href="/"
      aria-label="FlibidooSearch home"
    >

      <img
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt="Flibidoo"
      >

      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>

    </a>

    <div
      id="queryLabel"
      class="results-query"
    ></div>

    <div
      id="count"
      class="count"
    ></div>

  </div>


  <div class="results-search">

    <form
      id="resultsSearchForm"
      class="search-form"
      role="search"
    >

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >

        <svg
          class="submit-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"

/* =========================================================

function esc(value = ''){

  return String(value).replace(
    /[&<>'"]/g,
    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[char])
  );

}


function updateButtonState(button,value){

  if(!button)return;

  button.classList.toggle(
    'has-input',
    String(value || '').trim().length > 0
  );

/*
  Tiago can return percent encoded text.

  Decode a few times because nested encoding can happen.
*/

function decodeText(value = ''){

  let text = String(value);

  for(let i=0;i<3;i++){

    try{

      const decoded =
        decodeURIComponent(text);

      if(decoded === text){
        break;
      }

      text = decoded;

    }catch{

      break;

    }

  }

  return text;

}


/* =========================================================
   SAFE DESCRIPTION FORMATTER
========================================================= */

/*
  Tiago's result descriptions can contain special internal
  formatting markers such as:

  ***FLIBIDOO*****TAG*****0***

  Those MUST NOT be shown to the user.

  We convert supported Markdown/HTML formatting while
  stripping everything else.
*/

function formatDescription(value = ''){

  let text = decodeText(value);

  /*
    Remove Tiago/Flibidoo internal tags.
  */

  text = text
    .replace(
      /\*{0,3}\s*FLIBIDOO\s*\*{0,3}\s*TAG\s*\*{0,3}\s*\d+\s*\*{0,3}/gi,
      ''
    )
    .replace(
      /FLIBIDOO\s*TAG\s*\d+/gi,
      ''
    );

  /*
    Remove other obvious marker fragments if they occur
    without the exact surrounding asterisks.
  */

  text = text.replace(
    /\*{1,5}\s*FLIBIDOO\s*\*{1,5}\s*TAG\s*\*{1,5}\s*\d+\s*\*{1,5}/gi,
    ''
  );

  /*
    Markdown → HTML.

    Triple emphasis first.
  */

  text = text
    .replace(
      /\*\*\*(.+?)\*\*\*/gs,
      '<strong><em>$1</em></strong>'
    )
    .replace(
      /___(.+?)___/gs,
      '<strong><em>$1</em></strong>'
    )
    .replace(
      /\*\*(.+?)\*\*/gs,
      '<strong>$1</strong>'
    )
    .replace(
      /__(.+?)__/gs,
      '<strong>$1</strong>'
    )
    .replace(
      /\*(.+?)\*/gs,
      '<em>$1</em>'
    )
    .replace(
      /_(.+?)_/gs,
      '<em>$1</em>'
    );


  /*
    If the provider sends actual HTML, parse it.

    We only permit:
      strong
      b
      em
      i
      br
  */

  const template =
    document.createElement('template');

  template.innerHTML = text;


  const allowed =
    new Set([
      'STRONG',
      'B',
      'EM',
      'I',
      'BR'
    ]);


  function clean(node){

    [...node.childNodes].forEach(child => {

      if(child.nodeType === Node.ELEMENT_NODE){

        if(!allowed.has(child.tagName)){

          const replacement =
            document.createTextNode(
              child.textContent || ''
            );

          child.replaceWith(replacement);

        }else{

          /*
            Strip ALL attributes.

            This prevents things such as:
              onclick=
              style=
              href=
              src=
              etc.
          */

          [...child.attributes].forEach(attribute => {
            child.removeAttribute(attribute.name);
          });

          clean(child);

        }

      }else if(child.nodeType === Node.TEXT_NODE){

        /* keep */

      }else{

        child.remove();

      }

    });

  }


  clean(template.content);

  return template.innerHTML;

}


/* =========================================================
   URL / FAVICON HELPERS
========================================================= */

function getHostname(url){

  try{

    return new URL(url).hostname;

  }catch{

    return '';

  }

}


function getFavicon(url){

  const host =
    getHostname(url);

  if(!host)return '';

  /*
    Google's favicon endpoint is used only as a fallback
    image URL. The actual search result still links to the
    original website.
  */

  return (
    'https://www.google.com/s2/favicons?' +
    'domain=' +
    encodeURIComponent(host) +
    '&sz=64'
  );

}


function firstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ''
    ){

      return value;

    }

  }

  return '';

}


/*
  Try the common thumbnail / OG-like fields returned by
  search providers.

  If none exists, use favicon.
*/

function getResultThumbnail(result){

  return firstValue(
    result.thumbnail,
    result.thumbnail_url,
    result.image,
    result.image_url,
    result.og_image,
    result.ogImage,
    result.properties?.thumbnail,
    result.properties?.image,
    result.properties?.og_image
  );

}


/* =========================================================
   WOTD
========================================================= */

function isWotdQuery(query){

  const normalized =
    decodeText(query)
      .toLowerCase()
      .replace(/[^\p{L}\p{N}\s]/gu,' ')
      .replace(/\s+/g,' ')
      .trim();

  if(!normalized)return false;

  const phrases = [
    'wotd',
    'word of the day',
    'wordoftheday',
    'word ofday',
    'words of the day'
  ];

  return phrases.some(
    phrase =>
      normalized === phrase ||
      normalized.includes(phrase)
  );

}


async function fetchWotd(){

  try{

    const response =
      await fetch(WOTD_WORKER + '/',{
        method:'GET',
        cache:'no-store'
      });

    if(!response.ok){
      return null;
    }

    const word =
      (await response.text()).trim();

    if(
      !word ||
      word.toLowerCase().includes('failed')
    ){

      return null;

    }

    return word;

  }catch{

    return null;

  }

}


async function ensureWotd(){

  if(currentWotd){
    return currentWotd;
  }

  currentWotd =
    await fetchWotd();

  return currentWotd;

}


/* =========================================================
   DICTIONARY
========================================================= */

async function fetchDictionary(word){

  try{

    const response =
      await fetch(
        SEARCH_WORKER +
        '/api/dictionary?word=' +
        encodeURIComponent(word),
        {
          method:'GET',
          headers:{
            'Accept':'application/json'
          },
          cache:'no-store'
        }
      );


    const text =
      await response.text();

    let data;

    try{

      data =
        text ? JSON.parse(text) : {};

    }catch{

      return null;

    }


    /*
      A missing word should simply mean "no dictionary"
      rather than breaking the search page.
    */

    if(
      response.status === 404 ||
      !response.ok
    ){

      return null;

    }

    if(
      !data ||
      !Array.isArray(data.entries) ||
      !data.entries.length
    ){

      return null;

    }

    return data;

  }catch{

    return null;

  }

}


/*
  Normalize the various possible FreeDictionaryAPI shapes.
*/

function normalizeEntries(data){

  if(!data)return [];

  let entries =
    Array.isArray(data.entries)
      ? data.entries
      : [];

  /*
    English first.

    We don't discard other languages.
  */

  entries = entries.slice().sort((a,b)=>{

    const aLang =
      String(
        a.language ||
        a.lang ||
        a.language_code ||
        ''
      ).toLowerCase();

    const bLang =
      String(
        b.language ||
        b.lang ||
        b.language_code ||
        ''
      ).toLowerCase();

    const aEnglish =
      aLang === 'en' ||
      aLang === 'eng' ||
      aLang.includes('english');

    const bEnglish =
      bLang === 'en' ||
      bLang === 'eng' ||
      bLang.includes('english');

    if(aEnglish && !bEnglish)return -1;
    if(!aEnglish && bEnglish)return 1;

    return 0;

  });

  return entries;

}


/* =========================================================
   DICTIONARY RENDERING
========================================================= */

function renderDictionary(data,word){

  dictionary.innerHTML = '';

  if(!data)return;

  const entries =
    normalizeEntries(data);

  if(!entries.length){

    dictionary.classList.add('hidden');

    return;

  }


  dictionary.classList.remove('hidden');


  const heading =
    document.createElement('h2');

  heading.className =
    'dictionary-title';

  heading.textContent =
    'Dictionary';

  dictionary.appendChild(heading);


  const wordLabel =
    document.createElement('div');

  wordLabel.className =
    'dictionary-word';

  wordLabel.textContent =
    decodeText(word);

  dictionary.appendChild(wordLabel);


  for(const entry of entries){

    const article =
      document.createElement('section');

    article.className =
      'dictionary-entry';


    const language =
      firstValue(
        entry.language,
        entry.lang,
        entry.language_name,
        entry.languageName,
        entry.language_code
      );


    if(language){

      const lang =
        document.createElement('div');

      lang.className =
        'dictionary-language';

      lang.textContent =
        decodeText(language);

      article.appendChild(lang);

    }


    const pos =
      firstValue(
        entry.partOfSpeech,
        entry.part_of_speech,
        entry.pos,
        entry.partOfSpeechName
      );


    if(pos){

      const part =
        document.createElement('div');

      part.className =
        'dictionary-pos';

      part.textContent =
        decodeText(pos);

      article.appendChild(part);

    }


    const senses =
      firstValue(
        entry.senses,
        entry.definitions,
        entry.meanings
      );


    let senseArray = [];

    if(Array.isArray(senses)){

      senseArray =
        senses;

    }


    /*
      Some APIs return meanings containing definitions.
    */

    if(
      !senseArray.length &&
      Array.isArray(entry.meanings)
    ){

      for(const meaning of entry.meanings){

        if(Array.isArray(meaning.definitions)){

          for(const definition of meaning.definitions){

            senseArray.push({
              ...definition,
              partOfSpeech:
                meaning.partOfSpeech ||
                meaning.part_of_speech ||
                ''
            });

          }

        }

      }

    }


    if(senseArray.length){

      const sensesWrap =
        document.createElement('div');

      sensesWrap.className =
        'dictionary-senses';


      const label =
        document.createElement('div');

      label.className =
        'dictionary-label';

      label.textContent =
        'Definitions';

      sensesWrap.appendChild(label);


      senseArray.slice(0,8).forEach(
        (sense,index)=>{

          const box =
            document.createElement('div');

          box.className =
            'dictionary-sense';


          const definition =
            firstValue(
              sense.definition,
              sense.meaning,
              sense.text,
              sense.gloss
            );


          if(definition){

            const def =
              document.createElement('div');

            def.className =
              'dictionary-definition';

            /*
              Dictionary definitions are treated as text,
              not arbitrary HTML.
            */

            def.textContent =
              decodeText(definition);

            box.appendChild(def);

          }


          const example =
            firstValue(
              sense.example,
              sense.examples?.[0],
              sense.example_sentence
            );


          if(example){

            const ex =
              document.createElement('div');

            ex.className =
              'dictionary-example';

            ex.textContent =
              '“' +
              decodeText(example) +
              '”';

            box.appendChild(ex);

          }


          if(box.childNodes.length){
            sensesWrap.appendChild(box);
          }

        }
      );


      article.appendChild(sensesWrap);

    }


    /*
      Translation information.
    */

    const translations =
      entry.translations;

    if(
      Array.isArray(translations) &&
      translations.length
    ){

      const wrap =
        document.createElement('div');

      wrap.className =
        'dictionary-translations';


      const transLabel =
        document.createElement('div');

      transLabel.className =
        'dictionary-label';

      transLabel.textContent =
        'Translations';

      wrap.appendChild(transLabel);


      const ul =
        document.createElement('ul');

      ul.className =
        'dictionary-list';


      translations
        .slice(0,12)
        .forEach(translation=>{

          const li =
            document.createElement('li');

          if(typeof translation === 'string'){

            li.textContent =
              decodeText(translation);

          }else{

            const text =
              firstValue(
                translation.translation,
                translation.word,
                translation.text,
                translation.value
              );

            if(text){
              li.textContent =
                decodeText(text);
            }

          }

          if(li.textContent){
            ul.appendChild(li);
          }

        });


      if(ul.children.length){
        wrap.appendChild(ul);
        article.appendChild(wrap);
      }

    }


    if(article.childNodes.length){

      dictionary.appendChild(article);

    }

  }


  /*
    If everything ended up empty, hide the sidebar.
  */

  const hasEntries =
    dictionary.querySelector(
      '.dictionary-entry'
    );

  if(!hasEntries){

    dictionary.classList.add('hidden');

  }

}


/* =========================================================
   WOTD PANEL
========================================================= */

function renderWotdPanel(word,meaning='',example=''){

  const panel =
    document.createElement('section');

  panel.className =

  const heading =

/* =========================================================
   DICTIONARY + WOTD
========================================================= */

async function loadSidebar(query){

  dictionary.innerHTML = '';
  dictionary.classList.add('hidden');


  const wantsWotd =
    isWotdQuery(query);


  /*
    First get today's WOTD if the query is explicitly about
    WOTD, because we need the actual word before searching
    the dictionary.
  */

  let wotdWord = null;

  if(wantsWotd){

    wotdWord =
      await ensureWotd();

  }else{

    /*
      Also fetch WOTD in the background so we can recognize
      a direct search for today's word.
    */

    wotdWord =
      await ensureWotd();

  }


  let dictionaryWord =
    wantsWotd && wotdWord
      ? wotdWord
      : query;


  /*
    If somebody searches the actual WOTD, show WOTD panel too.
  */

  const queryIsWotdWord =
    Boolean(
      wotdWord &&
      decodeText(query).trim().toLowerCase() ===
      decodeText(wotdWord).trim().toLowerCase()
    );


  const shouldShowWotd =
    wantsWotd ||
    queryIsWotdWord;


  const data =
    await fetchDictionary(dictionaryWord);


  if(!data && !shouldShowWotd){

    dictionary.classList.add('hidden');

    return;

  }


  if(data){

    renderDictionary(
      data,
      dictionaryWord
    );

  }


  if(shouldShowWotd && wotdWord){

    /*
      Try to extract the regular English meaning/example
      from the dictionary result for the WOTD panel.
    */

    let meaning = '';
    let example = '';

    const entries =
      normalizeEntries(data);

    const english =
      entries.find(entry=>{

        const language =
          String(
            firstValue(
              entry.language,
              entry.lang,
              entry.language_code
            )
          ).toLowerCase();

        return (
          language === 'en' ||
          language === 'eng' ||
          language.includes('english')
        );

      }) || entries[0];


    if(english){

      const senses =
        firstValue(
          english.senses,
          english.definitions,
          english.meanings
        );

      if(Array.isArray(senses) && senses.length){

        const first =
          senses[0];

        meaning =
          firstValue(
            first.definition,
            first.meaning,
            first.text,
            first.gloss
          ) || '';

        example =
          firstValue(
            first.example,
            first.examples?.[0],
            first.example_sentence
          ) || '';

      }

      /*
        Alternative meanings format.
      */

      if(
        !meaning &&
        Array.isArray(english.meanings)
      ){

        outer:
        for(const m of english.meanings){

          if(Array.isArray(m.definitions)){

            for(const d of m.definitions){

              meaning =
                firstValue(
                  d.definition,
                  d.meaning,
                  d.text,
                  d.gloss
                ) || '';

              example =
                firstValue(
                  d.example,
                  d.examples?.[0]
                ) || '';

              if(meaning)break outer;

            }

          }

        }

      }

    }


    if(!dictionary || dictionary.classList.contains('hidden')){

      dictionary.classList.remove('hidden');

      const title =
        document.createElement('h2');

      title.className =
        'dictionary-title';

      title.textContent =
        'Dictionary';

      dictionary.appendChild(title);

    }


    renderWotdPanel(
      wotdWord,
      meaning,
      example
    );

  }

}

async function requestSearch(q,page,type){

  const endpoint =
    SEARCH_WORKER +
    '/api/search?q=' +
    encodeURIComponent(q) +
    '&type=' +
    encodeURIComponent(type) +
    '&page=' +
    encodeURIComponent(page);

  const response =
    await fetch(endpoint,{
      method:'GET',
      headers:{
        'Accept':'application/json'
      },
      cache:'no-store'
    });


  const text =
    await response.text();


  let data;

  try{

    data =
      text ? JSON.parse(text) : {};

  }catch{

    throw new Error(
      `Search endpoint returned invalid JSON (${response.status}).`
    );

  }


  if(!response.ok){

    throw new Error(
      data?.error ||
      `Search endpoint returned ${response.status}.`
    );

  }


  return data;

}

          <img
            src="${esc(img)}"
            alt="${esc(title)}"
            loading="lazy"
            referrerpolicy="no-referrer"
            draggable="false"
          >

          <div class="longpress-progress">
            <div class="longpress-ring"></div>
          </div>
        </div>
      </a>

      <div class="image-result-title">${esc(title)}</div>
      <div class="image-result-source">${esc(source)}</div>
    `;

    grid.appendChild(el);

    setupImageLongPress(el, img, title);
  });

  if(grid.children.length){
    list.appendChild(grid);
  }else{
    list.innerHTML='<div class="empty">No images found.</div>';
  }
        
  /* =======================================================
     WEB / NEWS
  ======================================================= */

  }else{

    array.forEach(result=>{

      const url =
        decodeText(
          firstValue(
            result.url,
            result.link
          )
        );


      const host =
        decodeText(
          firstValue(
            result.meta_url?.hostname,
            result.hostname,
            getHostname(url)
          )
        );


      const title =
        decodeText(
          firstValue(
            result.title,
            result.name,
            url
          )
        );


      const rawDescription =
        firstValue(
          result.description,
          result.content,
          result.snippet,
          result.text
        );


      const description =
        formatDescription(
          rawDescription
        );


      const age =
        decodeText(
          firstValue(
            result.age,
            result.publishedDate,
            result.published,
            result.date
          )
        );


      const favicon =
        firstValue(
          result.favicon,
          result.favicon_url,
          result.icon,
          result.meta_url?.favicon,
          getFavicon(url)
        );


      const thumbnail =
        getResultThumbnail(result);


      const article =
        document.createElement('article');

      article.className =
        'result';


      const thumbnailHTML =
        thumbnail
          ? `
            <div class="result-media">
              <img
                src="${esc(decodeText(thumbnail))}"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.parentElement.remove()"
              >
            </div>
          `
          : '';


      article.innerHTML = `
        <div class="result-top">

          ${
            favicon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(decodeText(favicon))}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                  onerror="this.style.display='none'"
                >
              `
              : ''
          }

          <div class="result-url">
            ${esc(host || url)}
          </div>

        </div>

        <h2>
          <a
            href="${esc(url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>
        </h2>

        ${
          description
            ? `<p class="snippet">${description}</p>`
            : ''
        }

        ${
          age
            ? `<div class="result-meta">${esc(age)}</div>`
            : ''
        }

        ${thumbnailHTML}
      `;


      list.appendChild(article);

    });

  }


  /* =======================================================
     PAGINATION
  ======================================================= */

  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const button =
      document.createElement('button');

    button.textContent =
      'Previous';

    button.onclick =
      () => search(
        currentQ,
        currentPage - 1,
        currentType
      );

    pager.appendChild(button);

  }


  if(more){

    const button =
      document.createElement('button');

    button.textContent =
      'Next';

    button.onclick =
      () => search(
        currentQ,
        currentPage + 1,
        currentType
      );

    pager.appendChild(button);

  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(query || currentQ)}` +
    `&type=${encodeURIComponent(currentType)}` +
    (currentPage
      ? `&page=${currentPage}`
      : '')
  );

}

const LONG_PRESS_TIME = 2000;

function setupImageLongPress(el, imageUrl, title){
  const wrap = el.querySelector('.image-result-image-wrap');
  const progress = el.querySelector('.longpress-progress');
  const ring = el.querySelector('.longpress-ring');
  const link = el.querySelector('.image-result-link');

  let timer = null;
  let animation = null;
  let startTime = 0;
  let longPressTriggered = false;

  function resetPress(){
    if(timer){
      clearTimeout(timer);
      timer = null;
    }

    if(animation){
      cancelAnimationFrame(animation);
      animation = null;
    }

    wrap.classList.remove('downloading');
    progress.classList.remove('active');
    ring.style.setProperty('--progress', '0%');
    startTime = 0;
  }

  function updateProgress(){
    if(!startTime) return;

    const elapsed = performance.now() - startTime;
    const percent = Math.min(elapsed / LONG_PRESS_TIME, 1);

    ring.style.setProperty('--progress', `${percent * 100}%`);

    if(percent < 1){
      animation = requestAnimationFrame(updateProgress);
    }
  }

  function beginPress(e){
    /*
     * Only treat the primary mouse button as a long press.
     * Touch/pen are also supported.
     */
    if(e.type === 'mousedown' && e.button !== 0) return;

    longPressTriggered = false;

    if(timer) clearTimeout(timer);
    if(animation) cancelAnimationFrame(animation);

    startTime = performance.now();

    progress.classList.add('active');
    ring.style.setProperty('--progress', '0%');

    animation = requestAnimationFrame(updateProgress);

    timer = setTimeout(async ()=>{
      longPressTriggered = true;

      ring.style.setProperty('--progress', '100%');
      wrap.classList.add('downloading');

      await downloadImage(imageUrl, title);

      setTimeout(()=>{
        resetPress();
      }, 250);

    }, LONG_PRESS_TIME);
  }

  function endPress(e){
    /*
     * If the 2-second gesture completed, don't follow the image link.
     */
    if(longPressTriggered){
      if(e){
        e.preventDefault();
        e.stopPropagation();
      }

      resetPress();
      return;
    }

    resetPress();
  }

  /*
   * Prevent the browser's native context menu on long press.
   */
  wrap.addEventListener('contextmenu', e=>{
    e.preventDefault();
  });

  /*
   * Touch.
   */
  wrap.addEventListener('touchstart', beginPress, {
    passive: true
  });

  wrap.addEventListener('touchend', endPress, {
    passive: false
  });

  wrap.addEventListener('touchcancel', resetPress, {
    passive: true
  });

  /*
   * Mouse / trackpad.
   */
  wrap.addEventListener('mousedown', beginPress);

  wrap.addEventListener('mouseup', endPress);

  wrap.addEventListener('mouseleave', ()=>{
    if(!longPressTriggered) resetPress();
  });

  /*
   * Don't let the browser start dragging the image.
   */
  wrap.addEventListener('dragstart', e=>{
    e.preventDefault();
  });

  /*
   * If the long press fired, prevent the click from navigating.
   */
  link.addEventListener('click', e=>{
    if(longPressTriggered){
      e.preventDefault();
      e.stopPropagation();
      longPressTriggered = false;
    }
  });
}


async function downloadImage(url, title='image'){
  try{
    /*
     * Try fetching the image as a blob first.
     * This works when the image host permits CORS.
     */
    const response = await fetch(url, {
      mode: 'cors',
      credentials: 'omit'
    });

    if(!response.ok){
      throw new Error('Image request failed');
    }

    const blob = await response.blob();

    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = makeFilename(title, blob.type);
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(()=>{
      URL.revokeObjectURL(blobUrl);
    }, 5000);

    return true;

  }catch(err){
    /*
     * Some image hosts block cross-origin fetches.
     *
     * In that case, fall back to the image URL. The browser/site may
     * decide whether it can download it or simply navigate to it.
     */
    const a = document.createElement('a');
    a.href = url;
    a.download = makeFilename(title);
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();

    return false;
  }
}


function makeFilename(title, mime=''){
  let name = String(title || 'image')
    .replace(/[<>:"/\\|?*\x00-\x1F]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 100);

  if(!name) name = 'image';

  let ext = '';

  if(mime.includes('png')) ext='.png';
  else if(mime.includes('jpeg') || mime.includes('jpg')) ext='.jpg';
  else if(mime.includes('webp')) ext='.webp';
  else if(mime.includes('gif')) ext='.gif';

  return name + ext;
}
      
/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page = 0,
  type = currentType
){

  q =
    decodeText(q).trim();


  if(!q)return;


  currentQ =
    q;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    ['web','images','news'].includes(type)
      ? type
      : 'web';


  document.title =
    `${q} - FlibidooSearch`;


  input.value =
    q;

  resultsInput.value =
    q;


  home.classList.add('hidden');
  results.classList.remove('hidden');


  label.textContent =
    `Results for “${q}”`;


  list.innerHTML =
    '<div class="empty">Searching…</div>';

  count.textContent =
    '';

  pager.innerHTML =
    '';


  /*
    Dictionary loads independently.

    This is intentionally NOT dependent on search results.
  */

  loadSidebar(q);


  try{

    const data =
      await requestSearch(
        q,
        currentPage,
        currentType
      );


    /*
      Some Worker responses may not explicitly include type.
    */

    data.type =
      currentType;


    data.query =
      data.query ||
      q;


    await render(data);


  }catch(error){

    console.error(
      'FlibidooSearch:',
      error
    );


    list.innerHTML =
      `<div class="error">${esc(
        error.message ||
        'Search failed. Please try again.'
      )}</div>`;

  }

}


/* =========================================================
   SEARCH FORM EVENTS
========================================================= */

form.addEventListener(
  'submit',
  event=>{

    event.preventDefault();

    const q =
      input.value.trim();

    if(!q)return;

    location.href =
      `/?q=${encodeURIComponent(q)}` +
      `&type=web&page=0`;

  }
);


resultsForm.addEventListener(
  'submit',
  event=>{

    event.preventDefault();

    const q =
      resultsInput.value.trim();

    if(q){

      search(
        q,
        0,
        currentType
      );

    }

  }
);


/*
  Category switching.

  This directly calls YOUR Worker with:
    /api/search?type=images
    /api/search?type=news
    /api/search?type=web
*/

document
  .querySelectorAll('.search-type')
  .forEach(button=>{

    button.addEventListener(
      'click',
      ()=>{

        const q =
          resultsInput.value.trim() ||
          currentQ;

        if(!q)return;

        search(
          q,
          0,
          button.dataset.type
        );

      }
    );

  });


/* =========================================================
   INPUT BUTTON STATE
========================================================= */

input.addEventListener(
  'input',
  ()=>updateButtonState(
    submitButton,
    input.value
  )
);

resultsInput.addEventListener(
  'input',
  ()=>updateButtonState(
    resultsSubmitButton,
    resultsInput.value
  )
);


/* =========================================================
   ABOUT
========================================================= */

const aboutOverlay =
  document.querySelector('#aboutOverlay');

const aboutButton =
  document.querySelector('#aboutButton');

const aboutClose =
  document.querySelector('#aboutClose');


aboutButton.onclick =
  () =>
    aboutOverlay.classList.remove('hidden');


aboutClose.onclick =
  () =>
    aboutOverlay.classList.add('hidden');


aboutOverlay.addEventListener(
  'click',
  event=>{

    if(event.target === aboutOverlay){

      aboutOverlay.classList.add('hidden');

    }

  }
);


document.addEventListener(
  'keydown',
  event=>{

    if(event.key === 'Escape'){

      aboutOverlay.classList.add('hidden');

    }

  }
);


/* =========================================================
   INITIAL URL
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );


const initialQuery =
  params.get('q');


const initialType =
  params.get('type');


const initialPage =
  Number(
    params.get('page') || 0
  );


if(initialQuery){

  search(
    initialQuery,
    initialPage,
    ['web','images','news'].includes(initialType)
      ? initialType
      : 'web'
  );

}
