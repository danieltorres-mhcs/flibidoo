<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1d0c22" />

  <title>FlibidooSearch</title>

  <!-- Favicon / app icon -->
  <link
    rel="icon"
    type="image/png"
    href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
  />
  <link
    rel="apple-touch-icon"
    href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
  />

  <!-- PWA metadata -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FlibidooSearch" />

  <style>
    :root{
      --bg:#1d0c22;
      --text:#f5eef7;
      --muted:#b9aabb;
      --line:#5a4560;
      --line2:#39283d;
      --accent:#f5eef7;
      --result:#e7dce9;
      --url:#b8a2bc;
      --focus:#cdb8d1;
      --blue:#9db8d9;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    a{
      color:inherit;
    }

    button,
    input{
      font-family:inherit;
    }

    .shell{
      width:min(100% - 40px,1120px);
      margin:0 auto;
    }

    header{
      height:64px;
      border-bottom:1px solid var(--line2);
      display:flex;
      align-items:center;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      font-weight:600;
      letter-spacing:-.01em;
    }

    .brand img{
      width:34px;
      height:34px;
      object-fit:contain;
      display:block;
    }

    main{
      flex:1;
    }

    .home{
      min-height:calc(100vh - 120px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:54px 0 100px;
    }

    .hero-logo{
      width:min(210px,55vw);
      height:auto;
      display:block;
      margin-bottom:12px;

      -webkit-mask-image:
        linear-gradient(to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%),
        linear-gradient(to bottom,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%);

      mask-image:
        linear-gradient(to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%),
        linear-gradient(to bottom,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%);

      -webkit-mask-composite:source-in;
      mask-composite:intersect;
    }

    h1{
      font-size:clamp(34px,5vw,54px);
      line-height:1;
      margin:0 0 30px;
      letter-spacing:-.055em;
      font-weight:500;
    }

    .search-wrap{
      width:min(100%,680px);
    }

    form{
      display:flex;
      align-items:center;
      height:54px;
      border:1px solid var(--line);
      border-radius:28px;
      background:transparent;
      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    form:focus-within{
      border-color:var(--focus);
      box-shadow:0 0 0 2px rgba(205,184,209,.08);
    }

    .search-icon{
      width:20px;
      height:20px;
      margin-left:18px;
      flex:0 0 auto;
      opacity:.75;
    }

    .search-icon circle,
    .search-icon path{
      stroke:currentColor;
    }

    input{
      min-width:0;
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:16px;
      padding:0 14px;
    }

    input::placeholder{
      color:#9e8da1;
    }

    .submit{
      height:38px;
      width:38px;
      margin-right:8px;
      border:1px solid var(--line);
      background:transparent;
      color:#766679;
      border-radius:50%;
      padding:0;
      display:grid;
      place-items:center;
      cursor:pointer;

      transition:
        color .15s ease,
        border-color .15s ease;
    }

    .submit.has-input{
      color:var(--text);
      border-color:var(--focus);
    }

    .submit:hover{
      border-color:var(--focus);
    }

    .submit:focus-visible{
      outline:2px solid var(--focus);
      outline-offset:2px;
    }

    .submit-icon{
      width:18px;
      height:18px;
      display:block;
    }

    .links{
      display:flex;
      align-items:center;
      gap:18px;
      margin-top:20px;
      color:var(--muted);
      font-size:13px;
    }

    .links button{
      border:0;
      background:none;
      color:inherit;
      cursor:pointer;
      padding:0;
    }

    .links button:hover{
      color:var(--text);
    }

    .translate-link{
      text-decoration:none;
    }

    .translate-link:hover{
      text-decoration:underline;
    }

    .love-footer{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:13px;
      cursor:default;
    }

    .love-footer img{
      width:22px;
      height:22px;
      object-fit:contain;
      display:block;
    }

    /* ---------------- RESULTS ---------------- */

    .results{
      padding:30px 0 70px;
    }

    .results-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line2);
      padding-bottom:14px;
      margin-bottom:14px;
      min-height:44px;
      gap:18px;
    }

    .results-brand{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:inherit;
      white-space:nowrap;
    }

    .results-brand img{
      width:28px;
      height:28px;
      object-fit:contain;
      display:block;
    }

    .results-brand span{
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
    }

    .results-query{
      flex:1;
      min-width:0;
      font-size:14px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .count{
      font-size:13px;
      color:var(--muted);
      white-space:nowrap;
    }

    .results-search{
      width:min(100%,680px);
      margin:0 0 28px;
    }

    .results-search form{
      height:48px;
    }

    .results-search .search-icon{
      margin-left:16px;
    }

    .results-search .submit{
      width:34px;
      height:34px;
      margin-right:6px;
    }

    /* ---------------- TRANSLATE MESSAGE ---------------- */

    .translate-message{
      display:none;
      margin:-10px 0 20px;
      padding:11px 14px;
      border-left:2px solid rgba(157,184,217,.35);
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .translate-message a{
      color:var(--blue);
      text-decoration:underline;
      text-decoration-color:rgba(157,184,217,.65);
      text-underline-offset:2px;
    }

    .translate-message strong{
      font-weight:600;
    }

    .translate-message.visible{
      display:block;
    }

    /* ---------------- SEARCH TYPES ---------------- */

    .search-types{
      display:flex;
      align-items:flex-end;
      gap:0;
      margin:8px 0 18px;
      border-bottom:1px solid rgba(255,255,255,.12);
      height:36px;
    }

    .search-type{
      position:relative;
      appearance:none;
      border:0;
      background:transparent;
      color:rgba(255,255,255,.62);
      font:inherit;
      font-size:13px;
      line-height:20px;
      padding:0 12px 10px;
      margin:0;
      border-radius:0;
      cursor:pointer;
      transition:color .12s ease;
    }

    .search-type:hover{
      color:rgba(255,255,255,.9);
      background:transparent;
    }

    .search-type.active{
      color:#fff;
      background:transparent;
    }

    .search-type.active::after{
      content:"";
      position:absolute;
      left:10px;
      right:10px;
      bottom:-1px;
      height:2px;
      border-radius:2px 2px 0 0;
      background:currentColor;
    }

    .search-type:focus-visible{
      outline:1px solid rgba(255,255,255,.55);
      outline-offset:-2px;
    }

    /* ---------------- LAYOUT ---------------- */

    .results-layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 330px;
      grid-template-areas:"results dictionary";
      gap:42px;
      align-items:start;
    }

    .results-column{
      grid-area:results;
      min-width:0;
    }

    .dictionary{
      grid-area:dictionary;

      border-left:1px solid var(--line2);
      padding-left:28px;

      position:sticky;
      top:20px;

      max-height:calc(100vh - 40px);
      overflow:hidden;

      overscroll-behavior:contain;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .dictionary.hidden{
      display:none;
    }

    .dictionary-scroll-content{
      min-width:0;
    }

    /* Desktop dictionary */
    .dictionary-scroll-content{
      overflow:visible;
    }

    .dictionary-scroll-button{
      display:none;
    }

    /* ---------------- DICTIONARY ---------------- */

    .dictionary-title{
      font-size:22px;
      font-weight:500;
      letter-spacing:-.02em;
      margin:0 0 5px;
    }

    .dictionary-word{
      font-size:13px;
      color:var(--muted);
      margin-bottom:22px;
    }

    .dictionary-entry{
      padding:0 0 24px;
      margin-bottom:24px;
      border-bottom:1px solid var(--line2);
    }

    .dictionary-entry:last-child{
      border-bottom:0;
    }

    .dictionary-language{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .dictionary-pos{
      font-size:15px;
      margin-bottom:12px;
    }

    .dictionary-pronunciations,
    .dictionary-forms,
    .dictionary-senses,
    .dictionary-relations,
    .dictionary-translations{
      margin-top:14px;
    }

    .dictionary-label{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:7px;
    }

    .dictionary-list{
      margin:0;
      padding-left:18px;
    }

    .dictionary-list li{
      margin:0 0 7px;
    }

    .dictionary-sense{
      margin:0 0 15px;
    }

    .dictionary-definition{
      font-size:14px;
      line-height:1.55;
    }

    .dictionary-tags{
      font-size:12px;
      color:var(--muted);
      margin-left:5px;
    }

    .dictionary-example{
      font-size:13px;
      line-height:1.5;
      color:var(--result);
      margin:7px 0 0 14px;
    }

    .dictionary-quote{
      font-size:13px;
      line-height:1.5;
      color:var(--muted);
      margin:7px 0 0 14px;
    }

    .dictionary-source{
      font-size:12px;
      line-height:1.5;
      color:var(--muted);
      padding-top:4px;
    }

    .dictionary-source a{
      color:inherit;
    }

    .dictionary-loading,
    .dictionary-empty{
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    /* ---------------- RESULTS ---------------- */

    .result{
      padding:0 0 26px;
      margin-bottom:26px;
      border-bottom:1px solid var(--line2);
    }

    .result-url{
      font-size:13px;
      color:var(--url);
      margin-bottom:6px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .result h2{
      font-size:20px;
      line-height:1.25;
      margin:0 0 7px;
      font-weight:500;
      letter-spacing:-.02em;
    }

    .result h2 a{
      text-decoration:none;
    }

    .result h2 a:hover{
      text-decoration:underline;
    }

    .snippet{
      font-size:14px;
      line-height:1.6;
      color:var(--result);
      margin:0;
      max-width:760px;
    }

    .result-meta{
      font-size:12px;
      color:var(--muted);
      margin-top:7px;
    }

    .result-favicon{
      width:18px;
      height:18px;
      object-fit:contain;
      vertical-align:-4px;
      margin-right:7px;
    }

    .result-inline-thumb{
      margin-top:10px;
      max-width:260px;
    }

    .result-inline-thumb img{
      display:block;
      width:100%;
      max-height:150px;
      object-fit:cover;
    }

    /* ---------------- IMAGE RESULTS ---------------- */

    .image-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:28px 22px;
    }

    .image-result{
      min-width:0;
      position:relative;
      user-select:none;
      -webkit-user-select:none;
    }

    .image-result a{
      display:block;
      text-decoration:none;
    }

    .image-result-media{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line2);
      background:rgba(255,255,255,.02);
    }

    .image-result img{
      display:block;
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      cursor:pointer;
      -webkit-user-drag:none;
      user-select:none;
      -webkit-user-select:none;
      transition:transform .15s ease;
    }

    .image-result:hover img{
      transform:scale(1.01);
    }

    /* Long press progress */

    .image-hold-progress{
      position:absolute;
      left:0;
      bottom:0;
      height:4px;
      width:0%;
      background:rgba(255,255,255,.9);
      pointer-events:none;
      opacity:0;
      transition:none;
    }

    .image-result.holding .image-hold-progress{
      opacity:1;
      animation:imageHoldFill 2s linear forwards;
    }

    .image-result.downloaded .image-hold-progress{
      width:100%;
      opacity:1;
    }

    @keyframes imageHoldFill{
      from{
        width:0%;
      }

      to{
        width:100%;
      }
    }

    .image-result-title{
      font-size:14px;
      line-height:1.4;
      margin-top:9px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .image-result-source{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* ---------------- MAP RESULTS ---------------- */

    .map-result{
      padding:0 0 22px;
      margin-bottom:22px;
      border-bottom:1px solid var(--line2);
    }

    .map-result-title{
      font-size:18px;
      line-height:1.35;
      margin:0 0 6px;
      font-weight:500;
    }

    .map-result-title a{
      text-decoration:none;
    }

    .map-result-title a:hover{
      text-decoration:underline;
    }

    .map-result-address{
      font-size:14px;
      line-height:1.55;
      color:var(--result);
    }

    .map-result-coords{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    /* ---------------- OTHER ---------------- */

    .empty,
    .error{
      padding:70px 0;
      color:var(--muted);
      text-align:center;
    }

    .error{
      min-height:120px;
      max-width:680px;
      margin:0;
      padding:28px 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      border:1px solid var(--line2);
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .pager{
      display:flex;
      gap:8px;
      padding-top:10px;
    }

    .pager button{
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      border-radius:4px;
      padding:8px 12px;
      cursor:pointer;
    }

    .pager button:hover{
      border-color:var(--focus);
    }

    footer{
      height:56px;
      border-top:1px solid var(--line2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:var(--muted);
      font-size:12px;
    }

    .footer-links{
      display:flex;
      gap:16px;
    }

    .footer-links a{
      text-decoration:none;
    }

    .footer-links a:hover{
      text-decoration:underline;
      color:var(--text);
    }

    .hidden{
      display:none!important;
    }

    /* ---------------- TABLET ---------------- */

    @media(max-width:860px){

      .results-layout{
        grid-template-columns:1fr;
        grid-template-areas:
          "dictionary"
          "results";

        gap:28px;
      }

      .dictionary{
        border-left:0;
        border-top:1px solid var(--line2);
        padding:26px 0 0;

        /*
         * Tablet remains sticky.
         */
        position:sticky;
        top:12px;

        max-height:55vh;
      }

      .results-column{
        min-width:0;
      }

      .dictionary-scroll-content{
        overflow:auto;
        max-height:calc(55vh - 26px);
        scrollbar-width:thin;
      }

      .dictionary-scroll-button{
        display:none;
      }

      .image-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:22px 14px;
      }
    }

    /* ---------------- MOBILE ---------------- */

    @media(max-width:640px){

      .shell{
        width:min(100% - 24px,1120px);
      }

      header{
        height:58px;
      }

      .home{
        padding-top:25px;
        padding-bottom:70px;
      }

      .hero-logo{
        width:150px;
      }

      h1{
        font-size:36px;
        margin-bottom:24px;
      }

      form{
        height:50px;
      }

      .submit{
        width:38px;
        padding:0;
      }

      .links{
        flex-wrap:wrap;
        justify-content:center;
      }

      .results{
        padding-top:22px;
      }

      .results-head{
        gap:12px;
      }

      .results-brand img{
        width:24px;
        height:24px;
      }

      .results-brand span{
        font-size:14px;
      }

      .results-query{
        font-size:13px;
      }

      .count{
        display:none;
      }

      .search-types{
        overflow-x:auto;
        scrollbar-width:none;
      }

      .search-types::-webkit-scrollbar{
        display:none;
      }

      .search-type{
        padding-left:10px;
        padding-right:10px;
        font-size:12px;
      }

      /*
       * MOBILE DICTIONARY
       *
       * It is no longer sticky.
       * The frame itself does not manually scroll.
       * Only the inner content moves when the fixed buttons
       * are pressed.
       */
      .dictionary{
        position:relative;
        top:auto;
        max-height:none;

        height:340px;

        overflow:hidden;

        border:1px solid var(--line2);
        border-radius:10px;

        padding:18px 46px 18px 16px;

        background:rgba(255,255,255,.015);

        transition:
          opacity .2s ease,
          transform .2s ease;
      }

      .dictionary-scroll-content{
        height:100%;
        max-height:none;

        overflow:hidden;

        scrollbar-width:none;

        padding-right:4px;
      }

      .dictionary-scroll-content::-webkit-scrollbar{
        display:none;
      }

      /*
       * Fixed to the dictionary frame.
       */
      .dictionary-scroll-button{
        position:absolute;

        right:7px;

        width:30px;
        height:30px;

        border:1px solid rgba(255,255,255,.18);
        border-radius:7px;

        background:rgba(29,12,34,.96);

        color:rgba(255,255,255,.82);

        display:grid;
        place-items:center;

        padding:0;

        z-index:20;

        cursor:pointer;

        touch-action:manipulation;

        box-shadow:0 3px 10px rgba(0,0,0,.22);

        transition:
          background .12s ease,
          border-color .12s ease,
          transform .12s ease;
      }

      .dictionary-scroll-button:hover{
        background:rgba(255,255,255,.08);
        border-color:rgba(255,255,255,.3);
      }

      .dictionary-scroll-button:active{
        transform:scale(.94);
      }

      .dictionary-scroll-up{
        top:7px;
      }

      .dictionary-scroll-down{
        bottom:7px;
      }

      .dictionary-scroll-button svg{
        width:16px;
        height:16px;
        pointer-events:none;
      }

      .dictionary-title{
        font-size:21px;
      }

      .dictionary-word{
        margin-bottom:16px;
      }

      .dictionary-definition{
        font-size:14px;
      }

      .dictionary-example{
        font-size:13px;
      }

      .translate-message{
        margin-top:-4px;
      }

      .image-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:22px 14px;
      }

      footer{
        height:auto;
        min-height:56px;
        padding:12px 0;
      }

      .love-footer{
        font-size:11px;
      }
    }

    @media(max-width:460px){

      .image-grid{
        grid-template-columns:1fr;
      }

      .image-result img{
        aspect-ratio:4/3;
      }

      .dictionary{
        height:320px;
      }

      .results-brand span{
        font-size:13px;
      }
    }

    /* Extra protection for touch/vertical devices */
    @media(pointer:coarse) and (max-width:860px){

      .dictionary{
        position:relative;
        top:auto;
      }

      .dictionary-scroll-content{
        overflow:hidden;
      }
    }
  </style>
</head>

<body>

<main>

  <!-- HOME -->

  <section id="home" class="home shell">

    <img
      class="hero-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="FlibidooSearch logo"
    />

    <h1>FlibidooSearch</h1>

const WORKER_BASE =

function workerUrl(path, params = {}){

  const url = new URL(
    path,
    WORKER_BASE.replace(/\/+$/, '') + '/'
  );

  Object.entries(params).forEach(([key,value]) => {
    if(value !== undefined && value !== null){
      url.searchParams.set(key,String(value));
    }
  });

  return url.toString();
}

/* =========================================================
   HELPERS
   ========================================================= */

function esc(s = ''){

  return String(s).replace(
    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );
}


function updateButtonState(button,value){

  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );
}


function normalize(s = ''){

  return s
    .toLowerCase()
    .trim()
    .replace(/[“”"'.,!?;:()[\]{}]/g,'')
    .replace(/\s+/g,' ');
}


function levenshtein(a,b){

  const prev =
    Array.from(
      {length:b.length + 1},
      (_,i) => i
    );

  for(let i = 1; i <= a.length; i++){

    let cur = [i];

    for(let j = 1; j <= b.length; j++){

      cur[j] = Math.min(
        cur[j - 1] + 1,
        prev[j] + 1,
        prev[j - 1] +
          (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }

    for(let j = 0; j <= b.length; j++){
      prev[j] = cur[j];
    }
  }

  return prev[b.length];
}


/* =========================================================
   DICTIONARY QUERY DETECTION
   ========================================================= */

function dictionaryWord(query){

  const q = normalize(query);

  if(!q){
    return null;
  }

  if(q.split(' ').length === 1){
    return q;
  }

  const tokens =
    q.split(' ').filter(Boolean);

  const candidates =
    new Set();

  for(const t of tokens){

    if(/^[a-z][a-z'-]*$/i.test(t)){

      candidates.add(
        t.replace(
          /^['-]+|['-]+$/g,
          ''
        )
      );
    }
  }

  for(const word of candidates){

    const templates = [

      `meaning of ${word}`,
      `${word} meaning`,
      `${word} means`,
      `${word} definition`,
      `definition of ${word}`

    ];

    for(const template of templates){

      if(
        levenshtein(q,template) <= 3
      ){
        return word;
      }
    }
  }

  return null;
}


/* =========================================================
   TRANSLATE MESSAGE
   ========================================================= */

function translationSuggestion(query){

  const q = query.trim();

  if(!q){
    return null;
  }

  const lower = q.toLowerCase();

  const patterns = [

    /\bto english\b/i,
    /\benglish to\b/i,
    /\btranslate\b/i,
    /\btranslator\b/i,
    /\btranslated\b/i,
    /\bsay\s+.+\s+in\s+.+/i

  ];

  if(!patterns.some(pattern => pattern.test(lower))){
    return null;
  }

  return `
    I think you need
    <a
      href="https://flibidoo-translate.devs.surf"
      target="_self"
    >FlibidooTranslate</a>
    for that.
  `;
}


function updateTranslationMessage(query){

  const message =
    translationSuggestion(query);

  if(!message){

    translateMessage.classList.remove(
      'visible'

    translateMessage.innerHTML = '';

  }

  translateMessage.innerHTML = message;

  translateMessage.classList.add(
    'visible'

}


/* =========================================================
   RICH TEXT
   ========================================================= */

window.flibidooRichText =
function(value){

  let src = String(value ?? '');

  if(!src){
    return '';
  }

  const ta =
    document.createElement('textarea');

  ta.innerHTML = src;

  src = ta.value;

  src = src
    .replace(
      /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi,
      ''
    )
    .replace(
      /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*\/?>/gi,
      ''
    )
    .replace(
      /\s+on[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi,
      ''
    )
    .replace(
      /\s+(href|src)\s*=\s*(['"])\s*javascript:[\s\S]*?\2/gi,
      ''
    );

  const allowed = [];

  src = src.replace(
    /<\/?(strong|b|em|i|u|s|del|mark|small|br|code|kbd|sub|sup|a)(?:\s+[^>]*)?>/gi,
    m => {

      const idx =
        allowed.push(m) - 1;

      return `@@FLIBIDOO_TAG_${idx}@@`;
    }
  );

  src =
    src
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');

  src =
    src.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" rel="noopener noreferrer">$1</a>'
    );

  src =
    src.replace(
      /`([^`]+)`/g,
      '<code>$1</code>'
    );

  src =
    src.replace(
      /\*\*([^*]+)\*\*/g,
      '<strong>$1</strong>'
    );

  src =
    src.replace(
      /__([^_]+)__/g,
      '<strong>$1</strong>'
    );

  src =
    src.replace(
      /~~([^~]+)~~/g,
      '<del>$1</del>'
    );

  src =
    src.replace(
      /(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;])/g,
      '$1<em>$2</em>'
    );

  src =
    src.replace(
      /(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?:;])/g,
      '$1<em>$2</em>'
    );

  src =
    src.replace(
      /^#{1,6}\s+(.+)$/gm,
      '<strong>$1</strong>'
    );

  src =
    src.replace(
      /^\s*[-*]\s+(.+)$/gm,
      '• $1'
    );

  src =
    src.replace(
      /^\s*\d+\.\s+(.+)$/gm,
      '$1'
    );

  src =
    src.replace(
      /@@FLIBIDOO_TAG_(\d+)@@/g,
      (_,i) =>
        allowed[Number(i)] || ''
    );

  return src.replace(
    /\r?\n/g,
    '<br>'
  );
};


/* =========================================================
   DICTIONARY

function dictionaryTags(tags){

  return Array.isArray(tags) && tags.length
    ? ` <span class="dictionary-tags">(${tags.map(esc).join(', ')})</span>`
    : '';
}


function renderSense(sense,depth = 0){

  if(!sense){
    return '';
  }

  let html =
    `<div class="dictionary-sense" style="margin-left:${Math.min(depth,3)*12}px">`;

  if(sense.definition){

    html += `

  }

  if(Array.isArray(sense.examples)){

    sense.examples.forEach(x => {

      if(x){

        html += `
          <div class="dictionary-example">
            “${esc(x)}”
          </div>
        `;
      }
    });
  }

  if(Array.isArray(sense.quotes)){

    sense.quotes.forEach(q => {

      if(q?.text){

        html += `
          <div class="dictionary-quote">
            “${esc(q.text)}”

              ? ` — ${esc(q.reference)}`
              : ''}

        `;
      }
    });
  }

  if(
    Array.isArray(sense.synonyms) &&
    sense.synonyms.length
  ){

    html += `
      <div class="dictionary-relations">
        <div class="dictionary-label">
          Synonyms
        </div>
        <div>
          ${sense.synonyms.map(esc).join(', ')}
        </div>

    `;
  }

  if(
    Array.isArray(sense.antonyms) &&
    sense.antonyms.length
  ){

    html += `
      <div class="dictionary-relations">
        <div class="dictionary-label">
          Antonyms
        </div>
        <div>
          ${sense.antonyms.map(esc).join(', ')}
        </div>
      </div>
    `;
  }

  if(
    Array.isArray(sense.translations) &&
    sense.translations.length
  ){

    html += `
      <div class="dictionary-translations">
        <div class="dictionary-label">
          Translations
        </div>

        <ul class="dictionary-list">
    `;

    sense.translations.forEach(t => {

      if(t?.word){

        html += `
          <li>
            ${esc(
              t.language?.name ||
              t.language?.code ||
              ''
            )}
            —
            ${esc(t.word)}
          </li>
        `;
      }
    });

    html += `
        </ul>
      </div>
    `;
  }

  if(Array.isArray(sense.subsenses)){

    sense.subsenses.forEach(sub => {

      html += renderSense(
        sub,
        depth + 1
      );
    });
  }

  return html + '</div>';
}


/*
 * English is prioritized first.
 */
function sortDictionaryEntries(entries){

  if(!Array.isArray(entries)){
    return [];
  }

  return [...entries].sort((a,b) => {

    const aCode =
      String(
        a.language?.code ||
        ''
      ).toLowerCase();

    const bCode =
      String(
        b.language?.code ||
        ''
      ).toLowerCase();

    const aName =
      String(
        a.language?.name ||
        ''
      ).toLowerCase();

    const bName =
      String(
        b.language?.name ||
        ''
      ).toLowerCase();

    const aEnglish =
      aCode === 'en' ||
      aCode.startsWith('en-') ||
      aName === 'english';

    const bEnglish =
      bCode === 'en' ||
      bCode.startsWith('en-') ||
      bName === 'english';

    if(aEnglish && !bEnglish){
      return -1;
    }

    if(!aEnglish && bEnglish){
      return 1;
    }

    return 0;
  });
}


function dictionaryScrollControls(){

function setupDictionaryScrolling(){

  const scrollArea =
    dictionary.querySelector(
      '.dictionary-scroll-content'
    );

  if(!scrollArea){
    return;
  }

  const up =
    dictionary.querySelector(
      '.dictionary-scroll-up'
    );

  const down =
    dictionary.querySelector(
      '.dictionary-scroll-down'
    );

  if(!up || !down){
    return;
  }

  function scrollByAmount(amount){

    scrollArea.scrollBy({
      top:amount,
      behavior:'smooth'
    });
  }

  let holdTimer = null;
  let holding = false;

  function startHold(direction){

    holding = true;

    scrollByAmount(
      direction * 120
    );

    holdTimer =
      setInterval(() => {

        if(!holding){
          return;
        }

        scrollByAmount(
          direction * 100
        );

      },90);
  }

  function stopHold(){

    holding = false;

    if(holdTimer){

      clearInterval(
        holdTimer
      );

      holdTimer = null;
    }
  }

  function setupButton(button,direction){

    button.addEventListener(
      'pointerdown',
      event => {

        event.preventDefault();

        try{
          button.setPointerCapture(
            event.pointerId
          );
        }catch(_){}

        startHold(direction);
      }
    );

    button.addEventListener(
      'pointerup',
      stopHold
    );

    button.addEventListener(
      'pointercancel',
      stopHold
    );

    button.addEventListener(
      'pointerleave',
      event => {

        if(
          event.buttons === 0
        ){
          stopHold();
        }
      }
    );

    button.addEventListener(
      'click',
      event => {

        event.preventDefault();

        if(!holding){
          scrollByAmount(
            direction * 180
          );
        }
      }
    );
  }

  setupButton(up,-1);
  setupButton(down,1);
}


function renderDictionary(data){

  entries.forEach(entry => {

      entry.pronunciations.forEach(p => {

        if(p?.text){

          html += `

                  ? ` — ${esc(p.type)}`

              }

          `;
        }
      });

      html += `
          </ul>

      `;
    }

    if(
      Array.isArray(entry.forms) &&
      entry.forms.length
    ){

      html += `
        <div class="dictionary-forms">

          <div class="dictionary-label">
            Forms
          </div>

          <ul class="dictionary-list">
      `;

      entry.forms.forEach(f => {

        if(f?.word){

          html += `
            <li>
              ${esc(f.word)}
              ${dictionaryTags(f.tags)}
            </li>
          `;
        }
      });

      html += `
          </ul>
        </div>
      `;
    }

    if(
      Array.isArray(entry.senses) &&
      entry.senses.length
    ){

      html += `
        <div class="dictionary-senses">

          <div class="dictionary-label">
            Definitions
          </div>
      `;

      entry.senses.forEach(s => {

        html += renderSense(s);
      });

      html += `
        </div>
      `;
    }

    if(
      Array.isArray(entry.synonyms) &&
      entry.synonyms.length
    ){

      html += `
        <div class="dictionary-relations">

          <div class="dictionary-label">
            Synonyms
          </div>

          <div>
            ${entry.synonyms.map(esc).join(', ')}
          </div>

        </div>
      `;
    }

    if(
      Array.isArray(entry.antonyms) &&
      entry.antonyms.length
    ){

      html += `
        <div class="dictionary-relations">

          <div class="dictionary-label">
            Antonyms
          </div>

          <div>
            ${entry.antonyms.map(esc).join(', ')}
          </div>

        </div>
      `;
    }

    html += `
      </section>
    `;
  });

  if(data.source){

    html += `
      <div class="dictionary-source">
        Source:

          data.source.url
            ? `
              <a
                href="${esc(data.source.url)}"

              >

            `

        }

        ${
          data.source.license
            ? `

                data.source.license.url
                  ? `

                        data.source.license.name ||

                      )}
                    </a>
                  `
                  : esc(
                      data.source.license.name ||
                      ''
                    )
              }
            `
            : ''
        }
      </div>
    `;
  }

  html += `
    </div>

    ${dictionaryScrollControls()}
  `;

  dictionary.innerHTML = html;

  dictionary.classList.remove(
    'hidden'
  );

  setupDictionaryScrolling();
}

async function loadDictionary(q){

  const word =
    dictionaryWord(q);

  if(!word){

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML = '';

    return;
  }

  dictionary.classList.remove(
    'hidden'
  );

  dictionary.innerHTML = `
    <div class="dictionary-scroll-content">
      <div class="dictionary-loading">
        Looking up the definition…
      </div>
    </div>
  `;

  try{

    const r =
      await fetch(
        workerUrl(
          '/api/dictionary',
          {word}
        )
      );

    if(!r.ok){

      dictionary.classList.add(
        'hidden'
      );

      return;
    }

    const data =
      await r.json();

    if(
      data?.entries?.length
    ){

      renderDictionary(data);

    }else{

      dictionary.classList.add(
        'hidden'
      );

      dictionary.innerHTML = '';
    }

  }catch(_){

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML = '';
  }
}


/* =========================================================
   IMAGE LONG-PRESS DOWNLOAD
   ========================================================= */

let imageHoldTimer = null;
let imageHoldTarget = null;
let imageHoldCompleted = false;


function cancelImageHold(){

  if(imageHoldTimer){

    clearTimeout(
      imageHoldTimer
    );

    imageHoldTimer = null;
  }

  if(imageHoldTarget){

    imageHoldTarget.classList.remove(
      'holding'
    );

    if(!imageHoldCompleted){

      imageHoldTarget.classList.remove(
        'downloaded'
      );
    }
  }

  imageHoldTarget = null;
  imageHoldCompleted = false;
}


async function downloadImage(url,title='image'){

  if(!url){
    return;
  }

  let filename =
    String(title || 'image')
      .replace(
        /[<>:"/\\|?*\x00-\x1F]/g,
        ''
      )
      .trim()
      .slice(0,80);

  if(!filename){
    filename = 'flibidoo-image';
  }

  try{

    const response =
      await fetch(url,{
        mode:'cors',
        credentials:'omit'
      });

    if(!response.ok){
      throw new Error();
    }

    const blob =
      await response.blob();

    const blobUrl =
      URL.createObjectURL(blob);

    const a =
      document.createElement('a');

    a.href = blobUrl;
    a.download =
      filename +
      (blob.type?.includes('png')
        ? '.png'
        : blob.type?.includes('webp')
          ? '.webp'
          : '.jpg');

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
      () => URL.revokeObjectURL(blobUrl),
      3000
    );

  }catch(_){

    /*
     * Some remote image hosts block CORS.
     * In that case we still attempt a normal browser download.
     */
    const a =
      document.createElement('a');

    a.href = url;
    a.download = filename;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    document.body.appendChild(a);

    a.click();

    a.remove();
  }
}


function beginImageHold(card,img){

  cancelImageHold();

  imageHoldTarget = card;
  imageHoldCompleted = false;

  card.classList.add(
    'holding'
  );

  imageHoldTimer =
    setTimeout(async () => {

      imageHoldCompleted = true;

      card.classList.remove(
        'holding'
      );

      card.classList.add(
        'downloaded'
      );

      const url =
        img.dataset.downloadUrl ||
        img.currentSrc ||
        img.src;

      const title =
        card.dataset.title ||
        'flibidoo-image';

      await downloadImage(
        url,
        title
      );

      setTimeout(
        () => {

          card.classList.remove(
            'downloaded'
          );

        },
        900
      );

    },2000);
}


document.addEventListener(
  'pointerdown',
  event => {

    const img =
      event.target.closest(
        '.image-result img'
      );

    if(!img){
      return;
    }

    const card =
      img.closest(
        '.image-result'
      );

    if(!card){
      return;
    }

    beginImageHold(
      card,
      img
    );
  }
);


document.addEventListener(
  'pointerup',
  event => {

    if(
      event.target.closest(
        '.image-result img'
      )
    ){
      if(!imageHoldCompleted){
        cancelImageHold();
      }
    }
  }
);


document.addEventListener(
  'pointercancel',
  cancelImageHold
);


document.addEventListener(
  'pointerleave',
  event => {

    if(
      event.target.closest(
        '.image-result img'
      ) &&
      event.buttons === 0
    ){
      if(!imageHoldCompleted){
        cancelImageHold();
      }
    }
  }
);


document.addEventListener(
  'contextmenu',
  event => {

    if(
      event.target.closest(
        '.image-result img'

       * context menu from appearing.
       */
      event.preventDefault();
    }
  }
);


/* =========================================================
   RENDER RESULTS
   ========================================================= */

function render(data){

  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );

  currentType =
    data.type ||
    currentType;

  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';

  const resultsArray =
    Array.isArray(data.results)
      ? data.results
      : [];

  count.textContent =
    resultsArray.length
      ? `${resultsArray.length} results`
      : '';

  resultsInput.value =
    data.query || '';

  updateButtonState(
    resultsSubmitButton,
    resultsInput.value
  );

  updateTranslationMessage(
    data.query || currentQ
  );

  document
    .querySelectorAll('.search-type')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.type === currentType
      );
    });


  /*
   * Dictionary only exists on Web.
   */
  if(currentType !== 'web'){

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML = '';
  }


  list.innerHTML = '';
  pager.innerHTML = '';


  if(!resultsArray.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    return;
  }


  /* ---------------- IMAGES ---------------- */

  if(currentType === 'images'){

    const grid =
      document.createElement('div');

    grid.className =
      'image-grid';

    resultsArray.forEach(r => {

      const u =
        r.url ||
        r.properties?.url ||
        '';

      const img =
        r.thumbnail ||
        r.properties?.url ||
        '';

      if(!img){
        return;
      }

      const el =
        document.createElement('article');

      el.className =
        'image-result';

      el.dataset.title =
        r.title ||
        'flibidoo-image';

      el.innerHTML = `

        <a
          href="${esc(u)}"
          rel="noopener noreferrer"
        >

          <div class="image-result-media">

            <img
              src="${esc(img)}"
              data-download-url="${esc(img)}"
              alt="${esc(r.title || '')}"
              loading="lazy"
              referrerpolicy="no-referrer"
              draggable="false"
            />

            <div
              class="image-hold-progress"
              aria-hidden="true"
            ></div>

          </div>

        </a>

        <div class="image-result-title">
          ${esc(r.title || u)}
        </div>

        <div class="image-result-source">
          ${esc(
            r.source ||
            r.meta_url?.hostname ||
            ''
          )}
        </div>

      `;

      grid.appendChild(el);
    });

    if(grid.children.length){

      list.appendChild(grid);

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';
    }


  /* ---------------- MAPS ---------------- */

  }else if(currentType === 'map'){

    resultsArray.forEach(r => {

      const el =
        document.createElement('article');

      el.className =
        'map-result';

      const u =
        r.url || '';

      const title =
        r.title ||
        'Map result';

      const address =
        r.address
          ? Object.values(r.address)
              .filter(Boolean)
              .join(', ')
          : (
              r.description ||
              ''
            );

      el.innerHTML = `

        <h2 class="map-result-title">

          <a
            href="${esc(u)}"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>

        </h2>

        <div class="map-result-address">
          ${esc(address)}
        </div>

        ${
          r.lat &&
          r.lon
            ? `
              <div class="map-result-coords">
                ${esc(r.lat)}, ${esc(r.lon)}
              </div>
            `
            : ''
        }

      `;

      list.appendChild(el);
    });


  /* ---------------- WEB / NEWS ---------------- */

  }else{

    resultsArray.forEach(r => {

      const el =
        document.createElement('article');

      el.className =
        'result';

      const u =
        r.url || '';

      const favicon =
        r.meta_url?.favicon ||
        '';

      const host =
        r.meta_url?.hostname ||
        '';

      const title =
        r.title ||
        u;

      const description =
        r.description ||
        r.content ||
        '';

      const age =
        r.age ||
        r.publishedDate ||
        '';

      const thumb =
        r.thumbnail?.src ||
        r.thumbnail ||
        '';

      el.innerHTML = `

        <div class="result-url">

          ${
            favicon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(favicon)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

          <span>
            ${esc(host || u)}
          </span>

        </div>

        <h2>

          <a
            href="${esc(u)}"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>

        </h2>

        ${
          description
            ? `
              <p class="snippet">
                ${window.flibidooRichText(description)}
              </p>
            `
            : ''
        }

        ${
          age
            ? `
              <div class="result-meta">
                ${esc(age)}
              </div>
            `
            : ''
        }

        ${
          thumb
            ? `
              <div class="result-inline-thumb">

                <img
                  src="${esc(thumb)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >

              </div>
            `
            : ''
        }

      `;

      list.appendChild(el);
    });
  }


  /* ---------------- PAGINATION ---------------- */

  const hasMore =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const b =
      document.createElement('button');

    b.textContent =
      'Previous';

    b.onclick =
      () =>
        search(
          currentQ,
          currentPage - 1,
          currentType
        );

    pager.appendChild(b);
  }


  if(hasMore){

    const b =
      document.createElement('button');

    b.textContent =
      'Next';

    b.onclick =
      () =>
        search(
          currentQ,
          currentPage + 1,
          currentType
        );

    pager.appendChild(b);
  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(data.query || currentQ)}&type=${encodeURIComponent(currentType)}${currentPage ? `&page=${currentPage}` : ''}`
  );
}


/* =========================================================
   SEARCH
   ========================================================= */

async function search(
  q,
  page = 0,
  type = currentType
){

  q = q.trim();

  if(!q){
    return;
  }

  currentQ = q;
  currentPage = page;
  currentType = type;

  input.value = q;
  resultsInput.value = q;

  updateButtonState(
    submitButton,
    q
  );

  updateButtonState(
    resultsSubmitButton,
    q
  );

  updateTranslationMessage(q);

  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );

  list.innerHTML =
    '<div class="empty">Searching…</div>';

  count.textContent = '';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML = '';


  document
    .querySelectorAll('.search-type')
    .forEach(b => {

      b.classList.toggle(
        'active',
        b.dataset.type === currentType
      );
    });


  /*
   * Hide dictionary immediately when
   * leaving Web.
   */
  if(currentType !== 'web'){

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML = '';
  }


  /*
   * Start dictionary independently.
   */
  const dictionaryPromise =
    currentType === 'web'
      ? loadDictionary(q)
      : Promise.resolve();


  try{

    const r =
      await fetch(
        workerUrl(
          '/api/search',
          {
            q,
            page,
            type:currentType
          }
        )
      );


    const d =
      await r.json();


    if(!r.ok){

      throw new Error(
        d.error ||
        'Search failed.'
      );
    }


    render(d);

  }catch(e){

    list.innerHTML = `
      <div class="error">
        ${esc(
          e.message ||
          'Search failed. Please try again.'
        )}
      </div>
    `;
  }


  await dictionaryPromise;
}

/* =========================================================
   AUTOCOMPLETE
   ========================================================= */

(() => {

  const inputs =
    [
      ...document.querySelectorAll(
        '#q,#resultsQ'
      )
    ];

  if(!inputs.length){
    return;
  }


  let timer = null;
  let controller = null;
  let selected = -1;
  let items = [];


  const escape =
    value =>
      String(value ?? '')
        .replace(
          /[&<>"']/g,
          c => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'
          }[c])
        );


  function setup(input){

    const wrap =
      input.closest('form') ||
      input.parentElement;

    wrap.classList.add(
      'flibidoo-suggest-wrap'
    );


    const box =
      document.createElement('div');

    box.className =
      'flibidoo-suggestions';

    box.hidden = true;

    /*
     * Kept lightweight so autocomplete
     * does not interfere with the search.
     */
    Object.assign(
      box.style,
      {
        position:'absolute',
        left:'0',
        right:'0',
        top:'calc(100% + 4px)',
        zIndex:'100',
        background:'#1d0c22',
        border:'1px solid rgba(255,255,255,.14)',
        borderRadius:'8px',
        overflow:'hidden'
      }
    );

    wrap.style.position =
      'relative';

    wrap.appendChild(box);


    function close(){

      box.hidden = true;
      box.innerHTML = '';
      selected = -1;
    }


    function choose(q){

      input.value = q;

      close();

      const f =
        input.closest('form');

      if(f){
        f.requestSubmit();
      }
    }


    async function load(){

      const q =
        input.value.trim();

      if(q.length < 2){

        close();

        return;
      }


      if(controller){

        controller.abort();
      }


      controller =
        new AbortController();


      try{

        const r =
          await fetch(
            workerUrl(
              '/api/suggest',
              {q}
            ),
            {
              signal:
                controller.signal
            }
          );


        if(!r.ok){

          throw new Error();
        }


        const d =
          await r.json();


        items =
          Array.isArray(
            d.suggestions
          )
            ? d.suggestions.slice(0,8)
            : [];


        if(!items.length){

          close();

          return;
        }


        box.innerHTML =
          items.map(
            (x,i) => `

              <button
                type="button"
                data-i="${i}"
                style="
                  display:flex;
                  align-items:center;
                  gap:10px;
                  width:100%;
                  border:0;
                  background:transparent;
                  color:#fff;
                  text-align:left;
                  padding:10px 13px;
                  font:inherit;
                  font-size:13px;
                  cursor:pointer;
                "
              >

                ${
                  x.img
                    ? `
                      <img
                        src="${escape(x.img)}"
                        alt=""
                        width="24"
                        height="24"
                        style="
                          width:24px;
                          height:24px;
                          object-fit:cover;
                          border-radius:50%;
                        "
                      >
                    `
                    : ''
                }

                <span>
                  ${escape(x.query)}

                  ${
                    x.entity &&
                    x.desc
                      ? `
                        <small
                          style="
                            display:block;
                            color:rgba(255,255,255,.55);
                            margin-top:2px;
                          "
                        >
                          ${escape(x.desc)}
                        </small>
                      `
                      : ''
                  }

                </span>

              </button>

            `
          ).join('');


        box.hidden = false;


        box
          .querySelectorAll('button')
          .forEach(btn => {

            btn.addEventListener(
              'mousedown',
              e => {

                e.preventDefault();

                choose(
                  items[
                    Number(
                      btn.dataset.i
                    )
                  ].query
                );
              }
            );
          });

      }catch(_){

        close();
      }
    }


    input.addEventListener(
      'input',
      () => {

        clearTimeout(timer);

        timer =
          setTimeout(
            load,
            180
          );
      }
    );


    input.addEventListener(
      'keydown',
      e => {

        if(box.hidden){
          return;
        }


        if(
          e.key === 'ArrowDown'
        ){

          e.preventDefault();

          selected =
            Math.min(
              selected + 1,
              items.length - 1
            );

        }else if(
          e.key === 'ArrowUp'
        ){

          e.preventDefault();

          selected =
            Math.max(
              selected - 1,
              -1
            );

        }else if(
          e.key === 'Enter' &&
          selected >= 0
        ){

          e.preventDefault();

          choose(
            items[selected].query
          );

        }else if(
          e.key === 'Escape'
        ){

          close();

          return;
        }


        box
          .querySelectorAll('button')
          .forEach(
            (btn,i) => {

              btn.style.background =
                i === selected
                  ? 'rgba(255,255,255,.07)'
                  : 'transparent';
            }
          );
      }
    );


    document.addEventListener(
      'click',
      e => {

        if(
          !wrap.contains(e.target)
        ){
          close();
        }
      }
    );
  }


  inputs.forEach(setup);

})();


/* =========================================================
   PWA ICON / MANIFEST
   ========================================================= */

(() => {

  const icon =
    'https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG';


  /*
   * Creates a manifest dynamically so the HTML
   * can remain a single file.
   */
  try{

    const manifest = {

      name:'FlibidooSearch',

      short_name:'FlibidooSearch',

      start_url:
        location.origin + '/',

      display:'standalone',

      background_color:'#1d0c22',

      theme_color:'#1d0c22',

      description:
        'FlibidooSearch',

      icons:[
        {
          src:icon,
          sizes:'192x192',
          type:'image/png',
          purpose:'any'
        },
        {
          src:icon,
          sizes:'512x512',
          type:'image/png',
          purpose:'any'
        }
      ]
    };


    const blob =
      new Blob(
        [
          JSON.stringify(
            manifest
          )
        ],
        {
          type:
            'application/manifest+json'
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement('link');

    link.rel =
      'manifest';

    link.href =
      url;

    document.head.appendChild(
      link
    );

  }catch(_){}
})();
