<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1d0c22" />

  <title>FlibidooSearch</title>

  <link
    rel="icon"
    type="image/png"
    href="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
  />

  <style>
    :root{
      --bg:#1d0c22;
      --text:#f5eef7;
      --muted:#b9aabb;
      --line:#5a4560;
      --line2:#39283d;
      --accent:#f5eef7;
      --result:#e7dce9;
      --url:#b8a2bc;
      --focus:#cdb8d1;
      --translate:#a9c7e8;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    a{
      color:inherit;
    }

    .shell{
      width:min(calc(100% - 40px),1120px);
      margin:0 auto;
    }

    header{
      height:64px;
      border-bottom:1px solid var(--line2);
      display:flex;
      align-items:center;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      font-weight:600;
      letter-spacing:-.01em;
    }

    .brand img{
      width:34px;
      height:34px;
      object-fit:contain;
      display:block;
      border-radius:0;
      -webkit-mask-image:
        linear-gradient(to right,transparent 0%,black 7%,black 93%,transparent 100%),
        linear-gradient(to bottom,transparent 0%,black 7%,black 93%,transparent 100%);
      mask-image:
        linear-gradient(to right,transparent 0%,black 7%,black 93%,transparent 100%),
        linear-gradient(to bottom,transparent 0%,black 7%,black 93%,transparent 100%);
      -webkit-mask-composite:source-in;
      mask-composite:intersect;
    }

    .brand-flibidoo,
    .results-brand-flibidoo{
      font-weight:700;
      font-style:italic;
    }

    main{
      flex:1;
    }

    .home{
      min-height:calc(100vh - 120px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:54px 20px 100px;
    }

    .hero-logo{
      width:min(210px,55vw);
      height:auto;
      display:block;
      margin-bottom:12px;
      border-radius:0;
      -webkit-mask-image:
        linear-gradient(to right,transparent 0%,black 7%,black 93%,transparent 100%),
        linear-gradient(to bottom,transparent 0%,black 7%,black 93%,transparent 100%);
      mask-image:
        linear-gradient(to right,transparent 0%,black 7%,black 93%,transparent 100%),
        linear-gradient(to bottom,transparent 0%,black 7%,black 93%,transparent 100%);
      -webkit-mask-composite:source-in;
      mask-composite:intersect;
    }

    h1{
      font-size:clamp(34px,5vw,54px);
      line-height:1;
      margin:0 0 30px;
      letter-spacing:-.055em;
      font-weight:500;
    }

    .search-wrap{
      width:min(100%,680px);
    }

    form{
      display:flex;
      align-items:center;
      height:54px;
      border:1px solid var(--line);
      border-radius:28px;
      background:transparent;
      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    form:focus-within{
      border-color:var(--focus);
      box-shadow:0 0 0 2px rgba(205,184,209,.08);
    }

    .search-icon{
      width:20px;
      height:20px;
      margin-left:18px;
      flex:0 0 auto;
      opacity:.75;
    }

    .search-icon circle,
    .search-icon path{
      stroke:currentColor;
    }

    input{
      min-width:0;
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:16px;
      padding:0 14px;
    }

    input::placeholder{
      color:#9e8da1;
    }

    .submit{
      height:38px;
      width:38px;
      margin-right:8px;
      border:1px solid var(--line);
      background:transparent;
      color:#766679;
      border-radius:50%;
      padding:0;
      display:grid;
      place-items:center;
      cursor:pointer;
      transition:
        color .15s ease,
        border-color .15s ease,
        transform .12s ease;
    }

    .submit:hover{
      border-color:var(--focus);
    }

    .submit:active{
      transform:scale(.96);
    }

    .submit.has-input{
      color:var(--text);
      border-color:var(--focus);
    }

    .submit:focus-visible{
      outline:2px solid var(--focus);
      outline-offset:2px;
    }

    .submit-icon{
      width:18px;
      height:18px;
      display:block;
    }

    .links{
      display:flex;
      gap:18px;
      margin-top:20px;
      color:var(--muted);
      font-size:13px;
      justify-content:center;
    }

    .links button{
      border:0;
      background:none;
      color:inherit;
      cursor:pointer;
      padding:0;
    }

    .links button:hover{
      color:var(--text);
    }

    /* RESULTS */

    .results{
      padding:30px 20px 70px;
    }

    .results-head{
      display:flex;
      align-items:center;
      gap:18px;
      min-height:44px;
      border-bottom:1px solid var(--line2);
      padding-bottom:14px;
      margin-bottom:14px;
    }

    .results-brand{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:inherit;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .results-brand img{
      width:28px;
      height:28px;
      object-fit:contain;
      display:block;
    }

    .results-brand span{
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
    }

    .results-query{
      font-size:14px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      flex:1;
      min-width:0;
    }

    .count{
      font-size:13px;
      color:var(--muted);
      flex:0 0 auto;
    }

    .results-search{
      width:min(100%,680px);
      margin:0 0 10px;
    }

    .results-search form{
      height:48px;
    }

    .results-search .search-icon{
      margin-left:16px;
    }

    .results-search .submit{
      width:34px;
      height:34px;
      margin-right:6px;
    }

    /* SEARCH TYPE TABS */

    .search-types{
      display:flex;
      align-items:flex-end;
      gap:0;
      margin:8px 0 18px;
      border-bottom:1px solid rgba(255,255,255,.12);
      height:36px;
      overflow-x:auto;
      scrollbar-width:none;
    }

    .search-types::-webkit-scrollbar{
      display:none;
    }

    .search-type{
      position:relative;
      appearance:none;
      border:0;
      background:transparent;
      color:rgba(255,255,255,.62);
      font:inherit;
      font-size:13px;
      line-height:20px;
      padding:0 12px 10px;
      margin:0;
      border-radius:0;
      cursor:pointer;
      transition:
        color .12s ease,
        opacity .12s ease;
      white-space:nowrap;
    }

    .search-type:hover{
      color:rgba(255,255,255,.9);
      background:transparent;
    }

    .search-type.active{
      color:#fff;
      background:transparent;
    }

    .search-type.active::after{
      content:"";
      position:absolute;
      left:10px;
      right:10px;
      bottom:-1px;
      height:2px;
      border-radius:2px 2px 0 0;
      background:currentColor;
    }

    .search-type:focus-visible{
      outline:1px solid rgba(255,255,255,.55);
      outline-offset:-2px;
    }

    /* TRANSLATE MESSAGE */

    .translate-message{
      display:none;
      width:min(100%,680px);
      margin:0 0 22px;
      padding:11px 14px;
      border:1px solid var(--line2);
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
      border-radius:8px;
      background:rgba(255,255,255,.015);
    }

    .translate-message.show{
      display:block;
    }

    .translate-message a{
      color:var(--translate);
      text-decoration:underline;
      text-decoration-thickness:1px;
      text-underline-offset:2px;
    }

    .translate-message a:hover{
      color:#c4dcf3;
    }

    /* RESULTS LAYOUT */

    .results-layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 330px;
      gap:42px;
      align-items:start;
    }

    .results-main{
      min-width:0;
    }

    .dictionary{
      border-left:1px solid var(--line2);
      padding-left:28px;
      max-height:calc(100vh - 60px);
      overflow-y:auto;
      overscroll-behavior:contain;
      scrollbar-width:thin;

      /* Sticky on desktop/tablet */
      position:sticky;
      top:24px;

      transition:
        top .25s ease,
        max-height .25s ease,
        opacity .2s ease;
    }

    .dictionary::-webkit-scrollbar{
      width:6px;
    }

    .dictionary::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.2);
      border-radius:6px;
    }

    .dictionary.hidden{
      display:none;
    }

    .dictionary-title{
      font-size:22px;
      font-weight:500;
      letter-spacing:-.02em;
      margin:0 0 5px;
    }

    .dictionary-word{
      font-size:13px;
      color:var(--muted);
      margin-bottom:22px;
    }

    .dictionary-entry{
      padding:0 0 24px;
      margin-bottom:24px;
      border-bottom:1px solid var(--line2);
    }

    .dictionary-entry:last-child{
      border-bottom:0;
    }

    .dictionary-language{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .dictionary-pos{
      font-size:15px;
      margin-bottom:12px;
    }

    .dictionary-pronunciations,
    .dictionary-forms,
    .dictionary-senses,
    .dictionary-relations,
    .dictionary-translations{
      margin-top:14px;
    }

    .dictionary-label{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:7px;
    }

    .dictionary-list{
      margin:0;
      padding-left:18px;
    }

    .dictionary-list li{
      margin:0 0 7px;
    }

    .dictionary-sense{
      margin:0 0 15px;
    }

    .dictionary-definition{
      font-size:14px;
      line-height:1.55;
    }

    .dictionary-tags{
      font-size:12px;
      color:var(--muted);
      margin-left:5px;
    }

    .dictionary-example{
      font-size:13px;
      line-height:1.5;
      color:var(--result);
      margin:7px 0 0 14px;
    }

    .dictionary-quote{
      font-size:13px;
      line-height:1.5;
      color:var(--muted);
      margin:7px 0 0 14px;
    }

    .dictionary-source{
      font-size:12px;
      line-height:1.5;
      color:var(--muted);
      padding-top:4px;
    }

    .dictionary-source a{
      color:inherit;
    }

    .dictionary-loading,
    .dictionary-empty{
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    /* NORMAL RESULTS */

    .result{
      padding:0 0 26px;
      margin-bottom:26px;
      border-bottom:1px solid var(--line2);
    }

    .result-url{
      font-size:13px;
      color:var(--url);
      margin-bottom:6px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .result h2{
      font-size:20px;
      line-height:1.25;
      margin:0 0 7px;
      font-weight:500;
      letter-spacing:-.02em;
    }

    .result h2 a{
      text-decoration:none;
    }

    .result h2 a:hover{
      text-decoration:underline;
    }

    .snippet{
      font-size:14px;
      line-height:1.6;
      color:var(--result);
      margin:0;
      max-width:760px;
    }

    .result-favicon{
      width:18px;
      height:18px;
      object-fit:contain;
      vertical-align:-4px;
      margin-right:7px;
    }

    .result-meta{
      font-size:12px;
      color:var(--muted);
      margin-top:7px;
    }

    .result-inline-thumb{
      margin-top:10px;
      max-width:260px;
    }

    .result-inline-thumb img{
      display:block;
      width:100%;
      max-height:150px;
      object-fit:cover;
    }

    /* IMAGE RESULTS */

    .image-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:28px 22px;
    }

    .image-result{
      min-width:0;
    }

    .image-result a{
      display:block;
      text-decoration:none;
    }

    .image-result img{
      display:block;
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      border:1px solid var(--line2);
      background:rgba(255,255,255,.02);
    }

    .image-result-title{
      font-size:14px;
      line-height:1.4;
      margin-top:9px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .image-result-source{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* MAP RESULTS */

    .map-result{
      padding:0 0 22px;
      margin-bottom:22px;
      border-bottom:1px solid var(--line2);
    }

    .map-result-title{
      font-size:18px;
      line-height:1.35;
      margin:0 0 6px;
      font-weight:500;
    }

    .map-result-title a{
      text-decoration:none;
    }

    .map-result-title a:hover{
      text-decoration:underline;
    }

    .map-result-address{
      font-size:14px;
      line-height:1.55;
      color:var(--result);
    }

    .map-result-coords{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    /* EMPTY / ERROR */

    .empty{
      padding:70px 0;
      color:var(--muted);
      text-align:center;
    }

    .error{
      min-height:120px;
      max-width:680px;
      margin:0;
      padding:28px 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      border:1px solid var(--line2);
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    /* PAGER */

    .pager{
      display:flex;
      gap:8px;
      padding-top:10px;
    }

    .pager button{
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      border-radius:4px;
      padding:8px 12px;
      cursor:pointer;
    }

    .pager button:hover{
      border-color:var(--focus);
    }

    /* AUTOCOMPLETE */

    .flibidoo-suggest-wrap{
      position:relative;
    }

    .flibidoo-suggestions{
      position:absolute;
      left:0;
      right:0;
      top:calc(100% + 4px);
      z-index:100;
      background:#1d0c22;
      border:1px solid rgba(255,255,255,.14);
      border-radius:8px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
    }

    .flibidoo-suggestions[hidden]{
      display:none;
    }

    .flibidoo-suggestion{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      border:0;
      background:transparent;
      color:#fff;
      text-align:left;
      padding:10px 13px;
      font:inherit;
      font-size:13px;
      cursor:pointer;
    }

    .flibidoo-suggestion:hover,
    .flibidoo-suggestion.active{
      background:rgba(255,255,255,.07);
    }

    .flibidoo-suggestion img{
      width:24px;
      height:24px;
      object-fit:cover;
      border-radius:50%;
    }

    .flibidoo-suggestion small{
      display:block;
      color:rgba(255,255,255,.55);
      margin-top:2px;
    }

    /* FOOTER */

    footer{
      height:56px;
      border-top:1px solid var(--line2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:var(--muted);
      font-size:12px;
      padding:0 20px;
    }

    .footer-links{
      display:flex;
      gap:16px;
    }

    .footer-links a{
      text-decoration:none;
    }

    .footer-links a:hover{
      text-decoration:underline;
      color:var(--text);
    }

    .hidden{
      display:none!important;
    }

    /*
      TABLET
      Dictionary remains on the right and sticky.
    */

    @media(max-width:900px) and (min-width:701px){

      .shell{
        width:min(calc(100% - 48px),1120px);
      }

      .results{
        padding-left:24px;
        padding-right:24px;
      }

      .results-layout{
        grid-template-columns:minmax(0,1fr) 290px;
        gap:28px;
      }

      .dictionary{
        top:20px;
        max-height:calc(100vh - 40px);
      }

      .image-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    /*
      PHONE / VERTICAL DEVICES
      Dictionary becomes the first item above results.
      Sticky is explicitly disabled.
    */

    @media(max-width:700px){

      .shell{
        width:calc(100% - 28px);
      }

      .home{
        min-height:calc(100vh - 58px);
        padding:
          30px 14px
          80px;
      }

      .hero-logo{
        width:150px;
      }

      h1{
        font-size:36px;
        margin-bottom:24px;
      }

      form{
        height:50px;
      }

      .results{
        padding:
          22px 14px
          60px;
      }

      .results-head{
        gap:12px;
        flex-wrap:wrap;
      }

      .results-brand img{
        width:24px;
        height:24px;
      }

      .results-brand span{
        font-size:14px;
      }

      .results-query{
        order:3;
        flex-basis:100%;
        font-size:13px;
      }

      .count{
        margin-left:auto;
      }

      .results-search{
        width:100%;
      }

      .search-types{
        margin-top:8px;
      }

      .search-type{
        padding-left:10px;
        padding-right:10px;
        font-size:12px;
      }

      /*
        Important:
        Grid order puts dictionary ABOVE results.
      */

      .results-layout{
        display:flex;
        flex-direction:column;
        gap:26px;
      }

      .dictionary{
        order:1;
        width:100%;
        border-left:0;
        border-top:1px solid var(--line2);
        padding:
          24px 0 0;

        /*
          No sticky behavior on phones.
        */
        position:static;
        top:auto;

        max-height:none;
        overflow:visible;

        transition:
          padding .25s ease,
          opacity .2s ease;
      }

      .results-main{
        order:2;
        width:100%;
      }

      .dictionary-title{
        font-size:21px;
      }

      .translate-message{
        width:100%;
        margin-bottom:18px;
      }

      .image-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:22px 14px;
      }

      .footer-links{
        gap:10px;
      }
    }

    @media(max-width:460px){

      .shell{
        width:calc(100% - 24px);
      }

      .home{
        padding-left:12px;
        padding-right:12px;
      }

      .results{
        padding-left:12px;
        padding-right:12px;
      }

      .image-grid{
        grid-template-columns:1fr;
      }

      .links{
        gap:15px;
      }

      .results-brand span{
        font-size:13px;
      }

      .count{
        font-size:12px;
      }
    }

    /*
      EXTRA SMALL DEVICES
      Gives search controls breathing room.
    */

    @media(max-width:360px){

      .home{
        padding-left:8px;
        padding-right:8px;
      }

      .results{
        padding-left:8px;
        padding-right:8px;
      }

      input{
        font-size:15px;
        padding-left:10px;
        padding-right:8px;
      }

      .search-icon{
        margin-left:13px;
      }

      .submit{
        margin-right:6px;
      }
    }
  </style>
</head>

<body>

<main>

  <!-- HOME -->

  <section id="home" class="home shell">

    <img
      class="hero-logo"
      src="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
      alt="FlibidooSearch logo"
    />

    <h1>
      <span class="brand-flibidoo">Flibidoo</span>Search
    </h1>

    <div class="search-wrap">

      <form id="searchForm" role="search">

        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="10.8"
            cy="10.8"
            r="6.8"
            stroke-width="1.7"
          />
          <path
            d="m16 16 5 5"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>

        <input
          id="q"
          name="q"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web"
          aria-label="Search the web"
        />

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="Search"
          title="Search"
        >
          <svg
            class="submit-icon"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M5 12h14"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="m12 5 7 7-7 7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"

FLIBIDOOSEARCH CONFIGURATION

const WORKER_URL =

/*

DOM

  document.querySelector('#translateMessage');

let currentPage = 0;

/*
==========================================================
UTILITY
==========================================================
*/

function api(path, params = {}) {

  const url =
    new URL(
      path,
      WORKER_URL
    );

  Object.entries(params).forEach(
    ([key,value]) => {
      if(
        value !== undefined &&
        value !== null
      ){
        url.searchParams.set(
          key,
          value
        );
      }
    }
  );

  return url.toString();
}


function esc(s = '') {

  return String(s).replace(
    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );
}


function updateButtonState(
  button,
  value
){

  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );
}


function normalize(s = ''){

  return s
    .toLowerCase()
    .trim()
    .replace(
      /[“”"'.,!?;:()[\]{}]/g,
      ''
    )
    .replace(
      /\s+/g,
      ' '
    );
}


/*
==========================================================
DICTIONARY WORD DETECTION
==========================================================
*/

function levenshtein(a,b){

  const prev =
    Array.from(
      {length:b.length + 1},
      (_,i) => i
    );

  for(
    let i = 1;
    i <= a.length;
    i++
  ){

    const cur = [i];

    for(
      let j = 1;
      j <= b.length;
      j++
    ){

      cur[j] =
        Math.min(
          cur[j - 1] + 1,
          prev[j] + 1,
          prev[j - 1] +
          (
            a[i - 1] === b[j - 1]
              ? 0
              : 1
          )
        );
    }

    for(
      let j = 0;
      j <= b.length;
      j++
    ){
      prev[j] = cur[j];
    }
  }

  return prev[b.length];
}


function dictionaryWord(query){

  const q =
    normalize(query);

  if(!q){
    return null;
  }

  const words =
    q.split(' ');

  if(words.length === 1){
    return q;
  }

  const candidates =
    new Set();

  for(const word of words){

    if(
      /^[a-z][a-z'-]*$/i.test(word)
    ){

      candidates.add(
        word.replace(
          /^['-]+|['-]+$/g,
          ''
        )
      );
    }
  }

  for(const word of candidates){

    const templates = [

      `meaning of ${word}`,

      `${word} meaning`,

      `${word} means`,

      `${word} definition`,

      `definition of ${word}`

    ];

    for(
      const template of templates
    ){

      if(
        levenshtein(
          q,
          template
        ) <= 3
      ){

        return word;
      }
    }
  }

  return null;
}


/*
==========================================================
ENGLISH-FIRST DICTIONARY
==========================================================
*/

function prioritizeEnglish(entries){

  if(
    !Array.isArray(entries) ||
    !entries.length
  ){
    return [];
  }

  return [...entries].sort(
    (a,b) => {

      const aCode =
        String(
          a?.language?.code || ''
        ).toLowerCase();

      const aName =
        String(
          a?.language?.name || ''
        ).toLowerCase();

      const bCode =
        String(
          b?.language?.code || ''
        ).toLowerCase();

      const bName =
        String(
          b?.language?.name || ''
        ).toLowerCase();

      const aEnglish =
        aCode === 'en' ||
        aName === 'english';

      const bEnglish =
        bCode === 'en' ||
        bName === 'english';

      if(
        aEnglish &&
        !bEnglish
      ){
        return -1;
      }

      if(
        bEnglish &&
        !aEnglish
      ){
        return 1;
      }

      return 0;
    }
  );
}


/*
==========================================================
TRANSLATE QUERY DETECTION
==========================================================
*/

function isTranslationQuery(query){

  const q =
    normalize(query);

  if(!q){
    return false;
  }


  /*
    Examples:

    translate hello
    translator
    translated word
    translate this to english
    hello to english
    english to spanish
  */

  if(
    /\bto english\b/i.test(q) ||
    /\benglish to\b/i.test(q) ||
    /\btranslate\b/i.test(q) ||
    /\btranslator\b/i.test(q) ||
    /\btranslated\b/i.test(q)
  ){
    return true;
  }


  /*
    Examples:

    say hello in spanish
    say good morning in japanese
    say hello in french
  */

  if(
    /^say\s+.+\s+in\s+.+$/i.test(q)
  ){
    return true;
  }


  return false;
}


function updateTranslateMessage(query){

  if(
    isTranslationQuery(query)
  ){

    translateMessage.classList.add(
      'show'
    );

  }else{

    translateMessage.classList.remove(
      'show'
    );
  }
}


/*
==========================================================
RICH TEXT
==========================================================
*/

window.flibidooRichText =
function(value){

  let src =
    String(value ?? '');

  if(!src){
    return '';
  }


  const ta =
    document.createElement(
      'textarea'
    );

  ta.innerHTML = src;

  src = ta.value;


  src = src
    .replace(
      /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi,
      ''
    )
    .replace(
      /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*\/?>/gi,
      ''
    )
    .replace(
      /\s+on[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi,
      ''
    )
    .replace(
      /\s+(href|src)\s*=\s*(['"])\s*javascript:[\s\S]*?\2/gi,
      ''
    );


  const allowed = [];


  src =
    src.replace(
      /<\/?(strong|b|em|i|u|s|del|mark|small|br|code|kbd|sub|sup|a)(?:\s+[^>]*)?>/gi,
      m => {

        const idx =
          allowed.push(m) - 1;

        return `@@FLIBIDOO_TAG_${idx}@@`;
      }
    );


  src =
    src
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      );


  src =
    src.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" rel="noopener noreferrer">$1</a>'
    );


  src =
    src.replace(
      /`([^`]+)`/g,
      '<code>$1</code>'
    );


  src =
    src.replace(
      /\*\*([^*]+)\*\*/g,
      '<strong>$1</strong>'
    );


  src =
    src.replace(
      /__([^_]+)__/g,
      '<strong>$1</strong>'
    );


  src =
    src.replace(
      /~~([^~]+)~~/g,
      '<del>$1</del>'
    );


  src =
    src.replace(
      /(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;])/g,
      '$1<em>$2</em>'
    );


  src =
    src.replace(
      /(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?:;])/g,
      '$1<em>$2</em>'
    );


  src =
    src.replace(
      /^#{1,6}\s+(.+)$/gm,
      '<strong>$1</strong>'
    );


  src =
    src.replace(
      /^\s*[-*]\s+(.+)$/gm,
      '• $1'
    );


  src =
    src.replace(
      /^\s*\d+\.\s+(.+)$/gm,
      '$1'
    );


  src =
    src.replace(
      /@@FLIBIDOO_TAG_(\d+)@@/g,
      (_,i) =>
        allowed[Number(i)] || ''
    );


  return src.replace(
    /\r?\n/g,
    '<br>'
  );
};


/*
==========================================================
DICTIONARY RENDERING
==========================================================
*/

function dictionaryTags(tags){

  if(
    !Array.isArray(tags) ||
    !tags.length
  ){
    return '';
  }

  return `
    <span class="dictionary-tags">
      (${tags.map(esc).join(', ')})
    </span>
  `;
}


function renderSense(
  sense,
  depth = 0
){

  if(!sense){
    return '';
  }

  let html = `
    <div
      class="dictionary-sense"
      style="margin-left:${Math.min(depth,3)*12}px"
    >
  `;


  if(sense.definition){

    html += `
      <div class="dictionary-definition">
        ${esc(sense.definition)}
        ${dictionaryTags(sense.tags)}
      </div>
    `;
  }


  if(
    Array.isArray(sense.examples)
  ){

    sense.examples.forEach(
      example => {

        if(example){

          html += `
            <div class="dictionary-example">
              “${esc(example)}”
            </div>
          `;
        }
      }
    );
  }


  if(
    Array.isArray(sense.quotes)
  ){

    sense.quotes.forEach(
      quote => {

        if(quote?.text){

          html += `
            <div class="dictionary-quote">
              “${esc(quote.text)}”
              ${
                quote.reference
                  ? ` — ${esc(quote.reference)}`
                  : ''
              }
            </div>
          `;
        }
      }
    );
  }


  if(
    Array.isArray(sense.synonyms) &&
    sense.synonyms.length
  ){

    html += `
      <div class="dictionary-relations">
        <div class="dictionary-label">
          Synonyms
        </div>

        <div>
          ${sense.synonyms.map(esc).join(', ')}
        </div>
      </div>
    `;
  }


  if(
    Array.isArray(sense.antonyms) &&
    sense.antonyms.length
  ){

    html += `
      <div class="dictionary-relations">
        <div class="dictionary-label">
          Antonyms
        </div>

        <div>
          ${sense.antonyms.map(esc).join(', ')}
        </div>
      </div>
    `;
  }


  if(
    Array.isArray(sense.translations) &&
    sense.translations.length
  ){

    html += `
      <div class="dictionary-translations">

        <div class="dictionary-label">
          Translations
        </div>

        <ul class="dictionary-list">
    `;


    sense.translations.forEach(
      translation => {

        if(translation?.word){

          html += `
            <li>
              ${
                esc(
                  translation.language?.name ||
                  translation.language?.code ||
                  ''
                )
              }

              —

              ${esc(translation.word)}
            </li>
          `;
        }
      }
    );


    html += `
        </ul>
      </div>
    `;
  }


  if(
    Array.isArray(sense.subsenses)
  ){

    sense.subsenses.forEach(
      sub =>
        html += renderSense(
          sub,
          depth + 1
        )
    );
  }


  return html + '</div>';
}


function renderDictionary(data){

  if(
    !data?.entries?.length
  ){

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML = '';

    return;
  }


  /*
    English entries are intentionally
    moved to the top.
  */

  const entries =
    prioritizeEnglish(
      data.entries
    );


  let html = `

    <h2 class="dictionary-title">
      ${esc(data.word || '')}
    </h2>

    <div class="dictionary-word">
      Dictionary
    </div>

  `;


  entries.forEach(
    entry => {

      html += `
        <section class="dictionary-entry">
      `;


      const language =
        entry.language?.name ||
        entry.language?.code;


      if(language){

        html += `
          <div class="dictionary-language">
            ${esc(language)}
            ${
              entry.language?.code
                ? ` (${esc(entry.language.code)})`
                : ''
            }
          </div>
        `;
      }


      if(entry.partOfSpeech){

        html += `
          <div class="dictionary-pos">
            ${esc(entry.partOfSpeech)}
          </div>
        `;
      }


      if(
        Array.isArray(
          entry.pronunciations
        ) &&
        entry.pronunciations.length
      ){

        html += `
          <div class="dictionary-pronunciations">

            <div class="dictionary-label">
              Pronunciations
            </div>

            <ul class="dictionary-list">
        `;


        entry.pronunciations.forEach(
          pronunciation => {

            if(
              pronunciation?.text
            ){

              html += `
                <li>
                  ${esc(pronunciation.text)}
                  ${
                    pronunciation.type
                      ? ` — ${esc(pronunciation.type)}`
                      : ''
                  }
                  ${dictionaryTags(
                    pronunciation.tags
                  )}
                </li>
              `;
            }
          }
        );


        html += `
            </ul>
          </div>
        `;
      }


      if(
        Array.isArray(entry.forms) &&
        entry.forms.length
      ){

        html += `
          <div class="dictionary-forms">

            <div class="dictionary-label">
              Forms
            </div>

            <ul class="dictionary-list">
        `;


        entry.forms.forEach(
          form => {

            if(form?.word){

              html += `
                <li>
                  ${esc(form.word)}
                  ${dictionaryTags(form.tags)}
                </li>
              `;
            }
          }
        );


        html += `
            </ul>
          </div>
        `;
      }


      if(
        Array.isArray(entry.senses) &&
        entry.senses.length
      ){

        html += `
          <div class="dictionary-senses">

            <div class="dictionary-label">
              Definitions
            </div>
        `;


        entry.senses.forEach(
          sense => {
            html += renderSense(
              sense
            );
          }
        );


        html += `
          </div>
        `;
      }


      if(
        Array.isArray(entry.synonyms) &&
        entry.synonyms.length
      ){

        html += `
          <div class="dictionary-relations">

            <div class="dictionary-label">
              Synonyms
            </div>

            <div>
              ${entry.synonyms.map(esc).join(', ')}
            </div>

          </div>
        `;
      }


      if(
        Array.isArray(entry.antonyms) &&
        entry.antonyms.length
      ){

        html += `
          <div class="dictionary-relations">

            <div class="dictionary-label">
              Antonyms
            </div>

            <div>
              ${entry.antonyms.map(esc).join(', ')}
            </div>

          </div>
        `;
      }


      html += `
        </section>
      `;
    }
  );


  if(data.source){

    html += `
      <div class="dictionary-source">

        Source:

        ${
          data.source.url
            ? `
              <a
                href="${esc(data.source.url)}"
                rel="noopener noreferrer"
              >
                ${esc(data.source.url)}
              </a>
            `
            : ''
        }

        ${
          data.source.license
            ? `
              <br>
              License:
              ${
                data.source.license.url
                  ? `
                    <a
                      href="${esc(data.source.license.url)}"
                      rel="noopener noreferrer"
                    >
                      ${esc(
                        data.source.license.name ||
                        'License'
                      )}
                    </a>
                  `
                  : esc(
                      data.source.license.name ||
                      ''
                    )
              }
            `
            : ''
        }

      </div>
    `;
  }


  dictionary.innerHTML =
    html;

  dictionary.classList.remove(
    'hidden'
  );
}


/*
==========================================================
LOAD DICTIONARY
==========================================================
*/

async function loadDictionary(q){

  const word =
    dictionaryWord(q);


  if(!word){

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML = '';

    return;
  }


  dictionary.classList.remove(
    'hidden'
  );


  dictionary.innerHTML = `
    <div class="dictionary-loading">
      Looking up the definition…
    </div>
  `;


  try{

    const response =
      await fetch(
        api('/api/dictionary',{
          word
        })
      );


    if(!response.ok){

      dictionary.classList.add(
        'hidden'
      );

      return;
    }


    const data =
      await response.json();


    if(
      data?.entries?.length
    ){

      renderDictionary(
        data
      );

    }else{

      dictionary.classList.add(
        'hidden'
      );

      dictionary.innerHTML = '';
    }

  }catch(error){

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML = '';
  }
}


/*
==========================================================
RENDER SEARCH RESULTS
==========================================================
*/

function render(data){

  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );


  currentType =
    data.type ||
    currentType;


  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';


  const resultsArray =
    Array.isArray(data.results)
      ? data.results
      : [];


  count.textContent =
    resultsArray.length
      ? `${resultsArray.length} results`
      : '';


  resultsInput.value =
    data.query || '';


  updateButtonState(
    resultsSubmitButton,
    resultsInput.value
  );


  updateTranslateMessage(
    data.query || currentQ
  );


  document
    .querySelectorAll(
      '.search-type'
    )
    .forEach(
      button =>
        button.classList.toggle(
          'active',
          button.dataset.type ===
          currentType
        )
    );


  list.innerHTML = '';

  pager.innerHTML = '';


  if(!resultsArray.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    return;
  }


  /*
  IMAGES
  */

  if(currentType === 'images'){

    const grid =
      document.createElement(
        'div'
      );

    grid.className =
      'image-grid';


    resultsArray.forEach(
      result => {

        const url =
          result.url ||
          result.properties?.url ||
          '';

        const image =
          result.thumbnail ||
          result.properties?.url ||
          '';


        if(!image){
          return;
        }


        const element =
          document.createElement(
            'article'
          );

        element.className =
          'image-result';


        element.innerHTML = `

          <a
            href="${esc(url)}"
            rel="noopener noreferrer"
          >

            <img
              src="${esc(image)}"
              alt="${esc(result.title || '')}"
              loading="lazy"
              referrerpolicy="no-referrer"
            />

          </a>

          <div class="image-result-title">
            ${esc(result.title || url)}
          </div>

          <div class="image-result-source">
            ${esc(
              result.source ||
              result.meta_url?.hostname ||
              ''
            )}
          </div>

        `;


        grid.appendChild(
          element
        );
      }
    );


    if(grid.children.length){

      list.appendChild(
        grid
      );

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';
    }


  /*
  MAPS
  */

  }else if(currentType === 'map'){

    resultsArray.forEach(
      result => {

        const element =
          document.createElement(
            'article'
          );

        element.className =
          'map-result';


        const url =
          result.url || '';

        const title =
          result.title ||
          'Map result';


        const address =
          result.address
            ? Object.values(
                result.address
              )
              .filter(Boolean)
              .join(', ')
            : (
                result.description ||
                ''
              );


        element.innerHTML = `

          <h2 class="map-result-title">

            <a
              href="${esc(url)}"
              rel="noopener noreferrer"
            >
              ${esc(title)}
            </a>

          </h2>

          <div class="map-result-address">
            ${esc(address)}
          </div>

          ${
            result.lat &&
            result.lon
              ? `
                <div class="map-result-coords">
                  ${esc(result.lat)},
                  ${esc(result.lon)}
                </div>
              `
              : ''
          }

        `;


        list.appendChild(
          element
        );
      }
    );


  /*
  WEB + NEWS
  */

  }else{

    resultsArray.forEach(
      result => {

        const element =
          document.createElement(
            'article'
          );

        element.className =
          'result';


        const url =
          result.url || '';

        const favicon =
          result.meta_url?.favicon ||
          '';

        const host =
          result.meta_url?.hostname ||
          '';

        const title =
          result.title ||
          url;

        const description =
          result.description ||
          result.content ||
          '';

        const age =
          result.age ||
          result.publishedDate ||
          '';

        const thumb =
          result.thumbnail?.src ||
          result.thumbnail ||
          '';


        element.innerHTML = `

          <div class="result-url">

            ${
              favicon
                ? `
                  <img
                    class="result-favicon"
                    src="${esc(favicon)}"
                    alt=""
                    loading="lazy"
                    referrerpolicy="no-referrer"
                  />
                `
                : ''
            }

            <span>
              ${esc(host || url)}
            </span>

          </div>


          <h2>

            <a
              href="${esc(url)}"
              rel="noopener noreferrer"
            >
              ${esc(title)}
            </a>

          </h2>


          ${
            description
              ? `
                <p class="snippet">
                  ${window.flibidooRichText(description)}
                </p>
              `
              : ''
          }


          ${
            age
              ? `
                <div class="result-meta">
                  ${esc(age)}
                </div>
              `
              : ''
          }


          ${
            thumb
              ? `
                <div class="result-inline-thumb">

                  <img
                    src="${esc(thumb)}"
                    alt=""
                    loading="lazy"
                    referrerpolicy="no-referrer"
                  />

                </div>
              `
              : ''
          }

        `;


        list.appendChild(
          element
        );
      }
    );
  }


  /*
  PAGINATION
  */

  const hasMore =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const button =
      document.createElement(
        'button'
      );

    button.textContent =
      'Previous';


    button.onclick =
      () =>
        search(
          currentQ,
          currentPage - 1,
          currentType
        );


    pager.appendChild(
      button
    );
  }


  if(hasMore){

    const button =
      document.createElement(
        'button'
      );

    button.textContent =
      'Next';


    button.onclick =
      () =>
        search(
          currentQ,
          currentPage + 1,
          currentType
        );


    pager.appendChild(
      button
    );
  }


  /*
  UPDATE URL

  This uses the normal site URL,
  not the Worker URL.
  */

  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(
      data.query || currentQ
    )}&type=${encodeURIComponent(
      currentType
    )}&page=${currentPage}`
  );
}


/*
==========================================================
SEARCH
==========================================================
*/

async function search(
  q,
  page = 0,
  type = currentType
){

  q =
    q.trim();


  if(!q){
    return;
  }


  currentQ =
    q;

  currentPage =
    page;

  currentType =
    type;


  input.value =
    q;

  resultsInput.value =
    q;


  updateButtonState(
    submitButton,
    q
  );

  updateButtonState(
    resultsSubmitButton,
    q
  );


  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );


  updateTranslateMessage(
    q
  );


  list.innerHTML =
    '<div class="empty">Searching…</div>';


  count.textContent =
    '';


  label.textContent =
    `Results for “${q}”`;


  pager.innerHTML =
    '';


  document
    .querySelectorAll(
      '.search-type'
    )
    .forEach(
      button =>
        button.classList.toggle(
          'active',
          button.dataset.type ===
          currentType
        )
    );


  /*
    Dictionary starts independently.
    It doesn't prevent web search.
  */

  const dictionaryPromise =
    currentType === 'web'
      ? loadDictionary(q)
      : Promise.resolve();


  try{

    const response =
      await fetch(
        api('/api/search',{
          q,
          page,
          type:currentType
        })
      );


    let data;

    try{

      data =
        await response.json();

    }catch(error){

      throw new Error(
        'Search server returned invalid data.'
      );
    }


    if(!response.ok){

      throw new Error(
        data.error ||
        'Search failed.'
      );
    }


    render(
      data
    );


  }catch(error){

    list.innerHTML = `
      <div class="error">
        ${esc(
          error.message ||
          'Search failed. Please try again.'
        )}
      </div>
    `;
  }


  await dictionaryPromise;
}


/*
==========================================================
INPUT EVENTS
==========================================================
*/

input.addEventListener(
  'input',
  () =>
    updateButtonState(
      submitButton,
      input.value
    )
);


updateButtonState(
  submitButton,
  input.value
);


resultsInput.addEventListener(
  'input',
  () =>
    updateButtonState(
      resultsSubmitButton,
      resultsInput.value
    )
);


updateButtonState(
  resultsSubmitButton,
  resultsInput.value
);


/*
==========================================================
FORMS
==========================================================
*/

form.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    search(
      input.value,
      0,
      currentType
    );
  }
);


resultsForm.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    search(
      resultsInput.value,
      0,
      currentType
    );
  }
);


/*
==========================================================
CLEAR
==========================================================
*/

document
  .querySelector('#clear')
  .onclick = () => {

    input.value = '';

    input.focus();

    updateButtonState(
      submitButton,
      input.value
    );
  };


/*
==========================================================
I'M FEELING LUCKY
==========================================================
*/

document
  .querySelector('#lucky')
  .onclick = async () => {

    const q =
      input.value.trim();


    if(!q){
      return;
    }


    /*
      Translation queries should go
      to FlibidooTranslate instead.
    */

    if(
      isTranslationQuery(q)
    ){

      window.location.href =
        'https://flibidoo-translate.devs.surf';

      return;
    }


    try{

      const response =
        await fetch(
          api('/api/search',{
            q,
            page:0,
            type:currentType
          })
        );


      const data =
        await response.json();


      if(
        data.results?.[0]?.url
      ){

        location.href =
          data.results[0].url;

      }else{

        search(
          q,
          0,
          currentType
        );
      }


    }catch(error){

      search(
        q,
        0,
        currentType
      );
    }
  };


/*
==========================================================
SEARCH TYPE BUTTONS
==========================================================
*/

document
  .querySelectorAll(
    '.search-type'
  )
  .forEach(
    button => {

      button.addEventListener(
        'click',
        () => {

          const q =
            resultsInput.value ||
            currentQ;


          search(
            q,
            0,
            button.dataset.type
          );
        }
      );
    }
  );


/*
==========================================================
INITIAL URL SEARCH
==========================================================
*/

const params =
  new URLSearchParams(
    location.search
  );


const initialQuery =
  params.get('q');


const initialPage =
  Math.max(
    0,
    Number(
      params.get('page') ||
      0
    )
  );


const initialType =
  [
    'web',
    'images',
    'news',
    'map'
  ].includes(
    params.get('type')
  )
    ? params.get('type')
    : 'web';


if(initialQuery){

  search(
    initialQuery,
    initialPage,
    initialType
  );
}


/*
==========================================================
AUTOCOMPLETE
==========================================================
*/

(() => {

  const inputs = [
    ...document.querySelectorAll(
      '#q,#resultsQ'
    )
  ];


  if(!inputs.length){
    return;
  }


  let timer = null;

  let controller = null;

  let selected = -1;

  let items = [];


  function setup(input){

    const wrap =
      input.closest('form') ||
      input.parentElement;


    wrap.classList.add(
      'flibidoo-suggest-wrap'
    );


    const box =
      document.createElement(
        'div'
      );


    box.className =
      'flibidoo-suggestions';

    box.hidden =
      true;


    wrap.appendChild(
      box
    );


    function close(){

      box.hidden =
        true;

      box.innerHTML =
        '';

      selected =
        -1;
    }


    function choose(q){

      input.value =
        q;

      close();


      const form =
        input.closest('form');


      if(form){
        form.requestSubmit();
      }
    }


    async function load(){

      const q =
        input.value.trim();


      if(q.length < 2){

        close();

        return;
      }


      if(controller){

        controller.abort();
      }


      controller =
        new AbortController();


      try{

        const response =
          await fetch(
            api('/api/suggest',{
              q
            }),
            {
              signal:
                controller.signal
            }
          );


        if(!response.ok){

          throw new Error();
        }


        const data =
          await response.json();


        items =
          Array.isArray(
            data.suggestions
          )
            ? data.suggestions.slice(
                0,
                8
              )
            : [];


        if(!items.length){

          close();

          return;
        }


        box.innerHTML =
          items.map(
            (item,index) => `

              <button
                class="flibidoo-suggestion"
                type="button"
                data-i="${index}"
              >

                ${
                  item.img
                    ? `
                      <img
                        src="${esc(item.img)}"
                        alt=""
                        loading="lazy"
                        referrerpolicy="no-referrer"
                      />
                    `
                    : ''
                }

                <span>

                  ${esc(
                    item.query
                  )}

                  ${
                    item.entity &&
                    item.desc
                      ? `
                        <small>
                          ${esc(item.desc)}
                        </small>
                      `
                      : ''
                  }

                </span>

              </button>
            `
          ).join('');


        box.hidden =
          false;


        box
          .querySelectorAll(
            'button'
          )
          .forEach(
            button => {

              button.addEventListener(
                'mousedown',
                event => {

                  event.preventDefault();


                  const item =
                    items[
                      Number(
                        button.dataset.i
                      )
                    ];


                  if(item){

                    choose(
                      item.query
                    );
                  }
                }
              );
            }
          );


      }catch(error){

        close();
      }
    }


    input.addEventListener(
      'input',
      () => {

        clearTimeout(
          timer
        );


        timer =
          setTimeout(
            load,
            180
          );
      }
    );


    input.addEventListener(
      'keydown',
      event => {

        if(box.hidden){
          return;
        }


        if(
          event.key ===
          'ArrowDown'
        ){

          event.preventDefault();

          selected =
            Math.min(
              selected + 1,
              items.length - 1
            );

        }else if(
          event.key ===
          'ArrowUp'
        ){

          event.preventDefault();

          selected =
            Math.max(
              selected - 1,
              -1
            );

        }else if(
          event.key ===
          'Enter' &&
          selected >= 0
        ){

          event.preventDefault();

          choose(
            items[selected].query
          );

        }else if(
          event.key ===
          'Escape'
        ){

          close();

          return;
        }


        box
          .querySelectorAll(
            'button'
          )
          .forEach(
            (button,index) => {

              button.classList.toggle(
                'active',
                index === selected
              );
            }
          );
      }
    );


    document.addEventListener(
      'click',
      event => {

        if(
          !wrap.contains(
            event.target
          )
        ){

          close();
        }
      }
    );
  }


  inputs.forEach(
    setup
  );

})();

</script>
