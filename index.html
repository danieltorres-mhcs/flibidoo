<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">

<title>FlibidooSearch</title>

<link
  rel="icon"
  type="image/png"
  href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

a{
  color:inherit;
}

button,
input{
  font-family:inherit;
}

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px;
}


/* =========================================================
   HOME
   ========================================================= */

#home.home{
  width:100%;
  height:100vh;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.home-inner{
  width:min(100%,760px);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.hero-logo{
  width:min(360px,72vw);
  max-width:360px;
  height:auto;
  display:block;
  margin:0 auto 22px;
  object-fit:contain;

  /*
   * Very subtle fading around the image edges.
   * This doesn't alter the actual PNG.
   */
  -webkit-mask-image:
    radial-gradient(
      ellipse at center,
      #000 68%,
      rgba(0,0,0,.92) 82%,
      transparent 100%
    );
  mask-image:
    radial-gradient(
      ellipse at center,
      #000 68%,
      rgba(0,0,0,.92) 82%,
      transparent 100%
    );
}

h1{
  font-size:clamp(34px,5vw,54px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500;
}

h1 em{
  font-style:normal;
}

.search-wrap{
  width:min(100%,680px);
}

form{
  display:flex;
  align-items:center;
  height:54px;
  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;

  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:
    0 0 0 2px rgba(205,184,209,.08);
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 14px;
}

input::placeholder{
  color:#9e8da1;
}


/* =========================================================
   SEARCH BUTTON / ARROW
   ========================================================= */

.submit{
  height:38px;
  width:38px;
  margin-right:8px;

  border:1px solid var(--line);
  background:transparent;
  color:#766679;

  border-radius:50%;
  padding:0;

  display:grid;
  place-items:center;

  cursor:pointer;

  transition:
    color .15s ease,
    border-color .15s ease,
    background .15s ease;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
  color:var(--text);
  background:rgba(255,255,255,.03);
}

.submit:active{
  transform:scale(.96);
}

.submit svg{
  width:19px;
  height:19px;
  display:block;
  fill:currentColor;
}


/* =========================================================
   HOME LINKS
   ========================================================= */

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;

  margin-top:20px;

  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  color:var(--muted);

  font-size:12px;
  line-height:1.4;
  text-align:center;
}

.confederacy-credit img{
  width:18px;
  height:18px;

  display:block;
  object-fit:contain;

  flex:0 0 18px;

  border-radius:4px;
}


/* =========================================================
   MAIN
   ========================================================= */

main{
  flex:1;
}


/* =========================================================
   RESULTS
   ========================================================= */

.results{
  padding:30px 12px 70px;
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;

  min-height:44px;

  border-bottom:1px solid var(--line2);

  padding-bottom:14px;
  margin-bottom:14px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;

  text-decoration:none;
  color:inherit;

  white-space:nowrap;
}

.results-brand img{
  width:32px;
  height:32px;

  object-fit:contain;
  display:block;

  flex:0 0 32px;
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}


/* =========================================================
   RESULTS SEARCH
   ========================================================= */

.results-search{
  width:min(100%,680px);
  margin:0 0 20px;
}

.results-search form{
  height:48px;
}

.results-search .submit{
  width:34px;
  height:34px;
  margin-right:6px;
}

.results-search .submit svg{
  width:17px;
  height:17px;
}


/* =========================================================
   SEARCH TYPES
   ========================================================= */

.search-types{
  display:flex;
  align-items:flex-end;

  gap:0;

  margin:8px 0 18px;

  border-bottom:1px solid rgba(255,255,255,.12);

  height:36px;
}

.search-type{
  position:relative;

  appearance:none;

  border:0;
  background:transparent;

  color:rgba(255,255,255,.62);

  font:inherit;
  font-size:13px;

  line-height:20px;

  padding:0 12px 10px;

  margin:0;

  border-radius:0;

  cursor:pointer;
}

.search-type:hover{
  color:#fff;
  background:transparent;
}

.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";

  position:absolute;

  left:10px;
  right:10px;

  bottom:-1px;

  height:2px;

  border-radius:2px 2px 0 0;

  background:currentColor;
}


/* =========================================================
   RESULTS LAYOUT
   ========================================================= */

.results-layout{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    330px;

  gap:42px;

  align-items:start;
}


/* =========================================================
   WEB RESULTS
   ========================================================= */

.result{
  padding:0 0 26px;
  margin-bottom:26px;

  border-bottom:1px solid var(--line2);
}

.result-top{
  display:flex;
  align-items:center;

  gap:9px;

  min-width:0;

  margin-bottom:7px;
}

.result-favicon{
  width:18px;
  height:18px;

  flex:0 0 18px;

  object-fit:contain;

  border-radius:3px;

  background:rgba(255,255,255,.04);
}

.result-url{
  font-size:13px;
  color:var(--url);

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  min-width:0;
}

.result h2{
  font-size:20px;
  line-height:1.25;

  margin:0 0 7px;

  font-weight:500;

  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.result-content{
  display:flex;
  align-items:flex-start;

  gap:18px;

  min-width:0;
}

.result-text{
  min-width:0;
  flex:1;
}

.snippet{
  font-size:14px;
  line-height:1.6;

  color:var(--result);

  margin:0;

  max-width:760px;
}

.result-meta{
  font-size:12px;
  color:var(--muted);

  margin-top:7px;
}

.result-thumbnail{
  width:120px;
  height:80px;

  flex:0 0 120px;

  object-fit:cover;

  border-radius:6px;

  border:1px solid var(--line2);

  background:rgba(255,255,255,.02);
}


/* =========================================================
   IMAGE RESULTS
   ========================================================= */

.image-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-result img{
  display:block;

  width:100%;

  aspect-ratio:4/3;

  object-fit:cover;

  border:1px solid var(--line2);

  background:rgba(255,255,255,.02);

  border-radius:6px;
}

.image-result-title{
  font-size:14px;
  line-height:1.4;

  margin-top:9px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);

  margin-top:4px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================================================
   DICTIONARY
   ========================================================= */

.dictionary{
  border-left:1px solid var(--line2);

  padding-left:28px;

  max-height:70vh;

  overflow-y:auto;

  overscroll-behavior:contain;

  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;

  font-weight:500;

  letter-spacing:-.02em;

  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;

  color:var(--muted);

  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;

  margin-bottom:24px;

  border-bottom:1px solid var(--line2);
}

.dictionary-language,
.dictionary-label{
  font-size:12px;
  color:var(--muted);
}

.dictionary-language{
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  text-transform:uppercase;

  letter-spacing:.05em;

  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);

  margin-left:5px;
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;

  color:var(--result);

  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;

  color:var(--muted);
}


/* =========================================================
   EMPTY / ERROR / PAGER
   ========================================================= */

.empty{
  padding:70px 0;

  color:var(--muted);

  text-align:center;
}

.error{
  min-height:120px;

  max-width:680px;

  margin:0;

  padding:28px 18px;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  border:1px solid var(--line2);

  color:var(--muted);

  font-size:14px;

  line-height:1.5;
}

.pager{
  display:flex;

  gap:8px;

  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);

  background:transparent;

  color:var(--text);

  border-radius:4px;

  padding:8px 12px;

  cursor:pointer;
}

.pager button:hover{
  border-color:var(--focus);
}

.hidden{
  display:none!important;
}


/* =========================================================
   ABOUT
   ========================================================= */

.about-overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.62);

  display:grid;

  place-items:center;

  padding:24px;

  z-index:10000;
}

.about-overlay.hidden{
  display:none;
}

.about-card{
  position:relative;

  width:min(100%,560px);

  max-height:min(80vh,700px);

  overflow:auto;

  background:#24132a;

  border:1px solid var(--line);

  border-radius:14px;

  box-shadow:0 20px 60px rgba(0,0,0,.45);

  padding:30px;
}

.about-close{
  position:absolute;

  top:10px;
  right:10px;

  width:34px;
  height:34px;

  border:0;

  border-radius:50%;

  background:transparent;

  color:var(--muted);

  font-size:24px;

  line-height:1;

  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);

  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;

  font-size:25px;

  font-weight:500;
}

.about-card p{
  color:var(--result);

  line-height:1.7;

  font-size:14px;
}

.about-card a{
  color:var(--text);
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr;
  }

  .dictionary{
    order:-1;

    border-left:0;

    border-bottom:1px solid var(--line2);

    border-top:0;

    padding:0 0 26px;

    margin-bottom:26px;

    max-height:none;
  }
}


@media(max-width:760px){

  .image-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:22px 14px;
  }

  .result-content{
    gap:12px;
  }

  .result-thumbnail{
    width:100px;
    height:70px;

    flex-basis:100px;
  }
}


@media(max-width:640px){

  .shell{
    width:100%;

    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:20px 16px;
  }

  .hero-logo{
    width:min(280px,75vw);
    max-width:280px;

    margin-bottom:18px;
  }

  h1{
    font-size:36px;

    margin-bottom:24px;
  }

  form{
    height:50px;
  }

  .results{
    padding:22px 16px 60px;
  }

  .results-head{
    gap:12px;
  }

  .results-brand img{
    width:28px;
    height:28px;

    flex-basis:28px;
  }

  .results-brand span{
    font-size:14px;
  }

  .results-query{
    font-size:13px;
  }

  .search-types{
    overflow-x:auto;

    scrollbar-width:none;
  }

  .search-types::-webkit-scrollbar{
    display:none;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;

    font-size:12px;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}


@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr;
  }

  .result-thumbnail{
    width:84px;
    height:64px;

    flex-basis:84px;
  }

  .result h2{
    font-size:18px;
  }
}
</style>
</head>


<body>

<main>

<!-- =======================================================
     HOME
======================================================= -->

<section id="home" class="home shell">

  <div class="home-inner">

    <img
      class="hero-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="Flibidoo"
    >

    <div class="search-wrap">

      <h1>
        <em><strong>Flibidoo</strong></em>Search
      </h1>

      <form
        id="searchForm"
        role="search"
        autocomplete="off"
      >

        <input
          id="q"
          name="q"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web"
          aria-label="Search the web"
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="Search"
        >

          <!-- Font Awesome arrow supplied by user -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
            aria-hidden="true"
          >
            <path
              d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"
            />
          </svg>

        </button>

      </form>

      <div class="links">

        <button
          type="button"
          id="aboutButton"
        >
          About
        </button>

        <span class="confederacy-credit">

          with love from The Great Confederacy of E

          <img
            src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
            alt=""
            aria-hidden="true"
          >

        </span>

      </div>

    </div>

  </div>

</section>


<!-- =======================================================
     RESULTS
======================================================= -->

<section
  id="results"
  class="results shell hidden"
>

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >

      <img
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt="Flibidoo"
      >

      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>

    </a>

    <div
      id="queryLabel"
      class="results-query"
    ></div>

    <div
      id="count"
      class="count"
    ></div>

  </div>


  <!-- Results search box -->

  <div class="results-search">

    <form
      id="resultsSearchForm"
      role="search"
      autocomplete="off"
    >

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path
            d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"
          />
        </svg>

      </button>

    </form>

  </div>


  <!-- Search categories -->

  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >
      Web
    </button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >
      Images
    </button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >
      News
    </button>

  </nav>


  <!-- Results + dictionary -->

  <div class="results-layout">

    <div>

      <div id="resultList"></div>

      <div
        id="pager"
        class="pager"
      ></div>

    </div>


    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results"
    ></aside>

  </div>

</section>

</main>


<!-- =======================================================
     ABOUT
======================================================= -->

<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle"
>

  <div class="about-card">

    <button
      id="aboutClose"
      class="about-close"
      type="button"
      aria-label="Close About"
    >
      ×
    </button>

    <h2 id="aboutTitle">
      About
    </h2>

    <p>
      Welcome to FlibidooSearch.
    </p>

    <p>
      You can edit this text directly in the HTML
      inside the <strong>about-card</strong>.
    </p>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_BASE =
  'https://working-filibidooo.daniel-torres-a95.workers.dev';


const FLIBIDOO_LOGO =
  'https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG';


const CONFEDERACY_IMAGE =
  'https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png';


/* =========================================================
   DOM
========================================================= */

const form =
  document.querySelector('#searchForm');

const input =
  document.querySelector('#q');

const home =
  document.querySelector('#home');

const results =
  document.querySelector('#results');

const list =
  document.querySelector('#resultList');

const label =
  document.querySelector('#queryLabel');

const count =
  document.querySelector('#count');

const pager =
  document.querySelector('#pager');

const resultsForm =
  document.querySelector('#resultsSearchForm');

const resultsInput =
  document.querySelector('#resultsQ');

const dictionary =
  document.querySelector('#dictionary');

const submitButton =
  document.querySelector('#submitButton');

const resultsSubmitButton =
  document.querySelector('#resultsSubmitButton');


/* =========================================================
   STATE
========================================================= */

let currentQ = '';
let currentPage = 0;
let currentType = 'web';


/* =========================================================
   HELPERS
========================================================= */

function esc(value = ''){

  return String(value).replace(
    /[&<>'"]/g,
    character => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[character])
  );
}


function updateButtonState(button,value){

  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );
}


function getHostname(url){

  if(!url) return '';

  try{
    return new URL(url).hostname;
  }catch{
    return '';
  }
}


/* =========================================================
   FAVICON
========================================================= */

function faviconForResult(result){

  /*
   * Tiago commonly exposes:
   *
   * meta_url.favicon
   *
   * Some result shapes may expose:
   *
   * favicon
   * favicon_url
   */

  const favicon =
    result?.meta_url?.favicon ||
    result?.favicon ||
    result?.favicon_url ||
    '';

  if(favicon){
    return favicon;
  }

  const url =
    result?.url ||
    result?.link ||
    '';

  const host =
    getHostname(url);

  if(!host){
    return '';
  }

  /*
   * Google's favicon endpoint is used only
   * as a fallback.
   */

  return (
    'https://www.google.com/s2/favicons' +
    `?domain=${encodeURIComponent(host)}` +
    '&sz=64'
  );
}


/* =========================================================
   THUMBNAIL
========================================================= */

function thumbnailForResult(result){

  /*
   * Tiago image/OG-style thumbnail possibilities.
   */

  return (
    result?.thumbnail?.src ||
    result?.thumbnail?.url ||
    result?.thumbnail ||
    result?.image?.url ||
    result?.image ||
    result?.properties?.thumbnail ||
    ''
  );
}


/* =========================================================
   DICTIONARY HELPERS
========================================================= */

function normalizeEntries(data){

  if(Array.isArray(data)){
    return data;
  }

  if(
    data &&
    Array.isArray(data.entries)
  ){
    return data.entries;
  }

  if(
    data &&
    Array.isArray(data.data)
  ){
    return data.data;
  }

  return [];
}


function extractText(value){

  if(value == null){
    return '';
  }

  if(typeof value === 'string'){
    return value;
  }

  if(typeof value === 'number'){
    return String(value);
  }

  return '';
}


/* =========================================================
   DICTIONARY RENDER
========================================================= */

function renderDictionary(data,word){

  const entries =
    normalizeEntries(data);

  dictionary.innerHTML = '';

  if(!entries.length){
    dictionary.classList.add('hidden');
    return;
  }

  dictionary.classList.remove('hidden');

  const title =
    document.createElement('h2');

  title.className =
    'dictionary-title';

  title.textContent =
    'Dictionary';

  dictionary.appendChild(title);


  const wordLabel =
    document.createElement('div');

  wordLabel.className =
    'dictionary-word';

  wordLabel.textContent =
    word;

  dictionary.appendChild(wordLabel);


  entries.forEach(entry => {

    const article =
      document.createElement('article');

    article.className =
      'dictionary-entry';


    /*
     * Language
     */

    const language =
      entry.language ||
      entry.lang ||
      '';

    if(language){

      const el =
        document.createElement('div');

      el.className =
        'dictionary-language';

      el.textContent =
        language;

      article.appendChild(el);
    }


    /*
     * Part of speech
     */

    const pos =
      entry.partOfSpeech ||
      entry.part_of_speech ||
      entry.pos ||
      '';

    if(pos){

      const el =
        document.createElement('div');

      el.className =
        'dictionary-pos';

      el.textContent =
        pos;

      article.appendChild(el);
    }


    /*
     * Definitions
     */

    const definitions =
      entry.definitions ||
      entry.senses ||
      [];


    if(Array.isArray(definitions)){

      const senses =
        document.createElement('div');

      senses.className =
        'dictionary-senses';


      const heading =
        document.createElement('div');

      heading.className =
        'dictionary-label';

      heading.textContent =
        'Definitions';

      senses.appendChild(heading);


      definitions
        .slice(0,12)
        .forEach((definition,index) => {

          let definitionText = '';

          let example = '';

          let tags = '';


          if(typeof definition === 'string'){

            definitionText =
              definition;

          }else if(definition){

            definitionText =
              extractText(
                definition.definition ||
                definition.meaning ||
                definition.text
              );

            example =
              extractText(
                definition.example ||
                definition.examples?.[0]
              );

            tags =
              Array.isArray(definition.tags)
                ? definition.tags.join(', ')
                : extractText(definition.tags);
          }


          if(!definitionText){
            return;
          }


          const sense =
            document.createElement('div');

          sense.className =
            'dictionary-sense';


          const definitionEl =
            document.createElement('div');

          definitionEl.className =
            'dictionary-definition';

          definitionEl.textContent =
            `${index + 1}. ${definitionText}`;

          sense.appendChild(
            definitionEl
          );


          if(tags){

            const tagEl =
              document.createElement('span');

            tagEl.className =
              'dictionary-tags';

            tagEl.textContent =
              `(${tags})`;

            definitionEl.appendChild(
              tagEl
            );
          }


          if(example){

            const exampleEl =
              document.createElement('div');

            exampleEl.className =
              'dictionary-example';

            exampleEl.textContent =
              `“${example}”`;

            sense.appendChild(
              exampleEl
            );
          }


          senses.appendChild(
            sense
          );

        });


      article.appendChild(
        senses
      );
    }


    /*
     * Translations
     */

    const translations =
      entry.translations ||
      entry.translation ||
      [];


    if(
      Array.isArray(translations) &&
      translations.length
    ){

      const block =
        document.createElement('div');

      block.className =
        'dictionary-translations';


      const heading =
        document.createElement('div');

      heading.className =
        'dictionary-label';

      heading.textContent =
        'Translations';

      block.appendChild(
        heading
      );


      const ul =
        document.createElement('ul');

      ul.className =
        'dictionary-list';


      translations
        .slice(0,20)
        .forEach(translation => {

          const li =
            document.createElement('li');

          if(typeof translation === 'string'){

            li.textContent =
              translation;

          }else{

            li.textContent =
              translation?.translation ||
              translation?.word ||
              translation?.text ||
              '';

          }

          if(li.textContent){
            ul.appendChild(li);
          }

        });


      if(ul.children.length){
        block.appendChild(ul);
        article.appendChild(block);
      }
    }


    article.appendChild(
      document.createElement('br')
    );


    dictionary.appendChild(
      article
    );

  });


  const source =
    document.createElement('div');

  source.className =
    'dictionary-source';

  source.textContent =
    'Source: FreeDictionaryAPI';

  dictionary.appendChild(
    source
  );
}


/* =========================================================
   LOAD DICTIONARY
========================================================= */

async function loadDictionary(word){

  /*
   * Dictionary is primarily useful for Web searches.
   */

  if(!word || currentType !== 'web'){
    dictionary.classList.add('hidden');
    dictionary.innerHTML = '';
    return;
  }


  dictionary.classList.remove('hidden');

  dictionary.innerHTML = `
    <h2 class="dictionary-title">
      Dictionary
    </h2>

    <div class="dictionary-word">
      ${esc(word)}
    </div>

    <div class="dictionary-loading">
      Looking up “${esc(word)}”…
    </div>
  `;


  try{

    const response =
      await fetch(
        `${API_BASE}/api/dictionary?word=${encodeURIComponent(word)}`,
        {
          method:'GET',

          headers:{
            'Accept':'application/json'
          }
        }
      );


    const text =
      await response.text();


    let data;

    try{

      data =
        JSON.parse(text);

    }catch{

      dictionary.innerHTML = `
        <h2 class="dictionary-title">
          Dictionary
        </h2>

        <div class="dictionary-word">
          ${esc(word)}
        </div>

        <div class="dictionary-empty">
          Dictionary unavailable.
        </div>
      `;

      return;
    }


    if(
      !response.ok &&
      response.status !== 404
    ){

      dictionary.innerHTML = `
        <h2 class="dictionary-title">
          Dictionary
        </h2>

        <div class="dictionary-word">
          ${esc(word)}
        </div>

        <div class="dictionary-empty">
          Dictionary unavailable.
        </div>
      `;

      return;
    }


    renderDictionary(
      data,
      word
    );

  }catch(error){

    console.error(
      'Dictionary error:',
      error
    );

    dictionary.classList.add(
      'hidden'
    );
  }
}


/* =========================================================
   RENDER SEARCH RESULTS
========================================================= */

function render(data){

  home.classList.add('hidden');

  results.classList.remove('hidden');


  currentType =
    data.type ||
    currentType;


  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';


  let a = [];


  /*
   * WEB
   */

  if(currentType === 'web'){

    a =
      Array.isArray(
        data.results?.web?.results
      )
        ? data.results.web.results
        : [];

  }


  /*
   * IMAGES
   */

  else if(
    currentType === 'images'
  ){

    a =
      Array.isArray(
        data.results
      )
        ? data.results
        : [];

  }


  /*
   * NEWS
   */

  else if(
    currentType === 'news'
  ){

    a =
      Array.isArray(
        data.results
      )
        ? data.results
        : [];

  }


  count.textContent =
    a.length
      ? `${a.length} results`
      : '';


  resultsInput.value =
    data.query ||
    '';


  list.innerHTML = '';

  pager.innerHTML = '';


  /*
   * Active category
   */

  document
    .querySelectorAll('.search-type')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.type ===
        currentType
      );

    });


  if(!a.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    dictionary.classList.add(
      'hidden'
    );

    return;
  }


  /* =======================================================
     IMAGES
  ======================================================= */

  if(currentType === 'images'){

    const grid =
      document.createElement('div');

    grid.className =
      'image-grid';


    a.forEach(result => {

      const url =
        result.url ||
        result.link ||
        result.properties?.url ||
        '';


      const image =
        result.thumbnail?.src ||
        result.thumbnail?.url ||
        result.thumbnail ||
        result.image?.url ||
        result.image ||
        result.properties?.url ||
        '';


      if(!image){
        return;
      }


      const article =
        document.createElement('article');

      article.className =
        'image-result';


      article.innerHTML = `

        <a
          href="${esc(url)}"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            src="${esc(image)}"
            alt="${esc(result.title || '')}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >

        </a>

        <div class="image-result-title">
          ${esc(result.title || url)}
        </div>

        <div class="image-result-source">
          ${esc(
            result.source ||
            result.meta_url?.hostname ||
            getHostname(url)
          )}
        </div>
      `;


      grid.appendChild(
        article
      );

    });


    if(grid.children.length){

      list.appendChild(
        grid
      );

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';

    }


    dictionary.classList.add(
      'hidden'
    );
  }


  /* =======================================================
     NEWS
  ======================================================= */

  else if(currentType === 'news'){

    a.forEach(result => {

      const article =
        document.createElement('article');

      article.className =
        'result';


      const url =
        result.url ||
        result.link ||
        '';


      const host =
        result.meta_url?.hostname ||
        getHostname(url);


      const favicon =
        faviconForResult(
          result
        );


      const title =
        result.title ||
        url ||
        'News result';


      const description =
        result.description ||
        result.content ||
        '';


      const age =
        result.age ||
        result.publishedDate ||
        result.published_date ||
        '';


      const thumbnail =
        thumbnailForResult(
          result
        );


      article.innerHTML = `

        <div class="result-top">

          ${
            favicon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(favicon)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

          <div class="result-url">
            ${esc(host || url)}
          </div>

        </div>


        <h2>

          <a
            href="${esc(url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>

        </h2>


        <div class="result-content">

          <div class="result-text">

            ${
              description
                ? `
                  <p class="snippet">
                    ${esc(description)}
                  </p>
                `
                : ''
            }

            ${
              age
                ? `
                  <div class="result-meta">
                    ${esc(age)}
                  </div>
                `
                : ''
            }

          </div>


          ${
            thumbnail
              ? `
                <img
                  class="result-thumbnail"
                  src="${esc(thumbnail)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

        </div>

      `;


      list.appendChild(
        article
      );

    });


    dictionary.classList.add(
      'hidden'
    );
  }


  /* =======================================================
     WEB
  ======================================================= */

  else{

    a.forEach(result => {

      const article =
        document.createElement('article');

      article.className =
        'result';


      const url =
        result.url ||
        result.link ||
        '';


      const host =
        result.meta_url?.hostname ||
        getHostname(url);


      const favicon =
        faviconForResult(
          result
        );


      const title =
        result.title ||
        url ||
        'Search result';


      const description =
        result.description ||
        result.content ||
        '';


      const age =
        result.age ||
        result.publishedDate ||
        result.published_date ||
        '';


      /*
       * Thumbnail / OG image.
       *
       * If no thumbnail exists,
       * favicon is used as the visual fallback.
       */

      const thumbnail =
        thumbnailForResult(
          result
        ) ||
        favicon;


      article.innerHTML = `

        <div class="result-top">

          ${
            favicon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(favicon)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

          <div class="result-url">
            ${esc(host || url)}
          </div>

        </div>


        <h2>

          <a
            href="${esc(url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>

        </h2>


        <div class="result-content">

          <div class="result-text">

            ${
              description
                ? `
                  <p class="snippet">
                    ${esc(description)}
                  </p>
                `
                : ''
            }

            ${
              age
                ? `
                  <div class="result-meta">
                    ${esc(age)}
                  </div>
                `
                : ''
            }

          </div>


          ${
            thumbnail
              ? `
                <img
                  class="result-thumbnail"
                  src="${esc(thumbnail)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

        </div>

      `;


      list.appendChild(
        article
      );

    });


    /*
     * Dictionary only for Web.
     */

    loadDictionary(
      data.query ||
      currentQ
    );

  }


  /* =======================================================
     PAGINATION
  ======================================================= */

  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const button =
      document.createElement('button');

    button.textContent =
      'Previous';

    button.onclick = () =>
      search(
        currentQ,
        currentPage - 1,
        currentType
      );

    pager.appendChild(
      button
    );
  }


  if(more){

    const button =
      document.createElement('button');

    button.textContent =
      'Next';

    button.onclick = () =>
      search(
        currentQ,
        currentPage + 1,
        currentType
      );

    pager.appendChild(
      button
    );
  }


  /*
   * Update browser URL.
   */

  const query =
    data.query ||
    currentQ;


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(query)}` +
    `&type=${encodeURIComponent(currentType)}` +
    `${
      currentPage
        ? `&page=${currentPage}`
        : ''
    }`
  );
}


/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page = 0,
  type = currentType
){

  q = q.trim();

  if(!q){
    return;
  }


  currentQ =
    q;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    ['web','images','news']
      .includes(type)
      ? type
      : 'web';


  document.title =
    `${q} - FlibidooSearch`;


  input.value =
    q;

  resultsInput.value =
    q;


  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );


  list.innerHTML =
    '<div class="empty">Searching…</div>';


  count.textContent =
    '';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML =
    '';


  /*
   * Hide dictionary while searching
   * unless this is a web search.
   */

  if(currentType !== 'web'){

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML =
      '';

  }


  /*
   * Update active category immediately.
   */

  document
    .querySelectorAll('.search-type')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.type ===
        currentType
      );

    });


  try{

    const response =
      await fetch(
        `${API_BASE}/api/search` +
        `?q=${encodeURIComponent(q)}` +
        `&type=${encodeURIComponent(currentType)}` +
        `&page=${currentPage}`,
        {
          method:'GET',

          headers:{
            'Accept':
              'application/json'
          }
        }
      );


    /*
     * Read text first.
     *
     * This avoids:
     *
     * Unexpected token 'N'
     */

    const text =
      await response.text();


    let data;

    try{

      data =
        JSON.parse(text);

    }catch{

      throw new Error(
        `Search server returned invalid JSON (HTTP ${response.status}).`
      );

    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        `Search failed (HTTP ${response.status}).`
      );

    }


    /*
     * Make sure the renderer knows
     * which category was requested.
     */

    data.type =
      currentType;

    data.query =
      data.query ||
      q;


    render(
      data
    );

  }catch(error){

    console.error(
      'Search error:',
      error
    );


    dictionary.classList.add(
      'hidden'
    );


    list.innerHTML =
      `
        <div class="error">
          ${esc(
            error.message ||
            'Search failed. Please try again.'
          )}
        </div>
      `;
  }
}


/* =========================================================
   HOME SEARCH
========================================================= */

form.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const q =
      input.value.trim();

    if(!q){
      return;
    }


    /*
     * Navigate to the results URL.
     *
     * The initial URL loader below
     * will perform the actual search.
     */

    location.href =
      `/?q=${encodeURIComponent(q)}` +
      `&type=web&page=0`;
  }
);


/* =========================================================
   RESULTS SEARCH
========================================================= */

resultsForm.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const q =
      resultsInput.value.trim();

    if(!q){
      return;
    }


    search(
      q,
      0,
      currentType
    );
  }
);


/* =========================================================
   CATEGORY BUTTONS
========================================================= */

document
  .querySelectorAll('.search-type')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        const q =
          resultsInput.value.trim() ||
          currentQ;

        const type =
          button.dataset.type;


        if(!q){
          return;
        }


        /*
         * This is the important part:
         *
         * Clicking Images or News creates
         * a completely new Worker request.
         */

        search(
          q,
          0,
          type
        );

      }
    );

  });

/* =========================================================
   INITIAL URL
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );


const initialQuery =
  params.get('q');


const initialType =
  params.get('type');


const initialPage =
  Number(
    params.get('page') ||
    '0'
  );


if(initialQuery){

  search(
    initialQuery,

    Number.isFinite(initialPage)
      ? initialPage
      : 0,

    ['web','images','news']
      .includes(initialType)
      ? initialType
      : 'web'
  );

}else{

  /*
   * Keep the home page visible.
   */

  home.classList.remove(
    'hidden'
  );

  results.classList.add(
    'hidden'
  );

}


/* =========================================================
