<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1d0c22" />

  <title>FlibidooSearch</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
  />

  <style>
    :root{
      --bg:#1d0c22;
      --text:#f5eef7;
      --muted:#b9aabb;
      --line:#5a4560;
      --line2:#39283d;
      --accent:#f5eef7;
      --result:#e7dce9;
      --url:#b8a2bc;
      --focus:#cdb8d1;
      --translate:#b8c8e8;
    }

    *{
      box-sizing:border-box
    }

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif
    }

    body{
      min-height:100vh;
      display:flex;
      flex-direction:column
    }

    a{
      color:inherit
    }

    .shell{
      width:min(100% - 40px,1120px);
      margin:0 auto
    }

    header{
      height:64px;
      border-bottom:1px solid var(--line2);
      display:flex;
      align-items:center
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      font-weight:600;
      letter-spacing:-.01em
    }

    .brand img{
      width:34px;
      height:34px;
      object-fit:contain;
      display:block;
      mask-image:linear-gradient(
        to bottom,
        #000 0%,
        #000 74%,
        transparent 100%
      );
      -webkit-mask-image:linear-gradient(
        to bottom,
        #000 0%,
        #000 74%,
        transparent 100%
      );
      border-radius:0 0 11px 11px
    }

    main{
      flex:1
    }

    .home{
      min-height:calc(100vh - 120px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:54px 0 100px
    }

    .hero-logo{
      width:min(210px,55vw);
      height:auto;
      display:block;
      margin-bottom:12px;
      mask-image:linear-gradient(
        to bottom,
        #000 0%,
        #000 78%,
        transparent 100%
      );
      -webkit-mask-image:linear-gradient(
        to bottom,
        #000 0%,
        #000 78%,
        transparent 100%
      );
      border-radius:0 0 34px 34px
    }

    h1{
      font-size:clamp(34px,5vw,54px);
      line-height:1;
      margin:0 0 30px;
      letter-spacing:-.055em;
      font-weight:500
    }

    .search-wrap{
      width:min(100%,680px)
    }

    form{
      display:flex;
      align-items:center;
      height:54px;
      border:1px solid var(--line);
      border-radius:28px;
      background:transparent;
      transition:border-color .15s ease,box-shadow .15s ease
    }

    form:focus-within{
      border-color:var(--focus);
      box-shadow:0 0 0 2px rgba(205,184,209,.08)
    }

    .search-icon{
      width:20px;
      height:20px;
      margin-left:18px;
      flex:0 0 auto;
      opacity:.75
    }

    .search-icon circle,
    .search-icon path{
      stroke:currentColor
    }

    input{
      min-width:0;
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:16px;
      padding:0 14px
    }

    input::placeholder{
      color:#9e8da1
    }

    .submit{
      height:38px;
      width:38px;
      margin-right:8px;
      border:1px solid var(--line);
      background:transparent;
      color:#766679;
      border-radius:50%;
      padding:0;
      display:grid;
      place-items:center;
      font-size:20px;
      line-height:1;
      cursor:pointer;
      transition:color .15s ease,border-color .15s ease
    }

    .submit.has-input{
      color:var(--text);
      border-color:var(--focus)
    }

    .submit:hover{
      border-color:var(--focus)
    }

    .submit:focus-visible{
      outline:2px solid var(--focus);
      outline-offset:2px
    }

    .submit-icon{
      width:18px;
      height:18px;
      display:block
    }

    .links{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      margin-top:20px;
      color:var(--muted);
      font-size:13px;
      flex-wrap:wrap
    }

    .links button,
    .links a{
      border:0;
      background:none;
      color:inherit;
      cursor:pointer;
      padding:0;
      text-decoration:none
    }

    .links button:hover,
    .links a:hover{
      color:var(--text)
    }

    .love-message{
      display:inline-flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
      color:var(--muted)
    }

    .love-message img{
      width:22px;
      height:22px;
      object-fit:contain;
      display:inline-block;
      vertical-align:middle
    }

    .results{
      padding:30px 0 70px
    }

    .results-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line2);
      padding-bottom:14px;
      margin-bottom:14px;
      gap:18px
    }

    .results-brand{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:inherit;
      white-space:nowrap
    }

    .results-brand img{
      width:28px;
      height:28px;
      object-fit:contain;
      display:block
    }

    .results-brand span{
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em
    }

    .results-query{
      font-size:14px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      flex:1
    }

    .count{
      font-size:13px;
      color:var(--muted);
      white-space:nowrap
    }

    .results-search{
      width:min(100%,680px);
      margin:0 0 28px
    }

    .results-search form{
      height:48px
    }

    .results-search .search-icon{
      margin-left:16px
    }

    .results-search .submit{
      width:34px;
      height:34px;
      margin-right:6px
    }

    /* Translation suggestion */

    .translate-message{
      display:none;
      margin:0 0 18px;
      padding:11px 14px;
      border-left:2px solid rgba(184,200,232,.35);
      color:var(--muted);
      font-size:13px;
      line-height:1.5
    }

    .translate-message.visible{
      display:block
    }

    .translate-message a{
      color:var(--translate);
      text-decoration:underline;
      text-decoration-thickness:1px;
      text-underline-offset:2px
    }

    .translate-message a:hover{
      color:#d0dcf2
    }

    /* Search navigation */

    .search-types{
      display:flex;
      align-items:flex-end;
      gap:0;
      margin:8px 0 18px;
      border-bottom:1px solid rgba(255,255,255,.12);
      height:36px
    }

    .search-type{
      position:relative;
      appearance:none;
      border:0;
      background:transparent;
      color:rgba(255,255,255,.62);
      font:inherit;
      font-size:13px;
      line-height:20px;
      padding:0 12px 10px;
      margin:0;
      border-radius:0;
      cursor:pointer;
      transition:color .12s ease
    }

    .search-type:hover{
      color:rgba(255,255,255,.9);
      background:transparent
    }

    .search-type.active{
      color:#fff;
      background:transparent
    }

    .search-type.active::after{
      content:"";
      position:absolute;
      left:10px;
      right:10px;
      bottom:-1px;
      height:2px;
      border-radius:2px 2px 0 0;
      background:currentColor
    }

    .search-type:focus-visible{
      outline:1px solid rgba(255,255,255,.55);
      outline-offset:-2px
    }

    /* Main responsive layout */

    .results-layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 330px;
      gap:42px;
      align-items:start
    }

    .results-main{
      min-width:0
    }

    .dictionary{
      border-left:1px solid var(--line2);
      padding-left:28px;
      position:sticky;
      top:24px;
      max-height:calc(100vh - 48px);
      overflow-y:auto;
      overscroll-behavior:contain;
      scrollbar-width:thin
    }

    .dictionary::-webkit-scrollbar{
      width:6px
    }

    .dictionary::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.2);
      border-radius:6px
    }

    .dictionary.hidden{
      display:none
    }

    .dictionary-title{
      font-size:22px;
      font-weight:500;
      letter-spacing:-.02em;
      margin:0 0 5px
    }

    .dictionary-word{
      font-size:13px;
      color:var(--muted);
      margin-bottom:22px
    }

    .dictionary-entry{
      padding:0 0 24px;
      margin-bottom:24px;
      border-bottom:1px solid var(--line2)
    }

    .dictionary-entry:last-child{
      border-bottom:0
    }

    .dictionary-language{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px
    }

    .dictionary-pos{
      font-size:15px;
      margin-bottom:12px
    }

    .dictionary-pronunciations,
    .dictionary-forms,
    .dictionary-senses,
    .dictionary-relations,
    .dictionary-translations{
      margin-top:14px
    }

    .dictionary-label{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:7px
    }

    .dictionary-list{
      margin:0;
      padding-left:18px
    }

    .dictionary-list li{
      margin:0 0 7px
    }

    .dictionary-sense{
      margin:0 0 15px
    }

    .dictionary-definition{
      font-size:14px;
      line-height:1.55
    }

    .dictionary-tags{
      font-size:12px;
      color:var(--muted);
      margin-left:5px
    }

    .dictionary-example{
      font-size:13px;
      line-height:1.5;
      color:var(--result);
      margin:7px 0 0 14px
    }

    .dictionary-quote{
      font-size:13px;
      line-height:1.5;
      color:var(--muted);
      margin:7px 0 0 14px
    }

    .dictionary-source{
      font-size:12px;
      line-height:1.5;
      color:var(--muted);
      padding-top:4px
    }

    .dictionary-source a{
      color:inherit
    }

    .dictionary-loading,
    .dictionary-empty{
      font-size:13px;
      color:var(--muted);
      line-height:1.5
    }

    /* Results */

    .result{
      padding:0 0 26px;
      margin-bottom:26px;
      border-bottom:1px solid var(--line2)
    }

    .result-url{
      font-size:13px;
      color:var(--url);
      margin-bottom:6px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap
    }

    .result h2{
      font-size:20px;
      line-height:1.25;
      margin:0 0 7px;
      font-weight:500;
      letter-spacing:-.02em
    }

    .result h2 a{
      text-decoration:none
    }

    .result h2 a:hover{
      text-decoration:underline
    }

    .snippet{
      font-size:14px;
      line-height:1.6;
      color:var(--result);
      margin:0;
      max-width:760px
    }

    .result-meta{
      font-size:12px;
      color:var(--muted);
      margin-top:7px
    }

    .result-inline-thumb{
      margin-top:10px;
      max-width:260px
    }

    .result-inline-thumb img{
      display:block;
      width:100%;
      max-height:150px;
      object-fit:cover
    }

    .result-favicon{
      width:18px;
      height:18px;
      object-fit:contain;
      vertical-align:-4px;
      margin-right:7px
    }

    /* Images */

    .image-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:28px 22px
    }

    .image-result{
      min-width:0
    }

    .image-result a{
      display:block;
      text-decoration:none
    }

    .image-result img{
      display:block;
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      border:1px solid var(--line2);
      background:rgba(255,255,255,.02)
    }

    .image-result-title{
      font-size:14px;
      line-height:1.4;
      margin-top:9px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis
    }

    .image-result-source{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis
    }

    /* Maps */

    .map-result{
      padding:0 0 22px;
      margin-bottom:22px;
      border-bottom:1px solid var(--line2)
    }

    .map-result-title{
      font-size:18px;
      line-height:1.35;
      margin:0 0 6px;
      font-weight:500
    }

    .map-result-title a{
      text-decoration:none
    }

    .map-result-title a:hover{
      text-decoration:underline
    }

    .map-result-address{
      font-size:14px;
      line-height:1.55;
      color:var(--result)
    }

    .map-result-coords{
      font-size:12px;
      color:var(--muted);
      margin-top:6px
    }

    .empty,
    .error{
      padding:70px 0;
      color:var(--muted);
      text-align:center
    }

    .error{
      min-height:120px;
      max-width:680px;
      margin:0;
      padding:28px 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      border:1px solid var(--line2);
      color:var(--muted);
      font-size:14px;
      line-height:1.5
    }

    .pager{
      display:flex;
      gap:8px;
      padding-top:10px
    }

    .pager button{
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      border-radius:4px;
      padding:8px 12px;
      cursor:pointer
    }

    .pager button:hover{
      border-color:var(--focus)
    }

    footer{
      height:56px;
      border-top:1px solid var(--line2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:var(--muted);
      font-size:12px
    }

    .hidden{
      display:none!important
    }

    /* Autocomplete */

    .flibidoo-suggest-wrap{
      position:relative
    }

    .flibidoo-suggestions{
      position:absolute;
      left:0;
      right:0;
      top:calc(100% + 4px);
      z-index:100;
      background:#1d0c22;
      border:1px solid rgba(255,255,255,.14);
      border-radius:8px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,.25)
    }

    .flibidoo-suggestion{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      border:0;
      background:transparent;
      color:#fff;
      text-align:left;
      padding:10px 13px;
      font:inherit;
      font-size:13px;
      cursor:pointer
    }

    .flibidoo-suggestion:hover,
    .flibidoo-suggestion.active{
      background:rgba(255,255,255,.07)
    }

    .flibidoo-suggestion img{
      width:24px;
      height:24px;
      object-fit:cover;
      border-radius:50%
    }

    .flibidoo-suggestion small{
      display:block;
      color:rgba(255,255,255,.55);
      margin-top:2px
    }

    /* Tablet */

    @media(max-width:1000px){

      .shell{
        width:min(100% - 32px,900px)
      }

      .results-layout{
        grid-template-columns:minmax(0,1fr) 300px;
        gap:30px
      }

      .dictionary{
        top:18px;
        max-height:calc(100vh - 36px);
        padding-left:22px
      }
    }

    /* Phones: dictionary above results and NOT sticky */

    @media(max-width:760px){

      .shell{
        width:min(100% - 28px,680px)
      }

      .results{
        padding:24px 0 60px
      }

      .results-layout{
        display:flex;
        flex-direction:column;
        gap:28px
      }

      /*
        Dictionary appears first on phones.
        order:-1 ensures it is above resultList.
      */
      .dictionary{
        order:-1;
        width:100%;
        border-left:0;
        border-top:0;
        border-bottom:1px solid var(--line2);
        padding:0 0 26px;
        position:static;
        top:auto;
        max-height:none;
        overflow:visible;
        overscroll-behavior:auto
      }

      .results-main{
        order:2;
        width:100%
      }

      .translate-message{
        margin-bottom:16px
      }

      .image-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:22px 14px
      }

      .results-head{
        gap:12px
      }

      .results-query{
        font-size:13px
      }

      .count{
        display:none
      }
    }

    @media(max-width:640px){

      .shell{
        width:calc(100% - 24px)
      }

      header{
        height:58px
      }

      .home{
        min-height:100vh;
        padding:25px 0 60px
      }

      .hero-logo{
        width:150px
      }

      h1{
        font-size:36px;
        margin-bottom:24px
      }

      form{
        height:50px
      }

      .submit{
        width:38px;
        padding:0
      }

      .results{
        padding-top:20px
      }

      .results-search{
        margin-bottom:22px
      }

      .search-types{
        overflow-x:auto;
        scrollbar-width:none
      }

      .search-types::-webkit-scrollbar{
        display:none
      }

      .search-type{
        padding-left:10px;
        padding-right:10px;
        font-size:12px
      }

      .results-brand img{
        width:24px;
        height:24px
      }

      .results-brand span{
        font-size:14px
      }

      .results-query{
        display:none
      }

      .result h2{
        font-size:18px
      }

      .snippet{
        font-size:14px
      }

      .dictionary-title{
        font-size:20px
      }

      .love-message{
        white-space:normal;
        text-align:center;
        justify-content:center
      }
    }

    @media(max-width:460px){

      .shell{
        width:calc(100% - 20px)
      }

      .home{
        padding-left:4px;
        padding-right:4px
      }

      .search-wrap{
        width:100%
      }

      .image-grid{
        grid-template-columns:1fr
      }

      .links{
        gap:14px;
        line-height:1.4
      }

      .results{
        padding-left:2px;
        padding-right:2px
      }

      .results-head{
        margin-bottom:12px
      }
    }
  </style>
</head>

<body>

<main>

  <!-- HOME -->

  <section id="home" class="home shell">

    <img
      class="hero-logo"
      src="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
      alt="FlibidooSearch logo"
    />

    <h1>
      <strong><em>Flibidoo</em></strong>Search
    </h1>

    <div class="search-wrap">

      <form id="searchForm" role="search">

        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="10.8"
            cy="10.8"
            r="6.8"
            stroke-width="1.7"
          />
          <path
            d="m16 16 5 5"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>

        <input
          id="q"
          name="q"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web"
          aria-label="Search the web"
        />

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="Search"
          title="Search"
        >
          <svg
            class="submit-icon"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M5 12h14"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="m12 5 7 7-7 7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

      </form>

      <div class="links">

        <a
          href="https://flibidoo-translate.devs.surf"
          id="translateLink"
        >
          FlibidooTranslate
        </a>

        <span class="love-message">
          with love from The Great Confederacy of E
          <img
            src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
            alt=""
          />
        </span>

      </div>

    </div>
  </section>


  <!-- RESULTS -->

  <section id="results" class="results shell hidden">

    <div class="results-head">

      <a
        class="results-brand"
        href="/"
        aria-label="FlibidooSearch home"
      >
        <img
          src="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
          alt="FlibidooSearch"
        />

        <span>
          <strong><em>Flibidoo</em></strong>Search
        </span>
      </a>

      <div
        id="queryLabel"
        class="results-query"
      ></div>

      <div
        id="count"
        class="count"
      ></div>

    </div>


    <div class="results-search">

      <form
        id="resultsSearchForm"
        role="search"
      >

        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="10.8"
            cy="10.8"
            r="6.8"
            stroke-width="1.7"
          />

          <path
            d="m16 16 5 5"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>

/* ============================================================
   HELPERS
   ============================================================ */

function esc(s = '') {

  return String(s).replace(
    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );

}


function updateButtonState(button,value){

  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );

}


function normalize(s = ''){

  return String(s)
    .toLowerCase()
    .trim()
    .replace(/[“”"'.,!?;:()[\]{}]/g,'')
    .replace(/\s+/g,' ');

}


/* ============================================================
   TRANSLATION INTENT DETECTION
   ============================================================ */

function translationIntent(query){

  const q = normalize(query);

  if(!q){
    return false;
  }


  /*
    Examples detected:

    translate hello
    translator
    translated text
    translate this to english
    translate english to spanish
    english to french
    say hello in spanish
    say hello in japanese
    how do you say hello in spanish
  */

  if(/\btranslate\b/.test(q)){
    return true;
  }

  if(/\btranslator\b/.test(q)){
    return true;
  }

  if(/\btranslated\b/.test(q)){
    return true;
  }

  if(/\bto english\b/.test(q)){
    return true;
  }

  if(/\benglish to\b/.test(q)){
    return true;
  }

  if(/\bsay\b.+\bin\b/.test(q)){
    return true;
  }

  return false;

}


function showTranslateMessage(query){

  if(!translationIntent(query)){

    translateMessage.classList.remove('visible');
    translateMessage.innerHTML='';

    return;
  }


  translateMessage.innerHTML =
    `I think you need ` +
    `<a href="https://flibidoo-translate.devs.surf">` +
    `<strong><em>Flibidoo</em></strong>Translate` +
    `</a> for that.`;


  translateMessage.classList.add('visible');

}


/* ============================================================
   LEVENSHTEIN
   ============================================================ */

function levenshtein(a,b){

  const prev =
    Array.from(
      {length:b.length + 1},
      (_,i)=>i
    );


  for(let i=1;i<=a.length;i++){

    let cur=[i];

    for(let j=1;j<=b.length;j++){

      cur[j]=Math.min(
        cur[j-1]+1,
        prev[j]+1,
        prev[j-1]+(
          a[i-1]===b[j-1] ? 0 : 1
        )
      );

    }

    for(
      let j=0;
      j<=b.length;
      j++
    ){

      prev[j]=cur[j];

    }

  }

  return prev[b.length];

}


/* ============================================================
   DICTIONARY DETECTION
   ============================================================ */

function dictionaryWord(query){

  const q=normalize(query);

  if(!q){
    return null;
  }


  if(q.split(' ').length===1){
    return q;
  }


  const tokens =
    q
      .split(' ')
      .filter(Boolean);


  const candidates =
    new Set();


  for(const t of tokens){

    if(
      /^[a-z][a-z'-]*$/i.test(t)
    ){

      candidates.add(
        t.replace(
          /^['-]+|['-]+$/g,
          ''
        )
      );

    }

  }


  for(const word of candidates){

    const templates=[

      `meaning of ${word}`,
      `${word} meaning`,
      `${word} means`,
      `${word} definition`,
      `definition of ${word}`

    ];


    for(const template of templates){

      if(
        levenshtein(q,template)<=3
      ){

        return word;

      }

    }

  }


  return null;

}


/* ============================================================
   DICTIONARY LANGUAGE PRIORITIZATION
   ============================================================ */

function prioritizeEnglish(entries){

  if(!Array.isArray(entries)){
    return entries;
  }


  return [...entries].sort(
    (a,b)=>{

      const aLang =
        String(
          a?.language?.code ||
          a?.language?.name ||
          ''
        ).toLowerCase();

      const bLang =
        String(
          b?.language?.code ||
          b?.language?.name ||
          ''
        ).toLowerCase();


      const aEnglish =
        aLang === 'en' ||
        aLang === 'eng' ||
        aLang.includes('english');


      const bEnglish =
        bLang === 'en' ||
        bLang === 'eng' ||
        bLang.includes('english');


      if(aEnglish && !bEnglish){
        return -1;
      }

      if(!aEnglish && bEnglish){
        return 1;
      }

      return 0;

    }
  );

}


/* ============================================================
   DICTIONARY RENDERING
   ============================================================ */

function dictionaryTags(tags){

  return Array.isArray(tags) && tags.length

    ? ` <span class="dictionary-tags">(${tags.map(esc).join(', ')})</span>`

    : '';

}


function renderSense(sense,depth=0){

  if(!sense){
    return '';
  }


  let html =
    `<div class="dictionary-sense" style="margin-left:${Math.min(depth,3)*12}px">`;


  if(sense.definition){

    html +=
      `<div class="dictionary-definition">` +
      `${esc(sense.definition)}` +
      `${dictionaryTags(sense.tags)}` +
      `</div>`;

  }


  if(Array.isArray(sense.examples)){

    sense.examples.forEach(x=>{

      if(x){

        html +=
          `<div class="dictionary-example">` +
          `“${esc(x)}”` +
          `</div>`;

      }

    });

  }


  if(Array.isArray(sense.quotes)){

    sense.quotes.forEach(q=>{

      if(q?.text){

        html +=
          `<div class="dictionary-quote">` +
          `“${esc(q.text)}”` +
          `${q.reference ? ` — ${esc(q.reference)}` : ''}` +
          `</div>`;

      }

    });

  }


  if(
    Array.isArray(sense.synonyms) &&
    sense.synonyms.length
  ){

    html +=
      `<div class="dictionary-relations">` +
      `<div class="dictionary-label">Synonyms</div>` +
      `<div>${sense.synonyms.map(esc).join(', ')}</div>` +
      `</div>`;

  }


  if(
    Array.isArray(sense.antonyms) &&
    sense.antonyms.length
  ){

    html +=
      `<div class="dictionary-relations">` +
      `<div class="dictionary-label">Antonyms</div>` +
      `<div>${sense.antonyms.map(esc).join(', ')}</div>` +
      `</div>`;

  }


  if(
    Array.isArray(sense.translations) &&
    sense.translations.length
  ){

    html +=
      `<div class="dictionary-translations">` +
      `<div class="dictionary-label">Translations</div>` +
      `<ul class="dictionary-list">`;


    sense.translations.forEach(t=>{

      if(t?.word){

        html +=
          `<li>` +
          `${esc(
            t.language?.name ||
            t.language?.code ||
            ''
          )}` +
          ` — ${esc(t.word)}` +
          `</li>`;

      }

    });


    html +=
      `</ul></div>`;

  }


  if(Array.isArray(sense.subsenses)){

    sense.subsenses.forEach(sub=>{

      html +=
        renderSense(
          sub,
          depth+1
        );

    });

  }


  return html + '</div>';

}


function renderDictionary(data){

  if(

    dictionary.classList.add('hidden');

  const entries =

  html +=
    `<div class="dictionary-word">Dictionary</div>`;


  entries.forEach(entry=>{

    if(language){

        `${esc(language)}` +
        `${
          entry.language?.code

      entry.pronunciations.forEach(p=>{

        if(p?.text){

            `<li>` +
            `${esc(p.text)}` +
            `${
              p.type
                ? ` — ${esc(p.type)}`

    if(

    ){

      html +=
        `<div class="dictionary-forms">` +

        `<ul class="dictionary-list">`;


      entry.forms.forEach(f=>{

        if(f?.word){

          html +=
            `<li>` +
            `${esc(f.word)}` +

        }

      });


      html +=
        `</ul></div>`;

    }


    if(
      Array.isArray(entry.senses) &&

    ){

      html +=
        `<div class="dictionary-senses">` +
        `<div class="dictionary-label">Definitions</div>`;


      entry.senses.forEach(
        s=>{

        }
      );


      html +=
        `</div>`;

    }


    if(
      Array.isArray(entry.synonyms) &&
      entry.synonyms.length
    ){

      html +=
        `<div class="dictionary-relations">` +
        `<div class="dictionary-label">Synonyms</div>` +
        `<div>${entry.synonyms.map(esc).join(', ')}</div>` +
        `</div>`;

    }


    if(
      Array.isArray(entry.antonyms) &&
      entry.antonyms.length
    ){

      html +=
        `<div class="dictionary-relations">` +
        `<div class="dictionary-label">Antonyms</div>` +
        `<div>${entry.antonyms.map(esc).join(', ')}</div>` +
        `</div>`;

    }


    html +=
      `</section>`;

  });


  if(data.source){

    html +=
      `<div class="dictionary-source">` +
      `Source: `;


    if(data.source.url){

      html +=
        `<a href="${esc(data.source.url)}" rel="noopener noreferrer">` +
        `${esc(data.source.url)}` +
        `</a>`;

    }


    if(data.source.license){

      html +=
        `<br>License: `;


      if(data.source.license.url){

        html +=
          `<a href="${esc(data.source.license.url)}" rel="noopener noreferrer">` +
          `${esc(data.source.license.name || 'License')}` +
          `</a>`;

      }else{

        html +=
          esc(
            data.source.license.name || ''
          );

      }

    }


    html +=
      `</div>`;

  }


  dictionary.innerHTML=html;
  dictionary.classList.remove('hidden');

}


/* ============================================================
   DICTIONARY API
   ============================================================ */

async function loadDictionary(q){

  const word =
    dictionaryWord(q);


  if(!word){

    dictionary.classList.add('hidden');
    dictionary.innerHTML='';

    return;

  }


  dictionary.classList.remove('hidden');

  dictionary.innerHTML =
    '<div class="dictionary-loading">' +
    'Looking up the definition…' +
    '</div>';


  try{

    const r =
      await fetch(
        `${WORKER_BASE}/api/dictionary?word=${encodeURIComponent(word)}`
      );


    if(!r.ok){

      dictionary.classList.add('hidden');

      return;

    }


    const data =
      await r.json();


    if(data?.entries?.length){

      renderDictionary(data);

    }else{

      dictionary.classList.add('hidden');
      dictionary.innerHTML='';

    }

  }catch(_){

    dictionary.classList.add('hidden');
    dictionary.innerHTML='';

  }

}


/* ============================================================
   RICH TEXT
   ============================================================ */

window.flibidooRichText =
function(value){

  let src =
    String(value ?? '');


  if(!src){
    return '';
  }


  const ta =
    document.createElement('textarea');

  ta.innerHTML=src;

  src=ta.value;


  src =
    src
      .replace(
        /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi,
        ''
      )
      .replace(
        /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*\/?>/gi,
        ''
      )
      .replace(
        /\s+on[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi,
        ''
      )
      .replace(
        /\s+(href|src)\s*=\s*(['"])\s*javascript:[\s\S]*?\2/gi,
        ''
      );


  const allowed=[];


  src =
    src.replace(
      /<\/?(strong|b|em|i|u|s|del|mark|small|br|code|kbd|sub|sup|a)(?:\s+[^>]*)?>/gi,
      m=>{

        const idx =
          allowed.push(m)-1;

        return `@@FLIBIDOO_TAG_${idx}@@`;

      }
    );


  src =
    src
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');


  src =
    src.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" rel="noopener noreferrer">$1</a>'
    );


  src =
    src.replace(
      /`([^`]+)`/g,
      '<code>$1</code>'
    );


  src =
    src.replace(
      /\*\*([^*]+)\*\*/g,
      '<strong>$1</strong>'
    );


  src =
    src.replace(
      /__([^_]+)__/g,
      '<strong>$1</strong>'
    );


  src =
    src.replace(
      /~~([^~]+)~~/g,
      '<del>$1</del>'
    );


  src =
    src.replace(
      /(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;])/g,
      '$1<em>$2</em>'
    );


  src =
    src.replace(
      /(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?:;])/g,
      '$1<em>$2</em>'
    );


  src =
    src.replace(
      /^#{1,6}\s+(.+)$/gm,
      '<strong>$1</strong>'
    );


  src =
    src.replace(
      /^\s*[-*]\s+(.+)$/gm,
      '• $1'
    );


  src =
    src.replace(
      /^\s*\d+\.\s+(.+)$/gm,
      '$1'
    );


  src =
    src.replace(
      /@@FLIBIDOO_TAG_(\d+)@@/g,
      (_,i)=>allowed[Number(i)] || ''
    );


  return src.replace(
    /\r?\n/g,
    '<br>'
  );

};


/* ============================================================
   RENDER SEARCH RESULTS
   ============================================================ */

function render(data){

  home.classList.add('hidden');
  results.classList.remove('hidden');


  currentType =
    data.type || currentType;


  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';


  showTranslateMessage(
    data.query || currentQ
  );


  const resultsArray =
    Array.isArray(data.results)
      ? data.results
      : [];


  count.textContent =
    resultsArray.length
      ? `${resultsArray.length} results`
      : '';


  resultsInput.value =
    data.query || '';


  updateButtonState(
    resultsSubmitButton,
    resultsInput.value
  );


  document
    .querySelectorAll('.search-type')
    .forEach(
      b =>
        b.classList.toggle(
          'active',
          b.dataset.type === currentType
        )
    );


  list.innerHTML='';
  pager.innerHTML='';


  if(!resultsArray.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    return;

  }


  /* IMAGES */

  if(currentType === 'images'){

    const grid =
      document.createElement('div');

    grid.className='image-grid';


    resultsArray.forEach(r=>{

      const u =
        r.url ||
        r.properties?.url ||
        '';


      const img =
        r.thumbnail ||
        r.properties?.url ||
        '';


      if(!img){
        return;
      }


      const el =
        document.createElement('article');


      el.className='image-result';


      el.innerHTML =
        `
        <a
          href="${esc(u)}"
          rel="noopener noreferrer"
        >
          <img
            src="${esc(img)}"
            alt="${esc(r.title || '')}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >
        </a>

        <div class="image-result-title">
          ${esc(r.title || u)}
        </div>

        <div class="image-result-source">
          ${esc(
            r.source ||
            r.meta_url?.hostname ||
            ''
          )}
        </div>
        `;


      grid.appendChild(el);

    });


    if(grid.children.length){

      list.appendChild(grid);

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';

    }

  }


  /* MAPS */

  else if(currentType === 'map'){

    resultsArray.forEach(r=>{

      const el =
        document.createElement('article');


      el.className='map-result';


      const u =
        r.url || '';


      const title =
        r.title || 'Map result';


      const address =
        r.address
          ? Object.values(r.address)
              .filter(Boolean)
              .join(', ')
          : (
            r.description || ''
          );


      el.innerHTML =
        `
        <h2 class="map-result-title">
          <a
            href="${esc(u)}"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>
        </h2>

        <div class="map-result-address">
          ${esc(address)}
        </div>

        ${
          r.lat && r.lon
            ? `<div class="map-result-coords">
                ${esc(r.lat)}, ${esc(r.lon)}
              </div>`
            : ''
        }
        `;


      list.appendChild(el);

    });

  }


  /* WEB / NEWS */

  else{

    resultsArray.forEach(r=>{

      const el =
        document.createElement('article');


      el.className='result';


      const u =
        r.url || '';


      const favicon =
        r.meta_url?.favicon || '';


      const host =
        r.meta_url?.hostname || '';


      const title =
        r.title || u;


      const description =
        r.description ||
        r.content ||
        '';


      const age =
        r.age ||
        r.publishedDate ||
        '';


      const thumb =
        r.thumbnail?.src ||
        r.thumbnail ||
        '';


      el.innerHTML =
        `
        <div class="result-url">

          ${
            favicon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(favicon)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

          <span>
            ${esc(host || u)}
          </span>

        </div>

        <h2>
          <a
            href="${esc(u)}"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>
        </h2>

        ${
          description
            ? `
              <p class="snippet">
                ${window.flibidooRichText(description)}
              </p>
            `
            : ''
        }

        ${
          age
            ? `
              <div class="result-meta">
                ${esc(age)}
              </div>
            `
            : ''
        }

        ${
          thumb
            ? `
              <div class="result-inline-thumb">
                <img
                  src="${esc(thumb)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              </div>
            `
            : ''
        }
        `;


      list.appendChild(el);

    });

  }


  const hasMore =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const b =
      document.createElement('button');


    b.textContent='Previous';


    b.onclick=() =>
      search(
        currentQ,
        currentPage - 1,
        currentType
      );


    pager.appendChild(b);

  }


  if(hasMore){

    const b =
      document.createElement('button');


    b.textContent='Next';


    b.onclick=() =>
      search(
        currentQ,
        currentPage + 1,
        currentType
      );


    pager.appendChild(b);

  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(
      data.query || currentQ
    )}` +
    `&type=${encodeURIComponent(
      currentType
    )}` +
    `&page=${currentPage}`
  );

}


/* ============================================================
   SEARCH
   ============================================================ */

async function search(
  q,
  page=0,
  type=currentType
){

  q=q.trim();


  if(!q){
    return;
  }


  currentQ=q;
  currentPage=page;
  currentType=type;


  input.value=q;
  resultsInput.value=q;


  updateButtonState(
    submitButton,
    q
  );


  updateButtonState(
    resultsSubmitButton,
    q
  );


  home.classList.add('hidden');
  results.classList.remove('hidden');


  list.innerHTML =
    '<div class="empty">Searching…</div>';


  count.textContent='';


  label.textContent =
    `Results for “${q}”`;


  showTranslateMessage(q);


  pager.innerHTML='';


  document
    .querySelectorAll('.search-type')
    .forEach(
      b =>
        b.classList.toggle(
          'active',
          b.dataset.type === currentType
        )
    );


  /*
    Dictionary runs independently.
    This means a dictionary failure cannot break
    the search request.
  */

  const dictionaryPromise =
    currentType === 'web'
      ? loadDictionary(q)
      : Promise.resolve();


  try{

    const r =
      await fetch(
        `${WORKER_BASE}/api/search` +
        `?q=${encodeURIComponent(q)}` +
        `&page=${page}` +
        `&type=${encodeURIComponent(currentType)}`
      );


    let d;


    try{

      d=await r.json();

    }catch(_){

      throw new Error(
        'Search worker returned invalid JSON.'
      );

    }


    if(!r.ok){

      throw new Error(
        d.error ||
        'Search failed.'
      );

    }


    render(d);

  }catch(e){

    list.innerHTML =
      `<div class="error">
        ${esc(
          e.message ||
          'Search failed. Please try again.'
        )}
      </div>`;

  }


  await dictionaryPromise;

}


/* ============================================================
   FORM EVENTS
   ============================================================ */

input.addEventListener(
  'input',
  () =>
    updateButtonState(
      submitButton,
      input.value
    )
);


updateButtonState(
  submitButton,
  input.value
);


resultsInput.addEventListener(
  'input',
  () =>
    updateButtonState(
      resultsSubmitButton,
      resultsInput.value
    )
);


updateButtonState(
  resultsSubmitButton,
  resultsInput.value
);


form.addEventListener(
  'submit',
  e=>{
    e.preventDefault();

    search(
      input.value,
      0,
      currentType
    );
  }
);


resultsForm.addEventListener(
  'submit',
  e=>{
    e.preventDefault();

    search(
      resultsInput.value,
      0,
      currentType
    );
  }
);


/* ============================================================
   SEARCH TYPE BUTTONS
   ============================================================ */

document
  .querySelectorAll('.search-type')
  .forEach(btn=>{

    btn.addEventListener(
      'click',
      ()=>{

        const q =
          resultsInput.value ||
          currentQ;


        search(
          q,
          0,
          btn.dataset.type
        );

      }
    );

  });


/* ============================================================
   INITIAL URL SEARCH
   ============================================================ */

const params =
  new URLSearchParams(
    location.search
  );


const initialQuery =
  params.get('q');


const initialPage =
  Math.max(
    0,
    Number(
      params.get('page') || 0
    )
  );


const initialType =
  [
    'web',
    'images',
    'news',
    'map'
  ].includes(
    params.get('type')
  )
    ? params.get('type')
    : 'web';


if(initialQuery){

  search(
    initialQuery,
    initialPage,
    initialType
  );

}


/* ============================================================
   AUTOCOMPLETE
   ============================================================ */

(() => {

  const inputs =
    [
      ...document.querySelectorAll(
        '#q, #resultsQ'
      )
    ];


  if(!inputs.length){
    return;
  }


  let timer=null;
  let controller=null;
  let selected=-1;
  let items=[];


  const escape =
    v =>
      String(v ?? '').replace(
        /[&<>"']/g,
        c=>({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        }[c])
      );


  function setup(input){

    const wrap =
      input.closest('form') ||
      input.parentElement;


    wrap.classList.add(
      'flibidoo-suggest-wrap'
    );


    const box =
      document.createElement('div');


    box.className =
      'flibidoo-suggestions';


    box.hidden=true;


    wrap.appendChild(box);


    function close(){

      box.hidden=true;
      box.innerHTML='';
      selected=-1;

    }


    function choose(q){

      input.value=q;

      close();


      const f =
        input.closest('form');


      if(f){
        f.requestSubmit();
      }

    }


    async function load(){

      const q =
        input.value.trim();


      if(q.length < 2){

        close();

        return;

      }


      if(controller){
        controller.abort();
      }


      controller =
        new AbortController();


      try{

        const r =
          await fetch(
            `${WORKER_BASE}/api/suggest?q=` +
            encodeURIComponent(q),
            {
              signal:
                controller.signal
            }
          );


        if(!r.ok){
          throw new Error();
        }


        const d =
          await r.json();


        items =
          Array.isArray(
            d.suggestions
          )
            ? d.suggestions.slice(0,8)
            : [];


        if(!items.length){

          close();

          return;

        }


        box.innerHTML =
          items.map(
            (x,i)=>
              `
              <button
                class="flibidoo-suggestion"
                type="button"
                data-i="${i}"
              >

                ${
                  x.img
                    ? `
                      <img
                        src="${escape(x.img)}"
                        alt=""
                        loading="lazy"
                        referrerpolicy="no-referrer"
                      >
                    `
                    : ''
                }

                <span>
                  ${escape(x.query)}

                  ${
                    x.entity && x.desc
                      ? `<small>${escape(x.desc)}</small>`
                      : ''
                  }
                </span>

              </button>
              `
          )
          .join('');


        box.hidden=false;


        box
          .querySelectorAll('button')
          .forEach(btn=>{

            btn.addEventListener(
              'mousedown',
              e=>{

                e.preventDefault();

                choose(
                  items[
                    Number(
                      btn.dataset.i
                    )
                  ].query
                );

              }
            );

          });

      }catch(_){

        close();

      }

    }


    input.addEventListener(
      'input',
      ()=>{

        clearTimeout(timer);

        timer =
          setTimeout(
            load,
            180
          );

      }
    );


    input.addEventListener(
      'keydown',
      e=>{

        if(box.hidden){
          return;
        }


        if(e.key === 'ArrowDown'){

          e.preventDefault();

          selected =
            Math.min(
              selected + 1,
              items.length - 1
            );

        }

        else if(e.key === 'ArrowUp'){

          e.preventDefault();

          selected =
            Math.max(
              selected - 1,
              -1
            );

        }

        else if(
          e.key === 'Enter' &&
          selected >= 0
        ){

          e.preventDefault();

          choose(
            items[selected].query
          );

        }

        else if(
          e.key === 'Escape'
        ){

          close();

          return;

        }


        box
          .querySelectorAll('button')
          .forEach(
            (btn,i)=>
              btn.classList.toggle(
                'active',
                i===selected
              )
          );

      }
    );


    document.addEventListener(
      'click',
      e=>{

        if(!wrap.contains(e.target)){
          close();
        }

      }
    );

  }


  inputs.forEach(setup);

})();


/* ============================================================
   EXPOSE DICTIONARY FUNCTION
   ============================================================ */

window.flibidooLoadDictionary =
  loadDictionary;

</script>

</body>
