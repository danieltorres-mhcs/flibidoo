<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1d0c22" />

  <title>FlibidooSearch</title>

  <!-- FlibidooSearch favicon -->
  <link
    rel="icon"
    type="image/png"
    href="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
  />

  <link
    rel="apple-touch-icon"
    href="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
  />

  <style>
    :root{
      --bg:#1d0c22;
      --text:#f5eef7;
      --muted:#b9aabb;
      --line:#5a4560;
      --line2:#39283d;
      --accent:#f5eef7;
      --result:#e7dce9;
      --url:#b8a2bc;
      --focus:#cdb8d1;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    a{
      color:inherit;
    }

    .shell{
      width:min(100% - 40px,1120px);
      margin:0 auto;
    }

    header{
      height:64px;
      border-bottom:1px solid var(--line2);
      display:flex;
      align-items:center;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      font-weight:600;
      letter-spacing:-.01em;
    }

    .brand img{
      width:34px;
      height:34px;
      object-fit:contain;
      display:block;
      mask-image:linear-gradient(
        to bottom,
        #000 0%,
        #000 74%,
        transparent 100%
      );
      -webkit-mask-image:linear-gradient(
        to bottom,
        #000 0%,
        #000 74%,
        transparent 100%
      );
      border-radius:0 0 11px 11px;
    }

    main{
      flex:1;
    }

    .home{
      min-height:calc(100vh - 120px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:54px 0 100px;
    }

    .hero-logo{
      width:min(210px,55vw);
      height:auto;
      display:block;
      margin-bottom:12px;
      mask-image:linear-gradient(
        to bottom,
        #000 0%,
        #000 78%,
        transparent 100%
      );
      -webkit-mask-image:linear-gradient(
        to bottom,
        #000 0%,
        #000 78%,
        transparent 100%
      );
      border-radius:0 0 34px 34px;
    }

    h1{
      font-size:clamp(34px,5vw,54px);
      line-height:1;
      margin:0 0 30px;
      letter-spacing:-.055em;
      font-weight:500;
    }

    .search-wrap{
      width:min(100%,680px);
    }

    form{
      display:flex;
      align-items:center;
      height:54px;
      border:1px solid var(--line);
      border-radius:28px;
      background:transparent;
      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    form:focus-within{
      border-color:var(--focus);
      box-shadow:0 0 0 2px rgba(205,184,209,.08);
    }

    .search-icon{
      width:20px;
      height:20px;
      margin-left:18px;
      flex:0 0 auto;
      opacity:.75;
    }

    .search-icon circle,
    .search-icon path{
      stroke:currentColor;
    }

    input{
      min-width:0;
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:16px;
      padding:0 14px;
    }

    input::placeholder{
      color:#9e8da1;
    }

    .submit{
      height:38px;
      width:38px;
      margin-right:8px;
      border:1px solid var(--line);
      background:transparent;
      color:#766679;
      border-radius:50%;
      padding:0;
      display:grid;
      place-items:center;
      font-size:20px;
      line-height:1;
      cursor:pointer;
      transition:
        color .15s ease,
        border-color .15s ease;
    }

    .submit.has-input{
      color:var(--text);
      border-color:var(--focus);
    }

    .submit:hover{
      border-color:var(--focus);
    }

    .submit:focus-visible{
      outline:2px solid var(--focus);
      outline-offset:2px;
    }

    .links{
      display:flex;
      gap:18px;
      margin-top:20px;
      color:var(--muted);
      font-size:13px;
    }

    .links button{
      border:0;
      background:none;
      color:inherit;
      cursor:pointer;
      padding:0;
    }

    .links button:hover{
      color:var(--text);
    }

    /* =====================================================
       RESULTS
       ===================================================== */

    .results{
      padding:30px 0 70px;
    }

    .results-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line2);
      padding-bottom:14px;
      margin-bottom:14px;
    }

    .count{
      font-size:13px;
      color:var(--muted);
    }

    .results-search{
      width:min(100%,680px);
      margin:0 0 28px;
    }

    .results-search form{
      height:48px;
    }

    .results-search .search-icon{
      margin-left:16px;
    }

    .results-search .submit{
      width:34px;
      height:34px;
      margin-right:6px;
    }

    /* =====================================================
       RESULTS LAYOUT

       Desktop:
       results | dictionary

       Portrait tablet/phone:
       dictionary
       results
       ===================================================== */

    .results-layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 330px;
      grid-template-areas:"results dictionary";
      gap:42px;
      align-items:start;
      transition:
        grid-template-columns .25s ease,
        gap .25s ease;
    }

    .results-layout > div:first-child{
      grid-area:results;
      min-width:0;
    }

    .dictionary{
      grid-area:dictionary;
      min-width:0;

      border-left:1px solid var(--line2);
      padding-left:28px;

      max-height:50vh;
      overflow-y:auto;
      overscroll-behavior:contain;
      scrollbar-width:thin;
    }

    .dictionary::-webkit-scrollbar{
      width:6px;
    }

    .dictionary::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.2);
      border-radius:6px;
    }

    .dictionary.hidden{
      display:none;
    }

    .dictionary-title{
      font-size:22px;
      font-weight:500;
      letter-spacing:-.02em;
      margin:0 0 5px;
    }

    .dictionary-word{
      font-size:13px;
      color:var(--muted);
      margin-bottom:22px;
    }

    .dictionary-entry{
      padding:0 0 24px;
      margin-bottom:24px;
      border-bottom:1px solid var(--line2);
    }

    .dictionary-entry:last-child{
      border-bottom:0;
    }

    .dictionary-language{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .dictionary-pos{
      font-size:15px;
      margin-bottom:12px;
    }

    .dictionary-pronunciations,
    .dictionary-forms,
    .dictionary-senses,
    .dictionary-relations,
    .dictionary-translations{
      margin-top:14px;
    }

    .dictionary-label{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:7px;
    }

    .dictionary-list{
      margin:0;
      padding-left:18px;
    }

    .dictionary-list li{
      margin:0 0 7px;
    }

    .dictionary-sense{
      margin:0 0 15px;
    }

    .dictionary-definition{
      font-size:14px;
      line-height:1.55;
    }

    .dictionary-tags{
      font-size:12px;
      color:var(--muted);
      margin-left:5px;
    }

    .dictionary-example{
      font-size:13px;
      line-height:1.5;
      color:var(--result);
      margin:7px 0 0 14px;
    }

    .dictionary-quote{
      font-size:13px;
      line-height:1.5;
      color:var(--muted);
      margin:7px 0 0 14px;
    }

    .dictionary-source{
      font-size:12px;
      line-height:1.5;
      color:var(--muted);
      padding-top:4px;
    }

    .dictionary-source a{
      color:inherit;
    }

    .dictionary-loading,
    .dictionary-empty{
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    /* =====================================================
       STICKY DICTIONARY
       Desktop = sticky
       ===================================================== */

    @media (min-width:861px){

      .dictionary{
        position:sticky;
        top:24px;
        align-self:start;
      }
    }

    /* =====================================================
       TABLET LANDSCAPE
       Sticky dictionary stays on right
       ===================================================== */

    @media (min-width:641px) and (max-width:860px) and (orientation:landscape){

      .results-layout{
        grid-template-columns:minmax(0,1fr) 300px;
        grid-template-areas:"results dictionary";
        gap:30px;
      }

      .dictionary{
        position:sticky;
        top:20px;
        align-self:start;

        border-left:1px solid var(--line2);
        border-top:0;
        padding:0 0 0 24px;

        max-height:calc(100vh - 40px);
      }
    }

    /* =====================================================
       PORTRAIT TABLET + PHONE

       Dictionary ABOVE results
       NOT sticky
       ===================================================== */

    @media (max-width:860px) and (orientation:portrait){

      .results-layout{
        grid-template-columns:minmax(0,1fr);
        grid-template-areas:
          "dictionary"
          "results";

        gap:28px;
      }

      .dictionary{
        position:static;

        border-left:0;
        border-top:1px solid var(--line2);
        padding:26px 0 0;

        max-height:45vh;
        overflow-y:auto;
      }

      .results-layout > div:first-child{
        width:100%;
      }
    }

    /* Also handle narrow screens that don't report orientation */
    @media (max-width:640px){

      .results-layout{
        grid-template-columns:minmax(0,1fr);
        grid-template-areas:
          "dictionary"
          "results";

        gap:22px;
      }

      .dictionary{
        position:static;

        border-left:0;
        border-top:1px solid var(--line2);
        padding:22px 0 0;

        max-height:42vh;
      }
    }

    /* =====================================================
       TRANSLATE SUGGESTION
       ===================================================== */

    .translate-message{
      display:none;
      margin:0 0 22px;
      padding:12px 14px;

      border:1px solid var(--line2);
      border-radius:10px;

      color:var(--muted);
      font-size:13px;
      line-height:1.5;

      background:rgba(255,255,255,.018);
    }

    .translate-message.visible{
      display:block;
    }

    .translate-message a{
      color:var(--text);
      text-decoration:none;
      font-weight:600;
    }

    .translate-message a:hover{
      text-decoration:underline;
    }

    /* =====================================================
       RESULT ITEMS
       ===================================================== */

    .result{
      padding:0 0 26px;
      margin-bottom:26px;
      border-bottom:1px solid var(--line2);
    }

    .result-url{
      font-size:13px;
      color:var(--url);
      margin-bottom:6px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .result h2{
      font-size:20px;
      line-height:1.25;
      margin:0 0 7px;
      font-weight:500;
      letter-spacing:-.02em;
    }

    .result h2 a{
      text-decoration:none;
    }

    .result h2 a:hover{
      text-decoration:underline;
    }

    .snippet{
      font-size:14px;
      line-height:1.6;
      color:var(--result);
      margin:0;
      max-width:760px;
    }

    .empty,
    .error{
      padding:70px 0;
      color:var(--muted);
      text-align:center;
    }

    .error{
      color:#d9bfcf;
    }

    .pager{
      display:flex;
      gap:8px;
      padding-top:10px;
    }

    .pager button{
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      border-radius:4px;
      padding:8px 12px;
      cursor:pointer;
    }

    .pager button:hover{
      border-color:var(--focus);
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    footer{
      height:56px;
      border-top:1px solid var(--line2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:var(--muted);
      font-size:12px;
    }

    .footer-links{
      display:flex;
      gap:16px;
    }

    .footer-links a{
      text-decoration:none;
    }

    .footer-links a:hover{
      text-decoration:underline;
      color:var(--text);
    }

    .hidden{
      display:none!important;
    }

    /* =====================================================
       LOGO UPDATE
       ===================================================== */

    .logo,
    .brand-logo,
    img[alt*="Flibidoo" i],
    img[src*="flibidoo" i]{
      border-radius:0!important;

      -webkit-mask-image:
        linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        ),
        linear-gradient(
          to bottom,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

      mask-image:
        linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        ),
        linear-gradient(
          to bottom,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

      -webkit-mask-composite:source-in;
      mask-composite:intersect;
    }

    /* =====================================================
       SUBMIT ICON
       ===================================================== */

    .submit-icon{
      width:18px;
      height:18px;
      display:block;
      transition:
        color .15s ease,
        opacity .15s ease;
    }

    .submit{
      color:var(--muted);
    }

    .submit.has-input{
      color:var(--text);
    }

    /* =====================================================
       RESULTS HEADER
       ===================================================== */

    .results-header{
      display:flex;
      align-items:center;
      gap:18px;
      min-height:44px;
    }

    .results-brand{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:inherit;
      white-space:nowrap;
    }

    .results-brand img{
      width:28px;
      height:28px;
      object-fit:contain;
      display:block;
    }

    .results-brand span{
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
    }

    .results-query-label{
      font-size:14px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* =====================================================
       SEARCH TYPE NAVIGATION
       ===================================================== */

    .search-types{
      display:flex;
      align-items:flex-end;
      gap:0;
      margin:8px 0 18px;
      border-bottom:1px solid rgba(255,255,255,.12);
      height:36px;
    }

    .search-type{
      position:relative;
      appearance:none;
      border:0;
      background:transparent;
      color:rgba(255,255,255,.62);
      font:inherit;
      font-size:13px;
      line-height:20px;
      padding:0 12px 10px;
      margin:0;
      border-radius:0;
      cursor:pointer;
      transition:color .12s ease;
    }

    .search-type:hover{
      color:rgba(255,255,255,.9);
      background:transparent;
    }

    .search-type.active{
      color:#fff;
      background:transparent;
    }

    .search-type.active::after{
      content:"";
      position:absolute;
      left:10px;
      right:10px;
      bottom:-1px;
      height:2px;
      border-radius:2px 2px 0 0;
      background:currentColor;
    }

    .search-type:focus-visible{
      outline:1px solid rgba(255,255,255,.55);
      outline-offset:-2px;
    }

    /* =====================================================
       FAVICONS
       ===================================================== */

    .result-item{
      position:relative;
    }

    .result-site-icon{
      width:28px;
      height:28px;
      flex:0 0 28px;
      object-fit:contain;
      border-radius:4px;
      display:block;
    }

    .result-url-row{
      display:flex;
      align-items:center;
      gap:7px;
      min-width:0;
    }

    .result-url-row .result-url{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .result-meta{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .result-favicon{
      width:18px;
      height:18px;
      object-fit:contain;
      vertical-align:-4px;
      margin-right:7px;
    }

    /* =====================================================
       RESULT TYPE LAYOUTS
       ===================================================== */

    .image-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:28px 22px;
    }

    .image-result{
      min-width:0;
    }

    .image-result a{
      display:block;
      text-decoration:none;
    }

    .image-result img{
      display:block;
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      border:1px solid var(--line2);
      background:rgba(255,255,255,.02);
    }

    .image-result-title{
      font-size:14px;
      line-height:1.4;
      margin-top:9px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .image-result-source{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .map-result{
      padding:0 0 22px;
      margin-bottom:22px;
      border-bottom:1px solid var(--line2);
    }

    .map-result-title{
      font-size:18px;
      line-height:1.35;
      margin:0 0 6px;
      font-weight:500;
    }

    .map-result-title a{
      text-decoration:none;
    }

    .map-result-title a:hover{
      text-decoration:underline;
    }

    .map-result-address{
      font-size:14px;
      line-height:1.55;
      color:var(--result);
    }

    .map-result-coords{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    /* =====================================================
       MEDIA
       ===================================================== */

    .result-inline-thumb{
      margin-top:10px;
      max-width:260px;
    }

    .result-inline-thumb img{
      display:block;
      width:100%;
      max-height:150px;
      object-fit:cover;
    }

    .flibidoo-suggest-wrap{
      position:relative;
    }

    .flibidoo-suggestions{
      position:absolute;
      left:0;
      right:0;
      top:calc(100% + 4px);
      z-index:100;
      background:#1d0c22;
      border:1px solid rgba(255,255,255,.14);
      overflow:hidden;
    }

    /* =====================================================
       DICTIONARY FALLBACK
       ===================================================== */

    .dictionary-fallback{
      max-height:50vh;
      overflow-y:auto;
      padding:14px 16px;
      box-sizing:border-box;
    }

    .dictionary-line{
      font-size:13px;
      line-height:1.5;
      margin-top:7px;
    }

    /* =====================================================
       AUTOCOMPLETE
       ===================================================== */

    .flibidoo-suggestions{
      border-radius:8px;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
    }

    .flibidoo-suggestion{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      border:0;
      background:transparent;
      color:#fff;
      text-align:left;
      padding:10px 13px;
      font:inherit;
      font-size:13px;
      cursor:pointer;
    }

    .flibidoo-suggestion:hover,
    .flibidoo-suggestion.active{
      background:rgba(255,255,255,.07);
    }

    .flibidoo-suggestion img{
      width:24px;
      height:24px;
      object-fit:cover;
      border-radius:50%;
    }

    .flibidoo-suggestion small{
      display:block;
      color:rgba(255,255,255,.55);
      margin-top:2px;
    }

    /* =====================================================
       RESPONSIVE PADDING
       ===================================================== */

    @media(max-width:1120px){

      .shell{
        width:min(
          calc(100% - 48px),
          1120px
        );
      }
    }

    @media(max-width:860px){

      .shell{
        width:min(
          calc(100% - 40px),
          1120px
        );
      }

      .results{
        padding-top:26px;
      }
    }

    @media(max-width:640px){

      .shell{
        width:calc(100% - 28px);
        max-width:none;
      }

      header{
        height:58px;
      }

      .home{
        padding-top:25px;
        padding-left:7px;
        padding-right:7px;
      }

      .hero-logo{
        width:150px;
      }

      h1{
        font-size:36px;
        margin-bottom:24px;
      }

      form{
        height:50px;
      }

      .submit{
        width:38px;
        padding:0;
      }

      .results{
        padding-top:22px;
        padding-left:2px;
        padding-right:2px;
      }

      .results-search{
        width:100%;
      }

      .search-types{
        overflow-x:auto;
        scrollbar-width:none;
      }

      .search-types::-webkit-scrollbar{
        display:none;
      }

      .search-type{
        padding-left:10px;
        padding-right:10px;
        font-size:12px;
      }

      .results-head{
        gap:10px;
      }

      .results-brand img{
        width:24px;
        height:24px;
      }

      .results-brand span{
        font-size:14px;
      }

      .results-query-label,
      .results-query{
        font-size:13px;
      }

      .image-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:22px 14px;
      }
    }

    @media(max-width:460px){

      .shell{
        width:calc(100% - 24px);
      }

      .image-grid{
        grid-template-columns:1fr;
      }

      .dictionary{
        max-height:40vh;
      }
    }
  </style>
</head>

<script>
/* =========================================================
   FLIBIDOO SEARCH WORKER
   ========================================================= */

const WORKER_BASE =
  'https://ancient-unit-5007.daniel-torres-a95.workers.dev';


/* =========================================================
   ELEMENTS
   ========================================================= */

const form =
  document.querySelector('#searchForm');

const input =
  document.querySelector('#q');

const submitButton =
  document.querySelector('#submitButton');

const home =
  document.querySelector('#home');

const results =
  document.querySelector('#results');

const list =
  document.querySelector('#resultList');

const label =
  document.querySelector('#queryLabel');

const count =
  document.querySelector('#count');

const pager =
  document.querySelector('#pager');

const resultsForm =
  document.querySelector('#resultsSearchForm');

const resultsInput =
  document.querySelector('#resultsQ');

const resultsSubmitButton =
  document.querySelector('#resultsSubmitButton');

const dictionary =
  document.querySelector('#dictionary');

const translateMessage =
  document.querySelector('#translateMessage');


let currentQ = '';
let currentPage = 1;
let currentType = 'web';


/* =========================================================
   UTILITIES
   ========================================================= */

function esc(s=''){
  return String(s).replace(
    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );
}


function updateButtonState(button,value){
  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );
}


function normalize(s=''){
  return s
    .toLowerCase()
    .trim()
    .replace(/[“”"'.,!?;:()[\]{}]/g,'')
    .replace(/\s+/g,' ');
}


function levenshtein(a,b){

  const prev =
    Array.from(
      {length:b.length+1},
      (_,i)=>i
    );

  for(let i=1;i<=a.length;i++){

    let cur=[i];

    for(let j=1;j<=b.length;j++){

      cur[j]=Math.min(
        cur[j-1]+1,
        prev[j]+1,
        prev[j-1]+(
          a[i-1]===b[j-1]
            ?0
            :1
        )
      );
    }

    for(
      let j=0;
      j<=b.length;
      j++
    ){
      prev[j]=cur[j];
    }
  }

  return prev[b.length];
}


/* =========================================================
   DICTIONARY QUERY DETECTION
   ========================================================= */

function dictionaryWord(query){

  const q=normalize(query);

  if(!q){
    return null;
  }

  if(q.split(' ').length===1){
    return q;
  }

  const tokens=q
    .split(' ')
    .filter(Boolean);

  const candidates=new Set();

  for(const t of tokens){

    if(/^[a-z][a-z'-]*$/i.test(t)){

      candidates.add(
        t.replace(
          /^['-]+|['-]+$/g,
          ''
        )
      );
    }
  }

  for(const word of candidates){

    const templates=[
      `meaning of ${word}`,
      `${word} meaning`,
      `${word} means`,
      `${word} definition`,
      `definition of ${word}`
    ];

    for(
      const template of templates
    ){

      if(
        levenshtein(
          q,
          template
        )<=3
      ){
        return word;
      }
    }
  }

  return null;
}


/* =========================================================
   TRANSLATE REQUEST DETECTION
   =========================================================

   Detects things such as:

   translate hello to spanish
   translator english to french
   translated to english
   hello to english
   english to japanese
   say hello in spanish
   say hello in japanese
   ========================================================= */

function isTranslationQuery(query){

  const q = String(query || '')
    .trim()
    .toLowerCase();

  if(!q){
    return false;
  }


  /*
   * Explicit translation words
   */

  if(
    /\btranslate\b/.test(q) ||
    /\btranslator\b/.test(q) ||
    /\btranslated\b/.test(q)
  ){
    return true;
  }


  /*
   * "... to english"
   *
   * Example:
   * hello to english
   * translate this to english
   */

  if(
    /\bto\s+(?:the\s+)?english\b/.test(q)
  ){
    return true;
  }


  /*
   * "english to ..."
   *
   * Example:
   * english to spanish
   * english to japanese
   */

  if(
    /\benglish\s+to\s+[a-z-]+/.test(q)
  ){
    return true;
  }


  /*
   * "say ____ in ____"
   *
   * Example:
   * say hello in spanish
   * say good morning in japanese
   * say thank you in french
   */

  if(
    /\bsay\s+.+\s+in\s+[a-z][a-z-]*(?:\s+[a-z][a-z-]*)?$/i.test(q)
  ){
    return true;
  }


  return false;
}


function updateTranslateMessage(query){

  if(
    translateMessage &&
    isTranslationQuery(query)
  ){
    translateMessage.classList.add('visible');
  }else if(translateMessage){
    translateMessage.classList.remove('visible');
  }
}


/* =========================================================
   RENDER SEARCH RESULTS
   ========================================================= */

function render(data){

  home.classList.add('hidden');
  results.classList.remove('hidden');

  currentType =
    data.type || currentType;

  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';

  const resultsArray =
    Array.isArray(data.results)
      ? data.results
      : [];

  count.textContent =
    resultsArray.length
      ? `${resultsArray.length} results`
      : '';

  resultsInput.value =
    data.query || '';

  updateButtonState(
    resultsSubmitButton,
    resultsInput.value
  );

  updateTranslateMessage(
    data.query || currentQ
  );

  document
    .querySelectorAll('.search-type')
    .forEach(
      b =>
        b.classList.toggle(
          'active',
          b.dataset.type===currentType
        )
    );

  list.innerHTML='';
  pager.innerHTML='';


  if(!resultsArray.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    return;
  }


  /* =======================================================
     IMAGES
     ======================================================= */

  if(currentType==='images'){

    const grid =
      document.createElement('div');

    grid.className='image-grid';

    resultsArray.forEach(r=>{

      const u =
        r.url ||
        r.properties?.url ||
        '';

      const img =
        r.thumbnail ||
        r.properties?.url ||
        '';

      if(!img){
        return;
      }

      const el =
        document.createElement('article');

      el.className='image-result';

      el.innerHTML=`
        <a
          href="${esc(u)}"
          rel="noopener noreferrer"
        >
          <img
            src="${esc(img)}"
            alt="${esc(r.title||'')}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >
        </a>

        <div class="image-result-title">
          ${esc(r.title||u)}
        </div>

        <div class="image-result-source">
          ${esc(
            r.source ||
            r.meta_url?.hostname ||
            ''
          )}
        </div>
      `;

      grid.appendChild(el);
    });


    if(grid.children.length){

      list.appendChild(grid);

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';
    }

  }


  /* =======================================================
     MAPS
     ======================================================= */

  else if(currentType==='map'){

    resultsArray.forEach(r=>{

      const el =
        document.createElement('article');

      el.className='map-result';

      const u =
        r.url || '';

      const title =
        r.title || 'Map result';

      const address =
        r.address
          ? Object
              .values(r.address)
              .filter(Boolean)
              .join(', ')
          : (
              r.description || ''
            );

      el.innerHTML=`
        <h2 class="map-result-title">
          <a
            href="${esc(u)}"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>
        </h2>

        <div class="map-result-address">
          ${esc(address)}
        </div>

        ${
          r.lat && r.lon
            ? `
              <div class="map-result-coords">
                ${esc(r.lat)}, ${esc(r.lon)}
              </div>
            `
            : ''
        }
      `;

      list.appendChild(el);
    });

  }


  /* =======================================================
     WEB / NEWS
     ======================================================= */

  else{

    resultsArray.forEach(r=>{

      const el =
        document.createElement('article');

      el.className='result';

      const u =
        r.url || '';

      const favicon =
        r.meta_url?.favicon || '';

      const host =
        r.meta_url?.hostname || '';

      const title =
        r.title || u;

      const description =
        r.description ||
        r.content ||
        '';

      const age =
        r.age ||
        r.publishedDate ||
        '';

      const thumb =
        r.thumbnail?.src ||
        r.thumbnail ||
        '';


      el.innerHTML=`

        <div class="result-url">

          ${
            favicon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(favicon)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

          <span>
            ${esc(host || u)}
          </span>

        </div>


        <h2>
          <a
            href="${esc(u)}"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>
        </h2>


        ${
          description
            ? `
              <p class="snippet">
                ${window.flibidooRichText(description)}
              </p>
            `
            : ''
        }


        ${
          age
            ? `
              <div class="result-meta">
                ${esc(age)}
              </div>
            `
            : ''
        }


        ${
          thumb
            ? `
              <div class="result-inline-thumb">
                <img
                  src="${esc(thumb)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              </div>
            `
            : ''
        }

      `;

      list.appendChild(el);
    });
  }


  /* =======================================================
     PAGINATION
     ======================================================= */

  const hasMore =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage>0){

    const b =
      document.createElement('button');

    b.textContent='Previous';

    b.onclick=() =>
      search(
        currentQ,
        currentPage-1,
        currentType
      );

    pager.appendChild(b);
  }


  if(hasMore){

    const b =
      document.createElement('button');

    b.textContent='Next';

    b.onclick=() =>
      search(
        currentQ,
        currentPage+1,
        currentType
      );

    pager.appendChild(b);
  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(
      data.query || currentQ
    )}&type=${encodeURIComponent(
      currentType
    )}${
      currentPage
        ? `&page=${currentPage}`
        : ''
    }`
  );
}


/* =========================================================
   DICTIONARY
   ========================================================= */

function dictionaryTags(tags){

  return Array.isArray(tags) &&
    tags.length

    ? `
      <span class="dictionary-tags">
        (${tags.map(esc).join(', ')})
      </span>
    `

    : '';
}


function renderSense(
  sense,
  depth=0
){

  if(!sense){
    return '';
  }

  let html=`
    <div
      class="dictionary-sense"
      style="margin-left:${Math.min(depth,3)*12}px"
    >
  `;


  if(sense.definition){

    html += `
      <div class="dictionary-definition">
        ${esc(sense.definition)}
        ${dictionaryTags(sense.tags)}
      </div>
    `;
  }


  if(Array.isArray(sense.examples)){

    sense.examples.forEach(x=>{

      if(x){

        html += `
          <div class="dictionary-example">
            “${esc(x)}”
          </div>
        `;
      }
    });
  }


  if(Array.isArray(sense.quotes)){

    sense.quotes.forEach(q=>{

      if(q?.text){

        html += `
          <div class="dictionary-quote">
            “${esc(q.text)}”
            ${
              q.reference
                ? ` — ${esc(q.reference)}`
                : ''
            }
          </div>
        `;
      }
    });
  }


  if(
    Array.isArray(sense.synonyms) &&
    sense.synonyms.length
  ){

    html += `
      <div class="dictionary-relations">

        <div class="dictionary-label">
          Synonyms
        </div>

        <div>
          ${sense.synonyms.map(esc).join(', ')}
        </div>

      </div>
    `;
  }


  if(
    Array.isArray(sense.antonyms) &&
    sense.antonyms.length
  ){

    html += `
      <div class="dictionary-relations">

        <div class="dictionary-label">
          Antonyms
        </div>

        <div>
          ${sense.antonyms.map(esc).join(', ')}
        </div>

      </div>
    `;
  }


  if(
    Array.isArray(sense.translations) &&
    sense.translations.length
  ){

    html += `
      <div class="dictionary-translations">

        <div class="dictionary-label">
          Translations
        </div>

        <ul class="dictionary-list">
    `;


    sense.translations.forEach(t=>{

      if(t?.word){

        html += `
          <li>
            ${esc(
              t.language?.name ||
              t.language?.code ||
              ''
            )}
            —
            ${esc(t.word)}
          </li>
        `;
      }
    });


    html += `
        </ul>

      </div>
    `;
  }


  if(Array.isArray(sense.subsenses)){

    sense.subsenses.forEach(
      sub =>
        html +=
          renderSense(
            sub,
            depth+1
          )
    );
  }


  return html+'</div>';
}


function renderDictionary(data){

  if(
    !data?.entries?.length
  ){

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML='';

    return;
  }


  let html=`
    <h2 class="dictionary-title">
      ${esc(data.word||'')}
    </h2>

    <div class="dictionary-word">
      Dictionary
    </div>
  `;


  data.entries.forEach(entry=>{

    html += `
      <section class="dictionary-entry">
    `;


    const language =
      entry.language?.name ||
      entry.language?.code;


    if(language){

      html += `
        <div class="dictionary-language">
          ${esc(language)}
          ${
            entry.language?.code
              ? ` (${esc(entry.language.code)})`
              : ''
          }
        </div>
      `;
    }


    if(entry.partOfSpeech){

      html += `
        <div class="dictionary-pos">
          ${esc(entry.partOfSpeech)}
        </div>
      `;
    }


    if(
      Array.isArray(entry.pronunciations) &&
      entry.pronunciations.length
    ){

      html += `
        <div class="dictionary-pronunciations">

          <div class="dictionary-label">
            Pronunciations
          </div>

          <ul class="dictionary-list">
      `;


      entry.pronunciations.forEach(p=>{

        if(p?.text){

          html += `
            <li>
              ${esc(p.text)}
              ${
                p.type
                  ? ` — ${esc(p.type)}`
                  : ''
              }
              ${dictionaryTags(p.tags)}
            </li>
          `;
        }
      });


      html += `
          </ul>
        </div>
      `;
    }


    if(
      Array.isArray(entry.forms) &&
      entry.forms.length
    ){

      html += `
        <div class="dictionary-forms">

          <div class="dictionary-label">
            Forms
          </div>

          <ul class="dictionary-list">
      `;


      entry.forms.forEach(f=>{

        if(f?.word){

          html += `
            <li>
              ${esc(f.word)}
              ${dictionaryTags(f.tags)}
            </li>
          `;
        }
      });


      html += `
          </ul>

        </div>
      `;
    }


    if(
      Array.isArray(entry.senses) &&
      entry.senses.length
    ){

      html += `
        <div class="dictionary-senses">

          <div class="dictionary-label">
            Definitions
          </div>
      `;


      entry.senses.forEach(
        s =>
          html += renderSense(s)
      );


      html += `
        </div>
      `;
    }


    if(
      Array.isArray(entry.synonyms) &&
      entry.synonyms.length
    ){

      html += `
        <div class="dictionary-relations">

          <div class="dictionary-label">
            Synonyms
          </div>

          <div>
            ${entry.synonyms.map(esc).join(', ')}
          </div>

        </div>
      `;
    }


    if(
      Array.isArray(entry.antonyms) &&
      entry.antonyms.length
    ){

      html += `
        <div class="dictionary-relations">

          <div class="dictionary-label">
            Antonyms
          </div>

          <div>
            ${entry.antonyms.map(esc).join(', ')}
          </div>

        </div>
      `;
    }


    html += `
      </section>
    `;
  });


  if(data.source){

    html += `
      <div class="dictionary-source">

        Source:
        ${
          data.source.url
            ? `
              <a
                href="${esc(data.source.url)}"
                rel="noopener noreferrer"
              >
                ${esc(data.source.url)}
              </a>
            `
            : ''
        }

        ${
          data.source.license
            ? `
              <br>
              License:
              ${
                data.source.license.url
                  ? `
                    <a
                      href="${esc(data.source.license.url)}"
                      rel="noopener noreferrer"
                    >
                      ${esc(
                        data.source.license.name ||
                        'License'
                      )}
                    </a>
                  `
                  : esc(
                      data.source.license.name ||
                      ''
                    )
              }
            `
            : ''
        }

      </div>
    `;
  }


  dictionary.innerHTML=html;

  dictionary.classList.remove(
    'hidden'
  );
}


async function loadDictionary(q){

  const word =
    dictionaryWord(q);


  if(!word){

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML='';

    return;
  }


  dictionary.classList.remove(
    'hidden'
  );

  dictionary.innerHTML =
    '<div class="dictionary-loading">Looking up the definition…</div>';


  try{

    const r =
      await fetch(
        `${WORKER_BASE}/api/dictionary?word=${encodeURIComponent(word)}`
      );


    if(!r.ok){

      dictionary.classList.add(
        'hidden'
      );

      return;
    }


    const data =
      await r.json();


    if(data?.entries?.length){

      renderDictionary(data);

    }else{

      dictionary.classList.add(
        'hidden'
      );

      dictionary.innerHTML='';
    }

  }catch{

    dictionary.classList.add(
      'hidden'
    );

    dictionary.innerHTML='';
  }
}


/* =========================================================
   SEARCH
   ========================================================= */

async function search(
  q,
  page=0,
  type=currentType
){

  q=q.trim();

  if(!q){
    return;
  }


  currentQ=q;
  currentPage=page;
  currentType=type;


  input.value=q;
  resultsInput.value=q;


  updateButtonState(
    submitButton,
    q
  );

  updateButtonState(
    resultsSubmitButton,
    q
  );


  updateTranslateMessage(q);


  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );


  list.innerHTML =
    '<div class="empty">Searching…</div>';


  count.textContent='';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML='';


  document
    .querySelectorAll('.search-type')
    .forEach(
      b =>
        b.classList.toggle(
          'active',
          b.dataset.type===currentType
        )
    );


  /*
   * Dictionary runs independently.
   */

  const dictionaryPromise =
    currentType==='web'
      ? loadDictionary(q)
      : Promise.resolve();


  try{

    const r =
      await fetch(
        `${WORKER_BASE}/api/search?q=${encodeURIComponent(q)}&page=${page}&type=${encodeURIComponent(currentType)}`
      );


    const d =
      await r.json();


    if(!r.ok){

      throw new Error(
        d.error ||
        'Search failed'
      );
    }


    render(d);

  }catch(e){

    list.innerHTML =
      `<div class="error">
        ${esc(
          e.message ||
          'Search failed. Please try again.'
        )}
      </div>`;
  }


  await dictionaryPromise;
}

<!-- =======================================================
     INDEPENDENT DICTIONARY FALLBACK
     ======================================================= -->

<script>
(() => {

  const DICT_BASE =
    'https://freedictionaryapi.com/api/v1/entries/all/';


  const qEl =
    document.querySelector(
      '#searchInput, input[name="q"], input[type="search"]'
    );


  const dictEl =
    document.querySelector(
      '#dictionary, .dictionary, .definition-panel, .dictionary-panel'
    );


  function dictionaryQuery(q){

    q=(q||'').trim();

    if(!q){
      return '';
    }


    const m =
      q.match(
        /^(?:meaning of|definition of)\s+(.+)$/i
      ) ||
      q.match(
        /^(.+?)\s+(?:meaning|means|definition)$/i
      );


    return m
      ? m[1].trim()
      : q;
  }


  function looksLikeDefinition(q){

    const clean =
      (q||'').trim();


    return (
      /^[A-Za-z][A-Za-z'-]{0,31}$/.test(clean) ||

      /^(?:meaning of|definition of)\s+[A-Za-z][A-Za-z'-]{0,31}$/i
        .test(clean) ||

      /^[A-Za-z][A-Za-z'-]{0,31}\s+(?:meaning|means|definition)$/i
        .test(clean)
    );
  }


  async function loadDictionary(q){

    if(
      !dictEl ||
      !looksLikeDefinition(q)
    ){
      return;
    }


    const word =
      dictionaryQuery(q);


    if(!word){
      return;
    }


    try{

      const r =
        await fetch(
          DICT_BASE +
          encodeURIComponent(word)
        );


      if(!r.ok){
        return;
      }


      const data =
        await r.json();


      if(
        !data ||
        !Array.isArray(data.entries) ||
        !data.entries.length
      ){
        return;
      }


      if(
        typeof window.showDictionary ===
        'function'
      ){

        window.showDictionary(data);

        return;
      }


      if(
        typeof window.renderDictionary ===
        'function'
      ){

        window.renderDictionary(data);

        return;
      }


      const entries =
        data.entries
          .flatMap(
            e =>
              (e.senses || [])
                .map(
                  sense=>({

                    pos:
                      e.partOfSpeech ||
                      '',

                    definition:
                      sense.definition ||
                      '',

                    examples:
                      sense.examples ||
                      [],

                    synonyms:
                      sense.synonyms ||
                      [],

                    antonyms:
                      sense.antonyms ||
                      []
                  })
                )
          )
          .filter(
            x =>
              x.definition ||
              x.examples.length ||
              x.synonyms.length ||
              x.antonyms.length
          );


      dictEl.innerHTML=`
        <div class="dictionary-fallback">

          <div class="dictionary-word">
            ${escapeHtml(
              data.word ||
              word
            )}
          </div>

          ${
            entries.map(
              e => `

                <section>

                  ${
                    e.pos
                      ? `
                        <div class="dictionary-pos">
                          ${escapeHtml(e.pos)}
                        </div>
                      `
                      : ''
                  }

                  ${
                    e.definition
                      ? `
                        <div class="dictionary-definition">
                          ${escapeHtml(e.definition)}
                        </div>
                      `
                      : ''
                  }

                  ${
                    e.examples
                      .map(
                        x =>
                          `
                            <div class="dictionary-example">
                              “${escapeHtml(x)}”
                            </div>
                          `
                      )
                      .join('')
                  }

                  ${
                    e.synonyms.length
                      ? `
                        <div class="dictionary-line">
                          <b>Synonyms:</b>
                          ${e.synonyms.map(escapeHtml).join(', ')}
                        </div>
                      `
                      : ''
                  }

                  ${
                    e.antonyms.length
                      ? `
                        <div class="dictionary-line">
                          <b>Antonyms:</b>
                          ${e.antonyms.map(escapeHtml).join(', ')}
                        </div>
                      `
                      : ''
                  }

                </section>
              `
            ).join('')
          }

        </div>
      `;


      dictEl.hidden=false;

    }catch(_){

      /*
       * Dictionary failure never blocks
       * web search.
       */
    }
  }


  function escapeHtml(v){

    return String(v).replace(
      /[&<>"']/g,
      c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );
  }


  window.flibidooLoadDictionary =
    loadDictionary;


  document.addEventListener(
    'keydown',
    e=>{

      if(
        e.key==='Enter' &&
        e.target.matches(
          'input,textarea'
        )
      ){

        const q =
          e.target.value;

        if(
          looksLikeDefinition(q)
        ){

          loadDictionary(q);
        }
      }
    },
    true
  );


  window.addEventListener(
    'flibidoo:search',
    e =>
      loadDictionary(
        e.detail?.query || ''
      )
  );

})();
</script>


<!-- =======================================================
     AUTOCOMPLETE
     ======================================================= -->

<script>
(() => {

  const inputs =
    [
      ...document.querySelectorAll(
        '#q, #resultsQ'
      )
    ];


  if(!inputs.length){
    return;
  }


  let timer=null;
  let controller=null;
  let selected=-1;
  let items=[];


  const esc=v =>
    String(v??'').replace(
      /[&<>"']/g,
      c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );


  function setup(input){

    const wrap =
      input.closest('form') ||
      input.parentElement;


    wrap.classList.add(
      'flibidoo-suggest-wrap'
    );


    const box =
      document.createElement('div');


    box.className =
      'flibidoo-suggestions';

    box.hidden=true;

    wrap.appendChild(box);


    function close(){

      box.hidden=true;
      box.innerHTML='';
      selected=-1;
    }


    function choose(q){

      input.value=q;

      close();

      const f =
        input.closest('form');

      if(f){
        f.requestSubmit();
      }
    }


    async function load(){

      const q =
        input.value.trim();


      if(q.length<2){

        close();

        return;
      }


      if(controller){
        controller.abort();
      }


      controller =
        new AbortController();


      try{

        const r =
          await fetch(
            `${WORKER_BASE}/api/suggest?q=${encodeURIComponent(q)}`,
            {
              signal:
                controller.signal
            }
          );


        if(!r.ok){
          throw new Error();
        }


        const d =
          await r.json();


        items =
          Array.isArray(d.suggestions)
            ? d.suggestions.slice(0,8)
            : [];


        if(!items.length){

          close();

          return;
        }


        box.innerHTML =
          items.map(
            (x,i)=>`

              <button
                class="flibidoo-suggestion"
                type="button"
                data-i="${i}"
              >

                ${
                  x.img
                    ? `
                      <img
                        src="${esc(x.img)}"
                        alt=""
                        loading="lazy"
                        referrerpolicy="no-referrer"
                      >
                    `
                    : ''
                }

                <span>

                  ${esc(x.query)}

                  ${
                    x.entity &&
                    x.desc
                      ? `
                        <small>
                          ${esc(x.desc)}
                        </small>
                      `
                      : ''
                  }

                </span>

              </button>

            `
          ).join('');


        box.hidden=false;


        box
          .querySelectorAll('button')
          .forEach(btn=>{

            btn.addEventListener(
              'mousedown',
              e=>{

                e.preventDefault();

                choose(
                  items[
                    Number(
                      btn.dataset.i
                    )
                  ].query
                );
              }
            );
          });


      }catch(_){

        close();
      }
    }


    input.addEventListener(
      'input',
      ()=>{

        clearTimeout(timer);

        timer =
          setTimeout(
            load,
            180
          );
      }
    );


    input.addEventListener(
      'keydown',
      e=>{

        if(box.hidden){
          return;
        }


        if(e.key==='ArrowDown'){

          e.preventDefault();

          selected =
            Math.min(
              selected+1,
              items.length-1
            );

        }else if(e.key==='ArrowUp'){

          e.preventDefault();

          selected =
            Math.max(
              selected-1,
              -1
            );

        }else if(
          e.key==='Enter' &&
          selected>=0
        ){

          e.preventDefault();

          choose(
            items[selected].query
          );

        }else if(
          e.key==='Escape'
        ){

          close();

          return;
        }


        box
          .querySelectorAll('button')
          .forEach(
            (btn,i)=>
              btn.classList.toggle(
                'active',
                i===selected
              )
          );
      }
    );


    document.addEventListener(
      'click',
      e=>{

        if(!wrap.contains(e.target)){
          close();
        }
      }
    );
  }


  inputs.forEach(setup);

})();
</script>


<!-- =======================================================
     RICH DESCRIPTION RENDERER
     ======================================================= -->

<script>
(() => {

  window.flibidooRichText =
    function(value){

      let src =
        String(value ?? '');


      if(!src){
        return '';
      }


      const ta =
        document.createElement(
          'textarea'
        );


      ta.innerHTML=src;

      src=ta.value;


      src =
        src
          .replace(
            /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi,
            ''
          )
          .replace(
            /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*\/?>/gi,
            ''
          )
          .replace(
            /\s+on[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi,
            ''
          )
          .replace(
            /\s+(href|src)\s*=\s*(['"])\s*javascript:[\s\S]*?\2/gi,
            ''
          );


      const allowed=[];


      src =
        src.replace(
          /<\/?(strong|b|em|i|u|s|del|mark|small|br|code|kbd|sub|sup|a)(?:\s+[^>]*)?>/gi,
          m=>{

            const idx =
              allowed.push(m)-1;

            return `
              @@FLIBIDOO_TAG_${idx}@@
            `;
          }
        );


      src =
        src
          .replace(
            /</g,
            '&lt;'
          )
          .replace(
            />/g,
            '&gt;'
          );


      src =
        src.replace(
          /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          '<a href="$2" rel="noopener noreferrer">$1</a>'
        );


      src =
        src.replace(
          /`([^`]+)`/g,
          '<code>$1</code>'
        );


      src =
        src.replace(
          /\*\*([^*]+)\*\*/g,
          '<strong>$1</strong>'
        );


      src =
        src.replace(
          /__([^_]+)__/g,
          '<strong>$1</strong>'
        );


      src =
        src.replace(
          /~~([^~]+)~~/g,
          '<del>$1</del>'
        );


      src =
        src.replace(
          /(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;])/g,
          '$1<em>$2</em>'
        );


      src =
        src.replace(
          /(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?:;])/g,
          '$1<em>$2</em>'
        );


      src =
        src.replace(
          /^#{1,6}\s+(.+)$/gm,
          '<strong>$1</strong>'
        );


      src =
        src.replace(
          /^\s*[-*]\s+(.+)$/gm,
          '• $1'
        );


      src =
        src.replace(
          /^\s*\d+\.\s+(.+)$/gm,
          '$1'
        );


      src =
        src.replace(
          /@@FLIBIDOO_TAG_(\d+)@@/g,
          (_,i)=>
            allowed[
              Number(i)
            ] || ''
        );


      return src.replace(
        /\r?\n/g,
        '<br>'
      );
    };

})();
</script>
