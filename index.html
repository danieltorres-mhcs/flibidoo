<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">
<title>FlibidooSearch</title>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

a{color:inherit}

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px;
}

#home.home{
  width:100%;
  height:100vh;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.hero-logo{
  width:min(210px,55vw);
  height:auto;
  display:block;
  margin:0 0 12px;
  object-fit:contain;
}

h1{
  font-size:clamp(34px,5vw,54px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500;
}

.search-wrap{
  width:min(100%,680px);
}

form{
  display:flex;
  align-items:center;
  height:54px;
  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;
  transition:border-color .15s ease,box-shadow .15s ease;
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08);
}

.search-icon{
  width:20px;
  height:20px;
  margin-left:18px;
  flex:0 0 auto;
  opacity:.75;
}

.search-icon circle,
.search-icon path{
  stroke:currentColor;
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 14px;
}

input::placeholder{
  color:#9e8da1;
}

.submit{
  height:38px;
  width:38px;
  margin-right:8px;
  border:1px solid var(--line);
  background:transparent;
  color:#766679;
  border-radius:50%;
  padding:0;
  display:grid;
  place-items:center;
  cursor:pointer;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
}

.submit-icon{
  width:18px;
  height:18px;
  display:block;
}

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

/* EXACT FLAG IMAGE — emoji sized */
.confederacy-flag{
  width:18px;
  height:18px;
  display:inline-block;
  object-fit:contain;
  vertical-align:-4px;
  flex:0 0 18px;
  border-radius:4px;
}

main{
  flex:1;
}

.results{
  padding:30px 12px 70px;
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:44px;
  border-bottom:1px solid var(--line2);
  padding-bottom:14px;
  margin-bottom:14px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:inherit;
  white-space:nowrap;
}

.results-brand img{
  width:28px;
  height:28px;
  object-fit:contain;
  display:block;
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

.results-search{
  width:min(100%,680px);
  margin:0 0 28px;
}

.results-search form{
  height:48px;
}

.results-search .search-icon{
  margin-left:16px;
}

.results-search .submit{
  width:34px;
  height:34px;
  margin-right:6px;
}

.search-types{
  display:flex;
  align-items:flex-end;
  gap:0;
  margin:8px 0 18px;
  border-bottom:1px solid rgba(255,255,255,.12);
  height:36px;
}

.search-type{
  position:relative;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font:inherit;
  font-size:13px;
  line-height:20px;
  padding:0 12px 10px;
  margin:0;
  border-radius:0;
  cursor:pointer;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:-1px;
  height:2px;
  border-radius:2px 2px 0 0;
  background:currentColor;
}

.results-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:42px;
  align-items:start;
}

.result{
  padding:0 0 26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2);
}

.result-url{
  font-size:13px;
  color:var(--url);
  margin-bottom:6px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result h2{
  font-size:20px;
  line-height:1.25;
  margin:0 0 7px;
  font-weight:500;
  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.snippet{
  font-size:14px;
  line-height:1.6;
  color:var(--result);
  margin:0;
  max-width:760px;
}

.result-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:7px;
}

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-result img{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.02);
}

.image-result-title{
  font-size:14px;
  line-height:1.4;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.dictionary{
  border-left:1px solid var(--line2);
  padding-left:28px;
  max-height:70vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;
  font-weight:500;
  letter-spacing:-.02em;
  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line2);
}

.dictionary-language,
.dictionary-label{
  font-size:12px;
  color:var(--muted);
}

.dictionary-language{
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);
  margin-left:5px;
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;
  color:var(--result);
  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
}

.empty{
  padding:70px 0;
  color:var(--muted);
  text-align:center;
}

.error{
  min-height:120px;
  max-width:680px;
  margin:0;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line2);
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.pager{
  display:flex;
  gap:8px;
  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:4px;
  padding:8px 12px;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* About */
.about-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:24px;
  z-index:10000;
}

.about-overlay.hidden{
  display:none;
}

.about-card{
  position:relative;
  width:min(100%,560px);
  max-height:min(80vh,700px);
  overflow:auto;
  background:#24132a;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  padding:30px;
}

.about-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;
  font-size:25px;
  font-weight:500;
}

.about-card p{
  color:var(--result);
  line-height:1.7;
  font-size:14px;
}

.about-card a{
  color:var(--text);
}

/* Responsive */
@media(max-width:860px){
  .results-layout{
    grid-template-columns:1fr;
  }

  /* Dictionary appears FIRST on mobile/tablet */
  .dictionary{
    order:-1;
    border-left:0;
    border-bottom:1px solid var(--line2);
    border-top:0;
    padding:0 0 26px;
    margin-bottom:26px;
    max-height:none;
  }
}

@media(max-width:760px){
  .shell{
    width:100%;
    padding-left:20px;
    padding-right:20px;
  }

  #home.home{
    padding:24px 20px;
  }

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 14px;
  }
}

@media(max-width:640px){
  .shell{
    width:100%;
    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:20px 16px;
  }

  .hero-logo{
    width:150px;
  }

  h1{
    font-size:36px;
    margin-bottom:24px;
  }

  form{
    height:50px;
  }

  .results{
    padding:22px 16px 60px;
  }

  .results-head{
    gap:12px;
  }

  .results-brand img{
    width:24px;
    height:24px;
  }

  .results-brand span{
    font-size:14px;
  }

  .results-query{
    font-size:13px;
  }

  .search-types{
    overflow-x:auto;
    scrollbar-width:none;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;
    font-size:12px;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }

  .dictionary{
    padding-bottom:22px;
    margin-bottom:22px;
  }

  .result{
    padding-bottom:22px;
    margin-bottom:22px;
  }
}

@media(max-width:460px){
  .shell{
    padding-left:14px;
    padding-right:14px;
  }

  #home.home{
    padding-left:14px;
    padding-right:14px;
  }

  .image-grid{
    grid-template-columns:1fr;
  }

  .links{
    gap:12px;
  }

  .confederacy-credit{
    max-width:100%;
  }
}

@media(max-width:360px){
  h1{
    font-size:32px;
  }

  .results{
    padding-left:12px;
    padding-right:12px;
  }

  .results-head{
    gap:8px;
  }

  .results-query{
    min-width:0;
  }

  .count{
    display:none;
  }

  input{
    font-size:15px;
    padding-left:10px;
    padding-right:8px;
  }

  .submit{
    width:36px;
    height:36px;
  }
}
</style>
</head>

<body>

<main>

<section id="home" class="home shell">

  <div class="search-wrap">

    <h1><em><strong>Flibidoo</strong></em>Search</h1>

    <form id="searchForm" role="search">

      <input
        id="q"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="submitButton"
        type="submit"
        aria-label="Search"
      >→</button>

    </form>

    <div class="links">

      <button
        type="button"
        id="aboutButton"
      >About</button>

      <span class="confederacy-credit">

        <img
          class="confederacy-flag"
          src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/ref/heads/main/Untitled13_2026081194209.png"
          alt="The Great Confederacy of E"
        >

        <span>with love from The Great Confederacy of E</span>

      </span>

    </div>

  </div>

</section>


<section id="results" class="results shell hidden">

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >
      <span><em><strong>Flibidoo</strong></em>Search</span>
    </a>

    <div
      id="queryLabel"
      class="results-query"
    ></div>

    <div
      id="count"
      class="count"
    ></div>

  </div>


  <div class="results-search">

    <form
      id="resultsSearchForm"
      role="search"
    >

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >→</button>

    </form>

  </div>


  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >Web</button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >Images</button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >News</button>

  </nav>


  <div class="results-layout">

    <div>

      <div id="resultList"></div>

      <div
        id="pager"
        class="pager"
      ></div>

    </div>


    <aside
      id="dictionary"
      class="dictionary"
      aria-label="Dictionary results"
    ></aside>

  </div>

</section>

</main>


<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle"
>

  <div class="about-card">

    <button
      id="aboutClose"
      class="about-close"
      type="button"
      aria-label="Close About"
    >×</button>

    <h2 id="aboutTitle">About</h2>

    <p>Welcome to FlibidooSearch.</p>

    <p>
      You can edit this text directly in the HTML inside the
      <strong>about-card</strong>.
    </p>

  </div>

</div>


<script>

/*
 * IMPORTANT:
 * This is your Cloudflare Worker.
 *
 * Search:
 *   https://flibidoo-search.devs.surf/api/search
 *
 * Dictionary:
 *   https://flibidoo-search.devs.surf/api/dictionary
 */

const API_BASE='https://flibidoo-search.devs.surf';


const form=document.querySelector('#searchForm');
const input=document.querySelector('#q');

const home=document.querySelector('#home');
const results=document.querySelector('#results');

const list=document.querySelector('#resultList');
const label=document.querySelector('#queryLabel');
const count=document.querySelector('#count');
const pager=document.querySelector('#pager');

const resultsForm=document.querySelector('#resultsSearchForm');
const resultsInput=document.querySelector('#resultsQ');

const dictionary=document.querySelector('#dictionary');


let currentQ='';
let currentPage=0;
let currentType='web';


function esc(s=''){
  return String(s).replace(
    /[&<>'"]/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );
}


function updateButtonState(b,v){
  b.classList.toggle(
    'has-input',
    v.trim().length>0
  );
}


/*
 * DICTIONARY
 *
 * Always attempts to load the dictionary,
 * even when the main search has no results.
 */

async function loadDictionary(word){

  dictionary.classList.remove('hidden');

  dictionary.innerHTML=`
    <div class="dictionary-title">Dictionary</div>
    <div class="dictionary-word">${esc(word)}</div>
    <div class="dictionary-loading">Loading…</div>
  `;

  try{

    const response=await fetch(
      `${API_BASE}/api/dictionary?word=${encodeURIComponent(word)}`,
      {
        method:'GET',
        headers:{
          'Accept':'application/json'
        }
      }
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(
        data?.error || 'Dictionary unavailable.'
      );
    }

    renderDictionary(data,word);

  }catch(error){

    dictionary.innerHTML=`
      <div class="dictionary-title">Dictionary</div>
      <div class="dictionary-word">${esc(word)}</div>
      <div class="dictionary-empty">
        Dictionary unavailable.
      </div>
    `;

  }

}


function renderDictionary(data,word){

  const entries=
    Array.isArray(data?.entries)
      ? data.entries
      : [];

  if(!entries.length){

    dictionary.innerHTML=`
      <div class="dictionary-title">Dictionary</div>
      <div class="dictionary-word">${esc(word)}</div>
      <div class="dictionary-empty">
        No dictionary entry found.
      </div>
    `;

    return;
  }


  dictionary.innerHTML='';


  const title=document.createElement('div');
  title.className='dictionary-title';
  title.textContent='Dictionary';

  const wordEl=document.createElement('div');
  wordEl.className='dictionary-word';
  wordEl.textContent=word;

  dictionary.appendChild(title);
  dictionary.appendChild(wordEl);


  entries.forEach(entry=>{

    const entryEl=document.createElement('section');
    entryEl.className='dictionary-entry';


    if(entry.language){

      const language=document.createElement('div');
      language.className='dictionary-language';
      language.textContent=entry.language;

      entryEl.appendChild(language);

    }


    if(entry.partOfSpeech){

      const pos=document.createElement('div');
      pos.className='dictionary-pos';
      pos.textContent=entry.partOfSpeech;

      entryEl.appendChild(pos);

    }


    const senses=
      Array.isArray(entry.senses)
        ? entry.senses
        : [];


    if(senses.length){

      const sensesWrap=document.createElement('div');
      sensesWrap.className='dictionary-senses';


      const labelEl=document.createElement('div');
      labelEl.className='dictionary-label';
      labelEl.textContent='Definitions';

      sensesWrap.appendChild(labelEl);


      senses.forEach(sense=>{

        const senseEl=document.createElement('div');
        senseEl.className='dictionary-sense';


        const definition=
          sense.definition ||
          sense.gloss ||
          sense.meaning ||
          '';


        if(definition){

          const def=document.createElement('div');
          def.className='dictionary-definition';
          def.textContent=definition;

          senseEl.appendChild(def);

        }


        if(sense.example){

          const example=document.createElement('div');
          example.className='dictionary-example';
          example.textContent=`“${sense.example}”`;

          senseEl.appendChild(example);

        }


        sensesWrap.appendChild(senseEl);

      });


      entryEl.appendChild(sensesWrap);

    }


    if(
      Array.isArray(entry.translations) &&
      entry.translations.length
    ){

      const translations=document.createElement('div');
      translations.className='dictionary-translations';


      const translationLabel=document.createElement('div');
      translationLabel.className='dictionary-label';
      translationLabel.textContent='Translations';


      translations.appendChild(translationLabel);


      const ul=document.createElement('ul');
      ul.className='dictionary-list';


      entry.translations
        .slice(0,20)
        .forEach(t=>{

          const li=document.createElement('li');

          if(typeof t==='string'){
            li.textContent=t;
          }else{
            li.textContent=
              t.translation ||
              t.text ||
              t.word ||
              JSON.stringify(t);
          }

          ul.appendChild(li);

        });


      translations.appendChild(ul);
      entryEl.appendChild(translations);

    }


    dictionary.appendChild(entryEl);

  });

}


/*
 * RENDER SEARCH RESULTS
 */

function render(data){

  home.classList.add('hidden');
  results.classList.remove('hidden');

  currentType=data.type||currentType;

  label.textContent=
    data.query
      ? `Results for “${data.query}”`
      : '';


  let a=[];


  if(currentType==='web'){

    a=
      Array.isArray(data.results)
        ? data.results
        : Array.isArray(data.results?.web?.results)
          ? data.results.web.results
          : [];

  }else if(
    currentType==='images' ||
    currentType==='news'
  ){

    a=
      Array.isArray(data.results)
        ? data.results
        : [];

  }


  count.textContent=
    a.length
      ? `${a.length} results`
      : '';


  resultsInput.value=data.query||'';

  list.innerHTML='';
  pager.innerHTML='';


  document
    .querySelectorAll('.search-type')
    .forEach(b=>{
      b.classList.toggle(
        'active',
        b.dataset.type===currentType
      );
    });


  /*
   * Dictionary is loaded independently.
   * Therefore it still appears if the search has zero results.
   */
  if(data.query){
    loadDictionary(data.query);
  }


  if(!a.length){

    list.innerHTML=
      '<div class="empty">No results found.</div>';

    history.replaceState(
      {},
      '',
      `/?q=${encodeURIComponent(data.query||currentQ)}`+
      `&type=${encodeURIComponent(currentType)}`+
      `${currentPage?`&page=${currentPage}`:''}`
    );

    return;
  }


  /*
   * IMAGES
   */

  if(currentType==='images'){

    const grid=document.createElement('div');

    grid.className='image-grid';


    a.forEach(r=>{

      const u=
        r.url ||
        r.properties?.url ||
        '';

      const img=
        r.thumbnail ||
        r.properties?.url ||
        '';


      if(!img)return;


      const el=document.createElement('article');

      el.className='image-result';


      el.innerHTML=`
        <a
          href="${esc(u)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="${esc(img)}"
            alt="${esc(r.title||'')}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >
        </a>

        <div class="image-result-title">
          ${esc(r.title||u)}
        </div>

        <div class="image-result-source">
          ${esc(
            r.source ||
            r.meta_url?.hostname ||
            ''
          )}
        </div>
      `;


      grid.appendChild(el);

    });


    if(grid.children.length){

      list.appendChild(grid);

    }else{

      list.innerHTML=
        '<div class="empty">No images found.</div>';

    }


  /*
   * WEB / NEWS
   */

  }else{

    a.forEach(r=>{

      const el=document.createElement('article');

      el.className='result';


      const u=
        r.url ||
        '';

      const host=
        r.meta_url?.hostname ||
        '';

      const title=
        r.title ||
        u;

      const desc=
        r.description ||
        r.content ||
        '';

      const age=
        r.age ||
        r.publishedDate ||
        '';


      /*
       * Keep description/tag information intact.
       */
      let tagHtml='';


      if(Array.isArray(r.tags)){

        tagHtml=
          r.tags
            .map(tag=>`
              <span class="dictionary-tags">
                ${esc(tag)}
              </span>
            `)
            .join('');

      }


      el.innerHTML=`

        <div class="result-url">
          ${esc(host||u)}
        </div>

        <h2>
          <a
            href="${esc(u)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>
        </h2>

        ${
          desc
            ? `
              <p class="snippet">
                ${esc(desc)}
                ${tagHtml}
              </p>
            `
            : ''
        }

        ${
          age
            ? `
              <div class="result-meta">
                ${esc(age)}
              </div>
            `
            : ''
        }

      `;


      list.appendChild(el);

    });

  }


  const more=
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage>0){

    const b=document.createElement('button');

    b.textContent='Previous';

    b.onclick=()=>{
      search(
        currentQ,
        currentPage-1,
        currentType
      );
    };

    pager.appendChild(b);

  }


  if(more){

    const b=document.createElement('button');

    b.textContent='Next';

    b.onclick=()=>{
      search(
        currentQ,
        currentPage+1,
        currentType
      );
    };

    pager.appendChild(b);

  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(data.query||currentQ)}`+
    `&type=${encodeURIComponent(currentType)}`+
    `${currentPage?`&page=${currentPage}`:''}`
  );

}


/*
 * SEARCH
 *
 * IMPORTANT:
 * Uses YOUR Worker:
 *
 * /api/search?q=...&type=...&page=...
 *
 * It does NOT POST directly to search.tiago.zip.
 */

async function search(
  q,
  page=0,
  type=currentType
){

  q=q.trim();

  if(!q)return;


  currentQ=q;

  currentPage=
    Math.max(
      0,
      Number(page)||0
    );

  currentType=type;


  document.title=
    `${q} - FlibidooSearch`;


  input.value=q;
  resultsInput.value=q;


  /*
   * Immediately switch away from home.
   * This prevents the old "stays on homescreen while fetching"
   * behavior.
   */

  home.classList.add('hidden');
  results.classList.remove('hidden');


  list.innerHTML=
    '<div class="empty">Searching…</div>';

  count.textContent='';

  label.textContent=
    `Results for “${q}”`;

  pager.innerHTML='';


  /*
   * Dictionary starts independently so it can show
   * even while the web request is loading.
   */

  loadDictionary(q);


  try{

    const url=
      `${API_BASE}/api/search`+
      `?q=${encodeURIComponent(q)}`+
      `&type=${encodeURIComponent(type)}`+
      `&page=${encodeURIComponent(currentPage)}`;


    const r=await fetch(
      url,
      {
        method:'GET',
        headers:{
          'Accept':'application/json'
        }
      }
    );


    const body=await r.text();


    let d;

    try{

      d=JSON.parse(body);

    }catch(_){

      throw new Error(
        'Search Worker returned invalid JSON.'
      );

    }


    if(!r.ok){

      throw new Error(
        d?.error ||
        'Search failed. Please try again.'
      );

    }


    d.type=type;
    d.query=d.query||q;


    render(d);


  }catch(e){

    list.innerHTML=`
      <div class="error">
        ${esc(
          e.message ||
          'Search failed. Please try again.'
        )}
      </div>
    `;

    /*
     * Do NOT remove the dictionary if search fails.
     */
    loadDictionary(q);

  }

}


/*
 * HOME SEARCH
 */

form.addEventListener(
  'submit',
  e=>{

    e.preventDefault();

    const q=input.value.trim();

    if(q){

      /*
       * Move immediately to results page.
       */
      location.href=
        `/?q=${encodeURIComponent(q)}`+
        `&type=web&page=0`;

    }

  }
);


/*
 * RESULTS SEARCH
 */

resultsForm.addEventListener(
  'submit',
  e=>{

    e.preventDefault();

    const q=
      resultsInput.value.trim();

    if(q){

      search(
        q,
        0,
        currentType
      );

    }

  }
);


/*
 * WEB / IMAGES / NEWS
 */

document
  .querySelectorAll('.search-type')
  .forEach(btn=>{

    btn.addEventListener(
      'click',
      ()=>{

        search(
          resultsInput.value||currentQ,
          0,
          btn.dataset.type
        );

      }
    );

  });


/*
 * ABOUT
 */

const aboutOverlay=
  document.querySelector('#aboutOverlay');


document
  .querySelector('#aboutButton')
  .onclick=()=>{
    aboutOverlay.classList.remove('hidden');
  };


document
  .querySelector('#aboutClose')
  .onclick=()=>{
    aboutOverlay.classList.add('hidden');
  };


aboutOverlay.addEventListener(
  'click',
  e=>{
    if(e.target===aboutOverlay){
      aboutOverlay.classList.add('hidden');
    }
  }
);


document.addEventListener(
  'keydown',
  e=>{
    if(e.key==='Escape'){
      aboutOverlay.classList.add('hidden');
    }
  }
);


/*
 * INITIAL URL
 */

const params=
  new URLSearchParams(
    location.search
  );

const initialQuery=
  params.get('q');


if(initialQuery){

  search(
    initialQuery,
    Number(
      params.get('page')||0
    ),
    ['web','images','news']
      .includes(
        params.get('type')
      )
      ? params.get('type')
      : 'web'
  );

}

</script>
