<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d0c22">
<meta name="color-scheme" content="dark">
<link rel="icon" href="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true">
<title>FlibidooSearch</title>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
  --translator-text:#f5eef7;
  --translator-muted:#a995ad;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

a{
  color:inherit;
}

/* =========================================================
   GLOBAL
   ========================================================= */

.shell{
  width:min(100% - 32px,1120px);
  margin:0 auto;
}

/* =========================================================
   HOME
   ========================================================= */

#home.home{
  width:100%;
  min-height:100svh;
  margin:0;
  padding:
    max(24px,env(safe-area-inset-top))
    max(16px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(16px,env(safe-area-inset-left));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.search-wrap{
  width:min(100%,680px);
}

.hero-logo{
  width:min(210px,55vw);
  max-width:210px;
  height:auto;
  display:block;
  margin:0 auto 14px;
  object-fit:contain;
}

h1{
  font-size:clamp(34px,5vw,54px);
  line-height:1;
  margin:0 0 30px;
  text-align:center;
  letter-spacing:-.055em;
  font-weight:500;
}

.search-wrap form{
  display:flex;
  align-items:center;
  width:100%;
  height:54px;
  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;
  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

.search-wrap form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08);
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 16px;
}

input::placeholder{
  color:#9e8da1;
}

.submit{
  height:38px;
  width:38px;
  margin-right:8px;
  border:1px solid var(--line);
  background:transparent;
  color:#766679;
  border-radius:50%;
  padding:0;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 auto;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
}

.submit:active{
  transform:scale(.96);
}

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

/* =========================================================
   MAIN / RESULTS
   ========================================================= */

main{
  flex:1;
}

.results{
  width:min(100% - 32px,1120px);
  margin:0 auto;
  padding:
    max(24px,env(safe-area-inset-top))
    0
    max(70px,env(safe-area-inset-bottom));
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:44px;
  border-bottom:1px solid var(--line2);
  padding-bottom:14px;
  margin-bottom:14px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:inherit;
  white-space:nowrap;
}

.results-brand img{
  width:28px;
  height:28px;
  object-fit:contain;
  display:block;
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

.results-search{
  width:min(100%,680px);
  margin:0 0 28px;
}

.results-search form{
  display:flex;
  align-items:center;
  height:48px;
  border:1px solid var(--line);
  border-radius:24px;
}

.results-search form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08);
}

.results-search .submit{
  width:34px;
  height:34px;
  margin-right:6px;
}

.search-types{
  display:flex;
  align-items:flex-end;
  gap:0;
  margin:8px 0 18px;
  border-bottom:1px solid rgba(255,255,255,.12);
  height:36px;
  overflow-x:auto;
  scrollbar-width:none;
}

.search-types::-webkit-scrollbar{
  display:none;
}

.search-type{
  position:relative;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font:inherit;
  font-size:13px;
  line-height:20px;
  padding:0 12px 10px;
  margin:0;
  border-radius:0;
  cursor:pointer;
  white-space:nowrap;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:-1px;
  height:2px;
  border-radius:2px 2px 0 0;
  background:currentColor;
}

/* =========================================================
   RESULTS LAYOUT
   ========================================================= */

.results-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:42px;
  align-items:start;
}

.result{
  padding:0 0 26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2);
}

.result-url{
  font-size:13px;
  color:var(--url);
  margin-bottom:6px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result h2{
  font-size:20px;
  line-height:1.25;
  margin:0 0 7px;
  font-weight:500;
  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.snippet{
  font-size:14px;
  line-height:1.6;
  color:var(--result);
  margin:0;
  max-width:760px;
}

.result-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:7px;
}

/* =========================================================
   IMAGE RESULTS
   ========================================================= */

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-result img{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.02);
}

.image-result-title{
  font-size:14px;
  line-height:1.4;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   DICTIONARY
   ========================================================= */

.dictionary{
  border-left:1px solid var(--line2);
  padding-left:28px;
  max-height:70vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;
  font-weight:500;
  letter-spacing:-.02em;
  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line2);
}

.dictionary-language,
.dictionary-label{
  font-size:12px;
  color:var(--muted);
}

.dictionary-language{
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);
  margin-left:5px;
}

.dictionary-example{
  font-size:13px;
  line-height:1.5;
  color:var(--result);
  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
}

/* =========================================================
   TRANSLATOR
   NO CARD / NO ROUNDED CONTAINER
   ========================================================= */

.translator{
  display:none;
  margin:0 0 32px;
  padding:0 0 26px;
  border-bottom:1px solid var(--line2);
}

.translator.visible{
  display:block;
}

.translator-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.translator-title{
  font-size:14px;
  font-weight:600;
  margin:0;
}

.translator-languages{
  display:grid;
  grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.translator-language{
  min-width:0;
}

.translator-language select{
  width:100%;
  height:40px;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:0 4px;
  cursor:pointer;
}

.translator-language select:focus{
  border-color:var(--focus);
}

.translator-language select option{
  background:#24132a;
  color:var(--text);
}

.translate-swap{
  width:36px;
  height:36px;
  border:0;
  border-radius:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  display:grid;
  place-items:center;
  font-size:18px;
}

.translate-swap:hover{
  color:var(--text);
}

.translator-fields{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:20px;
}

.translator-field{
  min-width:0;
}

.translator-field textarea{
  width:100%;
  min-height:130px;
  max-height:260px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:0;
  outline:0;
  background:transparent;
  color:var(--translator-text);
  padding:12px;
  font-size:14px;
  line-height:1.55;
}

.translator-field textarea:focus{
  border-color:var(--focus);
}

.translator-field textarea::placeholder{
  color:var(--translator-muted);
}

.translator-field textarea[readonly]{
  color:#ddd1df;
}

.translator-field-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:7px;
}

.translator-field-label{
  color:var(--muted);
  font-size:12px;
}

.translator-count{
  color:var(--muted);
  font-size:11px;
}

.translator-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  margin-top:12px;
}

.translator-status{
  flex:1;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}

.translate-button{
  height:38px;
  padding:0 16px;
  border:1px solid var(--line);
  border-radius:0;
  background:transparent;
  color:var(--text);
  cursor:pointer;
}

.translate-button:hover{
  border-color:var(--focus);
}

.translate-button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* =========================================================
   EMPTY / ERROR / PAGER
   ========================================================= */

.empty{
  padding:70px 0;
  color:var(--muted);
  text-align:center;
}

.error{
  min-height:120px;
  max-width:680px;
  margin:0;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line2);
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.pager{
  display:flex;
  gap:8px;
  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:0;
  padding:8px 12px;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   ABOUT
   ========================================================= */

.about-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:24px;
  z-index:10000;
}

.about-overlay.hidden{
  display:none;
}

.about-card{
  position:relative;
  width:min(100%,560px);
  max-height:min(80vh,700px);
  overflow:auto;
  background:#24132a;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  padding:30px;
}

.about-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;
  font-size:25px;
  font-weight:500;
}

.about-card p{
  color:var(--result);
  line-height:1.7;
  font-size:14px;
}

.about-card a{
  color:var(--text);
}

/* =========================================================
   TABLET
   ========================================================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr;
    gap:0;
  }

  /*
    Dictionary is deliberately first on smaller screens.
  */
  .dictionary{
    order:-1;
    border-left:0;
    border-bottom:1px solid var(--line2);
    border-top:0;
    padding:0 0 26px;
    margin:0 0 26px;
    max-height:none;
  }

  .translator-fields{
    grid-template-columns:1fr;
  }

  .translator-languages{
    grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);
  }
}

/* =========================================================
   SMALL TABLET
   ========================================================= */

@media(max-width:760px){

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 14px;
  }

  .results{
    width:min(100% - 28px,1120px);
  }

  .results-head{
    gap:12px;
  }

  .results-query{
    min-width:0;
  }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:640px){

  .shell{
    width:100%;
    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:
      max(20px,env(safe-area-inset-top))
      max(16px,env(safe-area-inset-right))
      max(20px,env(safe-area-inset-bottom))
      max(16px,env(safe-area-inset-left));
  }

  .hero-logo{
    width:150px;
    max-width:45vw;
    margin-bottom:12px;
  }

  h1{
    font-size:36px;
    margin-bottom:24px;
  }

  .search-wrap form{
    height:50px;
  }

  .results{
    width:100%;
    padding:
      max(18px,env(safe-area-inset-top))
      max(16px,env(safe-area-inset-right))
      max(60px,env(safe-area-inset-bottom))
      max(16px,env(safe-area-inset-left));
  }

  .results-head{
    min-width:0;
  }

  .results-brand img{
    width:24px;
    height:24px;
  }

  .results-brand span{
    font-size:14px;
  }

  .results-query{
    font-size:13px;
  }

  .count{
    display:none;
  }

  .results-search{
    margin-bottom:20px;
  }

  .search-types{
    margin-top:8px;
    margin-bottom:16px;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;
    font-size:12px;
  }

  .result{
    padding-bottom:22px;
    margin-bottom:22px;
  }

  .result h2{
    font-size:18px;
  }

  .snippet{
    font-size:14px;
  }

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px 12px;
  }

  .translator{
    margin-bottom:24px;
  }

  .translator-languages{
    grid-template-columns:1fr;
    gap:8px;
  }

  .translate-swap{
    justify-self:center;
    transform:rotate(90deg);
  }

  .translator-fields{
    gap:14px;
  }

  .translator-field textarea{
    min-height:120px;
  }

  .translator-actions{
    align-items:flex-start;
  }

  .translator-status{
    font-size:11px;
  }

  .translate-button{
    flex:0 0 auto;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}

/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media(max-width:460px){

  #home.home{
    padding-left:14px;
    padding-right:14px;
  }

  .results{
    padding-left:14px;
    padding-right:14px;
  }

  .hero-logo{
    width:130px;
  }

  h1{
    font-size:32px;
  }

  .image-grid{
    grid-template-columns:1fr;
  }

  .translator-top{
    align-items:flex-start;
  }

  .translator-actions{
    flex-direction:column;
  }

  .translator-status{
    width:100%;
  }

  .translate-button{
    width:100%;
  }
}

/* =========================================================
   LANDSCAPE PHONE
   ========================================================= */

@media(max-height:520px) and (orientation:landscape){

  #home.home{
    justify-content:flex-start;
    padding-top:28px;
    padding-bottom:28px;
    overflow:auto;
  }

  .hero-logo{
    width:90px;
    margin-bottom:8px;
  }

  h1{
    font-size:30px;
    margin-bottom:18px;
  }

  .links{
    margin-top:14px;
  }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    transition:none!important;
    animation:none!important;
  }
}
</style>
</head>

<body>

<main>

<!-- =======================================================
     HOME
     ======================================================= -->

<section id="home" class="home shell">

  <div class="search-wrap">

    <!-- RESTORED FLIBIDOO LOGO -->
    <img
      class="hero-logo"
      src="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
      alt="Flibidoo"
      decoding="async"
    >

    <h1>
      <em><strong>Flibidoo</strong></em>Search
    </h1>

    <form id="searchForm" role="search">

      <input
        id="q"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="submitButton"
        type="submit"
        aria-label="Search"
      >→</button>

    </form>

    <div class="links">

      <button
        type="button"
        id="aboutButton"
      >About</button>

      <span class="confederacy-credit">
        with love from The Great Confederacy of E
      </span>

    </div>

  </div>

</section>


<!-- =======================================================
     RESULTS
     ======================================================= -->

<section id="results" class="results shell hidden">

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >

      <!-- RESTORED LOGO HERE TOO -->
      <img
        src="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
        alt="Flibidoo"

/* =========================================================

function esc(s = ''){
  return String(s).replace(
    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );
}


function updateButtonState(button,value){

  if(!button){
    return;
  }

  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );
}


function debounce(fn,wait=250){

  let timer;

  return (...args)=>{

    clearTimeout(timer);

    timer=setTimeout(
      ()=>fn(...args),
      wait
    );

  };
}


/* =========================================================
   BANGS
   ========================================================= */

async function loadBangs(){

  if(bangsLoaded){
    return;
  }

  try{

    const response =
      await fetch(BANGS_URL,{
        method:'GET',
        cache:'force-cache'
      });

    if(!response.ok){
      throw new Error('Could not load bangs');
    }

    const data =
      await response.json();

    if(Array.isArray(data)){
      bangs=data;
    }

    bangsLoaded=true;

  }catch(error){

    console.warn(
      'Bangs could not be loaded:',
      error
    );

  }

}


function findBang(query){

  const trimmed =
    query.trim();

  if(!trimmed.startsWith('!')){
    return null;
  }

  const firstWord =
    trimmed.split(/\s+/)[0];

  const bangName =
    firstWord.slice(1).toLowerCase();

  if(!bangName){
    return null;
  }

  return bangs.find(
    bang =>
      Array.isArray(bang.ts) &&
      bang.ts.some(
        tag =>
          String(tag).toLowerCase() === bangName
      )
  ) || null;

}


function handleBang(query){

  const bang =
    findBang(query);

  if(!bang){
    return false;
  }

  const first =
    query.trim().split(/\s+/)[0];

  const searchTerms =
    query.trim().slice(first.length).trim();

  if(!searchTerms){
    return false;
  }

  if(!bang.u){
    return false;
  }

  const target =
    bang.u.replace(
      '{searchTerms}',
      encodeURIComponent(searchTerms)
    );

  window.location.href=target;

  return true;
}

const LANGUAGE_ORDER = [

function languageCodeFromText(text){

  const normalized =
    text
      .toLowerCase()
      .trim()
      .replace(/\s+/g,' ');

  return LANGUAGE_ALIASES[normalized] || null;

}


function detectTranslatorIntent(query){

  const q =
    query
      .trim()
      .toLowerCase()
      .replace(/[?!.]+$/,'');

  let match;

  /*
    "spanish to english"
    "spanish -> english"
    "spanish → english"
  */

  match =
    q.match(
      /^(.+?)\s*(?:to|->|→)\s*(.+)$/
    );

  if(match){

    const from =
      languageCodeFromText(match[1]);

    const to =
      languageCodeFromText(match[2]);

    if(from && to){

      return {
        from,
        to,
        mode:'explicit'
      };

    }

  }


  /*
    "spanish to english"
    handled above.
  */

  match =
    q.match(
      /^(.+?)\s+to\s+english$/
    );

  if(match){

    const from =
      languageCodeFromText(match[1]);

    if(from){

      return {
        from,
        to:'en',
        mode:'explicit'
      };

    }

  }


  /*
    "english to spanish"
  */

  match =
    q.match(
      /^english\s+to\s+(.+)$/
    );

  if(match){

    const to =
      languageCodeFromText(match[1]);

    if(to){

      return {
        from:'en',
        to,
        mode:'explicit'
      };

    }

  }


  /*
    "translate"
    "translator"
    */

  if(
    q === 'translate' ||
    q === 'translator' ||
    q === 'translation'
  ){

    return {
      from:'auto',
      to:'en',
      mode:'generic'
    };

  }

  return null;

}

   ========================================================= */

function populateLanguageSelects(
  fromCode='auto',
  toCode='en'
){

  translateFrom.innerHTML='';
  translateTo.innerHTML='';

  const fromOptions = [
    'auto',
    ...LANGUAGE_ORDER
  ];

  fromOptions.forEach(code=>{

    const option =
      document.createElement('option');

    option.value=code;
    option.textContent=
      LANGUAGE_NAMES[code] || code;

    translateFrom.appendChild(option);

  });


  LANGUAGE_ORDER.forEach(code=>{

    const option =
      document.createElement('option');

    option.value=code;
    option.textContent=
      LANGUAGE_NAMES[code] || code;

    translateTo.appendChild(option);

  });


  translateFrom.value=
    LANGUAGE_NAMES[fromCode]
      ? fromCode
      : 'auto';

  translateTo.value=
    LANGUAGE_NAMES[toCode]
      ? toCode
      : 'en';

}


function showTranslator(
  from='auto',
  to='en'
){

  populateLanguageSelects(
    from,
    to
  );

  translator.classList.add('visible');

}


function hideTranslator(){

  translator.classList.remove('visible');

}


function updateTranslateCount(){

  const length =
    translateInput.value.length;

  translateCount.textContent =
    `${length} / ${MAX_TRANSLATE_CHARS}`;

}


/* =========================================================
   TRANSLATOR REQUEST
   ========================================================= */

async function translateText(){

  const text =
    translateInput.value.trim();

  if(!text){

    translateStatus.textContent =
      'Enter something to translate.';

    translateOutput.value='';

    return;

  }

  if(text.length > MAX_TRANSLATE_CHARS){

    translateStatus.textContent =
      `Maximum is ${MAX_TRANSLATE_CHARS} characters.`;

    return;

  }

  const source =
    translateFrom.value;

  const target =
    translateTo.value;

  if(source === target && source !== 'auto'){

    translateOutput.value=text;

    translateStatus.textContent =
      'Source and target are the same language.';

    return;

  }

  translateButton.disabled=true;

  translateStatus.textContent =
    'Translating…';

  translateOutput.value='';


  try{

    /*
      The worker is the public translation endpoint.

      The frontend does not need MyMemory credentials.
      Your Cloudflare Worker handles the actual request.
    */

    const url =
      new URL(
        TRANSLATOR_WORKER
      );

    url.searchParams.set(
      'q',
      text
    );

    url.searchParams.set(
      'source',
      source
    );

    url.searchParams.set(
      'target',
      target
    );


    const response =
      await fetch(
        url.toString(),
        {
          method:'GET',
          headers:{
            'Accept':'application/json'
          }
        }
      );


    if(!response.ok){

      throw new Error(
        `Translation request failed (${response.status})`
      );

    }


    const data =
      await response.json();


    /*
      Support several common Worker response shapes.
    */

    const translated =
      data.translatedText ??
      data.translation ??
      data.translated ??
      data.result ??
      data.text ??
      data.response?.translatedText ??
      '';


    if(!translated){

      throw new Error(
        'The translator returned no translated text.'
      );

    }


    translateOutput.value=
      String(translated);

    translateStatus.textContent =
      `${LANGUAGE_NAMES[target] || target}`;


  }catch(error){

    console.error(
      'Translation error:',
      error
    );

    translateStatus.textContent =
      error.message ||
      'Translation failed.';

  }finally{

    translateButton.disabled=false;

  }

}


/* =========================================================
   SEARCH
   ========================================================= */

async function search(
  q,
  page=0,
  type='web'
){

  q=q.trim();

  if(!q){
    return;
  }


  /*
    BANGS FIRST.
    "!w cats" etc. goes directly to the bang URL.
  */

  await loadBangs();

  if(handleBang(q)){
    return;
  }


  currentQ=q;

  currentPage=
    Math.max(
      0,
      Number(page) || 0
    );

  currentType=
    ['web','images','news'].includes(type)
      ? type
      : 'web';


  /*
    IMPORTANT:
    Switch to results IMMEDIATELY.

    The old version waited for fetch before making
    the results page visible, which caused the home
    screen to remain there while searching.
  */

  home.classList.add('hidden');

  results.classList.remove('hidden');


  document.title =
    `${q} - FlibidooSearch`;

  input.value=q;

  resultsInput.value=q;

  label.textContent =
    `Results for “${q}”`;

  count.textContent='';

  pager.innerHTML='';

  list.innerHTML =
    '<div class="empty">Searching…</div>';


  /*
    Translator detection happens immediately.
  */

  const translatorIntent =
    detectTranslatorIntent(q);

  if(translatorIntent){

    showTranslator(
      translatorIntent.from,
      translatorIntent.to
    );

    /*
      The translator search itself should not depend
      on web results.
    */

    dictionary.innerHTML =
      '<div class="dictionary-title">Dictionary</div>' +
      `<div class="dictionary-word">${esc(q)}</div>` +
      '<div class="dictionary-empty">Enter a word to see dictionary results.</div>';

  }else{

    hideTranslator();

  }


  /*
    Always load the dictionary independently.
    This means "No results found" does NOT remove it.
  */

  const dictionaryPromise =
    loadDictionary(q);


  try{

    const response =
      await fetch(
        `${API_BASE}/api`,
        {
          method:'POST',
          headers:{
            'Content-Type':'application/json',
            'Accept':'application/json'
          },
          body:JSON.stringify({
            query:q,
            type:currentType,
            page:currentPage
          })
        }
      );


    const raw =
      await response.text();


    let data;

    try{

      data=JSON.parse(raw);

    }catch{

      throw new Error(
        'Search server returned invalid JSON.'
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        `Search failed (${response.status}).`
      );

    }


    data.type=currentType;

    render(data);


  }catch(error){

    console.error(
      'Search error:',
      error
    );


    /*
      Keep dictionary visible even if search fails.
    */

    list.innerHTML =
      `<div class="error">${esc(
        error.message ||
        'Search failed. Please try again.'
      )}</div>`;

    count.textContent='';

  }


  await dictionaryPromise;

}


/* =========================================================
   RENDER SEARCH RESULTS
   ========================================================= */

function render(data){

  /*
    Do NOT hide results here.
    The search page was already shown immediately.
  */

  home.classList.add('hidden');

  results.classList.remove('hidden');


  currentType =
    ['web','images','news'].includes(data.type)
      ? data.type
      : currentType;


  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';


  let a=[];


  if(currentType==='web'){

    a =
      Array.isArray(
        data.results?.web?.results
      )
        ? data.results.web.results
        : Array.isArray(data.results)
          ? data.results
          : [];

  }else if(
    currentType==='images' ||
    currentType==='news'
  ){

    a =
      Array.isArray(data.results)
        ? data.results
        : Array.isArray(data.results?.results)
          ? data.results.results
          : [];

  }


  count.textContent =
    a.length
      ? `${a.length} results`
      : '';


  resultsInput.value =
    data.query || '';


  list.innerHTML='';

  pager.innerHTML='';


  document
    .querySelectorAll('.search-type')
    .forEach(button=>{

      button.classList.toggle(
        'active',
        button.dataset.type===currentType
      );

    });


  /*
    NO RESULTS:
    Keep dictionary visible.
  */

  if(!a.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    history.replaceState(
      {},
      '',
      `/?q=${encodeURIComponent(
        data.query || currentQ
      )}&type=${encodeURIComponent(
        currentType
      )}${currentPage
        ? `&page=${currentPage}`
        : ''
      }`
    );

    return;

  }


  /* =======================================================
     IMAGES
     ======================================================= */

  if(currentType==='images'){

    const grid =
      document.createElement('div');

    grid.className='image-grid';


    a.forEach(r=>{

      const u =
        r.url ||
        r.properties?.url ||
        r.image?.url ||
        '';

      const img =
        r.thumbnail ||
        r.thumbnail_url ||
        r.image?.thumbnail ||
        r.properties?.thumbnail ||
        r.properties?.url ||
        '';


      if(!img){
        return;
      }


      const el =
        document.createElement('article');

      el.className='image-result';


      el.innerHTML=`

        <a
          href="${esc(u)}"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            src="${esc(img)}"
            alt="${esc(r.title || '')}"
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
          >

        </a>

        <div class="image-result-title">
          ${esc(r.title || u)}
        </div>

        <div class="image-result-source">
          ${esc(
            r.source ||
            r.meta_url?.hostname ||
            r.domain ||
            ''
          )}
        </div>
      `;


      grid.appendChild(el);

    });


    if(grid.children.length){

      list.appendChild(grid);

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';

    }

  }


  /* =======================================================
     WEB / NEWS
     ======================================================= */

  else{

    a.forEach(r=>{

      const el =
        document.createElement('article');

      el.className='result';


      const u =
        r.url ||
        r.link ||
        '';

      const host =
        r.meta_url?.hostname ||
        r.source ||
        r.domain ||
        '';

      const title =
        r.title ||
        r.name ||
        u;

      const desc =
        r.description ||
        r.content ||
        r.snippet ||
        '';

      const age =
        r.age ||
        r.publishedDate ||
        r.published ||
        '';


      el.innerHTML=`

        <div class="result-url">
          ${esc(host || u)}
        </div>

        <h2>

          <a
            href="${esc(u)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>

        </h2>

        ${
          desc
            ? `<p class="snippet">${esc(desc)}</p>`
            : ''
        }

        ${
          age
            ? `<div class="result-meta">${esc(age)}</div>`
            : ''
        }

      `;


      list.appendChild(el);

    });

  }


  /*
    Pagination.
  */

  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore ||
      data.has_more
    );


  if(currentPage > 0){

    const button =
      document.createElement('button');

    button.textContent='Previous';

    button.onclick=()=>{

      search(
        currentQ,
        currentPage - 1,
        currentType
      );

    };

    pager.appendChild(button);

  }


  if(more){

    const button =
      document.createElement('button');

    button.textContent='Next';

    button.onclick=()=>{

      search(
        currentQ,
        currentPage + 1,
        currentType
      );

    };

    pager.appendChild(button);

  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(
      data.query || currentQ
    )}&type=${encodeURIComponent(
      currentType
    )}${currentPage
      ? `&page=${currentPage}`
      : ''
    }`
  );

}


/* =========================================================
   DICTIONARY
   ========================================================= */

async function loadDictionary(query){

  const clean =
    query
      .trim()
      .split(/\s+/)[0]
      .replace(
        /^[^\p{L}\p{N}'-]+|[^\p{L}\p{N}'-]+$/gu,
        ''
      );


  dictionary.innerHTML=`

    <div class="dictionary-title">
      Dictionary
    </div>

    <div class="dictionary-word">
      ${esc(clean || query)}
    </div>

    <div class="dictionary-loading">
      Looking up definition…
    </div>

  `;


  /*
    Don't try to dictionary-lookup translator commands.
  */

  if(
    !clean ||
    detectTranslatorIntent(query)
  ){

    dictionary.innerHTML=`

      <div class="dictionary-title">
        Dictionary
      </div>

      <div class="dictionary-word">
        ${esc(query)}
      </div>

      <div class="dictionary-empty">
        Dictionary lookup is available for individual words.
      </div>

    `;

    return;

  }


  try{

    const response =
      await fetch(
        `${DICTIONARY_API}${encodeURIComponent(clean)}`,
        {
          headers:{
            'Accept':'application/json'
          }
        }
      );


    if(!response.ok){

      throw new Error(
        'No dictionary entry found.'
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(data) ||
      !data.length
    ){

      throw new Error(
        'No dictionary entry found.'
      );

    }


    const entry =
      data[0];


    const meanings =
      Array.isArray(entry.meanings)
        ? entry.meanings
        : [];


    let html=`

      <div class="dictionary-title">
        Dictionary
      </div>

      <div class="dictionary-word">
        ${esc(entry.word || clean)}
      </div>

    `;


    meanings.forEach(meaning=>{

      html += `

        <article class="dictionary-entry">

          <div class="dictionary-language">
            ${esc(entry.phonetic || '')}
          </div>

          <div class="dictionary-pos">
            ${esc(meaning.partOfSpeech || '')}
          </div>

      `;


      const definitions =
        Array.isArray(meaning.definitions)
          ? meaning.definitions
          : [];


      definitions
        .slice(0,8)
        .forEach((definition,index)=>{

          html += `

            <div class="dictionary-sense">

              <div class="dictionary-definition">

                ${index + 1}.
                ${esc(
                  definition.definition || ''
                )}

              </div>

              ${
                definition.example
                  ? `
                    <div class="dictionary-example">
                      “${esc(definition.example)}”
                    </div>
                  `
                  : ''
              }

            </div>

          `;

        });


      const synonyms =
        definitions
          .flatMap(
            d =>
              Array.isArray(d.synonyms)
                ? d.synonyms
                : []
          )
          .slice(0,12);


      if(synonyms.length){

        html += `

          <div class="dictionary-relations">

            <div class="dictionary-label">
              Synonyms
            </div>

            <div class="dictionary-definition">
              ${esc(
                [...new Set(synonyms)].join(', ')
              )}
            </div>

          </div>

        `;

      }


      html += `
        </article>
      `;

    });


    const source =
      entry.sourceUrls?.[0];


    if(source){

      html += `

        <div class="dictionary-source">

          Source:
          <a
            href="${esc(source)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(source)}
          </a>

        </div>

      `;

    }


    dictionary.innerHTML=html;


  }catch(error){

    /*
      IMPORTANT:
      Dictionary remains visible even when
      no dictionary entry exists.
    */

    dictionary.innerHTML=`

      <div class="dictionary-title">
        Dictionary
      </div>

      <div class="dictionary-word">
        ${esc(clean || query)}
      </div>

      <div class="dictionary-empty">
        No dictionary entry found.
      </div>

    `;

  }

}


/* =========================================================
   INPUT EVENTS
   ========================================================= */

input.addEventListener(
  'input',
  ()=>updateButtonState(
    submitButton,
    input.value
  )
);


resultsInput.addEventListener(
  'input',
  ()=>updateButtonState(
    resultsSubmitButton,
    resultsInput.value
  )
);


translateInput.addEventListener(
  'input',
  updateTranslateCount
);


/* =========================================================
   SEARCH FORM
   ========================================================= */

form.addEventListener(
  'submit',
  async e=>{

    e.preventDefault();

    const q =
      input.value.trim();

    if(!q){
      return;
    }


    /*
      Change screen immediately.

      This also prevents the "stays on home screen
      for a while" problem.
    */

    home.classList.add('hidden');

    results.classList.remove('hidden');

    list.innerHTML =
      '<div class="empty">Searching…</div>';

    label.textContent =
      `Results for “${q}”`;

    resultsInput.value=q;


    /*
      Put the URL into history immediately.
    */

    history.pushState(
      {},
      '',
      `/?q=${encodeURIComponent(q)}&type=web&page=0`
    );


    await search(
      q,
      0,
      'web'
    );

  }
);


resultsForm.addEventListener(
  'submit',
  e=>{

    e.preventDefault();

    const q =
      resultsInput.value.trim();

    if(q){

      search(
        q,
        0,
        currentType
      );

    }

  }
);


/* =========================================================
   SEARCH TYPE BUTTONS
   ========================================================= */

document
  .querySelectorAll('.search-type')
  .forEach(button=>{

    button.addEventListener(
      'click',
      ()=>{

        const q =
          resultsInput.value.trim() ||
          currentQ;

        if(!q){
          return;
        }

        search(
          q,
          0,
          button.dataset.type
        );

      }
    );

  });


/* =========================================================
   TRANSLATOR
   ========================================================= */

translateButton.addEventListener(
  'click',
  translateText
);


translateSwap.addEventListener(
  'click',
  ()=>{

    const from =
      translateFrom.value;

    const to =
      translateTo.value;


    /*
      Don't make auto-detect the output.
    */

    if(to==='auto'){
      return;
    }


    translateFrom.value=
      to;

    translateTo.value=
      from === 'auto'
        ? 'en'
        : from;


    const oldInput =
      translateInput.value;

    translateInput.value=
      translateOutput.value;

    translateOutput.value=
      oldInput;

    updateTranslateCount();

  }
);


/* =========================================================
   ABOUT
   ========================================================= */

const aboutOverlay =
  document.querySelector(
    '#aboutOverlay'
  );


document
  .querySelector('#aboutButton')
  .onclick=()=>{

    aboutOverlay.classList.remove(
      'hidden'
    );

  };


document
  .querySelector('#aboutClose')
  .onclick=()=>{

    aboutOverlay.classList.add(
      'hidden'
    );

  };


aboutOverlay.addEventListener(
  'click',
  e=>{

    if(e.target===aboutOverlay){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


document.addEventListener(
  'keydown',
  e=>{

    if(e.key==='Escape'){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


/* =========================================================
   URL / INITIAL LOAD
   ========================================================= */

const params =
  new URLSearchParams(
    location.search
  );

const initialQuery =
  params.get('q');

const initialType =
  ['web','images','news'].includes(
    params.get('type')
  )
    ? params.get('type')
    : 'web';


/*
  Load bangs in the background so the first bang
  doesn't have to wait as long.
*/

loadBangs();


/*
  Important:
  If there is a query in the URL, immediately switch
  to results before waiting for the API.
*/

if(initialQuery){

  home.classList.add('hidden');

  results.classList.remove('hidden');

  resultsInput.value=
    initialQuery;

  label.textContent=
    `Results for “${initialQuery}”`;

  list.innerHTML=
    '<div class="empty">Searching…</div>';


  search(
    initialQuery,
    Number(params.get('page') || 0),
    initialType
  );

}


/* =========================================================
   INITIAL BUTTON STATES
   ========================================================= */

updateButtonState(
  submitButton,
  input.value
);

updateButtonState(
  resultsSubmitButton,
  resultsInput.value
);

updateTranslateCount();

</script>
