<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#1d0c22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG">

<title>FlibidooSearch</title>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
  --wotd:#ffb52e;
  --wotd2:#ffe18a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overscroll-behavior-x:none;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

img{
  max-width:100%;
}

a{
  color:inherit;
}

button,
input{
  font:inherit;
}

button{
  -webkit-user-select:none;
  user-select:none;
}

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px;
}

.hidden{
  display:none!important;
}


/* =========================
   HOME
========================= */

#home.home{
  width:100%;
  height:100vh;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  touch-action:manipulation;
}

.home-inner{
  width:min(100%,760px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.hero-logo{
  width:min(310px,72vw);
  height:auto;
  display:block;
  margin:0 auto 18px;
  object-fit:contain;

  -webkit-mask-image:
    radial-gradient(
      ellipse 72% 72% at center,
      #000 62%,
      rgba(0,0,0,.92) 70%,
      rgba(0,0,0,.5) 86%,
      transparent 100%
    );

  mask-image:
    radial-gradient(
      ellipse 72% 72% at center,
      #000 62%,
      rgba(0,0,0,.92) 70%,
      rgba(0,0,0,.5) 86%,
      transparent 100%
    );
}

.home-title{
  font-size:clamp(38px,5vw,56px);
  line-height:1;
  margin:0 0 32px;
  letter-spacing:-.055em;
  font-weight:500;
  text-align:center;
}

.home-title strong{
  font-weight:600;
}

.search-wrap{
  width:min(100%,760px);
}

form{
  display:flex;
  align-items:center;
  height:58px;
  border:1px solid var(--line);
  border-radius:30px;
  background:rgba(255,255,255,.015);
  transition:border-color .15s ease,box-shadow .15s ease;
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08);
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 16px;
}

input::placeholder{
  color:#9e8da1;
}

.submit{
  height:40px;
  width:40px;
  margin-right:8px;
  border:1px solid var(--line);
  background:transparent;
  color:#766679;
  border-radius:50%;
  padding:0;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 40px;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
}

.submit-icon{
  width:19px;
  height:19px;
  display:block;
  fill:currentColor;
}

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

.confederacy-credit img{
  width:20px;
  height:20px;
  display:block;
  object-fit:contain;
  flex:0 0 20px;
  border-radius:5px;
}


/* =========================
   RESULTS
========================= */

main{
  flex:1;
}

.results{
  padding:30px 12px 70px;
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:44px;
  border-bottom:1px solid var(--line2);
  padding-bottom:14px;
  margin-bottom:14px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:inherit;
  white-space:nowrap;
}

.results-brand img{
  width:28px;
  height:28px;
  object-fit:contain;
  display:block;
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

.results-search{
  width:min(100%,760px);
  margin:0 0 24px;
}

.results-search form{
  height:54px;
}

.results-search .submit{
  width:36px;
  height:36px;
  flex-basis:36px;
  margin-right:7px;
}


/* =========================
   SEARCH TYPES
========================= */

.search-types{
  display:flex;
  align-items:flex-end;
  gap:0;
  margin:8px 0 18px;
  border-bottom:1px solid rgba(255,255,255,.12);
  height:36px;
}

.search-type{
  position:relative;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font:inherit;
  font-size:13px;
  line-height:20px;
  padding:0 12px 10px;
  margin:0;
  border-radius:0;
  cursor:pointer;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:-1px;
  height:2px;
  border-radius:2px 2px 0 0;
  background:currentColor;
}


/* =========================
   RESULT LAYOUT
========================= */

.results-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:42px;
  align-items:start;
}


/* =========================
   WEB RESULTS
========================= */

.result{
  padding:0 0 26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2);
}

.result-top{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  margin-bottom:7px;
}

.result-favicon{
  width:20px;
  height:20px;
  flex:0 0 20px;
  object-fit:contain;
  border-radius:4px;
  background:rgba(255,255,255,.04);
}

.result-url{
  font-size:13px;
  color:var(--url);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}

.result h2{
  font-size:20px;
  line-height:1.25;
  margin:0 0 7px;
  font-weight:500;
  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.snippet{
  font-size:14px;
  line-height:1.6;
  color:var(--result);
  margin:0;
  max-width:760px;
  overflow-wrap:anywhere;
}

.snippet p{
  margin:0 0 8px;
}

.snippet p:last-child{
  margin-bottom:0;
}

.snippet strong,
.snippet b{
  font-weight:700;
}

.snippet em,
.snippet i{
  font-style:italic;
}

.snippet u{
  text-decoration:underline;
}

.snippet a{
  text-decoration:underline;
  color:var(--text);
}

.result-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:7px;
}


/* =========================
   IMAGES
========================= */

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-box{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.02);
}

.image-result img{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
}

.image-result-title{
  font-size:14px;
  line-height:1.4;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-progress{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  background:rgba(29,12,34,.18);
}

.image-progress::after{
  content:"";
  position:absolute;
  inset:0;
  border:4px solid rgba(255,255,255,.8);
  border-radius:0;
  clip-path:inset(100% 0 0 0);
}

.image-result.longpressing .image-progress{
  opacity:1;
}

.image-result.longpressing .image-progress::after{
  animation:fillLongPress 2s linear forwards;
}

@keyframes fillLongPress{
  from{
    clip-path:inset(100% 0 0 0);
  }
  to{
    clip-path:inset(0 0 0 0);
  }
}


/* =========================
   DICTIONARY SIDEBAR
========================= */

.dictionary{
  border-left:1px solid var(--line2);
  padding-left:28px;
  max-height:72vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;
  font-weight:500;
  letter-spacing:-.02em;
  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line2);
}

.dictionary-language{
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);
  margin-left:5px;
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;
  color:var(--result);
  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
}


/* =========================
   WOTD
========================= */

.wotd-panel{
  padding:0 0 22px;
  margin:0 0 22px;
  border-bottom:1px solid var(--line2);
}

.wotd-heading{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 9px;
  color:var(--wotd);
  font-size:13px;
  font-weight:600;
}

.wotd-word{
  color:#fff;
  font-size:22px;
  font-weight:600;
  line-height:1.25;
  margin:0 0 7px;
}

.wotd-definition{
  color:var(--wotd2);
  font-size:13px;
  line-height:1.55;
  margin:0;
}

.wotd-example{
  color:#cdbd87;
  font-size:12px;
  line-height:1.5;
  margin:8px 0 0;
}


/* =========================
   MAP
========================= */

.map-result{
  padding:0 0 22px;
  margin-bottom:22px;
  border-bottom:1px solid var(--line2);
}

.map-result-title{
  font-size:18px;
  line-height:1.35;
  margin:0 0 6px;
  font-weight:500;
}

.map-result-title a{
  text-decoration:none;
}

.map-result-title a:hover{
  text-decoration:underline;
}

.map-result-address{
  font-size:14px;
  line-height:1.55;
  color:var(--result);
}

.map-result-coords{
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
}


/* =========================
   GENERAL
========================= */

.empty{
  padding:70px 0;
  color:var(--muted);
  text-align:center;
}

.error{
  min-height:120px;
  max-width:680px;
  margin:0;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line2);
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.pager{
  display:flex;
  gap:8px;
  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:4px;
  padding:8px 12px;
  cursor:pointer;
}


/* =========================
   ABOUT
========================= */

.about-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:24px;
  z-index:10000;
}

.about-card{
  position:relative;
  width:min(100%,560px);
  max-height:min(80vh,700px);
  overflow:auto;
  background:#24132a;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  padding:30px;
}

.about-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;
  font-size:25px;
  font-weight:500;
}

.about-card p{
  color:var(--result);
  line-height:1.7;
  font-size:14px;
}

.about-card a{
  color:var(--text);
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr;
  }

  .dictionary{
    order:-1;
    border-left:0;
    border-bottom:1px solid var(--line2);
    border-top:0;
    padding:0 0 26px;
    margin-bottom:26px;
    max-height:none;
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 14px;
  }
}

@media(max-width:640px){

  .shell{
    width:100%;
    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:20px 16px;
  }

  .hero-logo{
    width:min(260px,72vw);
    margin-bottom:14px;
  }

  .home-title{
    font-size:38px;
    margin-bottom:25px;
  }

  form{
    height:54px;
  }

  .results{
    padding:22px 16px 60px;
  }

  .results-head{
    gap:12px;
  }

  .results-brand img{
    width:24px;
    height:24px;
  }

  .results-brand span{
    font-size:14px;
  }

  .results-query{
    font-size:13px;
  }

  .search-types{
    overflow-x:auto;
    scrollbar-width:none;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;
    font-size:12px;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<main>

<!-- =========================
     HOME
========================= -->

<section id="home" class="home shell">

  <div class="home-inner">

    <img
      class="hero-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="Flibidoo"
    >

    <h1 class="home-title">
      <em><strong>Flibidoo</strong></em>Search
    </h1>

    <div class="search-wrap">

      <form id="searchForm" role="search">

        <input
          id="q"
          name="q"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web"
          aria-label="Search the web"
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="Search"
        >
          <svg
            class="submit-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
            aria-hidden="true"
          >
            <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
          </svg>
        </button>

      </form>

      <div class="links">

        <button type="button" id="aboutButton">
          About
        </button>

        <span class="confederacy-credit">
          with love from The Great Confederacy of E

          <img
            src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
            alt=""
          >
        </span>

      </div>

    </div>

  </div>

</section>


<!-- =========================
     RESULTS
========================= -->

<section id="results" class="results shell hidden">

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >

      <img
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt=""
      >

      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>

    </a>

    <div
      id="queryLabel"
      class="results-query"
    ></div>

    <div
      id="count"
      class="count"
    ></div>

  </div>


  <div class="results-search">

    <form id="resultsSearchForm" role="search">

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >
        <svg
          class="submit-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>
      </button>

    </form>

  </div>


  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >
      Web
    </button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >
      Images
    </button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >
      News
    </button>

  </nav>


  <div class="results-layout">

    <div>
      <div id="resultList"></div>
      <div id="pager" class="pager"></div>
    </div>

    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results"
    >

      <!-- WOTD ALWAYS GOES FIRST -->
      <div id="wotdSidebar"></div>

      <!-- STANDARD DICTIONARY GOES SECOND -->
      <div id="dictionarySidebar"></div>

    </aside>

  </div>

</section>

</main>


<!-- =========================
     ABOUT
========================= -->

<div
  id="aboutOverlay"

/* =========================================================
   BASIC HELPERS
========================================================= */

function esc(value = ''){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');

}


function updateButtonState(button,value){

  button.classList.toggle(
    'has-input',
    String(value || '').trim().length > 0
  );

}


function normalizeUrl(url){

  if(!url) return '';

  url =
    String(url).trim();

  try{

    const decoded =
      decodeURIComponent(url);

    if(
      /^https?:\/\//i.test(decoded) &&
      decoded.length < url.length
    ){

      url = decoded;

    }

  }catch(_){}

  return url;

}


function hostname(url){

  try{

    return new URL(url)
      .hostname
      .replace(/^www\./,'');

  }catch(_){

    return '';

  }

}


function faviconFor(url){

  const host =
    hostname(url);

  if(!host) return '';

  return (
    'https://www.google.com/s2/favicons' +
    '?domain=' +
    encodeURIComponent(host) +
    '&sz=32'
  );

}


/* =========================================================
   TEXT / HTML
========================================================= */

function removeFlibidooMarkers(text){

  return String(text || '')
    .replace(
      /\*{3}FLIBIDOO\*{5}TAG\*{5}\d+\*{3}/gi,
      ''
    )
    .replace(
      /FLIBIDOO\s*TAG\s*\d+/gi,
      ''
    );

}


function decodeEntities(text){

  const textarea =
    document.createElement('textarea');

  textarea.innerHTML =
    String(text || '');

  return textarea.value;

}


function markdownToHtml(text){

  let s =
    String(text || '');

  s =
    removeFlibidooMarkers(s);


  s =
    s.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi,
      function(_,label,url){

        return (
          '<a href="' +
          esc(normalizeUrl(url)) +
          '">' +
          esc(label) +
          '</a>'
        );

      }
    );


  s =
    s.replace(
      /\*\*([^*]+)\*\*/g,
      '<strong>$1</strong>'
    );


  s =
    s.replace(
      /(^|[^\*])\*([^*\n]+)\*(?!\*)/g,
      '$1<em>$2</em>'
    );


  s =
    s.replace(
      /__([^_]+)__/g,
      '<strong>$1</strong>'
    );


  return s;

}


function sanitizeFormattedHtml(input){

  let source =
    String(input || '');

  source =
    removeFlibidooMarkers(source);

  source =
    decodeEntities(source);


  const token =
    '___FLIBIDOO_TAG_';

  const tags = [];


  source =
    source.replace(
      /<\/?(strong|b|em|i|u|br|p|a)(?:\s[^>]*)?>/gi,
      function(match){

        const id =
          tags.length;

        tags.push(match);

        return (
          token +
          id +
          '___'
        );

      }
    );


  source =
    esc(source);


  tags.forEach(function(tag,index){

    let safeTag =
      tag;


    if(/^<a\b/i.test(safeTag)){

      const hrefMatch =
        safeTag.match(
          /href\s*=\s*["']([^"']*)["']/i
        );


      const href =
        hrefMatch
          ? normalizeUrl(hrefMatch[1])
          : '';


      if(
        href &&
        /^https?:\/\//i.test(href)
      ){

        safeTag =
          '<a href="' +
          esc(href) +
          '">';

      }else{

        safeTag =
          '<a>';

      }

    }else{

      const nameMatch =
        safeTag.match(
          /^<\/?\s*([a-z0-9]+)/i
        );


      const name =
        nameMatch
          ? nameMatch[1].toLowerCase()
          : '';


      if(/^<\//.test(safeTag)){

        safeTag =
          '</' +
          name +
          '>';

      }else{

        safeTag =
          '<' +
          name +
          '>';

      }

    }


    source =
      source.replace(
        token +
        index +
        '___',
        safeTag
      );

  });


  const wrapper =
    document.createElement('div');

  wrapper.innerHTML =
    source;


  function processTextNode(node){

    if(
      node.nodeType ===
      Node.TEXT_NODE
    ){

      const value =
        node.nodeValue || '';


      if(
        value.includes('**') ||
        value.includes('__') ||
        /\[[^\]]+\]\(https?:\/\//i.test(value) ||
        /(^|[^\*])\*[^*\n]+\*(?!\*)/.test(value)
      ){

        const html =
          markdownToHtml(
            esc(value)
          );


        const temp =
          document.createElement('span');

        temp.innerHTML =
          html;


        node.replaceWith(
          ...Array.from(
            temp.childNodes
          )
        );

      }

      return;

    }


    if(
      node.nodeType ===
      Node.ELEMENT_NODE
    ){

      if(
        node.tagName === 'SCRIPT' ||
        node.tagName === 'STYLE'
      ){

        return;

      }


      Array.from(
        node.childNodes
      ).forEach(
        processTextNode
      );

    }

  }


  Array.from(
    wrapper.childNodes
  ).forEach(
    processTextNode
  );


  wrapper
    .querySelectorAll('a')
    .forEach(function(a){

      const href =
        normalizeUrl(
          a.getAttribute('href') || ''
        );


      if(
        /^https?:\/\//i.test(href)
      ){

        a.setAttribute(
          'href',
          href
        );

      }else{

        a.removeAttribute(
          'href'
        );

      }


      a.removeAttribute(
        'target'
      );

      a.removeAttribute(
        'rel'
      );

    });


  return wrapper.innerHTML;

}


function formatDescription(value){

  if(value == null) return '';

  return sanitizeFormattedHtml(
    String(value)
  );

}


/* =========================================================
   RESULT HELPERS
========================================================= */

function resultImage(result){

  return normalizeUrl(
    result.thumbnail ||
    result.image ||
    result.image_url ||
    result.properties?.thumbnail ||
    result.properties?.image ||
    ''
  );

}


function resultUrl(result){

  return normalizeUrl(
    result.url ||
    result.link ||
    result.properties?.url ||
    ''
  );

}


/* =========================================================
   WOTD QUERY
========================================================= */

function isWotdQuery(q){

  const s =
    String(q || '')
      .toLowerCase()
      .replace(/[^\w\s]/g,' ')
      .replace(/\s+/g,' ')
      .trim();


  return (
    s === 'wotd' ||
    s === 'word of the day' ||
    s.includes('word of the day') ||
    s.includes('wotd')
  );

}


/* =========================================================
   GET WOTD
========================================================= */

async function getWotd(){

  try{

    const response =
      await fetch(
        WOTD_WORKER + '/',
        {
          cache:'no-store'
        }
      );


    if(!response.ok){
      return '';
    }


    const text =
      (await response.text())
        .trim();


    if(!text){
      return '';
    }


    return text;

  }catch(_){

    return '';

  }

}


/* =========================================================
   WOTD PANEL POPULATION
========================================================= */

async function populateWotdPanel(panel,word){

  try{

    const response =
      await fetch(
        SEARCH_WORKER +
        '/api/dictionary?word=' +
        encodeURIComponent(word),
        {
          cache:'no-store'
        }
      );


    if(!response.ok){

      panel.remove();
      return;

    }


    const data =
      await response.json();


    const entries =
      Array.isArray(data?.entries)
        ? data.entries
        : [];


    if(!entries.length){

      panel.remove();
      return;

    }


    /*
      Prefer English.
    */

    entries.sort(function(a,b){

      const la =
        String(
          a.language ||
          a.lang ||
          ''
        ).toLowerCase();


      const lb =
        String(
          b.language ||
          b.lang ||
          ''
        ).toLowerCase();


      const ae =
        la === 'en' ||
        la === 'eng' ||
        la.includes('english');


      const be =
        lb === 'en' ||
        lb === 'eng' ||
        lb.includes('english');


      if(ae && !be) return -1;
      if(!ae && be) return 1;

      return 0;

    });


    let definition = '';
    let example = '';


    for(const entry of entries){

      const meanings =
        Array.isArray(entry.meanings)
          ? entry.meanings
          : [];


      for(const meaning of meanings){

        const definitions =
          Array.isArray(
            meaning.definitions
          )
            ? meaning.definitions
            : [];


        for(const def of definitions){

          if(!definition){

            definition =
              def.definition ||
              def.text ||
              def.meaning ||
              '';

          }


          if(!example){

            example =
              def.example ||
              def.examples?.[0] ||
              '';

          }


          if(definition) break;

        }


        if(definition) break;

      }


      if(definition) break;

    }


    if(!definition){

      panel.remove();
      return;

    }


    panel.querySelector(
      '.wotd-word'
    ).textContent =
      word;


    panel.querySelector(
      '.wotd-definition'
    ).innerHTML =
      formatDescription(
        definition
      );


    const exampleEl =
      panel.querySelector(
        '.wotd-example'
      );


    if(example){

      exampleEl.textContent =
        '“' +
        decodeEntities(example) +
        '”';

    }else{

      exampleEl.remove();

    }

  }catch(_){

    panel.remove();

  }

}


/* =========================================================
   DICTIONARY INTO SIDEBAR
========================================================= */

async function loadDictionaryInto(
  word,
  container
){

  try{

    const response =
      await fetch(
        SEARCH_WORKER +
        '/api/dictionary?word=' +
        encodeURIComponent(word),
        {
          cache:'no-store'
        }
      );


    if(!response.ok){
      return;
    }


    const data =
      await response.json();


    const entries =
      Array.isArray(data?.entries)
        ? data.entries
        : [];


    if(!entries.length){
      return;
    }


    /*
      English first.
    */

    entries.sort(function(a,b){

      const la =
        String(
          a.language ||
          a.lang ||
          a.language_name ||
          ''
        ).toLowerCase();


      const lb =
        String(
          b.language ||
          b.lang ||
          b.language_name ||
          ''
        ).toLowerCase();


      const ae =
        la === 'en' ||
        la === 'eng' ||
        la.includes('english');


      const be =
        lb === 'en' ||
        lb === 'eng' ||
        lb.includes('english');


      if(ae && !be) return -1;
      if(!ae && be) return 1;

      return 0;

    });


    renderDictionaryInto(
      entries,
      word,
      container
    );

  }catch(_){

    /*
      Dictionary failure must never
      break WOTD or search.
    */

  }

}


/* =========================================================
   DICTIONARY RENDERER
========================================================= */

function renderDictionaryInto(
  entries,
  word,
  container
){

  container.innerHTML = '';


  const title =
    document.createElement('h2');

  title.className =
    'dictionary-title';

  title.textContent =
    'Dictionary';

  container.appendChild(
    title
  );


  const wordLabel =
    document.createElement('div');

  wordLabel.className =
    'dictionary-word';

  wordLabel.textContent =
    word;

  container.appendChild(
    wordLabel
  );


  entries.forEach(function(entry){

    const article =
      document.createElement('article');

    article.className =
      'dictionary-entry';


    const language =
      entry.language ||
      entry.lang ||
      entry.language_name ||
      '';


    if(language){

      const lang =
        document.createElement('div');

      lang.className =
        'dictionary-language';

      lang.textContent =
        language;

      article.appendChild(
        lang
      );

    }


    const meanings =
      Array.isArray(entry.meanings)
        ? entry.meanings
        : [];


    meanings.forEach(function(meaning){

      const pos =
        meaning.partOfSpeech ||
        meaning.part_of_speech ||
        meaning.pos ||
        '';


      if(pos){

        const posEl =
          document.createElement('div');

        posEl.className =
          'dictionary-pos';

        posEl.textContent =
          pos;

        article.appendChild(
          posEl
        );

      }


      const definitions =
        Array.isArray(
          meaning.definitions
        )
          ? meaning.definitions
          : [];


      if(definitions.length){

        const senses =
          document.createElement('div');

        senses.className =
          'dictionary-senses';


        const labelEl =
          document.createElement('div');

        labelEl.className =
          'dictionary-label';

        labelEl.textContent =
          'Definitions';

        senses.appendChild(
          labelEl
        );


        const listEl =
          document.createElement('ol');

        listEl.className =
          'dictionary-list';


        definitions.forEach(function(def){

          const li =
            document.createElement('li');


          const definition =
            def.definition ||
            def.text ||
            def.meaning ||
            '';


          if(definition){

            const d =
              document.createElement('div');

            d.className =
              'dictionary-definition';

            d.innerHTML =
              formatDescription(
                definition
              );

            li.appendChild(d);

          }


          const example =
            def.example ||
            def.examples?.[0] ||
            '';


          if(example){

            const ex =
              document.createElement('div');

            ex.className =
              'dictionary-example';

            ex.textContent =
              '“' +
              decodeEntities(example) +
              '”';

            li.appendChild(ex);

          }


          listEl.appendChild(li);

        });


        senses.appendChild(
          listEl
        );

        article.appendChild(
          senses
        );

      }

    });


    if(article.textContent.trim()){

      container.appendChild(
        article
      );

    }

  });


  if(container.children.length > 2){

    dictionary.classList.remove(
      'hidden'
    );

  }

}


/* =========================================================
   WOTD SIDEBAR
========================================================= */

async function showWotdSearch(){

  wotdSidebar.innerHTML = '';


  const panel =
    document.createElement('section');

  panel.className =
    'wotd-panel';


  panel.innerHTML = `
    <div class="wotd-heading">
      Word of the Day
    </div>

    <div class="wotd-word">
      Loading…
    </div>

    <p class="wotd-definition"></p>

    <p class="wotd-example"></p>
  `;


  wotdSidebar.appendChild(
    panel
  );


  dictionary.classList.remove(
    'hidden'
  );


  const word =
    await getWotd();


  if(!word){

    panel.remove();

    if(
      !dictionarySidebar.children.length
    ){

      dictionary.classList.add(
        'hidden'
      );

    }

    return;

  }


  await populateWotdPanel(
    panel,
    word
  );

}


/* =========================================================
   STANDARD SIDEBAR LOADER
========================================================= */

async function loadSidebar(
  word,
  includeWotd=true
){

  /*
    Clear only the two dedicated areas.
    WOTD and Dictionary can no longer overwrite
    one another.
  */

  wotdSidebar.innerHTML = '';
  dictionarySidebar.innerHTML = '';


  if(!word){

    dictionary.classList.add(
      'hidden'
    );

    return;

  }


  /*
    WOTD ALWAYS COMES FIRST.
  */

  if(includeWotd){

    const panel =
      document.createElement('section');

    panel.className =
      'wotd-panel';


    panel.innerHTML = `
      <div class="wotd-heading">
        Word of the Day
      </div>

      <div class="wotd-word">
        Loading…
      </div>

      <p class="wotd-definition"></p>

      <p class="wotd-example"></p>
    `;


    wotdSidebar.appendChild(
      panel
    );


    dictionary.classList.remove(
      'hidden'
    );


    /*
      Get today's WOTD independently.
    */

    getWotd()
      .then(function(wotdWord){

        if(!wotdWord){

          panel.remove();

          return;

        }


        populateWotdPanel(
          panel,
          wotdWord
        );

      })
      .catch(function(){

        panel.remove();

      });

  }


  /*
    STANDARD DICTIONARY COMES SECOND.
  */

  await loadDictionaryInto(
    word,
    dictionarySidebar
  );


  /*
    Keep sidebar visible if either
    WOTD or Dictionary has content.
  */

  if(
    wotdSidebar.children.length ||
    dictionarySidebar.children.length
  ){

    dictionary.classList.remove(
      'hidden'
    );

  }else{

    dictionary.classList.add(
      'hidden'
    );

  }

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function render(data){

  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );


  currentType =
    data.type ||
    currentType;


  label.textContent =
    data.query
      ? `Results for “${decodeEntities(data.query)}”`
      : '';


  let a = [];


  if(currentType === 'web'){

    a =
      Array.isArray(data.results)
        ? data.results
        : Array.isArray(
            data.results?.web?.results
          )
            ? data.results.web.results
            : [];

  }else if(
    currentType === 'images' ||
    currentType === 'news'
  ){

    a =
      Array.isArray(data.results)
        ? data.results
        : [];

  }


  count.textContent =
    a.length
      ? `${a.length} results`
      : '';


  resultsInput.value =
    data.query || '';


  list.innerHTML = '';
  pager.innerHTML = '';


  document
    .querySelectorAll('.search-type')
    .forEach(function(button){

      button.classList.toggle(
        'active',
        button.dataset.type === currentType
      );

    });


  /*
    Sidebar behavior:
    
    Web search:
      WOTD first
      Dictionary second

    Images / News:
      no dictionary sidebar
  */

  const searchedWord =
    String(
      data.query ||
      currentQ
    ).trim();


  if(currentType === 'web'){

    if(isWotdQuery(searchedWord)){

      showWotdSearch();

    }else{

      loadSidebar(
        searchedWord,
        true
      );

    }

  }else{

    wotdSidebar.innerHTML = '';
    dictionarySidebar.innerHTML = '';

    dictionary.classList.add(
      'hidden'
    );

  }


  if(!a.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    return;

  }


  /* =========================
     IMAGES
  ========================= */

  if(currentType === 'images'){

    const grid =
      document.createElement('div');

    grid.className =
      'image-grid';


    a.forEach(function(r){

      const u =
        resultUrl(r);

      const img =
        resultImage(r);


      if(!img) return;


      const el =
        document.createElement('article');

      el.className =
        'image-result';


      el.innerHTML = `
        <a href="${esc(u || img)}">

          <div class="image-box">

            <img
              src="${esc(img)}"
              alt="${esc(
                decodeEntities(
                  r.title || ''
                )
              )}"
              loading="lazy"
              referrerpolicy="no-referrer"
            >

            <div class="image-progress"></div>

          </div>

        </a>

        <div class="image-result-title">
          ${esc(
            decodeEntities(
              r.title ||
              u ||
              ''
            )
          )}
        </div>

        <div class="image-result-source">
          ${esc(
            r.source ||
            hostname(u) ||
            ''
          )}
        </div>
      `;


      const image =
        el.querySelector('img');


      let pressTimer = null;
      let didLongPress = false;


      function startPress(){

        didLongPress = false;

        clearTimeout(
          pressTimer
        );


        el.classList.add(
          'longpressing'
        );


        pressTimer =
          setTimeout(
            async function(){

              didLongPress = true;

              el.classList.remove(
                'longpressing'
              );


              await downloadImage(
                img,
                r.title ||
                'image'
              );

            },
            2000
          );

      }


      function cancelPress(){

        clearTimeout(
          pressTimer
        );

        pressTimer = null;

        el.classList.remove(
          'longpressing'
        );

      }


      image.addEventListener(
        'pointerdown',
        startPress
      );

      image.addEventListener(
        'pointerup',
        cancelPress
      );

      image.addEventListener(
        'pointercancel',
        cancelPress
      );

      image.addEventListener(
        'pointerleave',
        cancelPress
      );


      const link =
        el.querySelector('a');


      link.addEventListener(
        'click',
        function(e){

          if(didLongPress){

            e.preventDefault();

            didLongPress = false;

          }

        }
      );


      grid.appendChild(el);

    });


    if(grid.children.length){

      list.appendChild(
        grid
      );

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';

    }

  }


  /* =========================
     WEB / NEWS
  ========================= */

  else{

    a.forEach(function(r){

      const el =
        document.createElement('article');

      el.className =
        'result';


      const u =
        resultUrl(r);


      const host =
        hostname(u);


      const title =
        decodeEntities(
          r.title ||
          u ||
          ''
        );


      const desc =
        r.description ??
        r.content ??
        r.snippet ??
        '';


      const age =
        r.age ||
        r.publishedDate ||
        r.published ||
        '';


      const icon =
        r.favicon ||
        r.favicon_url ||
        faviconFor(u);


      const thumbnail =
        resultImage(r);


      el.innerHTML = `

        <div class="result-top">

          ${
            icon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(icon)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                >
              `
              : ''
          }

          <div class="result-url">
            ${esc(host || u)}
          </div>

        </div>


        <h2>
          <a href="${esc(u)}">
            ${esc(title)}
          </a>
        </h2>


        ${
          thumbnail
            ? `
              <img
                src="${esc(thumbnail)}"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
                style="display:none;"
              >
            `
            : ''
        }


        ${
          desc
            ? `
              <p class="snippet">
                ${formatDescription(desc)}
              </p>
            `
            : ''
        }


        ${
          age
            ? `
              <div class="result-meta">
                ${esc(
                  decodeEntities(age)
                )}
              </div>
            `
            : ''
        }

      `;


      list.appendChild(
        el
      );

    });

  }


  /* =========================
     PAGINATION
  ========================= */

  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const button =
      document.createElement('button');

    button.textContent =
      'Previous';


    button.onclick =
      function(){

        search(
          currentQ,
          currentPage - 1,
          currentType
        );

      };


    pager.appendChild(
      button
    );

  }


  if(more){

    const button =
      document.createElement('button');

    button.textContent =
      'Next';


    button.onclick =
      function(){

        search(
          currentQ,
          currentPage + 1,
          currentType
        );

      };


    pager.appendChild(
      button
    );

  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(
      data.query ||
      currentQ
    )}&type=${encodeURIComponent(
      currentType
    )}${
      currentPage
        ? `&page=${currentPage}`
        : ''
    }`
  );

}


/* =========================================================
   IMAGE DOWNLOAD
========================================================= */

async function downloadImage(
  url,
  name
){

  try{

    const response =
      await fetch(
        url,
        {
          mode:'cors',
          credentials:'omit'
        }
      );


    if(!response.ok){

      throw new Error(
        'Download failed'
      );

    }


    const blob =
      await response.blob();


    const objectUrl =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement('a');


    a.href =
      objectUrl;


    a.download =
      String(
        name ||
        'image'
      )
        .replace(
          /[^\w\-]+/g,
          '_'
        )
        .slice(
          0,
          80
        ) +
      '.jpg';


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      function(){

        URL.revokeObjectURL(
          objectUrl
        );

      },
      1000
    );


  }catch(_){

    window.location.href =
      url;

  }

}


/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page=0,
  type=currentType
){

  q =
    String(q || '').trim();


  if(!q) return;


  currentQ =
    q;


  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );


  currentType =
    type;


  document.title =
    `${q} - FlibidooSearch`;


  input.value =
    q;


  resultsInput.value =
    q;


  home.classList.add(
    'hidden'
  );


  results.classList.remove(
    'hidden'
  );


  list.innerHTML =
    '<div class="empty">Searching…</div>';


  count.textContent =
    '';


  label.textContent =
    `Results for “${decodeEntities(q)}”`;


  pager.innerHTML =
    '';


  /*
    Clear sidebar areas independently.
  */

  wotdSidebar.innerHTML =
    '';

  dictionarySidebar.innerHTML =
    '';

  dictionary.classList.add(
    'hidden'
  );


  document
    .querySelectorAll('.search-type')
    .forEach(function(button){

      button.classList.toggle(
        'active',
        button.dataset.type === type
      );

    });


  /*
    IMPORTANT:
    
    Sidebar is loaded BEFORE the search result
    is finished.

    WOTD first.
    Dictionary second.
  */

  if(type === 'web'){

    if(isWotdQuery(q)){

      showWotdSearch();

    }else{

      loadSidebar(
        q,
        true
      );

    }

  }


  try{

    const url =
      SEARCH_WORKER +
      '/api/search?q=' +
      encodeURIComponent(q) +
      '&type=' +
      encodeURIComponent(type) +
      '&page=' +
      encodeURIComponent(currentPage);


    const response =
      await fetch(
        url,
        {
          method:'GET',
          headers:{
            'Accept':'application/json'
          },
          cache:'no-store'
        }
      );


    const raw =
      await response.text();


    let data = null;


    try{

      data =
        raw
          ? JSON.parse(raw)
          : null;

    }catch(_){

      throw new Error(
        `Search endpoint returned invalid JSON (${response.status}).`
      );

    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        `Search endpoint returned ${response.status}.`
      );

    }


    if(!data){

      throw new Error(
        'Search returned an empty response.'
      );

    }


    data.type =
      type;


    data.query =
      data.query ||
      q;


    if(type === 'web'){

      if(
        !Array.isArray(
          data.results
        )
      ){

        data.results =
          Array.isArray(
            data?.results?.web?.results
          )
            ? data.results.web.results
            : [];

      }

    }else if(
      type === 'images' ||
      type === 'news'
    ){

      if(
        !Array.isArray(
          data.results
        )
      ){

        data.results = [];

      }

    }


    render(
      data
    );


  }catch(error){

    /*
      IMPORTANT:
      Search errors do NOT clear
      the WOTD or Dictionary sidebar.
    */

    list.innerHTML =
      `
        <div class="error">
          ${esc(
            error?.message ||
            'Search failed. Please try again.'
          )}
        </div>
      `;

  }

}


/* =========================================================
   FORM EVENTS
========================================================= */

form.addEventListener(
  'submit',
  function(e){

    e.preventDefault();


    const q =
      input.value.trim();


    if(!q) return;


    location.href =
      `/?q=${encodeURIComponent(q)}&type=web&page=0`;

  }
);


resultsForm.addEventListener(
  'submit',
  function(e){

    e.preventDefault();


    const q =
      resultsInput.value.trim();


    if(q){

      search(
        q,
        0,
        currentType
      );

    }

  }
);


/* =========================================================
   CATEGORY BUTTONS
========================================================= */

document
  .querySelectorAll('.search-type')
  .forEach(function(button){

    button.addEventListener(
      'click',
      function(){

        const q =
          resultsInput.value.trim() ||
          currentQ;


        if(!q) return;


        search(
          q,
          0,
          button.dataset.type
        );

      }
    );

  });


/* =========================================================
   INPUT BUTTON STATE
========================================================= */

input.addEventListener(
  'input',
  function(){

    updateButtonState(
      submitButton,
      input.value
    );

  }
);


resultsInput.addEventListener(
  'input',
  function(){

    updateButtonState(
      resultsSubmitButton,
      resultsInput.value
    );

  }
);


/* =========================================================
   ABOUT
========================================================= */

const aboutOverlay =
  document.querySelector(
    '#aboutOverlay'
  );


document
  .querySelector('#aboutButton')
  .onclick =
  function(){

    aboutOverlay.classList.remove(
      'hidden'
    );

  };


document
  .querySelector('#aboutClose')
  .onclick =
  function(){

    aboutOverlay.classList.add(
      'hidden'
    );

  };


aboutOverlay.addEventListener(
  'click',
  function(e){

    if(
      e.target === aboutOverlay
    ){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


document.addEventListener(
  'keydown',
  function(e){

    if(e.key === 'Escape'){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


/* =========================================================
   INITIAL URL
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );


const initialQuery =
  params.get('q');


const initialType =
  ['web','images','news']
    .includes(
      params.get('type')
    )
      ? params.get('type')
      : 'web';


if(initialQuery){

  search(
    initialQuery,
    Number(
      params.get('page') || 0
    ),
    initialType
  );

}else{

  updateButtonState(
    submitButton,
    ''
  );

}

</script>
