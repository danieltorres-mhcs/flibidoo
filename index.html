<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">
<title>FlibidooSearch</title>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

a{
  color:inherit;
}

button,
input{
  font-family:inherit;
}

.hidden{
  display:none!important;
}

/* =========================================================
   HOME
========================================================= */

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px;
}

#home.home{
  width:100%;
  height:100vh;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.home-inner{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.hero-logo{
  width:min(300px,68vw);
  height:auto;
  max-height:170px;
  display:block;
  margin:0 auto 18px;
  object-fit:contain;

  /*
    Soft transparent edges.
    The mask fades the image into the background.
  */
  -webkit-mask-image:
    radial-gradient(
      ellipse 75% 72% at center,
      #000 65%,
      rgba(0,0,0,.9) 74%,
      rgba(0,0,0,.45) 88%,
      transparent 100%
    );

  mask-image:
    radial-gradient(
      ellipse 75% 72% at center,
      #000 65%,
      rgba(0,0,0,.9) 74%,
      rgba(0,0,0,.45) 88%,
      transparent 100%
    );
}

.home-title{
  font-size:clamp(38px,5vw,58px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500;
  text-align:center;
}

.home-title strong{
  font-weight:700;
}

.search-wrap{
  width:min(100%,760px);
  margin:0 auto;
}

form{
  display:flex;
  align-items:center;
  height:56px;
  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;
  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08);
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 16px;
}

input::placeholder{
  color:#9e8da1;
}

/* Search arrow */

.submit{
  height:40px;
  width:40px;
  margin-right:8px;
  border:1px solid var(--line);
  background:transparent;
  color:#766679;
  border-radius:50%;
  padding:0;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 40px;
  transition:
    color .15s ease,
    border-color .15s ease,
    background .15s ease,
    transform .15s ease;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
  background:rgba(255,255,255,.04);
}

.submit:active{
  transform:scale(.94);
}

.submit-icon{
  width:21px;
  height:21px;
  display:block;
  fill:currentColor;
}

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

.confederacy-credit img{
  width:20px;
  height:20px;
  display:block;
  object-fit:contain;
  flex:0 0 20px;
  border-radius:5px;
}

/* =========================================================
   RESULTS
========================================================= */

main{
  flex:1;
}

.results{
  padding:30px 12px 70px;
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:44px;
  border-bottom:1px solid var(--line2);
  padding-bottom:14px;
  margin-bottom:18px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:inherit;
  white-space:nowrap;
}

.results-brand img{
  width:30px;
  height:30px;
  object-fit:contain;
  display:block;
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

.results-search{
  width:min(100%,760px);
  margin:0 0 22px;
}

.results-search form{
  height:52px;
}

.results-search .submit{
  width:36px;
  height:36px;
  flex-basis:36px;
  margin-right:7px;
}

.results-search .submit-icon{
  width:19px;
  height:19px;
}

/* =========================================================
   SEARCH TYPES
========================================================= */

.search-types{
  display:flex;
  align-items:flex-end;
  gap:0;
  margin:8px 0 22px;
  border-bottom:1px solid rgba(255,255,255,.12);
  height:38px;
}

.search-type{
  position:relative;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font:inherit;
  font-size:13px;
  line-height:20px;
  padding:0 14px 10px;
  margin:0;
  border-radius:0;
  cursor:pointer;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:-1px;
  height:2px;
  border-radius:2px 2px 0 0;
  background:currentColor;
}

/* =========================================================
   RESULTS LAYOUT
========================================================= */

.results-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:42px;
  align-items:start;
}

/* =========================================================
   WEB RESULTS
========================================================= */

.result{
  padding:0 0 26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2);
}

.result-top{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  margin-bottom:6px;
}

.result-favicon{
  width:18px;
  height:18px;
  border-radius:4px;
  object-fit:contain;
  flex:0 0 18px;
  background:rgba(255,255,255,.04);
}

.result-url{
  font-size:13px;
  color:var(--url);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result h2{
  font-size:20px;
  line-height:1.25;
  margin:0 0 7px;
  font-weight:500;
  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.snippet{
  font-size:14px;
  line-height:1.6;
  color:var(--result);
  margin:0;
  max-width:760px;
}

.snippet strong{
  font-weight:700;
}

.snippet em{
  font-style:italic;
}

.snippet mark{
  background:rgba(255,205,80,.16);
  color:inherit;
  padding:0 2px;
  border-radius:2px;
}

.result-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:7px;
}

/* =========================================================
   IMAGES
========================================================= */

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result-link{
  display:block;
  text-decoration:none;
}

.image-result-image-wrap{
  position:relative;
  overflow:hidden;
  width:100%;
  aspect-ratio:4/3;
  background:rgba(255,255,255,.02);
  border:1px solid var(--line2);
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

.image-result-image-wrap img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border:0;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

.longpress-progress{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
  opacity:0;
  background:rgba(0,0,0,.18);
  transition:opacity .12s ease;
}

.longpress-progress.active{
  opacity:1;
}

.longpress-ring{
  width:58px;
  height:58px;
  border-radius:50%;
  background:
    conic-gradient(
      rgba(255,255,255,.95) var(--progress,0%),
      rgba(255,255,255,.18) var(--progress,0%)
    );
  padding:4px;
  transform:scale(.9);
}

.longpress-ring::after{
  content:"↓";
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(29,12,34,.94);
  color:#fff;
  font-size:25px;
  line-height:1;
}

.image-result-image-wrap.downloading .longpress-ring{
  animation:downloadPulse .35s ease;
}

@keyframes downloadPulse{
  0%{transform:scale(.9)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

.image-result-title{
  font-size:14px;
  line-height:1.4;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   DICTIONARY
========================================================= */

.dictionary{
  border-left:1px solid var(--line2);
  padding-left:28px;
  max-height:72vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;
  font-weight:500;
  letter-spacing:-.02em;
  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line2);
}

.dictionary-language{
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);
  margin-left:5px;
}

.dictionary-example{
  font-size:13px;
  line-height:1.5;
  color:var(--result);
  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
}

/* =========================================================
   WORD OF THE DAY
========================================================= */

.wotd-panel{
  padding:0 0 22px;
  margin:0 0 22px;
  border-bottom:1px solid var(--line2);
}

.wotd-heading{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 8px;
  color:#ffb52e;
  font-size:13px;
  font-weight:600;
}

.wotd-word{
  color:#fff;
  font-size:22px;
  font-weight:600;
  line-height:1.25;
  margin:0 0 6px;
}

.wotd-definition{
  color:#ffe9a8;
  font-size:13px;
  line-height:1.55;
  margin:0;
}

.wotd-example{
  color:#cdbb91;
  font-size:12px;
  line-height:1.5;
  margin:8px 0 0;
  font-style:italic;
}

.wotd-status{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

/* =========================================================
   MAPS REMOVED
========================================================= */

/* =========================================================
   EMPTY / ERROR / PAGER
========================================================= */

.empty{
  padding:70px 0;
  color:var(--muted);
  text-align:center;
}

.error{
  min-height:120px;
  max-width:680px;
  margin:0;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line2);
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.pager{
  display:flex;
  gap:8px;
  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:4px;
  padding:8px 12px;
  cursor:pointer;
}

.pager button:hover{
  border-color:var(--focus);
}

/* =========================================================
   ABOUT
========================================================= */

.about-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:24px;
  z-index:10000;
}

.about-card{
  position:relative;
  width:min(100%,560px);
  max-height:min(80vh,700px);
  overflow:auto;
  background:#24132a;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  padding:30px;
}

.about-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;
  font-size:25px;
  font-weight:500;
}

.about-card p{
  color:var(--result);
  line-height:1.7;
  font-size:14px;
}

.about-card a{
  color:var(--text);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr;
  }

  .dictionary{
    order:-1;
    border-left:0;
    border-bottom:1px solid var(--line2);
    border-top:0;
    padding:0 0 26px;
    margin-bottom:26px;
    max-height:none;
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 14px;
  }
}

@media(max-width:640px){

  .shell{
    width:100%;
    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:20px 16px;
  }

  .hero-logo{
    width:210px;
    max-height:130px;
  }

  .home-title{
    font-size:38px;
    margin-bottom:24px;
  }

  form{
    height:52px;
  }

  .results{
    padding:22px 16px 60px;
  }

  .results-head{
    gap:12px;
  }

  .results-brand img{
    width:24px;
    height:24px;
  }

  .results-brand span{
    font-size:14px;
  }

  .results-query{
    font-size:13px;
  }

  .search-types{
    overflow-x:auto;
    scrollbar-width:none;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;
    font-size:12px;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<main>

<!-- =====================================================
     HOME
===================================================== -->

<section id="home" class="home shell">

  <div class="home-inner">

    <img
      class="hero-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="Flibidoo"
    >

    <h1 class="home-title">
      <em><strong>Flibidoo</strong></em>Search
    </h1>

    <div class="search-wrap">

      <form id="searchForm" role="search">

        <input
          id="q"
          name="q"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web"
          aria-label="Search the web"
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="Search"
        >
          <svg
            class="submit-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
            aria-hidden="true"
          >
            <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
          </svg>
        </button>

      </form>

      <div class="links">

        <button
          type="button"
          id="aboutButton"
        >
          About
        </button>

        <span class="confederacy-credit">

          with love from The Great Confederacy of E

          <img
            src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
            alt=""
            aria-hidden="true"
          >

        </span>

      </div>

    </div>

  </div>

</section>


<!-- =====================================================
     RESULTS
===================================================== -->

<section id="results" class="results shell hidden">

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >

      <img
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt="Flibidoo"
      >

      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>

    </a>

    <div
      id="queryLabel"
      class="results-query"
    ></div>

    <div
      id="count"
      class="count"
    ></div>

  </div>


  <div class="results-search">

    <form
      id="resultsSearchForm"
      role="search"
    >

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >

        <svg
          class="submit-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>

      </button>

    </form>

  </div>


  <!-- NO MAPS -->

  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >
      Web
    </button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >
      Images
    </button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >
      News
    </button>

  </nav>


  <div class="results-layout">

    <div>

      <div id="resultList"></div>

      <div
        id="pager"
        class="pager"
      ></div>

    </div>


    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results"
    ></aside>

  </div>

</section>

</main>


<!-- =====================================================
     ABOUT
===================================================== -->

<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle"
>

/* =========================================================
   BASIC HELPERS
========================================================= */

function esc(value=''){
  return String(value).replace(
    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );
}


function updateButtonState(button,value){
  if(!button) return;

  button.classList.toggle(
    'has-input',
    String(value || '').trim().length > 0
  );
}


function normalizeUrl(url=''){
  try{
    return new URL(url,location.href).href;
  }catch{
    return '';
  }
}


function getHostname(url=''){
  try{
    return new URL(url).hostname;
  }catch{
    return '';
  }
}


function faviconFor(url=''){
  const host = getHostname(url);

  if(!host) return '';

  /*
   * Google's favicon endpoint is used only as a visual favicon
   * fallback. It does not affect navigation.
   */
  return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;
}


/* =========================================================
   SAFE DESCRIPTION FORMATTER
   Supports:
     **bold**
     *italic*
     __bold__
     _italic_
     <strong>
     <em>
     <b>
     <i>
     <mark>
     <br>
     percent-encoded text
========================================================= */

function decodeRepeated(value=''){
  let text = String(value);

  for(let i=0;i<3;i++){
    try{
      const decoded = decodeURIComponent(text);

      if(decoded === text) break;

      text = decoded;
    }catch{
      break;
    }
  }

  return text;
}


function formatDescription(value=''){
  let text = decodeRepeated(value);

  /*
   * Escape everything first.
   * This prevents arbitrary HTML from being injected.
   */
  text = esc(text);

  /*
   * Restore a deliberately small safe set of formatting tags.
   */
  text = text.replace(
    /&lt;(strong|b)&gt;([\s\S]*?)&lt;\/(strong|b)&gt;/gi,
    '<strong>$2</strong>'
  );

  text = text.replace(
    /&lt;(em|i)&gt;([\s\S]*?)&lt;\/(em|i)&gt;/gi,
    '<em>$2</em>'
  );

  text = text.replace(
    /&lt;mark&gt;([\s\S]*?)&lt;\/mark&gt;/gi,
    '<mark>$1</mark>'
  );

  text = text.replace(
    /&lt;br\s*\/?&gt;/gi,
    '<br>'
  );

  /*
   * Markdown-style bold.
   */
  text = text.replace(
    /\*\*([\s\S]*?)\*\*/g,
    '<strong>$1</strong>'
  );

  text = text.replace(
    /__([\s\S]*?)__/g,
    '<strong>$1</strong>'
  );

  /*
   * Markdown-style italic.
   */
  text = text.replace(
    /(^|[^\*])\*([^*\n]+)\*(?!\*)/g,
    '$1<em>$2</em>'
  );

  text = text.replace(
    /(^|[^_])_([^_\n]+)_(?!_)/g,
    '$1<em>$2</em>'
  );

  return text;
}


/* =========================================================
   WOTD
========================================================= */

function isWotdQuery(query=''){
  const q = query
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu,' ')
    .replace(/\s+/g,' ')
    .trim();

  return (
    q === 'wotd' ||
    q === 'word of the day' ||
    q.includes('word of the day') ||
    q.includes('wotd')
  );
}


async function getWotdWord(){
  try{

    const response = await fetch(
      `${WOTD_BASE}/`,
      {
        method:'GET',
        headers:{
          'Accept':'text/plain'
        },
        cache:'no-store'
      }
    );

    const text =
      await response.text();

    if(!response.ok){
      return '';
    }

    const word =
      text.trim();

    if(
      !word ||
      word.toLowerCase().includes('failed')
    ){
      return '';
    }

    return word;

  }catch{
    return '';
  }
}


/* =========================================================
   DICTIONARY
========================================================= */

async function fetchDictionary(word){

  if(!word) return null;

  try{

    const response =
      await fetch(
        `${WORKER_BASE}/api/dictionary?word=${encodeURIComponent(word)}`,
        {
          headers:{
            'Accept':'application/json'
          },
          cache:'no-store'
        }
      );

    const text =
      await response.text();

    let data = null;

    try{
      data = JSON.parse(text);
    }catch{
      return null;
    }

    if(!response.ok){
      return null;
    }

    if(
      !data ||
      !Array.isArray(data.entries) ||
      !data.entries.length
    ){
      return null;
    }

    return data;

  }catch{
    return null;
  }
}


function dictionaryLanguage(entry){
  return (
    entry.language?.name ||
    entry.language ||
    entry.lang ||
    entry.locale ||
    ''
  );
}


function isEnglishEntry(entry){

  const language =
    dictionaryLanguage(entry)
      .toLowerCase();

  return (
    language === 'english' ||
    language === 'en' ||
    language.startsWith('english ')
  );
}


function getEntries(data){

  if(!data) return [];

  let entries =
    Array.isArray(data.entries)
      ? [...data.entries]
      : [];

  /*
   * English always first.
   */
  entries.sort((a,b)=>{
    const ae = isEnglishEntry(a) ? 0 : 1;
    const be = isEnglishEntry(b) ? 0 : 1;

    return ae - be;
  });

  return entries;
}


function renderDictionary(data,word){

  dictionary.innerHTML = '';

  const entries =
    getEntries(data);

  if(!entries.length){
    dictionary.classList.add('hidden');
    return;
  }

  dictionary.classList.remove('hidden');

  const title =
    document.createElement('h2');

  title.className =
    'dictionary-title';

  title.textContent =
    'Dictionary';

  dictionary.appendChild(title);


  const wordLabel =
    document.createElement('div');

  wordLabel.className =
    'dictionary-word';

  wordLabel.textContent =
    word;

  dictionary.appendChild(wordLabel);


  /*
   * Don't show an unlimited number of duplicate language entries.
   */
  entries.slice(0,8).forEach(entry=>{

    const article =
      document.createElement('article');

    article.className =
      'dictionary-entry';


    const language =
      dictionaryLanguage(entry);

    if(language){

      const lang =
        document.createElement('div');

      lang.className =
        'dictionary-language';

      lang.textContent =
        language;

      article.appendChild(lang);
    }


    const meanings =
      Array.isArray(entry.meanings)
        ? entry.meanings
        : [];


    meanings.slice(0,6).forEach(meaning=>{

      const pos =
        meaning.partOfSpeech ||
        meaning.part_of_speech ||
        '';

      if(pos){

        const posEl =
          document.createElement('div');

        posEl.className =
          'dictionary-pos';

        posEl.textContent =
          pos;

        article.appendChild(posEl);
      }


      const senses =
        Array.isArray(meaning.senses)
          ? meaning.senses
          : [];


      senses.slice(0,8).forEach(sense=>{

        const definition =
          sense.definition ||
          sense.def ||
          sense.meaning ||
          '';

        if(!definition) return;


        const senseEl =
          document.createElement('div');

        senseEl.className =
          'dictionary-sense';


        const definitionEl =
          document.createElement('div');

        definitionEl.className =
          'dictionary-definition';

        definitionEl.innerHTML =
          formatDescription(definition);

        senseEl.appendChild(
          definitionEl
        );


        const example =
          sense.example ||
          sense.examples?.[0] ||
          '';

        if(example){

          const exampleEl =
            document.createElement('div');

          exampleEl.className =
            'dictionary-example';

          exampleEl.textContent =
            `“${decodeRepeated(example)}”`;

          senseEl.appendChild(
            exampleEl
          );
        }


        article.appendChild(
          senseEl
        );

      });

    });


    dictionary.appendChild(article);

  });
}


/* =========================================================
   WOTD PANEL
========================================================= */

async function renderWotdPanel(word){

  const data =
    await fetchDictionary(word);

  const panel =
    document.createElement('div');

  panel.className =
    'wotd-panel';


  const heading =
    document.createElement('div');

  heading.className =
    'wotd-heading';

  heading.textContent =
    '● Word of the Day';

  panel.appendChild(
    heading
  );


  const wordEl =
    document.createElement('div');

  wordEl.className =
    'wotd-word';

  wordEl.textContent =
    word;

  panel.appendChild(
    wordEl
  );


  let definition = '';
  let example = '';


  if(data){

    const entries =
      getEntries(data);

    /*
     * Prefer English for WOTD too.
     */
    const english =
      entries.find(isEnglishEntry) ||
      entries[0];


    const meanings =
      Array.isArray(english?.meanings)
        ? english.meanings
        : [];


    for(const meaning of meanings){

      const senses =
        Array.isArray(meaning.senses)
          ? meaning.senses
          : [];

      const sense =
        senses.find(
          s =>
            s.definition ||
            s.def ||
            s.meaning
        );

      if(sense){

        definition =
          sense.definition ||
          sense.def ||
          sense.meaning ||
          '';

        example =
          sense.example ||
          sense.examples?.[0] ||
          '';

        if(definition) break;
      }
    }
  }


  if(definition){

    const definitionEl =
      document.createElement('p');

    definitionEl.className =
      'wotd-definition';

    definitionEl.innerHTML =
      formatDescription(definition);

    panel.appendChild(
      definitionEl
    );
  }


  if(example){

    const exampleEl =
      document.createElement('p');

    exampleEl.className =
      'wotd-example';

    exampleEl.textContent =
      `“${decodeRepeated(example)}”`;

    panel.appendChild(
      exampleEl
    );
  }


  dictionary.prepend(panel);
  dictionary.classList.remove('hidden');
}


/* =========================================================
   SHOW DICTIONARY FOR A NORMAL SEARCH
========================================================= */

async function updateDictionaryForQuery(query){

  dictionary.innerHTML = '';

  const requestedWotd =
    isWotdQuery(query);

  /*
   * If they explicitly searched WOTD,
   * get today's word first.
   */
  if(requestedWotd){

    const word =
      await getWotdWord();

    if(word){

      await renderWotdPanel(word);

      /*
       * Also show the normal dictionary underneath it.
       */
      const data =
        await fetchDictionary(word);

      if(data){
        renderDictionaryBelowWotd(
          data,
          word
        );
      }

      return;
    }

    dictionary.classList.add('hidden');
    return;
  }


  /*
   * Normal search.
   */
  const data =
    await fetchDictionary(query);

  if(data){

    renderDictionary(
      data,
      query
    );

  }else{

    dictionary.classList.add('hidden');

  }


  /*
   * Check whether the searched word itself
   * is today's WOTD.
   */
  try{

    const today =
      await getWotdWord();

    if(
      today &&
      today.trim().toLowerCase() ===
      query.trim().toLowerCase()
    ){

      /*
       * If the normal dictionary exists,
       * put WOTD above it.
       */
      if(!dictionary.classList.contains('hidden')){

        await renderWotdPanel(
          today
        );

      }else{

        await renderWotdPanel(
          today
        );

      }
    }

  }catch{
    /* WOTD failure should never break search. */
  }
}

    meanings.slice(0,5).forEach(meaning=>{

      if(pos){

        posEl.textContent =

        article.appendChild(posEl);
      }


      const senses =
        Array.isArray(meaning.senses)
          ? meaning.senses
          : [];


      senses.slice(0,6).forEach(sense=>{

        const definition =
          sense.definition ||
          sense.def ||
          sense.meaning ||
          '';

        if(!definition) return;


        const senseEl =
          document.createElement('div');

        senseEl.className =
          'dictionary-sense';


        const definitionEl =
          document.createElement('div');

        definitionEl.className =
          'dictionary-definition';

        definitionEl.innerHTML =
          formatDescription(definition);

        senseEl.appendChild(
          definitionEl
        );


        const example =
          sense.example ||
          sense.examples?.[0] ||
          '';

        if(example){

          const exampleEl =
            document.createElement('div');

          exampleEl.className =
            'dictionary-example';

          exampleEl.textContent =
            `“${decodeRepeated(example)}”`;

          senseEl.appendChild(

        article.appendChild(

      });

/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page=0,
  type=currentType
){

  q =
    String(q || '').trim();

  if(!q) return;


  currentQ =
    q;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    ['web','images','news'].includes(type)
      ? type
      : 'web';


  document.title =
    `${q} - FlibidooSearch`;


  input.value =
    q;

  resultsInput.value =
    q;


  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );


  list.innerHTML =
    '<div class="empty">Searching…</div>';

  count.textContent =
    '';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML =
    '';


  document
    .querySelectorAll('.search-type')
    .forEach(button=>{
      button.classList.toggle(
        'active',
        button.dataset.type ===
        currentType
      );
    });


  /*
   * Dictionary is independent from search results.
   * Start it immediately so it can still appear if
   * Tiago returns zero results.
   */
  updateDictionaryForQuery(q)
    .catch(()=>{
      dictionary.classList.add(
        'hidden'
      );
    });


  try{

    const endpoint =
      `${WORKER_BASE}/api/search?q=${
        encodeURIComponent(q)
      }&type=${
        encodeURIComponent(currentType)
      }&page=${
        currentPage
      }`;


    const response =
      await fetch(
        endpoint,
        {
          method:'GET',
          headers:{
            'Accept':'application/json'
          },
          cache:'no-store'
        }
      );


    const text =
      await response.text();


    let data = null;

    try{

      data =
        JSON.parse(text);

    }catch{

      throw new Error(
        `Search endpoint returned ${
          response.status
        }: invalid JSON`
      );
    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        `Search endpoint returned ${response.status}`
      );
    }


    if(!data){

      throw new Error(
        'Search returned an empty response.'
      );
    }


    data.type =
      currentType;

    render(
      data
    );


  }catch(error){

    /*
     * Dictionary remains visible.
     * Only the search-result area gets the error.
     */
    list.innerHTML =
      `<div class="error">${
        esc(
          error?.message ||
          'Search failed. Please try again.'
        )
      }</div>`;

    count.textContent =
      '';

  }
}


/* =========================================================
   RENDER SEARCH RESULTS
========================================================= */

function render(data){

  home.classList.add(
    'hidden'
  );

  results.classList.remove(
    'hidden'
  );


  currentType =
    data.type ||
    currentType;


  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';


  let a = [];


  if(currentType === 'web'){

    a =
      Array.isArray(
        data.results
      )
        ? data.results
        : Array.isArray(
            data.results?.web?.results
          )
          ? data.results.web.results
          : [];

  }else if(
    currentType === 'images' ||
    currentType === 'news'
  ){

    a =
      Array.isArray(
        data.results
      )
        ? data.results
        : [];

  }


  count.textContent =
    a.length
      ? `${a.length} results`
      : '';


  resultsInput.value =
    data.query || '';


  list.innerHTML =
    '';

  pager.innerHTML =
    '';


  document
    .querySelectorAll('.search-type')
    .forEach(button=>{
      button.classList.toggle(
        'active',
        button.dataset.type ===
        currentType
      );
    });


  /*
   * Empty search results do NOT hide dictionary.
   */
  if(!a.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

  }else if(
    currentType === 'images'
  ){

    renderImages(a);

  }else{

    renderTextResults(a);

  }


  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const button =
      document.createElement(
        'button'
      );

    button.textContent =
      'Previous';

    button.onclick =
      () =>
        search(
          currentQ,
          currentPage - 1,
          currentType
        );

    pager.appendChild(
      button
    );
  }


  if(more){

    const button =
      document.createElement(
        'button'
      );

    button.textContent =
      'Next';

    button.onclick =
      () =>
        search(
          currentQ,
          currentPage + 1,
          currentType
        );

    pager.appendChild(
      button
    );
  }


  history.replaceState(
    {},
    '',
    `/?q=${
      encodeURIComponent(
        data.query ||
        currentQ
      )
    }&type=${
      encodeURIComponent(
        currentType
      )
    }${
      currentPage
        ? `&page=${currentPage}`
        : ''
    }`
  );
}


/* =========================================================
   TEXT RESULTS
========================================================= */

function renderTextResults(a){

  a.forEach(r=>{

    const el =
      document.createElement(
        'article'
      );

    el.className =
      'result';


    const u =
      r.url ||
      r.link ||
      '';


    const host =
      r.meta_url?.hostname ||
      getHostname(u) ||
      '';


    const title =
      r.title ||
      r.name ||
      u;


    const desc =
      r.description ||
      r.content ||
      r.snippet ||
      '';


    const age =
      r.age ||
      r.publishedDate ||
      r.published ||
      '';


    const favicon =
      r.favicon ||
      r.favicon_url ||
      faviconFor(u);


    /*
     * NO target="_blank".
     *
     * Clicking the result therefore stays in
     * the current tab.
     */
    el.innerHTML = `

      <div class="result-top">

        ${
          favicon
            ? `
              <img
                class="result-favicon"
                src="${esc(favicon)}"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
              >
            `
            : ''
        }

        <div class="result-url">
          ${esc(host || u)}
        </div>

      </div>


      <h2>

        <a href="${esc(u)}">
          ${esc(title)}
        </a>

      </h2>


      ${
        desc
          ? `
            <p class="snippet">
              ${formatDescription(desc)}
            </p>
          `
          : ''
      }


      ${
        age
          ? `
            <div class="result-meta">
              ${esc(decodeRepeated(age))}
            </div>
          `
          : ''
      }

    `;


    list.appendChild(
      el
    );

  });
}


/* =========================================================
   IMAGE RESULTS
========================================================= */

function renderImages(a){

  const grid =
    document.createElement(
      'div'
    );

  grid.className =
    'image-grid';


  a.forEach(r=>{

    const u =
      r.url ||
      r.properties?.url ||
      r.link ||
      '';


    /*
     * Tiago may expose thumbnail under different fields.
     */
    const img =
      r.thumbnail ||
      r.thumbnail_url ||
      r.image ||
      r.image_url ||
      r.properties?.thumbnail ||
      r.properties?.url ||
      '';


    if(!img) return;


    const el =
      document.createElement(
        'article'
      );

    el.className =
      'image-result';


    const title =
      r.title ||
      u;


    const source =
      r.source ||
      r.meta_url?.hostname ||
      getHostname(u) ||
      '';


    el.innerHTML = `

      <a
        href="${esc(u)}"
        class="image-result-link"
      >

        <div class="image-result-image-wrap">

          <img
            src="${esc(img)}"
            alt="${esc(title)}"
            loading="lazy"
            referrerpolicy="no-referrer"
            draggable="false"
          >

          <div class="longpress-progress">

            <div
              class="longpress-ring"
            ></div>

          </div>

        </div>

      </a>


      <div class="image-result-title">
        ${esc(title)}
      </div>


      <div class="image-result-source">
        ${esc(source)}
      </div>

    `;


    grid.appendChild(
      el
    );


    setupImageLongPress(
      el,
      img,
      title
    );

  });


  if(grid.children.length){

    list.appendChild(
      grid
    );

  }else{

    list.innerHTML =
      '<div class="empty">No images found.</div>';

  }
}


/* =========================================================
   IMAGE LONG PRESS
========================================================= */

const LONG_PRESS_TIME =
  2000;


function setupImageLongPress(
  el,
  imageUrl,
  title
){

  const wrap =
    el.querySelector(
      '.image-result-image-wrap'
    );

  const progress =
    el.querySelector(
      '.longpress-progress'
    );

  const ring =
    el.querySelector(
      '.longpress-ring'
    );

  const link =
    el.querySelector(
      '.image-result-link'
    );


  let timer =
    null;

  let animation =
    null;

  let startTime =
    0;

  let triggered =
    false;


  function reset(){

    if(timer){
      clearTimeout(timer);
      timer = null;
    }

    if(animation){
      cancelAnimationFrame(
        animation
      );

      animation = null;
    }

    wrap.classList.remove(
      'downloading'
    );

    progress.classList.remove(
      'active'
    );

    ring.style.setProperty(
      '--progress',
      '0%'
    );

    startTime = 0;
  }


  function update(){

    if(!startTime) return;

    const elapsed =
      performance.now() -
      startTime;

    const percent =
      Math.min(
        elapsed /
        LONG_PRESS_TIME,
        1
      );


    ring.style.setProperty(
      '--progress',
      `${percent * 100}%`
    );


    if(percent < 1){

      animation =
        requestAnimationFrame(
          update
        );
    }
  }


  function begin(event){

    if(
      event.type ===
      'mousedown' &&
      event.button !== 0
    ){
      return;
    }


    triggered =
      false;


    reset();


    startTime =
      performance.now();


    progress.classList.add(
      'active'
    );


    animation =
      requestAnimationFrame(
        update
      );


    timer =
      setTimeout(
        async ()=>{

          triggered =
            true;

          ring.style.setProperty(
            '--progress',
            '100%'
          );

          wrap.classList.add(
            'downloading'
          );


          await downloadImage(
            imageUrl,
            title
          );


          setTimeout(
            reset,
            250
          );

        },
        LONG_PRESS_TIME
      );
  }


  function end(event){

    if(triggered){

      event?.preventDefault();
      event?.stopPropagation();

      reset();

      return;
    }


    reset();
  }


  wrap.addEventListener(
    'contextmenu',
    event=>{
      event.preventDefault();
    }
  );


  wrap.addEventListener(
    'touchstart',
    begin,
    {passive:true}
  );


  wrap.addEventListener(
    'touchend',
    end,
    {passive:false}
  );


  wrap.addEventListener(
    'touchcancel',
    reset,
    {passive:true}
  );


  wrap.addEventListener(
    'mousedown',
    begin
  );


  wrap.addEventListener(
    'mouseup',
    end
  );


  wrap.addEventListener(
    'mouseleave',
    ()=>{
      if(!triggered){
        reset();
      }
    }
  );


  wrap.addEventListener(
    'dragstart',
    event=>{
      event.preventDefault();
    }
  );


  link.addEventListener(
    'click',
    event=>{

      if(triggered){

        event.preventDefault();
        event.stopPropagation();

        triggered =
          false;
      }

    }
  );
}


/* =========================================================
   IMAGE DOWNLOAD
========================================================= */

async function downloadImage(
  url,
  title='image'
){

  try{

    const response =
      await fetch(
        url,
        {
          mode:'cors',
          credentials:'omit'
        }
      );


    if(!response.ok){
      throw new Error(
        'Image request failed'
      );
    }


    const blob =
      await response.blob();


    const blobUrl =
      URL.createObjectURL(
        blob
      );


    const anchor =
      document.createElement(
        'a'
      );


    anchor.href =
      blobUrl;


    anchor.download =
      makeFilename(
        title,
        blob.type
      );


    document.body.appendChild(
      anchor
    );


    anchor.click();


    anchor.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          blobUrl
        );
      },
      5000
    );


  }catch{

    /*
     * Cross-origin hosts may reject the blob fetch.
     * Fall back to the actual image URL.
     */
    const anchor =
      document.createElement(
        'a'
      );


    anchor.href =
      url;


    anchor.download =
      makeFilename(
        title
      );


    document.body.appendChild(
      anchor
    );


    anchor.click();


    anchor.remove();

  }
}


function makeFilename(
  title,
  mime=''
){

  let name =
    String(title || 'image')
      .replace(
        /[<>:"/\\|?*\x00-\x1F]/g,
        ''
      )
      .replace(
        /\s+/g,
        ' '
      )
      .trim()
      .slice(0,100);


  if(!name){
    name = 'image';
  }


  let ext = '';


  if(mime.includes('png')){
    ext = '.png';

  }else if(
    mime.includes('jpeg') ||
    mime.includes('jpg')
  ){

    ext = '.jpg';

  }else if(
    mime.includes('webp')
  ){

    ext = '.webp';

  }else if(
    mime.includes('gif')
  ){

    ext = '.gif';
  }


  return name + ext;
}

);

      );

);
