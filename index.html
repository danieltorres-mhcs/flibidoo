<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1d0c22" />
  <title>FlibidooSearch</title>

  <link
    rel="icon"
    type="image/png"
    href="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
  />

  <style>
    :root{
      --bg:#1d0c22;
      --text:#f5eef7;
      --muted:#b9aabb;
      --line:#5a4560;
      --line2:#39283d;
      --accent:#f5eef7;
      --result:#e7dce9;
      --url:#b8a2bc;
      --focus:#cdb8d1;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      overflow-x:hidden;
    }

    a{
      color:inherit;
    }

    .shell{
      width:min(100% - 40px,1120px);
      margin:0 auto;
    }

    /*
      HOME
      Fixed to the viewport so there is no unwanted scrolling
      or giant empty area above the search interface.
    */

    #home.home{
      width:100%;
      height:100vh;
      min-height:100vh;
      margin:0;
      padding:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .hero-logo{
      width:min(210px,55vw);
      height:auto;
      display:block;
      margin:0 0 12px;
      object-fit:contain;

      -webkit-mask-image:
        linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        ),
        linear-gradient(
          to bottom,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

      mask-image:
        linear-gradient(
          to right,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        ),
        linear-gradient(
          to bottom,
          transparent 0%,
          black 7%,
          black 93%,
          transparent 100%
        );

      -webkit-mask-composite:source-in;
      mask-composite:intersect;
    }

    h1{
      font-size:clamp(34px,5vw,54px);
      line-height:1;
      margin:0 0 30px;
      letter-spacing:-.055em;
      font-weight:500;
    }

    .search-wrap{
      width:min(100%,680px);
    }

    form{
      display:flex;
      align-items:center;
      height:54px;
      border:1px solid var(--line);
      border-radius:28px;
      background:transparent;
      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    form:focus-within{
      border-color:var(--focus);
      box-shadow:0 0 0 2px rgba(205,184,209,.08);
    }

    .search-icon{
      width:20px;
      height:20px;
      margin-left:18px;
      flex:0 0 auto;
      opacity:.75;
    }

    .search-icon circle,
    .search-icon path{
      stroke:currentColor;
    }

    input{
      min-width:0;
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:16px;
      padding:0 14px;
    }

    input::placeholder{
      color:#9e8da1;
    }

    .submit{
      height:38px;
      width:38px;
      margin-right:8px;
      border:1px solid var(--line);
      background:transparent;
      color:#766679;
      border-radius:50%;
      padding:0;
      display:grid;
      place-items:center;
      cursor:pointer;
      transition:
        color .15s ease,
        border-color .15s ease;
    }

    .submit.has-input{
      color:var(--text);
      border-color:var(--focus);
    }

    .submit:hover{
      border-color:var(--focus);
    }

    .submit:focus-visible{
      outline:2px solid var(--focus);
      outline-offset:2px;
    }

    .submit-icon{
      width:18px;
      height:18px;
      display:block;
    }

    .links{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
      gap:18px;
      margin-top:20px;
      color:var(--muted);
      font-size:13px;
    }

    .links button{
      border:0;
      background:none;
      color:inherit;
      cursor:pointer;
      padding:0;
    }

    .links button:hover{
      color:var(--text);
    }

    .confederacy-credit{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      margin-top:0;
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
      text-align:center;
    }

    .confederacy-credit img{
      width:18px;
      height:18px;
      display:block;
      object-fit:contain;
      flex:0 0 18px;
      border-radius:4px;
    }

    /*
      RESULTS
    */

    main{
      flex:1;
    }

    .results{
      padding:30px 0 70px;
    }

    .results-head{
      display:flex;
      align-items:center;
      gap:18px;
      min-height:44px;
      border-bottom:1px solid var(--line2);
      padding-bottom:14px;
      margin-bottom:14px;
    }

    .results-brand{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:inherit;
      white-space:nowrap;
    }

    .results-brand img{
      width:28px;
      height:28px;
      object-fit:contain;
      display:block;
    }

    .results-brand span{
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
    }

    .results-query{
      font-size:14px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      flex:1;
    }

    .count{
      font-size:13px;
      color:var(--muted);
      white-space:nowrap;
    }

    .results-search{
      width:min(100%,680px);
      margin:0 0 28px;
    }

    .results-search form{
      height:48px;
    }

    .results-search .search-icon{
      margin-left:16px;
    }

    .results-search .submit{
      width:34px;
      height:34px;
      margin-right:6px;
    }

    .search-types{
      display:flex;
      align-items:flex-end;
      gap:0;
      margin:8px 0 18px;
      border-bottom:1px solid rgba(255,255,255,.12);
      height:36px;
    }

    .search-type{
      position:relative;
      appearance:none;
      border:0;
      background:transparent;
      color:rgba(255,255,255,.62);
      font:inherit;
      font-size:13px;
      line-height:20px;
      padding:0 12px 10px;
      margin:0;
      border-radius:0;
      cursor:pointer;
      transition:color .12s ease;
    }

    .search-type:hover{
      color:rgba(255,255,255,.9);
      background:transparent;
    }

    .search-type.active{
      color:#fff;
      background:transparent;
    }

    .search-type.active::after{
      content:"";
      position:absolute;
      left:10px;
      right:10px;
      bottom:-1px;
      height:2px;
      border-radius:2px 2px 0 0;
      background:currentColor;
    }

    .search-type:focus-visible{
      outline:1px solid rgba(255,255,255,.55);
      outline-offset:-2px;
    }

    .results-layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 330px;
      gap:42px;
      align-items:start;
    }

    /*
      WEB RESULTS
    */

    .result{
      padding:0 0 26px;
      margin-bottom:26px;
      border-bottom:1px solid var(--line2);
    }

    .result-url{
      font-size:13px;
      color:var(--url);
      margin-bottom:6px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .result h2{
      font-size:20px;
      line-height:1.25;
      margin:0 0 7px;
      font-weight:500;
      letter-spacing:-.02em;
    }

    .result h2 a{
      text-decoration:none;
    }

    .result h2 a:hover{
      text-decoration:underline;
    }

    .snippet{
      font-size:14px;
      line-height:1.6;
      color:var(--result);
      margin:0;
      max-width:760px;
    }

    .result-favicon{
      width:18px;
      height:18px;
      object-fit:contain;
      vertical-align:-4px;
      margin-right:7px;
    }

    .result-meta{
      font-size:12px;
      color:var(--muted);
      margin-top:7px;
    }

    .result-inline-thumb{
      margin-top:10px;
      max-width:260px;
    }

    .result-inline-thumb img{
      display:block;
      width:100%;
      max-height:150px;
      object-fit:cover;
    }

    /*
      IMAGES
    */

    .image-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:28px 22px;
    }

    .image-result{
      min-width:0;
      position:relative;
    }

    .image-hold-wrap{
      position:relative;
      display:block;
    }

    .image-result a{
      display:block;
      text-decoration:none;
    }

    .image-result img{
      user-select:none;
      -webkit-user-drag:none;
      display:block;
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      border:1px solid var(--line2);
      background:rgba(255,255,255,.02);
    }

    .image-result-title{
      font-size:14px;
      line-height:1.4;
      margin-top:9px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .image-result-source{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .image-hold-progress{
      position:absolute;
      inset:10px auto auto 10px;
      width:34px;
      height:34px;
      border-radius:50%;
      background:conic-gradient(
        currentColor 0deg,
        rgba(255,255,255,.18) 0deg
      );
      display:none;
      place-items:center;
      pointer-events:none;
      z-index:2;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));
    }

    .image-hold-progress::after{
      content:"";
      width:26px;
      height:26px;
      border-radius:50%;
      background:#17101a;
    }

    .image-result.holding .image-hold-progress,
    .image-result.hold-success .image-hold-progress{
      display:grid;
    }

    /*
      MAP RESULTS
    */

    .map-result{
      padding:0 0 22px;
      margin-bottom:22px;
      border-bottom:1px solid var(--line2);
    }

    .map-result-title{
      font-size:18px;
      line-height:1.35;
      margin:0 0 6px;
      font-weight:500;
    }

    .map-result-title a{
      text-decoration:none;
    }

    .map-result-title a:hover{
      text-decoration:underline;
    }

    .map-result-address{
      font-size:14px;
      line-height:1.55;
      color:var(--result);
    }

    .map-result-coords{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    /*
      DICTIONARY
    */

    .dictionary{
      border-left:1px solid var(--line2);
      padding-left:28px;
      max-height:50vh;
      overflow-y:auto;
      overscroll-behavior:contain;
      scrollbar-width:thin;
    }

    .dictionary::-webkit-scrollbar{
      width:6px;
    }

    .dictionary::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.2);
      border-radius:6px;
    }

    .dictionary-title{
      font-size:22px;
      font-weight:500;
      letter-spacing:-.02em;
      margin:0 0 5px;
    }

    .dictionary-word{
      font-size:13px;
      color:var(--muted);
      margin-bottom:22px;
    }

    .dictionary-entry{
      padding:0 0 24px;
      margin-bottom:24px;
      border-bottom:1px solid var(--line2);
    }

    .dictionary-entry:last-child{
      border-bottom:0;
    }

    .dictionary-language{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .dictionary-pos{
      font-size:15px;
      margin-bottom:12px;
    }

    .dictionary-pronunciations,
    .dictionary-forms,
    .dictionary-senses,
    .dictionary-relations,
    .dictionary-translations{
      margin-top:14px;
    }

    .dictionary-label{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:7px;
    }

    .dictionary-list{
      margin:0;
      padding-left:18px;
    }

    .dictionary-list li{
      margin:0 0 7px;
    }

    .dictionary-sense{
      margin:0 0 15px;
    }

    .dictionary-definition{
      font-size:14px;
      line-height:1.55;
    }

    .dictionary-tags{
      font-size:12px;
      color:var(--muted);
      margin-left:5px;
    }

    .dictionary-example{
      font-size:13px;
      line-height:1.5;
      color:var(--result);
      margin:7px 0 0 14px;
    }

    .dictionary-quote{
      font-size:13px;
      line-height:1.5;
      color:var(--muted);
      margin:7px 0 0 14px;
    }

    .dictionary-source{
      font-size:12px;
      line-height:1.5;
      color:var(--muted);
      padding-top:4px;
    }

    .dictionary-source a{
      color:inherit;
    }

    .dictionary-loading,
    .dictionary-empty{
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    /*
      WORD OF THE DAY
    */

    .wotd-panel{
      padding:0 0 22px;
      margin:0 0 22px;
      border-bottom:1px solid var(--line2);
    }

    .wotd-divider{
      height:1px;
      background:var(--line2);
      margin:14px 0 16px;
    }

    .wotd-heading{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0 0 8px;
      color:#ffb52e;
      font-size:13px;
      font-weight:600;
    }

    .wotd-heading svg{
      width:16px;
      height:16px;
      display:block;
      flex:0 0 16px;
    }

    .wotd-word{
      color:#ffe18a;
      font-size:20px;
      font-weight:600;
      line-height:1.25;
      margin:0 0 5px;
    }

    .wotd-definition{
      color:#ffe9a8;
      font-size:13px;
      line-height:1.55;
      margin:0;
    }

    .wotd-status{
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    /*
      PAGINATION / EMPTY / ERROR
    */

    .empty{
      padding:70px 0;
      color:var(--muted);
      text-align:center;
    }

    .error{
      min-height:120px;
      max-width:680px;
      margin:0;
      padding:28px 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      border:1px solid var(--line2);
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .pager{
      display:flex;
      gap:8px;
      padding-top:10px;
    }

    .pager button{
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      border-radius:4px;
      padding:8px 12px;
      cursor:pointer;
    }

    .pager button:hover{
      border-color:var(--focus);
    }

    /*
      AUTOCOMPLETE
    */

    .flibidoo-suggest-wrap{
      position:relative;
      z-index:100;
    }

    .flibidoo-suggestions{
      position:absolute;
      left:0;
      right:0;
      top:calc(100% + 4px);
      z-index:9999;
      background:#1d0c22;
      border:1px solid rgba(255,255,255,.14);
      border-radius:8px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
    }

    .flibidoo-suggestion{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      border:0;
      background:transparent;
      color:#fff;
      text-align:left;
      padding:10px 13px;
      font:inherit;
      font-size:13px;
      cursor:pointer;
    }

    .flibidoo-suggestion:hover,
    .flibidoo-suggestion.active{
      background:rgba(255,255,255,.07);
    }

    .flibidoo-suggestion img{
      width:24px;
      height:24px;
      object-fit:cover;
      border-radius:50%;
    }

    .flibidoo-suggestion small{
      display:block;
      color:rgba(255,255,255,.55);
      margin-top:2px;
    }

    /*
      VISIBILITY
    */

    .hidden{
      display:none !important;
    }

    /*
      MOBILE
    */

    @media(max-width:860px){
      .results-layout{
        grid-template-columns:1fr;
      }

      .dictionary{
        border-left:0;
        border-top:1px solid var(--line2);
        padding:26px 0 0;
        max-height:45vh;
      }
    }

    @media(max-width:760px){
      .image-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:22px 14px;
      }
    }

    @media(max-width:650px){
      .results-head{
        gap:12px;
      }

      .results-brand img{
        width:24px;
        height:24px;
      }

      .results-brand span{
        font-size:14px;
      }

      .results-query{
        font-size:13px;
      }

      .search-types{
        overflow-x:auto;
        scrollbar-width:none;
      }

      .search-types::-webkit-scrollbar{
        display:none;
      }

      .search-type{
        padding-left:10px;
        padding-right:10px;
        font-size:12px;
      }
    }

    @media(max-width:640px){
      .shell{
        width:min(100% - 24px,1120px);
      }

      .hero-logo{
        width:150px;
      }

      h1{
        font-size:36px;
        margin-bottom:24px;
      }

      form{
        height:50px;
      }

      .submit{
        width:38px;
      }

      .results{
        padding-top:22px;
      }

      .confederacy-credit img{
        width:18px;
        height:18px;
      }
    }

    @media(max-width:460px){
      .image-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <main>

    <!-- HOME -->

    <section id="home" class="home shell">

      <img
        class="hero-logo"
        src="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
        alt="FlibidooSearch logo"
      />

      <h1><em><strong>Flibidoo</strong></em>Search</h1>

      <div class="search-wrap">

        <form id="searchForm" role="search">

          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="10.8"
              cy="10.8"
              r="6.8"
              stroke-width="1.7"
            />
            <path
              d="m16 16 5 5"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>

          <input
            id="q"
            name="q"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search the web"
            aria-label="Search the web"
          />

          <button
            class="submit"
            id="submitButton"
            type="submit"
            aria-label="Search"
            title="Search"
          >
            <svg
              class="submit-icon"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M5 12h14"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="m12 5 7 7-7 7"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

        </form>

        <div class="links">

          <button type="button" id="lucky">
            I'm Feeling Lucky
          </button>

          <span
            class="confederacy-credit"
            aria-label="With love from The Great Confederacy of E"
          >
            <span>with love from The Great Confederacy of E</span>

            <img
              src="https://github.com/danieltorres-mhcs/assets/blob/main/Untitled13_20260821194209.png?raw=true"
              alt=""
              aria-hidden="true"
            />
          </span>

        </div>

      </div>

    </section>


    <!-- RESULTS -->

    <section id="results" class="results shell hidden">

      <div class="results-head">

        <a
          class="results-brand"
          href="/"
          aria-label="FlibidooSearch home"
        >
          <img
            src="https://github.com/danieltorres-mhcs/assets/blob/main/flibidoo.PNG?raw=true"
            alt="FlibidooSearch"
          />

          <span><em><strong>Flibidoo</strong></em>Search</span>
        </a>

        <div
          id="queryLabel"
          class="results-query"
        ></div>

        <div
          id="count"
          class="count"
        ></div>

      </div>


      <div class="results-search">

        <form id="resultsSearchForm" role="search">

          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="10.8"
              cy="10.8"
              r="6.8"
              stroke-width="1.7"
            />

            <path
              d="m16 16 5 5"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>

          <input
            id="resultsQ"
            name="q"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search the web"
            aria-label="Search the web"
          />

          <button
            class="submit"
            id="resultsSubmitButton"
            type="submit"
            aria-label="Search"
            title="Search"
          >
            <svg

    function esc(s = '') {
      return String(s).replace(
        /[&<>'"]/g,
        c => ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          "'":'&#39;',
          '"':'&quot;'
        }[c])
      );
    }


    function updateButtonState(button, value) {
      button.classList.toggle(
        'has-input',
        value.trim().length > 0

    function normalize(s = '') {
      return s
        .toLowerCase()
        .trim()
        .replace(/[“”"'.,!?;:()[\]{}]/g, '')
        .replace(/\s+/g, ' ');
    }


    function levenshtein(a, b) {

      const prev =
        Array.from(
          {length:b.length + 1},
          (_, i) => i
        );

      for(let i = 1; i <= a.length; i++) {

        const cur = [i];

        for(let j = 1; j <= b.length; j++) {

          cur[j] = Math.min(
            cur[j - 1] + 1,
            prev[j] + 1,
            prev[j - 1] +
              (a[i - 1] === b[j - 1] ? 0 : 1)
          );
        }

        for(let j = 0; j <= b.length; j++) {
          prev[j] = cur[j];
        }
      }

      return prev[b.length];
    }


    function dictionaryWord(query) {

      const q = normalize(query);

      if(!q) return null;

      if(q.split(' ').length === 1) {
        return q;
      }

      const tokens =
        q.split(' ').filter(Boolean);

      const candidates = new Set();

      for(const t of tokens) {
        if(/^[a-z][a-z'-]*$/i.test(t)) {
          candidates.add(
            t.replace(/^['-]+|['-]+$/g, '')
          );
        }
      }

      for(const word of candidates) {

        const templates = [
          `meaning of ${word}`,
          `${word} meaning`,
          `${word} means`,
          `${word} definition`,
          `definition of ${word}`
        ];

        for(const template of templates) {

          if(levenshtein(q, template) <= 3) {
            return word;
          }
        }
      }

      return null;
    }


    function render(data) {

    function dictionaryTags(tags) {

    function renderSense(sense, depth = 0) {

      if(!sense) return '';

      let html = `
        <div

      if(sense.definition) {

        html += `

            ${dictionaryTags(sense.tags)}

        `;
      }


      if(Array.isArray(sense.examples)) {

        sense.examples.forEach(x => {

          if(x) {

            html += `
              <div class="dictionary-example">
                “${esc(x)}”
              </div>
            `;
          }
        });
      }


      if(Array.isArray(sense.quotes)) {

        sense.quotes.forEach(q => {

            html += `

          }
        });
      }


      if(
        Array.isArray(sense.synonyms) &&
        sense.synonyms.length

        html += `

      if(

              Antonyms

              ${sense.antonyms.map(esc).join(', ')}
            </div>

      }


      if(
        Array.isArray(sense.translations) &&
        sense.translations.length
      ) {

        html += `

              Translations
            </div>

            <ul class="dictionary-list">
        `;


        sense.translations.forEach(t => {

          if(t?.word) {

            html += `

                ${esc(
                  t.language?.name ||
                  t.language?.code ||
                  ''
                )}
                —
                ${esc(t.word)}
              </li>
            `;
          }
        });


        html += `
            </ul>
          </div>
        `;
      }


      if(Array.isArray(sense.subsenses)) {

        sense.subsenses.forEach(sub => {

          html += renderSense(
            sub,
            depth + 1
          );
        });
      }


      return html + '</div>';
    }


    function renderDictionary(data) {

      if(!data?.entries?.length) {

        dictionary.classList.add('hidden');
        dictionary.innerHTML = '';

        return;
      }


      let html = `
        <h2 class="dictionary-title">
          ${esc(data.word || '')}
        </h2>

        <div class="dictionary-word">
          Dictionary
        </div>
      `;


      const entries =
        [...data.entries].sort((a,b) => {

          const la =
            String(
              a?.language?.name ||
              a?.language?.code ||
              ''
            )
            .trim()
            .toLowerCase();

          const lb =
            String(
              b?.language?.name ||
              b?.language?.code ||
              ''
            )
            .trim()
            .toLowerCase();


          const ae =
            la === 'english' ||
            la.startsWith('english ') ||
            la === 'en' ||
            la.startsWith('en-');

          const be =
            lb === 'english' ||
            lb.startsWith('english ') ||
            lb === 'en' ||
            lb.startsWith('en-');


          return ae === be
            ? 0
            : ae
              ? -1
              : 1;
        });


      entries.forEach(entry => {

        html += `
          <section class="dictionary-entry">
        `;


        const language =
          entry.language?.name ||
          entry.language?.code;


        if(language) {

          html += `
            <div class="dictionary-language">
              ${esc(language)}
              ${
                entry.language?.code
                  ? ` (${esc(entry.language.code)})`
                  : ''
              }
            </div>
          `;
        }


        if(entry.partOfSpeech) {

          html += `
            <div class="dictionary-pos">
              ${esc(entry.partOfSpeech)}
            </div>
          `;
        }


        if(
          Array.isArray(entry.pronunciations) &&
          entry.pronunciations.length
        ) {

          html += `
            <div class="dictionary-pronunciations">

              <div class="dictionary-label">
                Pronunciations
              </div>

              <ul class="dictionary-list">
          `;


          entry.pronunciations.forEach(p => {

            if(p?.text) {

              html += `
                <li>
                  ${esc(p.text)}
                  ${
                    p.type
                      ? ` — ${esc(p.type)}`
                      : ''
                  }
                  ${dictionaryTags(p.tags)}
                </li>
              `;
            }
          });


          html += `
              </ul>
            </div>
          `;
        }


        if(
          Array.isArray(entry.forms) &&
          entry.forms.length
        ) {

          html += `
            <div class="dictionary-forms">

              <div class="dictionary-label">
                Forms
              </div>

              <ul class="dictionary-list">
          `;


          entry.forms.forEach(f => {

            if(f?.word) {

              html += `
                <li>
                  ${esc(f.word)}
                  ${dictionaryTags(f.tags)}
                </li>
              `;
            }
          });


          html += `
              </ul>
            </div>
          `;
        }


        if(
          Array.isArray(entry.senses) &&
          entry.senses.length
        ) {

          html += `
            <div class="dictionary-senses">

              <div class="dictionary-label">
                Definitions
              </div>
          `;


          entry.senses.forEach(s => {
            html += renderSense(s);
          });


          html += `
            </div>
          `;
        }


        if(
          Array.isArray(entry.synonyms) &&
          entry.synonyms.length
        ) {

          html += `
            <div class="dictionary-relations">

              <div class="dictionary-label">
                Synonyms
              </div>

              <div>
                ${entry.synonyms.map(esc).join(', ')}
              </div>

            </div>
          `;
        }


        if(
          Array.isArray(entry.antonyms) &&
          entry.antonyms.length
        ) {

          html += `
            <div class="dictionary-relations">

              <div class="dictionary-label">
                Antonyms
              </div>

              <div>
                ${entry.antonyms.map(esc).join(', ')}
              </div>

            </div>
          `;
        }


        html += `
          </section>
        `;
      });


      if(data.source) {

        html += `

                ? `

                            data.source.license.name ||
                            'License'

                      `
                      : esc(
                          data.source.license.name ||
                          ''
                        )
                  }
                `
                : ''
            }
          </div>
        `;
      }


      dictionary.innerHTML = html;
      dictionary.classList.remove('hidden');
    }


    /*
      WORD OF THE DAY
    */

    const WOTD_WORKER =
      'https://ancient-unit-5007.daniel-torres-a95.workers.dev/';

    let cachedWotd = null;
    let wotdPromise = null;


    function isWotdQuery(query) {

      return (
        /\bwotd\b/i.test(query || '') ||
        /\bword\s+of\s+the\s+day\b/i.test(query || '')
      );
    }


    function normalizeWotdWord(word = '') {

      return normalize(word)
        .replace(/[^a-z0-9'-]/g, '');
    }


    function awardIcon() {

      return `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M8 3h8v5.2a4 4 0 0 1-8 0V3Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />

          <path
            d="M8 5H5v2.2a3.2 3.2 0 0 0 3.2 3.2M16 5h3v2.2a3.2 3.2 0 0 1-3.2 3.2M12 12v5M8.5 21h7M10 17h4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      `;
    }


    function cleanWotdTitle(title = '') {

      return String(title)
        .replace(/<!\[CDATA\[|\]\]>/g, '')
        .trim();
    }


    async function getWotd() {

      if(cachedWotd) {
        return cachedWotd;
      }

      if(wotdPromise) {
        return wotdPromise;
      }


      wotdPromise =
        (async() => {

          try {

            const r =
              await fetch(
                WOTD_WORKER,
                {cache:'no-store'}
              );

            if(!r.ok) {
              throw new Error(
                `WOTD worker returned ${r.status}`
              );
            }


            const word =
              cleanWotdTitle(
                await r.text()
              );


            if(!word) {
              throw new Error(
                'WOTD worker returned an empty word'
              );
            }


            cachedWotd = {word};

            return cachedWotd;

          } catch(error) {

            console.warn(
              'WOTD lookup failed:',
              error
            );

            return null;
          }

        })();


      try {
        return await wotdPromise;
      } finally {
        wotdPromise = null;
      }
    }


    function renderWotdPanel(
      word,
      definition = '',
      loading = false,
      error = false
    ) {

      dictionary.classList.remove('hidden');

      dictionary.innerHTML = `
        <div class="wotd-panel">

          <div class="wotd-heading">
            ${awardIcon()}
            <span>Word Of The Day</span>
          </div>

          ${
            word
              ? `
                <div class="wotd-word">
                  ${esc(word)}
                </div>
              `
              : ''
          }

          ${
            word
              ? `
                <div
                  class="wotd-divider"
                  aria-hidden="true"
                ></div>
              `
              : ''
          }

          ${
            loading
              ? `
                <div class="wotd-status">
                  Loading definition…
                </div>
              `
              : ''
          }

          ${
            error
              ? `

                </div>
              `
              : ''
          }

                  ${esc(definition)}

              `

          }

        </div>
      `;
    }


    async function fetchDictionaryData(word) {

      try {

        const r =
          await fetch(
            `/api/dictionary?word=${encodeURIComponent(word)}`,
            {cache:'no-store'}
          );


        if(r.ok) {

          const data =
            await r.json();

          if(data?.entries?.length) {
            return data;
          }
        }

      } catch {}


      try {

        const r =
          await fetch(
            `https://freedictionaryapi.com/api/v1/entries/all/${encodeURIComponent(word)}`,
            {cache:'no-store'}
          );


        if(r.ok) {
          return await r.json();
        }

      } catch {}


      return null;
    }


    function firstDictionaryDefinition(data) {

      return (
        data?.entries
          ?.flatMap(
            e =>
              Array.isArray(e.senses)
                ? e.senses
                : []
          )
          ?.map(
            s => s?.definition
          )
          ?.find(Boolean)
        || ''
      );
    }


    async function loadWotdSearch() {

      const wotd =
        await getWotd();


      if(!wotd) {

        renderWotdPanel(
          '',
          '',
          false,
          true
        );

        return;
      }


      renderWotdPanel(
        wotd.word,
        '',
        true,
        false
      );


      const data =
        await fetchDictionaryData(
          wotd.word
        );


      const definition =
        firstDictionaryDefinition(data);


      renderWotdPanel(
        wotd.word,
        definition,
        false,
        !definition
      );
    }


    async function loadDictionary(q) {

      const word =
        dictionaryWord(q);

      const wantsWotd =
        isWotdQuery(q);


      if(wantsWotd) {

        await loadWotdSearch();

        return;
      }


      let wotd = null;

      if(word) {
        wotd = await getWotd();
      }


      const searched =
        normalizeWotdWord(
          word || q
        );

      const actualWotd =
        normalizeWotdWord(
          wotd?.word || ''
        );


      if(
        wotd &&
        searched &&
        actualWotd &&
        searched === actualWotd
      ) {

        renderWotdPanel(
          wotd.word,
          '',
          false,
          false
        );

        return;
      }


      if(!word) {

        dictionary.classList.add('hidden');
        dictionary.innerHTML = '';

        return;
      }


      dictionary.classList.remove('hidden');

      dictionary.innerHTML =
        '<div class="dictionary-loading">Looking up the definition…</div>';


      try {

        const data =
          await fetchDictionaryData(word);


        if(data?.entries?.length) {

          renderDictionary(data);

        } else {

          dictionary.classList.add('hidden');
          dictionary.innerHTML = '';
        }

      } catch {

        dictionary.classList.add('hidden');
        dictionary.innerHTML = '';
      }
    }


    window.loadDictionary =
      loadDictionary;


    /*
      SEARCH
    */

    async function search(
      q,
      page = 0,
      type = currentType
    ) {

      q = q.trim();

      if(!q) return;


      const apiType =
        type === 'map'
          ? 'web'
          : type;


      currentQ = q;

      currentPage =
        Math.max(
          0,
          Number(page) || 0
        );

      currentType = type;


      document.title =
        `${q} - FlibidooSearch`;


      input.value = q;
      resultsInput.value = q;


      updateButtonState(
        submitButton,
        q
      );

      updateButtonState(
        resultsSubmitButton,
        q
      );


      home.classList.add('hidden');
      results.classList.remove('hidden');


      list.innerHTML =
        '<div class="empty">Searching…</div>';

      count.textContent = '';

      label.textContent =
        `Results for “${q}”`;

      pager.innerHTML = '';


      document
        .querySelectorAll('.search-type')
        .forEach(b => {

          b.classList.toggle(
            'active',
            b.dataset.type === currentType
          );
        });


      const dictionaryPromise =
        currentType === 'web'
          ? loadDictionary(q)
          : Promise.resolve();


      try {

        const r =
          await fetch(
            `${API_BASE}/api`,
            {
              method:'POST',

              headers:{
                'Content-Type':
                  'application/json'
              },

              body:JSON.stringify({
                query:q,
                type:apiType,
                page:currentPage
              })
            }
          );


        const d =
          await r.json();


        if(!r.ok) {

          throw new Error(
            d.error ||
            'Search failed'
          );
        }


        d.type =
          currentType;


        render(d);

      } catch(e) {

        list.innerHTML = `
          <div class="error">
            ${esc(
              e.message ||
              'Search failed. Please try again.'
            )}
          </div>
        `;
      }


      await dictionaryPromise;
    }


    /*
      SEARCH BUTTON STATES
    */

    input.addEventListener(
      'input',
      () =>
        updateButtonState(
          submitButton,
          input.value
        )
    );


    updateButtonState(
      submitButton,
      input.value
    );


    resultsInput.addEventListener(
      'input',
      () =>
        updateButtonState(
          resultsSubmitButton,
          resultsInput.value
        )
    );


    updateButtonState(
      resultsSubmitButton,
      resultsInput.value
    );


    /*
      HOME SEARCH
    */

    form.addEventListener(
      'submit',
      e => {

        e.preventDefault();

        const q =
          input.value.trim();

        if(!q) return;


        location.href =
          `/?q=${encodeURIComponent(q)}&type=${encodeURIComponent(currentType)}&page=0`;
      }
    );


    /*
      RESULTS SEARCH
    */

    resultsForm.addEventListener(
      'submit',
      e => {

        e.preventDefault();

        const q =
          resultsInput.value.trim();

        if(!q) return;


        location.href =
          `/?q=${encodeURIComponent(q)}&type=${encodeURIComponent(currentType)}&page=0`;
      }
    );


    /*
      I'M FEELING LUCKY
    */

    document
      .querySelector('#lucky')
      .onclick = async() => {

        const q =
          input.value.trim();

        if(!q) return;


        try {

          const r =
            await fetch(
              `${API_BASE}/api`,
              {
                method:'POST',

                headers:{
                  'Content-Type':
                    'application/json'
                },

                body:JSON.stringify({
                  query:q,
                  type:'web',
                  page:0
                })
              }
            );


          const d =
            await r.json();


          const first =
            d.results
              ?.web
              ?.results
              ?.[0];


          if(first?.url) {

            location.href =
              first.url;

          } else {

            search(q,0,'web');
          }

        } catch {

          search(q,0,'web');
        }
      };


    /*
      SEARCH TYPE BUTTONS
    */

    document
      .querySelectorAll('.search-type')
      .forEach(btn => {

        btn.addEventListener(
          'click',
          () =>
            search(
              resultsInput.value ||
              currentQ,
              0,
              btn.dataset.type
            )
        );
      });


    /*
      IMAGE LONG PRESS
    */

    const HOLD_MS = 2000;


    function setupImageHold(
      root = document
    ) {

      root
        .querySelectorAll('.image-result')
        .forEach(card => {

          if(card.dataset.holdReady === '1') {
            return;
          }


          card.dataset.holdReady = '1';


          const wrap =
            card.querySelector(
              '.image-hold-wrap'
            );

          const img =
            card.querySelector('img');

          const progress =
            card.querySelector(
              '.image-hold-progress'
            );


          if(
            !wrap ||
            !img ||
            !progress
          ) {
            return;
          }


          let timer = null;
          let start = 0;
          let active = false;
          let completed = false;


          const paint = () => {

            const pct =
              Math.min(
                1,
                (
                  performance.now() -
                  start
                ) / HOLD_MS
              );


            progress.style.background =
              `conic-gradient(
                currentColor ${pct * 360}deg,
                rgba(255,255,255,.18) ${pct * 360}deg
              )`;


            if(
              active &&
              pct < 1
            ) {
              requestAnimationFrame(
                paint
              );
            }
          };


          const cancel = () => {

            if(timer) {
              clearTimeout(timer);
            }

            timer = null;
            active = false;

            card.classList.remove(
              'holding'
            );

            progress.style.background = '';
          };


          const downloadPng =
            async() => {

              const src =
                img.currentSrc ||
                img.src;


              try {

                const response =
                  await fetch(
                    src,
                    {
                      mode:'cors',
                      credentials:'omit'
                    }
                  );


                if(!response.ok) {
                  throw new Error(
                    'Image fetch failed'
                  );
                }


                const blob =
                  await response.blob();


                const bitmap =
                  await createImageBitmap(
                    blob
                  );


                const canvas =
                  document.createElement(
                    'canvas'
                  );


                canvas.width =
                  bitmap.width;

                canvas.height =
                  bitmap.height;


                canvas
                  .getContext('2d')
                  .drawImage(
                    bitmap,
                    0,
                    0
                  );


                bitmap.close();


                const png =
                  await new Promise(
                    (resolve,reject) => {

                      canvas.toBlob(
                        b =>
                          b
                            ? resolve(b)
                            : reject(
                                new Error(
                                  'PNG conversion failed'
                                )
                              ),
                        'image/png'
                      );
                    }
                  );


                const a =
                  document.createElement(
                    'a'
                  );


                a.href =
                  URL.createObjectURL(
                    png
                  );


                const base =
                  (
                    img.alt ||
                    'flibidoo-image'
                  )
                    .replace(
                      /[^a-z0-9_-]+/gi,
                      '-'
                    )
                    .replace(
                      /^-+|-+$/g,
                      ''
                    ) ||
                  'flibidoo-image';


                a.download =
                  `${base}.png`;


                document.body.appendChild(a);

                a.click();

                a.remove();


                setTimeout(
                  () =>
                    URL.revokeObjectURL(
                      a.href
                    ),
                  1000
                );


                completed = true;

                card.classList.add(
                  'hold-success'
                );


                setTimeout(
                  () =>
                    card.classList.remove(
                      'hold-success'
                    ),
                  700
                );

              } catch(err) {

                const a =
                  document.createElement(
                    'a'
                  );


                a.href = src;
                a.download = 'flibidoo-image';
                a.target = '_blank';
                a.rel = 'noopener';


                document.body.appendChild(a);

                a.click();

                a.remove();
              }
            };


          const startHold = e => {

            if(
              e.pointerType === 'mouse' &&
              e.button !== 0
            ) {
              return;
            }


            completed = false;
            active = true;
            start = performance.now();


            card.classList.add(
              'holding'
            );


            progress.style.background =
              'conic-gradient(currentColor 0deg, rgba(255,255,255,.18) 0deg)';


            requestAnimationFrame(
              paint
            );


            timer =
              setTimeout(
                async() => {

                  timer = null;
                  active = false;

                  await downloadPng();

                },
                HOLD_MS
              );
          };


          const endHold = e => {

            if(completed) {

              completed = false;

              e?.preventDefault();
              e?.stopPropagation();

            } else {

              cancel();
            }
          };


          wrap.addEventListener(
            'pointerdown',
            startHold
          );

          wrap.addEventListener(
            'pointerup',
            endHold
          );

          wrap.addEventListener(
            'pointercancel',
            cancel
          );

          wrap.addEventListener(
            'pointerleave',
            e => {

              if(
                active &&
                e.pointerType === 'mouse'
              ) {
                cancel();
              }
            }
          );

          wrap.addEventListener(
            'dragstart',
            e =>
              e.preventDefault()
          );

          wrap.addEventListener(
            'contextmenu',
            e => {

              if(
                active ||
                completed
              ) {
                e.preventDefault();
              }
            }
          );

        });
    }


    /*
      INITIAL URL
    */

    const params =
      new URLSearchParams(
        location.search
      );


    const initialQuery =
      params.get('q');


    const initialPage =
      Math.max(
        0,
        Number(
          params.get('page') || 0
        )
      );


    const initialType =
      [
        'web',
        'images',
        'news',
        'map'
      ].includes(
        params.get('type')
      )
        ? params.get('type')
        : 'web';


    if(initialQuery) {

      search(
        initialQuery,
        initialPage,
        initialType
      );
    }
  </script>


  <!-- FAVICON HELPERS -->

  <script id="flibidoo-favicon-links">

    function flibidooFavicon(url) {

      try {

        const u =
          new URL(url);


        return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(u.hostname)}&sz=64`;

      } catch(_) {

        return '';
      }
    }


    function flibidooResultIcon(url) {

      const src =
        flibidooFavicon(url);


      return src
        ? `
          <img
            class="result-site-icon"
            src="${src}"
            alt=""
            loading="lazy"
            referrerpolicy="no-referrer"
          >
        `
        : '';
    }

  </script>


  <!-- AUTOCOMPLETE -->

  <script id="flibidoo-tiago-autocomplete">

    (() => {

      const SUGGEST_URL =
        'https://search.tiago.zip/suggest';


      const inputs =
        [
          ...document.querySelectorAll(
            '#q, #resultsQ'
          )
        ];


      if(!inputs.length) return;


      const escValue =
        v =>
          String(v ?? '')
            .replace(
              /[&<>"']/g,
              c => ({
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#39;'
              }[c])
            );


      function setup(input) {

        const form =
          input.closest('form');


        if(!form) return;


        form.classList.add(
          'flibidoo-suggest-wrap'
        );

        form.style.position =
          'relative';

        form.style.zIndex =
          '100';


        const box =
          document.createElement(
            'div'
          );


        box.className =
          'flibidoo-suggestions';

        box.setAttribute(
          'role',
          'listbox'
        );

        box.hidden = true;


        form.appendChild(box);


        let timer = 0;
        let controller = null;
        let selected = -1;
        let items = [];


        function close() {

          box.hidden = true;
          box.innerHTML = '';

          selected = -1;
          items = [];
        }


        function updateActive() {

          box
            .querySelectorAll(
              '.flibidoo-suggestion'
            )
            .forEach(
              (btn,i) => {

                btn.classList.toggle(
                  'active',
                  i === selected
                );

                btn.setAttribute(
                  'aria-selected',
                  i === selected
                    ? 'true'
                    : 'false'
                );
              }
            );
        }


        function choose(query) {

          input.value = query;

          close();


          if(
            typeof form.requestSubmit ===
            'function'
          ) {

            form.requestSubmit();

          } else {

            form.dispatchEvent(
              new Event(
                'submit',
                {
                  bubbles:true,
                  cancelable:true
                }
              )
            );
          }
        }


        async function loadSuggestions() {

          const q =
            input.value.trim();


          if(q.length < 2) {

            close();

            return;
          }


          if(controller) {
            controller.abort();
          }


          controller =
            new AbortController();


          try {

            const url =
              `${SUGGEST_URL}?${
                new URLSearchParams({q})
              }`;


            const response =
              await fetch(
                url,
                {
                  method:'GET',
                  headers:{
                    Accept:
                      'application/json'
                  },
                  signal:
                    controller.signal,
                  cache:'no-store'
                }
              );


            if(!response.ok) {

              throw new Error(
                `Suggestions request failed: ${response.status}`
              );
            }


            const data =
              await response.json();


            const suggestions =
              Array.isArray(
                data.suggestions
              )
                ? data.suggestions
                : [];


            items =
              suggestions
                .filter(
                  x =>
                    x &&
                    typeof x.query ===
                      'string' &&
                    x.query.trim()
                )
                .slice(0,8);


            if(
              !items.length ||
              input.value.trim() !== q
            ) {

              close();

              return;
            }


            box.innerHTML =
              items
                .map(
                  (x,i) => {

                    const image =
                      x.entity &&
                      x.img
                        ? `
                          <img
                            src="${escValue(x.img)}"
                            alt=""
                            loading="lazy"
                            referrerpolicy="no-referrer"
                          >
                        `
                        : '';


                    const desc =
                      x.entity &&
                      x.desc
                        ? `
                          <small>
                            ${escValue(x.desc)}
                          </small>
                        `
                        : '';


                    return `
                      <button
                        class="flibidoo-suggestion"
                        type="button"
                        role="option"
                        aria-selected="false"
                        data-index="${i}"
                      >
                        ${image}

                        <span>
                          ${escValue(x.query)}
                          ${desc}
                        </span>

                      </button>
                    `;
                  }
                )
                .join('');


            box.hidden = false;

            selected = -1;


            box
              .querySelectorAll(
                '.flibidoo-suggestion'
              )
              .forEach(button => {

                button.addEventListener(
                  'mousedown',
                  event => {

                    event.preventDefault();


                    const item =
                      items[
                        Number(
                          button.dataset.index
                        )
                      ];


                    if(item) {
                      choose(
                        item.query
                      );
                    }
                  }
                );
              });


          } catch(error) {

            if(
              error?.name !==
              'AbortError'
            ) {
              close();
            }
          }
        }


        input.addEventListener(
          'input',
          () => {

            clearTimeout(timer);

            timer =
              setTimeout(
                loadSuggestions,
                120
              );
          }
        );


        input.addEventListener(
          'keydown',
          event => {

            if(event.key === 'Escape') {

              close();

              return;
            }


            if(
              box.hidden ||
              !items.length
            ) {
              return;
            }


            if(event.key === 'ArrowDown') {

              event.preventDefault();

              selected =
                Math.min(
                  selected + 1,
                  items.length - 1
                );

              updateActive();

            } else if(
              event.key === 'ArrowUp'
            ) {

              event.preventDefault();

              selected =
                Math.max(
                  selected - 1,
                  -1
                );

              updateActive();

            } else if(
              event.key === 'Enter' &&
              selected >= 0
            ) {

              event.preventDefault();

              choose(
                items[selected].query
              );
            }
          }
        );


        input.addEventListener(
          'focus',
          () => {

            if(
              input.value.trim().length >= 2
            ) {
              loadSuggestions();
            }
          }
        );


        document.addEventListener(
          'pointerdown',
          event => {

            if(
              !form.contains(event.target)
            ) {
              close();
            }
          }
        );
      }


      inputs.forEach(setup);

    })();

  </script>


  <!-- RICH RESULT DESCRIPTIONS -->

  <script id="flibidoo-rich-description">

    (() => {

      window.flibidooRichText =
        function(value) {

          let src =
            String(value ?? '');


          if(!src) return '';


          const ta =
            document.createElement(
              'textarea'
            );


          ta.innerHTML = src;

          src = ta.value;


          /*
            Remove dangerous HTML.
          */

          src =
            src
              .replace(
                /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi,
                ''
              )
              .replace(
                /<\s*(script|iframe|object|embed|form|input|button|textarea|select|style|link|meta|svg|math)[^>]*\/?>/gi,
                ''
              )
              .replace(
                /\s+on[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi,
                ''
              )
              .replace(
                /\s+(href|src)\s*=\s*(['"])\s*javascript:[\s\S]*?\2/gi,
                ''
              );


          /*
            Protect allowed HTML tags.
          */

          const allowed = [];


          src =
            src.replace(
              /<\/?(strong|b|em|i|u|s|del|mark|small|br|code|kbd|sub|sup|a)(?:\s+[^>]*)?>/gi,
              m => {

                const idx =
                  allowed.push(m) - 1;

                return `@@FLIBIDOO_TAG_${idx}@@`;
              }
            );


          src =
            src
              .replace(/</g,'&lt;')
              .replace(/>/g,'&gt;');


          /*
            Markdown links.
          */

          src =
            src.replace(
              /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
              '<a href="$2" rel="noopener noreferrer">$1</a>'
            );


          /*
            Inline formatting.
          */

          src =
            src.replace(
              /`([^`]+)`/g,
              '<code>$1</code>'
            );


          src =
            src.replace(
              /\*\*([^*]+)\*\*/g,
              '<strong>$1</strong>'
            );


          src =
            src.replace(
              /__([^_]+)__/g,
              '<strong>$1</strong>'
            );


          src =
            src.replace(
              /~~([^~]+)~~/g,
              '<del>$1</del>'
            );


          src =
            src.replace(
              /(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;])/g,
              '$1<em>$2</em>'
            );


          src =
            src.replace(
              /(^|[\s(])_([^_\n]+)_(?=$|[\s).,!?:;])/g,
              '$1<em>$2</em>'
            );


          src =
            src.replace(
              /^#{1,6}\s+(.+)$/gm,
              '<strong>$1</strong>'
            );


          src =
            src.replace(
              /^\s*[-*]\s+(.+)$/gm,
              '• $1'
            );


          /*
            Restore safe HTML.
          */

          src =
            src.replace(
              /@@FLIBIDOO_TAG_(\d+)@@/g,
              (_,i) =>
                allowed[Number(i)] || ''
            );


          /*
            Preserve line breaks.
          */

          return src.replace(
            /\r?\n/g,
            '<br>'
          );
        };

    })();

  </script>
