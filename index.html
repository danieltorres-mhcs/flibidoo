<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">

<title>FlibidooSearch</title>

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;

  --wotd:#ffb52e;
  --wotd-light:#ffe18a;
  --wotd-text:#ffe9a8;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

a{
  color:inherit;
}

button,
input{
  font-family:inherit;
}

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px;
}

.hidden{
  display:none!important;
}


/* =========================================================
   HOME
   ========================================================= */

#home.home{
  width:100%;
  height:100vh;
  min-height:100vh;
  margin:0;
  padding:24px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.home-inner{
  width:min(100%,760px);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.hero-logo{
  width:min(300px,65vw);
  height:auto;
  display:block;
  margin:0 auto 18px;
  object-fit:contain;

  /*
   * Soft fade around the edges of the transparent logo.
   */
  filter:
    drop-shadow(0 8px 24px rgba(0,0,0,.18));
}

.home-title{
  text-align:center;
  font-size:clamp(38px,5vw,58px);
  line-height:1;
  margin:0 0 30px;
  letter-spacing:-.055em;
  font-weight:500;
}

.home-title strong{
  font-weight:700;
}

.search-wrap{
  width:min(100%,680px);
}

form{
  display:flex;
  align-items:center;
  height:54px;

  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;

  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:
    0 0 0 2px rgba(205,184,209,.08);
}

input{
  min-width:0;
  flex:1;

  border:0;
  outline:0;

  background:transparent;
  color:var(--text);

  font-size:16px;
  padding:0 18px;
}

input::placeholder{
  color:#9e8da1;
}


/* =========================================================
   ARROW BUTTON
   ========================================================= */

.submit{
  height:38px;
  width:38px;

  margin-right:8px;

  border:1px solid var(--line);
  background:transparent;
  color:#766679;

  border-radius:50%;
  padding:0;

  display:grid;
  place-items:center;

  cursor:pointer;

  transition:
    color .15s ease,
    border-color .15s ease,
    transform .1s ease;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
}

.submit:active{
  transform:scale(.94);
}

.submit-icon{
  width:19px;
  height:19px;
  display:block;
  fill:currentColor;
}


/* =========================================================
   HOME LINKS
   ========================================================= */

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;

  gap:18px;

  margin-top:20px;

  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;

  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

.confederacy-credit img{
  width:18px;
  height:18px;

  display:block;
  object-fit:contain;

  flex:0 0 18px;

  border-radius:4px;
}


/* =========================================================
   RESULTS
   ========================================================= */

main{
  flex:1;
}

.results{
  padding:30px 12px 70px;
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;

  min-height:44px;

  border-bottom:1px solid var(--line2);

  padding-bottom:14px;
  margin-bottom:14px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;

  text-decoration:none;
  color:inherit;

  white-space:nowrap;
}

.results-brand img{
  width:28px;
  height:28px;

  object-fit:contain;
  display:block;
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

.results-search{
  width:min(100%,680px);
  margin:0 0 28px;
}

.results-search form{
  height:48px;
}

.results-search .submit{
  width:34px;
  height:34px;
  margin-right:6px;
}

.results-search .submit-icon{
  width:17px;
  height:17px;
}


/* =========================================================
   SEARCH TYPES
   ========================================================= */

.search-types{
  display:flex;
  align-items:flex-end;

  gap:0;

  margin:8px 0 18px;

  border-bottom:1px solid rgba(255,255,255,.12);

  height:36px;
}

.search-type{
  position:relative;

  appearance:none;
  border:0;
  background:transparent;

  color:rgba(255,255,255,.62);

  font:inherit;
  font-size:13px;

  line-height:20px;

  padding:0 12px 10px;
  margin:0;

  border-radius:0;

  cursor:pointer;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";

  position:absolute;

  left:10px;
  right:10px;
  bottom:-1px;

  height:2px;

  border-radius:2px 2px 0 0;

  background:currentColor;
}


/* =========================================================
   RESULTS LAYOUT
   ========================================================= */

.results-layout{
  display:grid;

  grid-template-columns:minmax(0,1fr) 330px;

  gap:42px;

  align-items:start;
}


/* =========================================================
   WEB RESULTS
   ========================================================= */

.result{
  padding:0 0 26px;
  margin-bottom:26px;

  border-bottom:1px solid var(--line2);
}

.result-url{
  font-size:13px;
  color:var(--url);

  margin-bottom:7px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result-main{
  display:flex;
  gap:18px;
  align-items:flex-start;
}

.result-content{
  min-width:0;
  flex:1;
}

.result-title{
  display:flex;
  align-items:center;

  min-width:0;

  gap:8px;

  margin:0 0 7px;
}

.result-favicon{
  width:18px;
  height:18px;

  flex:0 0 18px;

  object-fit:contain;

  border-radius:3px;
}

.result h2{
  min-width:0;

  font-size:20px;
  line-height:1.25;

  margin:0;

  font-weight:500;
  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.snippet{
  font-size:14px;
  line-height:1.6;

  color:var(--result);

  margin:0;

  max-width:760px;
}

.snippet strong{
  font-weight:700;
}

.snippet em{
  font-style:italic;
}

.snippet u{
  text-decoration:underline;
}

.snippet mark{
  background:rgba(255,181,46,.22);
  color:inherit;
  padding:0 2px;
  border-radius:2px;
}

.result-meta{
  font-size:12px;
  color:var(--muted);

  margin-top:7px;
}


/* =========================================================
   RESULT THUMBNAILS
   ========================================================= */

.result-thumbnail-wrap{
  width:112px;
  flex:0 0 112px;
}

.result-thumbnail{
  width:112px;
  height:78px;

  display:block;

  object-fit:cover;

  border:1px solid var(--line2);
  border-radius:7px;

  background:rgba(255,255,255,.025);
}

.result-thumbnail.favicon-fallback{
  object-fit:contain;
  padding:24px;

  background:rgba(255,255,255,.025);
}


/* =========================================================
   IMAGE RESULTS
   ========================================================= */

.image-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-result img{
  display:block;

  width:100%;
  aspect-ratio:4/3;

  object-fit:cover;

  border:1px solid var(--line2);

  background:rgba(255,255,255,.02);

  border-radius:5px;
}

.image-result-title{
  font-size:14px;
  line-height:1.4;

  margin-top:9px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);

  margin-top:4px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================================================
   DICTIONARY
   ========================================================= */

.dictionary{
  border-left:1px solid var(--line2);

  padding-left:28px;

  max-height:70vh;

  overflow-y:auto;

  overscroll-behavior:contain;

  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;

  font-weight:500;

  letter-spacing:-.02em;

  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;

  color:var(--muted);

  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;

  border-bottom:1px solid var(--line2);
}

.dictionary-language,
.dictionary-label{
  font-size:12px;
  color:var(--muted);
}

.dictionary-language{
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;

  margin-bottom:12px;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  text-transform:uppercase;
  letter-spacing:.05em;

  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;

  color:var(--muted);

  margin-left:5px;
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;

  color:var(--result);

  margin:7px 0 0 14px;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;

  color:var(--muted);
}


/* =========================================================
   WORD OF THE DAY
   ========================================================= */

.wotd-panel{
  padding:0 0 22px;

  margin:0 0 22px;

  border-bottom:1px solid var(--line2);
}

.wotd-heading{
  display:flex;
  align-items:center;

  gap:8px;

  margin:0 0 8px;

  color:var(--wotd);

  font-size:13px;
  font-weight:600;
}

.wotd-word{
  color:#fff;

  font-size:22px;

  font-weight:600;

  line-height:1.25;

  margin:0 0 8px;
}

.wotd-definition{
  color:var(--wotd-text);

  font-size:13px;

  line-height:1.55;

  margin:0;
}

.wotd-example{
  color:rgba(255,233,168,.72);

  font-size:12px;

  line-height:1.55;

  margin:9px 0 0;
}

.wotd-status{
  color:var(--muted);

  font-size:13px;

  line-height:1.5;
}


/* =========================================================
   EMPTY / ERROR / PAGER
   ========================================================= */

.empty{
  padding:70px 0;

  color:var(--muted);

  text-align:center;
}

.error{
  min-height:120px;

  max-width:680px;

  margin:0;

  padding:28px 18px;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  border:1px solid var(--line2);

  color:var(--muted);

  font-size:14px;

  line-height:1.5;
}

.pager{
  display:flex;

  gap:8px;

  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);

  background:transparent;

  color:var(--text);

  border-radius:4px;

  padding:8px 12px;

  cursor:pointer;
}


/* =========================================================
   ABOUT
   ========================================================= */

.about-overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.62);

  display:grid;
  place-items:center;

  padding:24px;

  z-index:10000;
}

.about-overlay.hidden{
  display:none;
}

.about-card{
  position:relative;

  width:min(100%,560px);

  max-height:min(80vh,700px);

  overflow:auto;

  background:#24132a;

  border:1px solid var(--line);

  border-radius:14px;

  box-shadow:0 20px 60px rgba(0,0,0,.45);

  padding:30px;
}

.about-close{
  position:absolute;

  top:10px;
  right:10px;

  width:34px;
  height:34px;

  border:0;
  border-radius:50%;

  background:transparent;

  color:var(--muted);

  font-size:24px;
  line-height:1;

  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);

  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;

  font-size:25px;

  font-weight:500;
}

.about-card p{
  color:var(--result);

  line-height:1.7;

  font-size:14px;
}

.about-card a{
  color:var(--text);
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr;
  }

  .dictionary{
    order:-1;

    border-left:0;

    border-bottom:1px solid var(--line2);

    border-top:0;

    padding:0 0 26px;

    margin-bottom:26px;

    max-height:none;
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:22px 14px;
  }

  .result-thumbnail-wrap{
    width:92px;
    flex-basis:92px;
  }

  .result-thumbnail{
    width:92px;
    height:68px;
  }
}

@media(max-width:640px){

  .shell{
    width:100%;

    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:20px 16px;
  }

  .hero-logo{
    width:min(250px,70vw);

    margin-bottom:14px;
  }

  .home-title{
    font-size:38px;

    margin-bottom:24px;
  }

  form{
    height:50px;
  }

  .results{
    padding:22px 16px 60px;
  }

  .results-head{
    gap:12px;
  }

  .results-brand img{
    width:24px;
    height:24px;
  }

  .results-brand span{
    font-size:14px;
  }

  .results-query{
    font-size:13px;
  }

  .search-types{
    overflow-x:auto;

    scrollbar-width:none;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;

    font-size:12px;
  }

  .result-main{
    gap:12px;
  }

  .result-thumbnail-wrap{
    width:78px;
    flex-basis:78px;
  }

  .result-thumbnail{
    width:78px;
    height:60px;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr;
  }

  .result-thumbnail-wrap{
    display:none;
  }
}
</style>
</head>


<body>

<main>


<!-- =======================================================
     HOME
======================================================= -->

<section id="home" class="home shell">

  <div class="home-inner">

    <img
      class="hero-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="Flibidoo"
    >

    <h1 class="home-title">
      <em><strong>Flibidoo</strong></em>Search
    </h1>

    <div class="search-wrap">

      <form id="searchForm" role="search">

        <input
          id="q"
          name="q"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search the web"
          aria-label="Search the web"
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="Search"
        >

          <svg
            class="submit-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
            aria-hidden="true"
          >
            <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
          </svg>

        </button>

      </form>

      <div class="links">

        <button
          type="button"
          id="aboutButton"
        >
          About
        </button>

        <span class="confederacy-credit">

          with love from The Great Confederacy of E

          <img
            src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
            alt=""
          >

        </span>

      </div>

    </div>

  </div>

</section>


<!-- =======================================================
     RESULTS
======================================================= -->

<section id="results" class="results shell hidden">

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >

      <img
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt=""
      >

      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>

    </a>

    <div
      id="queryLabel"
      class="results-query"
    ></div>

    <div
      id="count"
      class="count"
    ></div>

  </div>


  <div class="results-search">

    <form
      id="resultsSearchForm"
      role="search"
    >

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >

        <svg
          class="submit-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>

      </button>

    </form>

  </div>


  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >
      Web
    </button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >
      Images
    </button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >
      News
    </button>

  </nav>


  <div class="results-layout">

    <div>

      <div id="resultList"></div>

      <div
        id="pager"
        class="pager"
      ></div>

    </div>


    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results"
    ></aside>

  </div>

</section>

</main>


<!-- =======================================================
     ABOUT
======================================================= -->

<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle"
>

  <div class="about-card">

    <button
      id="aboutClose"
      class="about-close"
      type="button"
      aria-label="Close About"
    >
      ×
    </button>

    <h2 id="aboutTitle">
      About
    </h2>

    <p>
      Welcome to FlibidooSearch.
    </p>

    <p>
      A small independent search interface built for the web.
    </p>

  </div>

</div>


<script>
/* =========================================================
   CONFIG
========================================================= */

const API_BASE =
  'https://working-filibidooo.daniel-torres-a95.workers.dev';


/* =========================================================
   ELEMENTS
========================================================= */

const form =

/* =========================================================
   STATE
========================================================= */

let currentQ = '';
let currentPage = 0;

/* =========================================================
   ESCAPE
========================================================= */

function esc(value = '') {

  return String(value).replace(
    /[&<>'"]/g,
    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[char])
  );

}


/* =========================================================
   URL ENCODING
========================================================= */

function safeURL(value) {

  if (!value) return '';

  try {

    const url =
      new URL(value);

    return url.href;

  } catch {

    return '';

  }

}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtonState(button,value) {

  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );

}


/* =========================================================
   SAFE RICH TEXT
=========================================================

   Supports:

   <strong>
   <b>
   <em>
   <i>
   <u>
   <mark>

   plus simple Markdown:

   **bold**
   *italic*
   _italic_
   __bold__

========================================================= */

function renderRichText(value = '') {

  let text =
    String(value);

  /*
   * Escape all HTML first.
   */
  text =
    esc(text);

  /*
   * Markdown bold.
   */
  text =
    text.replace(
      /\*\*(.+?)\*\*/g,
      '<strong>$1</strong>'
    );

  text =
    text.replace(
      /__(.+?)__/g,
      '<strong>$1</strong>'
    );

  /*
   * Markdown italic.
   */
  text =
    text.replace(
      /(^|[^\*])\*([^*\n]+)\*(?!\*)/g,
      '$1<em>$2</em>'
    );

  text =
    text.replace(
      /(^|[^_])_([^_\n]+)_(?!_)/g,
      '$1<em>$2</em>'
    );

  /*
   * Basic HTML tags that the API may already
   * have represented literally.
   *
   * Because the original HTML was escaped above,
   * only these explicitly supported tags are restored.
   */
  text =
    text.replace(
      /&lt;(strong|b)&gt;([\s\S]*?)&lt;\/\1&gt;/gi,
      '<strong>$2</strong>'
    );

  text =
    text.replace(
      /&lt;(em|i)&gt;([\s\S]*?)&lt;\/\1&gt;/gi,
      '<em>$2</em>'
    );

  text =
    text.replace(
      /&lt;u&gt;([\s\S]*?)&lt;\/u&gt;/gi,
      '<u>$1</u>'
    );

  text =
    text.replace(
      /&lt;mark&gt;([\s\S]*?)&lt;\/mark&gt;/gi,
      '<mark>$1</mark>'
    );

  /*
   * Preserve line breaks.
   */
  text =
    text.replace(
      /\r?\n/g,
      '<br>'
    );

  return text;
}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeWord(value = '') {

  return String(value)
    .toLowerCase()
    .trim()
    .replace(/[’']/g,'')
    .replace(/\s+/g,' ');

}


/* =========================================================
   IS WOTD QUERY?
========================================================= */

function isWotdQuery(query = '') {

  const normalized =
    normalizeWord(query);

  if (!normalized) return false;

  return (
    normalized === 'wotd' ||
    normalized.includes('word of the day') ||
    normalized.includes('words of the day') ||
    normalized.includes('what is the word of the day') ||
    normalized.includes('whats the word of the day') ||
    normalized.includes('what is todays word') ||
    normalized.includes("what's today's word") ||
    normalized.includes('todays word of the day')
  );

}


/* =========================================================
   API JSON
========================================================= */

async function apiJSON(
  path,
  options = {}
) {

  const response =
    await fetch(
      `${API_BASE}${path}`,
      {
        ...options,
        headers:{
          Accept:'application/json',
          ...(options.headers || {})
        }
      }
    );

  const text =
    await response.text();

  let data;

  try {

    data =
      text
        ? JSON.parse(text)
        : {};

  } catch {

    throw new Error(
      `Search endpoint returned ${response.status}: ${text.slice(0,120)}`
    );

  }

  if (!response.ok) {

    throw new Error(
      data?.error ||
      `Request failed (${response.status}).`
    );

  }

  return data;

}


/* =========================================================
   FETCH DICTIONARY
========================================================= */

async function fetchDictionary(word) {

  try {

    const data =
      await apiJSON(
        `/api/dictionary?word=${encodeURIComponent(word)}`
      );

    const entries =
      Array.isArray(data?.entries)
        ? data.entries
        : [];

    return entries;

  } catch {

    return [];

  }

}


/* =========================================================
   DICTIONARY FIELD HELPERS
========================================================= */

function entryLanguage(entry) {

  return String(
    entry?.language ||
    entry?.lang ||
    entry?.languageCode ||
    entry?.locale ||
    ''
  );

}


function entryPartOfSpeech(entry) {

  return String(
    entry?.partOfSpeech ||
    entry?.part_of_speech ||
    entry?.pos ||
    ''
  );

}


function getDefinitions(entry) {

  const definitions =
    entry?.definitions ||
    entry?.meanings ||
    entry?.senses ||
    [];

  if (!Array.isArray(definitions)) {
    return [];
  }

  return definitions;

}


function definitionText(item) {

  if (typeof item === 'string') {
    return item;
  }

  return (
    item?.definition ||
    item?.meaning ||
    item?.gloss ||
    item?.text ||
    ''
  );

}


function definitionExample(item) {

  if (typeof item === 'string') {
    return '';
  }

  return (
    item?.example ||
    item?.examples?.[0] ||
    item?.usage ||
    ''
  );

}


/* =========================================================
   DICTIONARY HTML
========================================================= */

function renderDictionary(
  word,
  entries,
  wotdData = null
) {

  /*
   * No entries = completely hide sidebar.
   */
  if (
    !Array.isArray(entries) ||
    !entries.length
  ) {

    dictionary.innerHTML = '';

    dictionary.classList.add('hidden');

    return;

  }

  /*
   * English first.
   */
  entries =
    [...entries].sort(
      (a,b) => {

        const al =
          entryLanguage(a).toLowerCase();

        const bl =
          entryLanguage(b).toLowerCase();

        const ae =
          al === 'en' ||
          al === 'eng' ||
          al.includes('english') ||
          al.startsWith('en-');

        const be =
          bl === 'en' ||
          bl === 'eng' ||
          bl.includes('english') ||
          bl.startsWith('en-');

        if (ae && !be) return -1;

        if (!ae && be) return 1;

        return 0;

      }
    );


  let html = '';


  /*
   * WOTD panel.
   */
  if (
    wotdData?.available &&
    wotdData?.word
  ) {

    const englishEntry =
      entries.find(entry => {

        const lang =
          entryLanguage(entry).toLowerCase();

        return (
          lang === 'en' ||
          lang === 'eng' ||
          lang.includes('english') ||
          lang.startsWith('en-')
        );

      }) || entries[0];

    const definitions =
      getDefinitions(englishEntry);

    const first =
      definitions[0];

    const definition =
      definitionText(first);

    const example =
      definitionExample(first);

    html += `
      <section class="wotd-panel">

        <div class="wotd-heading">
          Word of the Day!
        </div>

        <div class="wotd-word">
          ${esc(wotdData.word)}
        </div>

        ${
          definition
            ? `
              <p class="wotd-definition">
                ${renderRichText(definition)}
              </p>
            `
            : ''
        }

        ${
          example
            ? `
              <p class="wotd-example">
                “${renderRichText(example)}”
              </p>
            `
            : ''
        }

      </section>
    `;

  }


  html += `
    <h2 class="dictionary-title">
      Dictionary
    </h2>

    <div class="dictionary-word">
      ${esc(word)}
    </div>
  `;


  /*
   * Only show a reasonable number of entries.
   */
  entries
    .slice(0,10)
    .forEach(entry => {

      const language =
        entryLanguage(entry);

      const pos =
        entryPartOfSpeech(entry);

      const definitions =
        getDefinitions(entry);

      if (!definitions.length) {
        return;
      }

      html += `
        <section class="dictionary-entry">

          ${
            language
              ? `
                <div class="dictionary-language">
                  ${esc(language)}
                </div>
              `
              : ''
          }

          ${
            pos
              ? `
                <div class="dictionary-pos">
                  ${esc(pos)}
                </div>
              `
              : ''
          }

          <div class="dictionary-senses">

            <div class="dictionary-label">
              Definitions
            </div>

            <ol class="dictionary-list">
      `;

      definitions
        .slice(0,8)
        .forEach(def => {

          const definition =
            definitionText(def);

          const example =
            definitionExample(def);

          if (!definition) {
            return;
          }

          html += `
            <li class="dictionary-sense">

              <div class="dictionary-definition">
                ${renderRichText(definition)}
              </div>

              ${
                example
                  ? `
                    <div class="dictionary-example">
                      “${renderRichText(example)}”
                    </div>
                  `
                  : ''
              }

            </li>
          `;

        });

      html += `
            </ol>

          </div>

        </section>
      `;

    });


  dictionary.innerHTML =
    html;

  dictionary.classList.remove(
    'hidden'
  );

}


/* =========================================================
   LOAD WOTD + DICTIONARY
========================================================= */

async function loadSidebar(
  query
) {

  /*
   * WOTD request is always made.
   *
   * This allows:
   * "happy"
   *
   * to detect that happy is today's WOTD.
   */
  let wotdData = null;

  try {

    wotdData =
      await apiJSON(
        '/api/wotd'
      );

  } catch {

    wotdData = null;

  }


  /*
   * If the user explicitly searches WOTD,
   * use the WOTD word as the dictionary word.
   */
  const explicitWotd =
    isWotdQuery(query);

  let dictionaryWord =
    explicitWotd
      ? wotdData?.word || ''
      : query;


  /*
   * If the WOTD request worked and the searched
   * word itself is today's WOTD, show WOTD panel.
   */
  let matchedWotd = null;

  if (
    wotdData?.available &&
    wotdData?.word
  ) {

    if (
      normalizeWord(dictionaryWord) ===
      normalizeWord(wotdData.word)
    ) {

      matchedWotd =
        wotdData;

    }

  }


  /*
   * Explicit WOTD searches should show WOTD.
   */
  if (
    explicitWotd &&
    wotdData?.available
  ) {

    matchedWotd =
      wotdData;

  }


  /*
   * If there isn't a dictionary word,
   * there is nothing to display.
   */
  if (!dictionaryWord) {

    dictionary.innerHTML = '';

    dictionary.classList.add('hidden');

    return;

  }


  const entries =
    await fetchDictionary(
      dictionaryWord
    );


  /*
   * No dictionary entry:
   * hide sidebar completely.
   */
  if (!entries.length) {

    dictionary.innerHTML = '';

    dictionary.classList.add('hidden');

    return;

  }


  renderDictionary(
    dictionaryWord,
    entries,
    matchedWotd
  );

}


/* =========================================================
   RENDER SEARCH RESULTS
========================================================= */

function render(data) {

  home.classList.add('hidden');

  results.classList.remove('hidden');

  currentType =
    data.type || currentType;

  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';

  let a = [];

  if (
    currentType === 'web'
  ) {

    a =
      Array.isArray(
        data.results
      )
        ? data.results
        : [];

  } else if (
    currentType === 'images' ||
    currentType === 'news'
  ) {

    a =
      Array.isArray(
        data.results
      )
        ? data.results
        : [];

  }

  count.textContent =
    a.length
      ? `${a.length} results`
      : '';

  resultsInput.value =
    data.query || '';

  list.innerHTML = '';

  pager.innerHTML = '';


  /*
   * Update active tab.
   */
  document
    .querySelectorAll('.search-type')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.type ===
          currentType
      );

    });


  if (!a.length) {

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    /*
     * Still attempt dictionary/WOTD.
     */
    loadSidebar(
      data.query || currentQ
    );

    return;

  }


  /* =======================================================
     IMAGES
  ======================================================= */

  if (
    currentType === 'images'
  ) {

    const grid =
      document.createElement('div');

    grid.className =
      'image-grid';


    a.forEach(r => {

      const u =
        safeURL(
          r.url ||
          r.properties?.url ||
          ''
        );

      const img =
        safeURL(
          r.thumbnail ||
          r.properties?.url ||
          r.image ||
          ''
        );

      if (!img) {
        return;
      }

      const el =
        document.createElement('article');

      el.className =
        'image-result';

      el.innerHTML = `
        <a
          href="${esc(u || img)}"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            src="${esc(img)}"
            alt="${esc(r.title || '')}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >

        </a>

        <div class="image-result-title">
          ${esc(r.title || u)}
        </div>

        <div class="image-result-source">
          ${esc(
            r.source ||
            r.meta_url?.hostname ||
            ''
          )}
        </div>
      `;

      grid.appendChild(el);

    });


    if (grid.children.length) {

      list.appendChild(grid);

    } else {

      list.innerHTML =
        '<div class="empty">No images found.</div>';

    }

  }


  /* =======================================================
     NEWS
  ======================================================= */

  else if (
    currentType === 'news'
  ) {

    a.forEach(r => {

      const el =
        document.createElement('article');

      el.className =
        'result';


      const u =
        safeURL(r.url || '');

      const host =
        r.meta_url?.hostname ||
        '';

      const title =
        r.title ||
        u;

      const desc =
        r.description ||
        r.content ||
        '';

      const age =
        r.age ||
        r.publishedDate ||
        r.published ||
        '';


      const favicon =
        safeURL(
          r.favicon ||
          (
            host
              ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`
              : ''
          )
        );


      el.innerHTML = `

        <div class="result-url">
          ${esc(host || u)}
        </div>

        <div class="result-main">

          <div class="result-content">

            <div class="result-title">

              ${
                favicon
                  ? `
                    <img
                      class="result-favicon"
                      src="${esc(favicon)}"
                      alt=""
                      loading="lazy"
                      referrerpolicy="no-referrer"
                    >
                  `
                  : ''
              }

              <h2>
                <a
                  href="${esc(u)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${esc(title)}
                </a>
              </h2>

            </div>

            ${
              desc
                ? `
                  <p class="snippet">
                    ${renderRichText(desc)}
                  </p>
                `
                : ''
            }

            ${
              age
                ? `
                  <div class="result-meta">
                    ${esc(age)}
                  </div>
                `
                : ''
            }

          </div>

        </div>
      `;

      list.appendChild(el);

    });

  }


  /* =======================================================
     WEB
  ======================================================= */

  else {

    a.forEach(r => {

      const el =
        document.createElement('article');

      el.className =
        'result';


      const u =
        safeURL(r.url || '');

      const host =
        r.meta_url?.hostname ||
        getHostname(u);


      const title =
        r.title ||
        u;


      const desc =
        r.description ||
        r.content ||
        '';


      const age =
        r.age ||
        r.publishedDate ||
        '';


      /*
       * Worker provides displayImage:
       *
       * OG/thumbnail first
       * favicon fallback
       */
      const thumbnail =
        safeURL(
          r.thumbnail ||
          r.image ||
          r.properties?.thumbnail ||
          r.properties?.image ||
          ''
        );


      const favicon =
        safeURL(
          r.favicon ||
          (
            host
              ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`
              : ''
          )
        );


      const image =
        thumbnail ||
        favicon;


      el.innerHTML = `

        <div class="result-url">
          ${esc(host || u)}
        </div>

        <div class="result-main">

          <div class="result-content">

            <div class="result-title">

              ${
                favicon
                  ? `
                    <img
                      class="result-favicon"
                      src="${esc(favicon)}"
                      alt=""
                      loading="lazy"
                      referrerpolicy="no-referrer"
                    >
                  `
                  : ''
              }

              <h2>

                <a
                  href="${esc(u)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${esc(title)}
                </a>

              </h2>

            </div>

            ${
              desc
                ? `
                  <p class="snippet">
                    ${renderRichText(desc)}
                  </p>
                `
                : ''
            }

            ${
              age
                ? `
                  <div class="result-meta">
                    ${esc(age)}
                  </div>
                `
                : ''
            }

          </div>


          ${
            image
              ? `
                <a
                  class="result-thumbnail-wrap"
                  href="${esc(u)}"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="${esc(title)}"
                >

                  <img
                    class="result-thumbnail ${thumbnail ? '' : 'favicon-fallback'}"
                    src="${esc(image)}"
                    alt=""
                    loading="lazy"
                    referrerpolicy="no-referrer"
                  >

                </a>
              `
              : ''
          }

        </div>
      `;


      list.appendChild(el);

    });

  }


  /* =======================================================
     PAGINATION
  ======================================================= */

  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if (currentPage > 0) {

    const button =
      document.createElement('button');

    button.textContent =
      'Previous';

    button.onclick =
      () => search(
        currentQ,
        currentPage - 1,
        currentType
      );

    pager.appendChild(button);

  }


  if (more) {

    const button =
      document.createElement('button');

    button.textContent =
      'Next';

    button.onclick =
      () => search(
        currentQ,
        currentPage + 1,
        currentType
      );

    pager.appendChild(button);

  }


  /*
   * URL uses proper percent encoding.
   */
  const encodedQuery =
    encodeURIComponent(
      data.query || currentQ
    );

  const encodedType =
    encodeURIComponent(
      currentType
    );

  history.replaceState(
    {},
    '',
    `/?q=${encodedQuery}&type=${encodedType}` +
    (
      currentPage
        ? `&page=${currentPage}`
        : ''
    )
  );


  /*
   * Load dictionary / WOTD independently.
   */
  loadSidebar(
    data.query || currentQ
  );

}


/* =========================================================
   HOSTNAME
========================================================= */

function getHostname(url) {

  if (!url) return '';

  try {

    return new URL(url).hostname;

  } catch {

    return '';

  }

}


/* =========================================================
   SEARCH
========================================================= */

async function search(
  q,
  page = 0,
  type = currentType
) {

  q =
    String(q || '').trim();

  if (!q) {
    return;
  }


  currentQ =
    q;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    type;


  document.title =
    `${q} - FlibidooSearch`;


  input.value =
    q;

  resultsInput.value =
    q;


  home.classList.add('hidden');

  results.classList.remove('hidden');


  list.innerHTML =
    '<div class="empty">Searching…</div>';

  count.textContent =
    '';

  label.textContent =
    `Results for “${q}”`;

  pager.innerHTML =
    '';


  /*
   * Keep dictionary from displaying stale results
   * while the new search loads.
   */
  dictionary.innerHTML =
    '';

  dictionary.classList.add(
    'hidden'
  );


  try {

    const query =
      encodeURIComponent(q);

    const encodedType =
      encodeURIComponent(type);

    const data =
      await apiJSON(
        `/api/search?q=${query}&type=${encodedType}&page=${currentPage}`
      );

    data.type =
      type;

    data.query =
      data.query || q;

    render(data);

  } catch (error) {

    console.error(
      'Search error:',
      error
    );

    list.innerHTML = `
      <div class="error">
        ${esc(
          error.message ||
          'Search failed. Please try again.'
        )}
      </div>
    `;

    /*
     * Dictionary may still work even if search
     * itself fails.
     */
    loadSidebar(q);

  }

}


/* =========================================================
   HOME SEARCH
========================================================= */

form.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const q =
      input.value.trim();

    if (!q) {
      return;
    }

    /*
     * Full percent encoding.
     */
    location.href =
      `/?q=${encodeURIComponent(q)}` +
      `&type=web&page=0`;

  }
);


/* =========================================================
   RESULTS SEARCH
========================================================= */

resultsForm.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const q =
      resultsInput.value.trim();

    if (!q) {
      return;
    }

    search(
      q,
      0,
      currentType
    );

  }
);


/* =========================================================
   CATEGORY SWITCHING
========================================================= */

document
  .querySelectorAll('.search-type')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        const q =
          resultsInput.value.trim() ||
          currentQ;

        if (!q) {
          return;
        }

        search(
          q,
          0,
          button.dataset.type
        );

      }
    );

  });


/* =========================================================
   BUTTON COLOR
========================================================= */

input.addEventListener(
  'input',
  () => {

    updateButtonState(
      submitButton,
      input.value
    );

  }
);

resultsInput.addEventListener(
  'input',
  () => {

    updateButtonState(
      resultsSubmitButton,
      resultsInput.value
    );

  }
);


/* =========================================================
   ABOUT
========================================================= */

const aboutOverlay =
  document.querySelector(
    '#aboutOverlay'
  );

const aboutButton =
  document.querySelector(
    '#aboutButton'
  );

const aboutClose =
  document.querySelector(
    '#aboutClose'
  );


aboutButton.onclick =
  () => {

    aboutOverlay.classList.remove(
      'hidden'
    );

  };


aboutClose.onclick =
  () => {

    aboutOverlay.classList.add(
      'hidden'
    );

  };


aboutOverlay.addEventListener(
  'click',
  event => {

    if (
      event.target ===
      aboutOverlay
    ) {

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


document.addEventListener(
  'keydown',
  event => {

    if (
      event.key === 'Escape'
    ) {

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


/* =========================================================
   INITIAL URL
========================================================= */

const params =
  new URLSearchParams(
    location.search
  );

const initialQuery =
  params.get('q');

const initialType =
  params.get('type');

const initialPage =
  Number(
    params.get('page') || 0
  );


if (initialQuery) {

  search(
    initialQuery,
    initialPage,
    ['web','images','news'].includes(
      initialType
    )
      ? initialType
      : 'web'
  );

} else {

  /*
   * Make sure the initial arrow has the correct state.
   */
  updateButtonState(
    submitButton,
    input.value
  );

  updateButtonState(
    resultsSubmitButton,
    resultsInput.value
  );

}
</script>

</body>
</html>
