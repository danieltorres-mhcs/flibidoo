<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d0c22">
<title>FlibidooSearch</title>

<link rel="icon"
  href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG">

<style>
:root{
  --bg:#1d0c22;
  --text:#f5eef7;
  --muted:#b9aabb;
  --line:#5a4560;
  --line2:#39283d;
  --result:#e7dce9;
  --url:#b8a2bc;
  --focus:#cdb8d1;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

a{
  color:inherit;
}

.hidden{
  display:none!important;
}

/* =========================
   HOME
========================= */

#home.home{
  width:100%;
  height:100vh;
  min-height:100vh;
  margin:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.search-wrap{
  width:min(100%,680px);
}

.hero-logo{
  display:block;
  width:min(180px,42vw);
  height:auto;
  max-height:100px;
  object-fit:contain;
  margin:0 auto 16px;

  /* subtle fade around the image edges */
  -webkit-mask-image:
    radial-gradient(
      ellipse at center,
      #000 62%,
      rgba(0,0,0,.96) 72%,
      transparent 100%
    );
  mask-image:
    radial-gradient(
      ellipse at center,
      #000 62%,
      rgba(0,0,0,.96) 72%,
      transparent 100%
    );
}

h1{
  font-size:clamp(34px,5vw,54px);
  line-height:1;
  margin:0 0 30px;
  text-align:center;
  letter-spacing:-.055em;
  font-weight:500;
}

h1 strong{
  font-weight:700;
}

.search-wrap form{
  display:flex;
  align-items:center;
  width:100%;
  height:54px;
  border:1px solid var(--line);
  border-radius:28px;
  background:transparent;
  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

form:focus-within{
  border-color:var(--focus);
  box-shadow:0 0 0 2px rgba(205,184,209,.08);
}

input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0 16px;
}

input::placeholder{
  color:#9e8da1;
}

/* Arrow button */

.submit{
  height:38px;
  width:38px;
  margin-right:8px;
  border:1px solid var(--line);
  background:transparent;
  color:#766679;
  border-radius:50%;
  padding:9px;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 38px;
  transition:
    color .15s ease,
    border-color .15s ease,
    background .15s ease;
}

.submit.has-input{
  color:var(--text);
  border-color:var(--focus);
}

.submit:hover{
  border-color:var(--focus);
  color:var(--text);
  background:rgba(255,255,255,.035);
}

.submit-icon{
  width:100%;
  height:100%;
  display:block;
  fill:currentColor;
}

.links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:20px;
  color:var(--muted);
  font-size:13px;
}

.links button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  padding:0;
}

.links button:hover{
  color:var(--text);
}

.confederacy-credit{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}

.confederacy-credit img{
  width:18px;
  height:18px;
  display:block;
  object-fit:contain;
  flex:0 0 18px;
  border-radius:4px;
}

/* =========================
   RESULTS
========================= */

main{
  flex:1;
}

.shell{
  width:min(100% - 40px,1120px);
  margin:0 auto;
  padding-left:12px;
  padding-right:12px;
}

.results{
  padding:30px 12px 70px;
}

.results-head{
  display:flex;
  align-items:center;
  gap:18px;
  min-height:44px;
  border-bottom:1px solid var(--line2);
  padding-bottom:14px;
  margin-bottom:14px;
}

.results-brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:inherit;
  white-space:nowrap;
}

.results-brand img{
  width:30px;
  height:30px;
  object-fit:contain;
  display:block;

  -webkit-mask-image:
    radial-gradient(
      ellipse at center,
      #000 60%,
      rgba(0,0,0,.9) 75%,
      transparent 100%
    );
  mask-image:
    radial-gradient(
      ellipse at center,
      #000 60%,
      rgba(0,0,0,.9) 75%,
      transparent 100%
    );
}

.results-brand span{
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}

.results-query{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}

.count{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}

.results-search{
  width:min(100%,680px);
  margin:0 0 28px;
}

.results-search form{
  display:flex;
  align-items:center;
  height:48px;
  border:1px solid var(--line);
  border-radius:24px;
  background:transparent;
  transition:border-color .15s ease,box-shadow .15s ease;
}

.results-search .submit{
  width:34px;
  height:34px;
  flex:0 0 34px;
  padding:8px;
  margin-right:6px;
}

/* =========================
   SEARCH TYPES
========================= */

.search-types{
  display:flex;
  align-items:flex-end;
  gap:0;
  margin:8px 0 18px;
  border-bottom:1px solid rgba(255,255,255,.12);
  height:36px;
}

.search-type{
  position:relative;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font:inherit;
  font-size:13px;
  line-height:20px;
  padding:0 12px 10px;
  margin:0;
  border-radius:0;
  cursor:pointer;
}

.search-type:hover,
.search-type.active{
  color:#fff;
  background:transparent;
}

.search-type.active::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:-1px;
  height:2px;
  border-radius:2px 2px 0 0;
  background:currentColor;
}

/* =========================
   RESULTS LAYOUT
========================= */

.results-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:42px;
  align-items:start;
}

.result{
  padding:0 0 26px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line2);
}

/* Web result favicon + URL */

.result-url-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  margin-bottom:7px;
}

.result-favicon{
  width:18px;
  height:18px;
  flex:0 0 18px;
  object-fit:contain;
  border-radius:4px;
  background:rgba(255,255,255,.04);
}

.result-url{
  font-size:13px;
  color:var(--url);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}

.result h2{
  font-size:20px;
  line-height:1.25;
  margin:0 0 7px;
  font-weight:500;
  letter-spacing:-.02em;
}

.result h2 a{
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.result-content{
  display:flex;
  gap:16px;
  align-items:flex-start;
}

.result-text{
  min-width:0;
  flex:1;
}

.snippet{
  font-size:14px;
  line-height:1.6;
  color:var(--result);
  margin:0;
  max-width:760px;
}

.result-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:7px;
}

/* Tiago thumbnail / fallback favicon */

.result-thumbnail{
  width:120px;
  height:80px;
  object-fit:cover;
  flex:0 0 120px;
  border:1px solid var(--line2);
  border-radius:6px;
  background:rgba(255,255,255,.025);
}

/* =========================
   IMAGES
========================= */

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px 22px;
}

.image-result{
  min-width:0;
  position:relative;
}

.image-result a{
  display:block;
  text-decoration:none;
}

.image-result img{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border:1px solid var(--line2);
  background:rgba(255,255,255,.02);
}

.image-result-title{
  font-size:14px;
  line-height:1.4;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.image-result-source{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================
   MAP
========================= */

.map-result{
  padding:0 0 22px;
  margin-bottom:22px;
  border-bottom:1px solid var(--line2);
}

.map-result-title{
  font-size:18px;
  line-height:1.35;
  margin:0 0 6px;
  font-weight:500;
}

.map-result-title a{
  text-decoration:none;
}

.map-result-title a:hover{
  text-decoration:underline;
}

.map-result-address{
  font-size:14px;
  line-height:1.55;
  color:var(--result);
}

.map-result-coords{
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
}

/* =========================
   DICTIONARY
========================= */

.dictionary{
  border-left:1px solid var(--line2);
  padding-left:28px;
  max-height:72vh;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}

.dictionary-title{
  font-size:22px;
  font-weight:500;
  letter-spacing:-.02em;
  margin:0 0 5px;
}

.dictionary-word{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px;
}

.dictionary-entry{
  padding:0 0 24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line2);
}

.dictionary-language{
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
}

.dictionary-pos{
  font-size:15px;
  margin-bottom:12px;
  font-weight:600;
}

.dictionary-senses,
.dictionary-relations,
.dictionary-translations{
  margin-top:14px;
}

.dictionary-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:7px;
}

.dictionary-list{
  margin:0;
  padding-left:18px;
}

.dictionary-list li{
  margin:0 0 7px;
}

.dictionary-sense{
  margin:0 0 15px;
}

.dictionary-definition{
  font-size:14px;
  line-height:1.55;
}

.dictionary-tags{
  font-size:12px;
  color:var(--muted);
  margin-left:5px;
}

.dictionary-example,
.dictionary-quote{
  font-size:13px;
  line-height:1.5;
  color:var(--result);
  margin:7px 0 0 14px;
  font-style:italic;
}

.dictionary-source,
.dictionary-loading,
.dictionary-empty{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
}

.dictionary-source{
  margin-top:18px;
}

/* =========================
   EMPTY / ERROR
========================= */

.empty{
  padding:70px 0;
  color:var(--muted);
  text-align:center;
}

.error{
  min-height:120px;
  max-width:680px;
  margin:0;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line2);
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

/* =========================
   PAGER
========================= */

.pager{
  display:flex;
  gap:8px;
  padding-top:10px;
}

.pager button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  border-radius:4px;
  padding:8px 12px;
  cursor:pointer;
}

.pager button:hover{
  border-color:var(--focus);
}

/* =========================
   ABOUT
========================= */

.about-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:grid;
  place-items:center;
  padding:24px;
  z-index:10000;
}

.about-overlay.hidden{
  display:none;
}

.about-card{
  position:relative;
  width:min(100%,560px);
  max-height:min(80vh,700px);
  overflow:auto;
  background:#24132a;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  padding:30px;
}

.about-close{
  position:absolute;
  top:10px;
  right:10px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer;
}

.about-close:hover{
  background:rgba(255,255,255,.08);
  color:var(--text);
}

.about-card h2{
  margin:0 38px 16px 0;
  font-size:25px;
  font-weight:500;
}

.about-card p{
  color:var(--result);
  line-height:1.7;
  font-size:14px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:860px){

  .results-layout{
    grid-template-columns:1fr;
  }

  .dictionary{
    order:-1;
    border-left:0;
    border-bottom:1px solid var(--line2);
    border-top:0;
    padding:0 0 26px;
    margin-bottom:26px;
    max-height:none;
  }
}

@media(max-width:760px){

  .image-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 14px;
  }

  .result-thumbnail{
    width:100px;
    height:70px;
    flex-basis:100px;
  }
}

@media(max-width:640px){

  .shell{
    width:100%;
    padding-left:16px;
    padding-right:16px;
  }

  #home.home{
    padding:20px 16px;
  }

  .hero-logo{
    width:140px;
    max-height:80px;
  }

  h1{
    font-size:36px;
    margin-bottom:24px;
  }

  .search-wrap form{
    height:50px;
  }

  .results{
    padding:22px 16px 60px;
  }

  .results-head{
    gap:12px;
  }

  .results-brand img{
    width:24px;
    height:24px;
  }

  .results-brand span{
    font-size:14px;
  }

  .results-query{
    font-size:13px;
  }

  .search-types{
    overflow-x:auto;
    scrollbar-width:none;
  }

  .search-type{
    padding-left:10px;
    padding-right:10px;
    font-size:12px;
  }

  .result-content{
    display:block;
  }

  .result-thumbnail{
    width:100%;
    height:160px;
    margin-top:12px;
  }

  .about-overlay{
    padding:16px;
  }

  .about-card{
    padding:26px 22px;
  }
}

@media(max-width:460px){

  .image-grid{
    grid-template-columns:1fr;
  }

  .hero-logo{
    width:125px;
  }
}
</style>
</head>

<body>

<main>

<!-- =========================
     HOME
========================= -->

<section id="home" class="home shell">

  <div class="search-wrap">

    <img
      class="hero-logo"
      src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
      alt="Flibidoo"
    >

    <h1><em><strong>Flibidoo</strong></em>Search</h1>

    <form id="searchForm" role="search">

      <input
        id="q"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="submitButton"
        type="submit"
        aria-label="Search"
      >

        <!-- YOUR EXACT ARROW SVG -->
        <svg
          class="submit-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>

      </button>

    </form>

    <div class="links">

      <button type="button" id="aboutButton">
        About
      </button>

      <span class="confederacy-credit">

        with love from The Great Confederacy of E

        <img
          src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/Untitled13_20260821194209.png"
          alt=""
          aria-hidden="true"
        >

      </span>

    </div>

  </div>

</section>


<!-- =========================
     RESULTS
========================= -->

<section id="results" class="results shell hidden">

  <div class="results-head">

    <a
      class="results-brand"
      href="/"
      aria-label="FlibidooSearch home"
    >

      <img
        src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/flibidoo.PNG"
        alt="Flibidoo"
      >

      <span>
        <em><strong>Flibidoo</strong></em>Search
      </span>

    </a>

    <div
      id="queryLabel"
      class="results-query"
    ></div>

    <div
      id="count"
      class="count"
    ></div>

  </div>


  <div class="results-search">

    <form
      id="resultsSearchForm"
      role="search"
    >

      <input
        id="resultsQ"
        name="q"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web"
        aria-label="Search the web"
      >

      <button
        class="submit"
        id="resultsSubmitButton"
        type="submit"
        aria-label="Search"
      >

        <svg
          class="submit-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          aria-hidden="true"
        >
          <path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/>
        </svg>

      </button>

    </form>

  </div>


  <nav
    class="search-types"
    aria-label="Search type"
  >

    <button
      class="search-type active"
      data-type="web"
      type="button"
    >
      Web
    </button>

    <button
      class="search-type"
      data-type="images"
      type="button"
    >
      Images
    </button>

    <button
      class="search-type"
      data-type="news"
      type="button"
    >
      News
    </button>

    <button
      class="search-type"
      data-type="map"
      type="button"
    >
      Maps
    </button>

  </nav>


  <div class="results-layout">

    <div>

      <div id="resultList"></div>

      <div
        id="pager"
        class="pager"
      ></div>

    </div>


    <aside
      id="dictionary"
      class="dictionary hidden"
      aria-label="Dictionary results"
    ></aside>

  </div>

</section>

</main>


<!-- =========================
     ABOUT
========================= -->

<div
  id="aboutOverlay"
  class="about-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="aboutTitle"
>

  <div class="about-card">

    <button
      id="aboutClose"
      class="about-close"
      type="button"
      aria-label="Close About"
    >
      ×
    </button>

    <h2 id="aboutTitle">About</h2>

    <p>
      Welcome to FlibidooSearch.
    </p>

    <p>
      You can edit this text directly in the HTML inside the
      <strong>about-card</strong>.
    </p>

  </div>

</div>


<script>
/* ============================================================
   CONFIGURATION

   IMPORTANT:
   The browser talks to YOUR CLOUDFLARE WORKER.

   Worker endpoints:
     /api/search
     /api/dictionary
     /api/suggest
============================================================ */

const API_BASE = '';

const FAVICON_FALLBACK =
  'https://www.google.com/s2/favicons?domain=';


/* ============================================================
   ELEMENTS
============================================================ */

const form =
  document.querySelector('#searchForm');

const input =
  document.querySelector('#q');

const home =
  document.querySelector('#home');

const results =
  document.querySelector('#results');

const list =
  document.querySelector('#resultList');

const label =
  document.querySelector('#queryLabel');

const count =
  document.querySelector('#count');

const pager =
  document.querySelector('#pager');

const resultsForm =
  document.querySelector('#resultsSearchForm');

const resultsInput =
  document.querySelector('#resultsQ');

const dictionary =
  document.querySelector('#dictionary');

const submitButton =
  document.querySelector('#submitButton');

const resultsSubmitButton =
  document.querySelector('#resultsSubmitButton');


let currentQ = '';
let currentPage = 0;
let currentType = 'web';


/* ============================================================
   HELPERS
============================================================ */

function esc(value=''){
  return String(value).replace(
    /[&<>'"]/g,
    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[char])
  );
}


function updateButtonState(button,value){
  button.classList.toggle(
    'has-input',
    value.trim().length > 0
  );
}


function getHostname(url){

  try{
    return new URL(url).hostname;
  }catch{
    return '';
  }

}


function faviconFor(url){

  const host = getHostname(url);

  if(!host){
    return '';
  }

  return FAVICON_FALLBACK +
    encodeURIComponent(host) +
    '&sz=64';

}


function getFavicon(result){

  return (
    result?.meta_url?.favicon ||
    result?.favicon ||
    faviconFor(result?.url || '')
  );

}


function getThumbnail(result){

  /*
    Tiago commonly exposes:
      thumbnail.src

    Keep the other shapes as fallbacks because
    response structures can differ between result types.
  */

  return (
    result?.thumbnail?.src ||
    result?.thumbnail?.url ||
    result?.thumbnail ||
    result?.properties?.thumbnail ||
    result?.image ||
    ''
  );

}


/* ============================================================
   DICTIONARY
============================================================ */

async function loadDictionary(word){

  dictionary.classList.remove('hidden');

  dictionary.innerHTML =
    '<div class="dictionary-loading">Looking up definition…</div>';

  try{

    const response = await fetch(
      `${API_BASE}/api/dictionary?word=${encodeURIComponent(word)}`,
      {
        headers:{
          'Accept':'application/json'
        }
      }
    );

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error(
        'Dictionary returned an invalid response.'
      );
    }

    if(!response.ok){
      throw new Error(
        data?.error ||
        'Dictionary lookup failed.'
      );
    }

    renderDictionary(data,word);

  }catch(error){

    dictionary.innerHTML = `
      <div class="dictionary-title">Dictionary</div>
      <div class="dictionary-word">${esc(word)}</div>
      <div class="dictionary-empty">
        ${esc(
          error.message ||
          'No dictionary result available.'
        )}
      </div>
    `;

  }

}


function renderDictionary(data,word){

  const entries =
    Array.isArray(data?.entries)
      ? data.entries
      : [];

  dictionary.innerHTML = '';

  const title =
    document.createElement('h2');

  title.className =
    'dictionary-title';

  title.textContent =
    'Dictionary';

  dictionary.appendChild(title);


  const wordElement =
    document.createElement('div');

  wordElement.className =
    'dictionary-word';

  wordElement.textContent =
    word;

  dictionary.appendChild(wordElement);


  if(!entries.length){

    const empty =
      document.createElement('div');

    empty.className =
      'dictionary-empty';

    empty.textContent =
      'No definition found.';

    dictionary.appendChild(empty);

    return;
  }


  entries.forEach(entry => {

    const article =
      document.createElement('article');

    article.className =
      'dictionary-entry';


    if(entry.language){

      const language =
        document.createElement('div');

      language.className =
        'dictionary-language';

      language.textContent =
        entry.language;

      article.appendChild(language);

    }


    if(entry.partOfSpeech){

      const pos =
        document.createElement('div');

      pos.className =
        'dictionary-pos';

      pos.textContent =
        entry.partOfSpeech;

      article.appendChild(pos);

    }


    /*
      Senses
    */

    const senses =
      Array.isArray(entry.senses)
        ? entry.senses
        : [];


    if(senses.length){

      const sensesSection =
        document.createElement('div');

      sensesSection.className =
        'dictionary-senses';


      const heading =
        document.createElement('div');

      heading.className =
        'dictionary-label';

      heading.textContent =
        'Definitions';

      sensesSection.appendChild(heading);


      senses.forEach((sense,index) => {

        const senseElement =
          document.createElement('div');

        senseElement.className =
          'dictionary-sense';


        const definition =
          sense.definition ||
          sense.def ||
          sense.gloss ||
          '';


        if(definition){

          const def =
            document.createElement('div');

          def.className =
            'dictionary-definition';

          def.innerHTML =
            `<strong>${index + 1}.</strong> ${esc(definition)}`;

          senseElement.appendChild(def);

        }


        const example =
          sense.example ||
          sense.examples?.[0] ||
          '';


        if(example){

          const ex =
            document.createElement('div');

          ex.className =
            'dictionary-example';

          ex.textContent =
            `“${example}”`;

          senseElement.appendChild(ex);

        }


        sensesSection.appendChild(
          senseElement
        );

      });


      article.appendChild(
        sensesSection
      );

    }


    /*
      Synonyms
    */

    const synonyms =
      entry.synonyms ||
      [];

    if(Array.isArray(synonyms) &&
       synonyms.length){

      appendDictionaryList(
        article,
        'Synonyms',
        synonyms
      );

    }


    /*
      Antonyms
    */

    const antonyms =
      entry.antonyms ||
      [];

    if(Array.isArray(antonyms) &&
       antonyms.length){

      appendDictionaryList(
        article,
        'Antonyms',
        antonyms
      );

    }


    /*
      Translations
    */

    const translations =
      entry.translations;

    if(translations){

      const section =
        document.createElement('div');

      section.className =
        'dictionary-translations';

      const heading =
        document.createElement('div');

      heading.className =
        'dictionary-label';

      heading.textContent =
        'Translations';

      section.appendChild(heading);


      if(Array.isArray(translations)){

        translations.forEach(item => {

          const value =
            typeof item === 'string'
              ? item
              : item?.translation ||
                item?.text ||
                '';

          if(!value) return;

          const div =
            document.createElement('div');

          div.className =
            'dictionary-definition';

          div.textContent =
            value;

          section.appendChild(div);

        });

      }else if(
        typeof translations === 'object'
      ){

        Object.entries(
          translations
        ).forEach(([language,value]) => {

          const div =
            document.createElement('div');

          div.className =
            'dictionary-definition';

          div.textContent =
            `${language}: ${
              Array.isArray(value)
                ? value.join(', ')
                : value
            }`;

          section.appendChild(div);

        });

      }


      article.appendChild(section);

    }


    dictionary.appendChild(article);

  });


  const source =
    document.createElement('div');

  source.className =
    'dictionary-source';

  source.innerHTML =
    'Dictionary data from ' +
    '<a href="https://freedictionaryapi.com/" target="_blank" rel="noopener noreferrer">FreeDictionaryAPI</a>.';

  dictionary.appendChild(source);

}


function appendDictionaryList(
  parent,
  title,
  values
){

  const section =
    document.createElement('div');

  section.className =
    'dictionary-relations';


  const heading =
    document.createElement('div');

  heading.className =
    'dictionary-label';

  heading.textContent =
    title;

  section.appendChild(heading);


  const ul =
    document.createElement('ul');

  ul.className =
    'dictionary-list';


  values.forEach(value => {

    const text =
      typeof value === 'string'
        ? value
        : value?.word ||
          value?.text ||
          '';

    if(!text) return;

    const li =
      document.createElement('li');

    li.textContent =
      text;

    ul.appendChild(li);

  });


  if(ul.children.length){

    section.appendChild(ul);
    parent.appendChild(section);

  }

}


/* ============================================================
   RENDER SEARCH RESULTS
============================================================ */

function render(data){

  home.classList.add('hidden');
  results.classList.remove('hidden');

  currentType =
    data.type || currentType;

  label.textContent =
    data.query
      ? `Results for “${data.query}”`
      : '';

  let array = [];


  if(currentType === 'web'){

    array =
      Array.isArray(
        data.results
      )
        ? data.results
        : Array.isArray(
            data.results?.web?.results
          )
          ? data.results.web.results
          : [];

  }else if(
    currentType === 'images' ||
    currentType === 'news'
  ){

    array =
      Array.isArray(data.results)
        ? data.results
        : [];

  }else if(
    currentType === 'map'
  ){

    const locations =
      data.results?.locations ??
      data.results?.map ??
      data.locations ??
      data.results;

    array =
      Array.isArray(locations)
        ? locations
        : [];

  }


  count.textContent =
    array.length
      ? `${array.length} results`
      : '';


  resultsInput.value =
    data.query || '';


  list.innerHTML = '';
  pager.innerHTML = '';


  document
    .querySelectorAll('.search-type')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.type === currentType
      );

    });


  /*
    Dictionary only makes sense on normal web searches.
  */

  if(currentType === 'web' && data.query){

    loadDictionary(data.query);

  }else{

    dictionary.classList.add('hidden');
    dictionary.innerHTML = '';

  }


  if(!array.length){

    list.innerHTML =
      '<div class="empty">No results found.</div>';

    return;

  }


  /* =========================
     IMAGES
  ========================= */

  if(currentType === 'images'){

    const grid =
      document.createElement('div');

    grid.className =
      'image-grid';


    array.forEach(result => {

      const url =
        result.url ||
        result.properties?.url ||
        '';

      const image =
        getThumbnail(result) ||
        result.url ||
        result.properties?.url ||
        '';


      if(!image) return;


      const element =
        document.createElement('article');

      element.className =
        'image-result';


      element.innerHTML = `
        <a
          href="${esc(url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="${esc(image)}"
            alt="${esc(result.title || '')}"
            loading="lazy"
            referrerpolicy="no-referrer"
          >
        </a>

        <div class="image-result-title">
          ${esc(result.title || url)}
        </div>

        <div class="image-result-source">
          ${esc(
            result.source ||
            result.meta_url?.hostname ||
            getHostname(url)
          )}
        </div>
      `;


      grid.appendChild(element);

    });


    if(grid.children.length){

      list.appendChild(grid);

    }else{

      list.innerHTML =
        '<div class="empty">No images found.</div>';

    }

  }


  /* =========================
     MAPS
  ========================= */

  else if(currentType === 'map'){

    array.forEach(result => {

      const element =
        document.createElement('article');

      element.className =
        'map-result';


      const title =
        result.title ||
        result.name ||
        result.address?.name ||
        result.properties?.name ||
        'Map result';


      const url =
        result.url ||
        result.website ||
        result.properties?.url ||
        '';


      let address = '';


      if(typeof result.address === 'string'){

        address =
          result.address;

      }else if(result.address){

        address =
          Object.values(result.address)
            .filter(
              value =>
                typeof value === 'string' &&
                value
            )
            .join(', ');

      }else{

        address =
          result.description ||
          result.properties?.address ||
          '';

      }


      const lat =
        result.lat ??
        result.latitude ??
        result.coordinates?.lat ??
        result.geometry?.coordinates?.[1];


      const lon =
        result.lon ??
        result.lng ??
        result.longitude ??
        result.coordinates?.lon ??
        result.geometry?.coordinates?.[0];


      const href =
        lat != null &&
        lon != null

          ? `https://www.google.com/maps?q=${
              encodeURIComponent(lat)
            },${
              encodeURIComponent(lon)
            }`

          : url;


      element.innerHTML = `

        <h2 class="map-result-title">

          <a
            href="${esc(href)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(title)}
          </a>

        </h2>

        ${
          address
            ? `<div class="map-result-address">
                ${esc(address)}
              </div>`
            : ''
        }

        ${
          lat != null && lon != null
            ? `<div class="map-result-coords">
                ${esc(lat)}, ${esc(lon)}
              </div>`
            : ''
        }

      `;


      list.appendChild(element);

    });

  }


  /* =========================
     WEB / NEWS
  ========================= */

  else{

    array.forEach(result => {

      const element =
        document.createElement('article');

      element.className =
        'result';


      const url =
        result.url || '';


      const host =
        result.meta_url?.hostname ||
        getHostname(url);


      const favicon =
        getFavicon(result) ||
        faviconFor(url);


      const thumbnail =
        getThumbnail(result);


      const title =
        result.title ||
        url;


      const description =
        result.description ||
        result.content ||
        '';


      const age =
        result.age ||
        result.publishedDate ||
        result.published ||
        '';


      element.innerHTML = `

        <div class="result-url-row">

          ${
            favicon
              ? `
                <img
                  class="result-favicon"
                  src="${esc(favicon)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                  onerror="this.onerror=null;this.src='${esc(
                    faviconFor(url)
                  )}'"
                >
              `
              : ''
          }

          <div class="result-url">
            ${esc(host || url)}
          </div>

        </div>


        <div class="result-content">

          <div class="result-text">

            <h2>

              <a
                href="${esc(url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${esc(title)}
              </a>

            </h2>

            ${
              description
                ? `
                  <p class="snippet">
                    ${esc(description)}
                  </p>
                `
                : ''
            }

            ${
              age
                ? `
                  <div class="result-meta">
                    ${esc(age)}
                  </div>
                `
                : ''
            }

          </div>


          ${
            thumbnail
              ? `
                <img
                  class="result-thumbnail"
                  src="${esc(thumbnail)}"
                  alt=""
                  loading="lazy"
                  referrerpolicy="no-referrer"
                  onerror="this.onerror=null;this.src='${esc(
                    favicon
                  )}'"
                >
              `
              : ''
          }

        </div>
      `;


      list.appendChild(element);

    });

  }


  /* =========================
     PAGINATION
  ========================= */

  const more =
    Boolean(
      data.more_results_available ||
      data.hasMore
    );


  if(currentPage > 0){

    const previous =
      document.createElement('button');

    previous.textContent =
      'Previous';

    previous.onclick =
      () =>
        search(
          currentQ,
          currentPage - 1,
          currentType
        );

    pager.appendChild(previous);

  }


  if(more){

    const next =
      document.createElement('button');

    next.textContent =
      'Next';

    next.onclick =
      () =>
        search(
          currentQ,
          currentPage + 1,
          currentType
        );

    pager.appendChild(next);

  }


  history.replaceState(
    {},
    '',
    `/?q=${encodeURIComponent(
      data.query || currentQ
    )}&type=${encodeURIComponent(
      currentType
    )}${
      currentPage
        ? `&page=${currentPage}`
        : ''
    }`
  );

}


/* ============================================================
   SEARCH
============================================================ */

async function search(
  query,
  page=0,
  type=currentType
){

  query =
    query.trim();

  if(!query) return;


  currentQ =
    query;

  currentPage =
    Math.max(
      0,
      Number(page) || 0
    );

  currentType =
    type;


  document.title =
    `${query} - FlibidooSearch`;


  input.value =
    query;

  resultsInput.value =
    query;


  home.classList.add('hidden');
  results.classList.remove('hidden');


  list.innerHTML =
    '<div class="empty">Searching…</div>';

  count.textContent =
    '';

  label.textContent =
    `Results for “${query}”`;

  pager.innerHTML =
    '';


  if(currentType === 'web'){

    dictionary.classList.remove('hidden');

    dictionary.innerHTML =
      '<div class="dictionary-loading">Looking up definition…</div>';

  }else{

    dictionary.classList.add('hidden');

  }


  try{

    /*
      IMPORTANT:
      This calls YOUR WORKER.

      It does NOT call:
        search.tiago.zip/api
      directly from the browser.
    */

    const response =
      await fetch(
        `${API_BASE}/api/search?q=${
          encodeURIComponent(query)
        }&type=${
          encodeURIComponent(currentType)
        }&page=${
          currentPage
        }`,
        {
          method:'GET',
          headers:{
            'Accept':'application/json'
          }
        }
      );


    /*
      Read text first.

      This prevents:
        Unexpected token 'N',
        "Not Found " is not valid JSON

      when Cloudflare returns an HTML/text error.
    */

    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch{

      throw new Error(
        response.ok
          ? 'Search server returned invalid JSON.'
          : `Search endpoint returned ${response.status}: ${text.slice(0,120)}`
      );

    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        `Search failed (${response.status}).`
      );

    }


    data.type =
      currentType;


    render(data);


  }catch(error){

    dictionary.classList.add('hidden');

    list.innerHTML = `
      <div class="error">
        ${esc(
          error.message ||
          'Search failed. Please try again.'
        )}
      </div>
    `;

  }

}


/* ============================================================
   INPUT BUTTON STATE
============================================================ */

input.addEventListener(
  'input',
  () =>
    updateButtonState(
      submitButton,
      input.value
    )
);

resultsInput.addEventListener(
  'input',
  () =>
    updateButtonState(
      resultsSubmitButton,
      resultsInput.value
    )
);


/* ============================================================
   HOME SEARCH
============================================================ */

form.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const query =
      input.value.trim();

    if(!query) return;

    location.href =
      `/?q=${encodeURIComponent(query)}&type=web&page=0`;

  }
);


/* ============================================================
   RESULTS SEARCH
============================================================ */

resultsForm.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const query =
      resultsInput.value.trim();

    if(!query) return;

    search(
      query,
      0,
      currentType
    );

  }
);


/* ============================================================
   SEARCH TYPE BUTTONS
============================================================ */

document
  .querySelectorAll('.search-type')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        const query =
          resultsInput.value ||
          currentQ;

        search(
          query,
          0,
          button.dataset.type
        );

      }
    );

  });


/* ============================================================
   ABOUT
============================================================ */

const aboutOverlay =
  document.querySelector(
    '#aboutOverlay'
  );

document
  .querySelector('#aboutButton')
  .onclick =
    () =>
      aboutOverlay.classList.remove(
        'hidden'
      );


document
  .querySelector('#aboutClose')
  .onclick =
    () =>
      aboutOverlay.classList.add(
        'hidden'
      );


aboutOverlay.addEventListener(
  'click',
  event => {

    if(event.target === aboutOverlay){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


document.addEventListener(
  'keydown',
  event => {

    if(event.key === 'Escape'){

      aboutOverlay.classList.add(
        'hidden'
      );

    }

  }
);


/* ============================================================
   INITIAL URL
============================================================ */

const params =
  new URLSearchParams(
    location.search
  );

const initialQuery =
  params.get('q');

const initialType =
  ['web','images','news','map']
    .includes(
      params.get('type')
    )
      ? params.get('type')
      : 'web';


if(initialQuery){

  search(
    initialQuery,
    Number(
      params.get('page') || 0
    ),
    initialType
  );

}


/* ============================================================
   INITIAL BUTTON STATES
============================================================ */

updateButtonState(
  submitButton,
  input.value
);

updateButtonState(
  resultsSubmitButton,
  resultsInput.value
);
</script>
